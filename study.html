"q": "When discussing the differences between purchasing a mutual fund and a hedge fund, the investor should be aware that", "a": "hedge funds only offer Class A shares, while mutual funds offer many different classes.", "b": "hedge fund shares are generally listed on an exchange, while mutual fund shares are not.", "c": "hedge funds do not offer the transparency of mutual funds.", "d": "managers of hedge funds are generally registered with the SEC, while mutual fund managers are registered with the state(s).", "e": "Because hedge funds are not registered with the SEC (or the states), there are limited disclosures—the transparency is not nearly what investors have with mutual funds. Mutual fund investment managers always register with the SEC, and the same is true of must hedge fund managers, typically those with AUM of at least $150 million. Neither hedge funds nor mutual funds trade on listed exchanges, and hedge funds do not have traditional share classes; they may offer a choice of different currencies, but that is totally different from the share classes of mutual funds."}, {"n": 24, "q": "An investor reading the open-end investment company section of today's The Wall Street Journal sees that Bull in the Teashop Fund has a NAV of $10.65 and an offering price of $11.15. He knows that he would have received which of the following if his redemption order had been received by the fund prior to yesterday's market close?", "a": "$10.65, less redemption fee, if any", "b": "$11.15, less redemption fee, if any", "c": "$10.65, less commission", "d": "$10.65", "e": "An investor redeeming his shares will receive the NAV less any redemption fee that may be described in the prospectus. Investors redeeming through the fund are not charged a commission."}, {"n": 25, "q": "When reviewing the prospectus of a mutual fund, you would be most likely to find a discussion of breakpoints dealing with which share class?", "a": "Class R", "b": "Class C", "c": "Class B", "d": "Class A", "e": "It is only Class A shares with their front-end load where a schedule of breakpoints is found in the prospectus. Class B and C shares have deferred sales charges, and Class R shares generally have no front-end or back-end loading."}, {"n": 26, "q": "Compared to traditional investments, hedge funds and private equity are most likely to be more", "a": "leveraged.", "b": "liquid.", "c": "transparent.", "d": "leveraged and transparent.", "e": "Alternative investments tend to use more leverage and are typically less liquid and less transparent than traditional investments."}, {"n": 27, "q": "Which of the following statements correctly describe similarities between exchange-traded funds and closed-end investment companies?There are a limited number of outstanding shares.They are traded on registered stock exchanges.They trade at prices that are not dependent upon but are usually very close to their net asset value.Investors purchase these on margin", "a": "I and IV", "b": "II and IV", "c": "I and III", "d": "II and III", "e": "Both exchange-traded funds (ETFs) and closed-end investment companies are traded on exchanges. Only closed-end investment companies have a limited number of shares. Closed-end funds may trade at significant premiums or discounts from their NAV, while ETFs rarely stray far from the NAV. As exchange-traded securities, both may be purchased on margin (and sold short)."}, {"n": 28, "q": "If a customer's portfolio is heavily invested in common stock mutual funds, what is the customer's greatest risk?", "a": "Loss of diversification", "b": "Changes in interest rates", "c": "Loss of liquidity", "d": "Loss of principal", "e": "A mutual fund with a portfolio of common stock is subject to market risk. If the market falls, the value of the fund's shares also falls, subjecting the owner to loss of principal."}, {"n": 29, "q": "An agent has recommended investments in the XYZ fund family to his customers for 10 years. He is referred by one of his customers to a prospect who has inherited $500,000 as beneficiary of a life insurance policy. The prospect tells the agent she has never invested in the market before, is risk averse, and wants safety of principal to be the first priority with liquidity second. The agent recommends the following investments:XYZ government bond fund, B shares $200,000XYZ large-cap growth and Income B shares $150,000Liquid reserve money market $150,000The recommendation is", "a": "suitable because it addresses the customer's liquidity objective.", "b": "suitable because he recommended conservative investments.", "c": "suitable because it addresses the customer's safety objective.", "d": "unsuitable because it does not address the customer's two primary objectives.", "e": "The customer's objectives of safety and liquidity are not satisfied by these recommendations. The government bond fund and large-cap growth and income fund are both subject to market risk and, as Class B shares, are subject to a contingent-deferred sales charge in the event the customer wishes to access the funds before the back-end load expires. The back-end load is not consistent with the customer's liquidity objective."}, {"n": 30, "q": "When investing in mutual funds, each of the following is a sales charge except", "a": "12b-1 fees.", "b": "a back-end load.", "c": "a CDSC.", "d": "a front-end load.", "e": "12b-1 fees are not defined as sales charges because they are not a function of buying or selling your shares. These fees are asset-based, generally charged quarterly, and come out of the NAV. Front-end loads and back-end loads (CDSCs) are charged either when you buy the fund (front-end) or sell your shares (back-end)."}, {"n": 31, "q": "Which of the following is the least suitable mutual fund transaction?", "a": "Encouraging an investor in a high tax bracket with an income objective to invest in a municipal bond fund", "b": "Encouraging a retired 65-year-old investor to invest a small percentage of his savings in a large-cap growth fund", "c": "Encouraging an investor in his early 30s to invest in an emerging markets mutual fund", "d": "Encouraging a mutual fund shareholder to switch from one fund family to another while a deferred load is in existence", "e": "Encouraging a mutual fund shareholder to switch from one fund family to another while a deferred load is in existence is not in the client's best interest, because the client might be subject to substantial additional sales charges."}, {"n": 32, "q": "In which type of real estate investment does an investor have a reasonable expectation of receiving periodic distributions in the form of dividends?", "a": "Undeveloped land", "b": "A real estate investment trust (REIT)", "c": "The purchase of a primary residence", "d": "Rental real estate", "e": "A REIT is an indirect form of ownership of real estate. For tax purposes, at least 90% of the REIT's taxable income is distributed to investors in the form of a taxable dividend. Unlike DPPs, there is no flow-through of losses."}, {"n": 33, "q": "An investor signed a letter of intent to purchase $50,000 worth of Sky-High Mutual Fund. At the end of 13 months, he had only invested $48,000 in the fund. Which of the following is true?", "a": "There are no additional requirements; he will receive the breakpoint.", "b": "The fund will liquidate shares to meet the additional sales charge.", "c": "He must sign a new letter for the $2,000 to receive the breakpoint.", "d": "He has 90 days to invest the additional $2,000 for the breakpoint.", "e": "An investor has only 13 months to meet a letter of intent commitment. Once that period of time has elapsed, the investment company is entitled to a refund of the discount it had originally given the investor. This is accomplished by liquidating a sufficient number of shares to cover the additional sales charge to be imposed."}, {"n": 34, "q": "A retiree contacts an agent to discuss investing his retirement savings of approximately $2.1 million. His investment objective is long-term growth. The agent and customer discuss the advantages and disadvantages of diversifying among five different mutual funds within two fund families, as opposed to purchasing within just one fund family. Consequently, the agent made the following purchase recommendations:XYZ Emerging Growth Class B $495,000XYZ Research Class B $310,000XYZ Investors Growth Stock Class B $495,000ABC Capital Enterprise Class B $495,000ABC Capital Opportunity Class B $310,000Total $2,105,000These recommendations are", "a": "suitable because they achieve the diversification the customer seeks.", "b": "unsuitable because Class A shares in either (or both) fund family could be purchased for a sales charge breakpoint discount at or near zero percent.", "c": "unsuitable because the investments are not equal in amount.", "d": "suitable because the customer fully understands all of the ramifications and is satisfied.", "e": "Class A shares, in most mutual funds, provide breakpoint sales charge discounts, so there is no sales charge when purchasing $1 million worth of shares (or less in some cases). Class A shares also have lower operating expenses than Class B shares. This retired investor would be subject to back-end loads with Class B shares if the funds were needed unexpectedly within a few years. In the real world, it is impossible to buy Class B shares in this dollar quantity. Most funds have a limit of $50 to $100 thousand."}, {"n": 35, "q": "Under the Investment Company Act of 1940, which of the following statements about advisory contracts between an investment company and an outside adviser is true?", "a": "The initial contract is effective once approved by the board of directors.", "b": "The contract may be in writing, or it may be oral if there are at least two witnesses to the agreement.", "c": "The contract may not be unilaterally assigned to another adviser.", "d": "The contract must be established for a one-year period and renewed annually thereafter.", "e": "All contracts between an investment company and an outside adviser must be in writing and must contain certain provisions; these include that the contract may not be unilaterally assigned to another adviser. The initial contract must be for two years and it is subject to annual renewal by a majority vote of the outstanding shares or the board of directors, as well as a majority of the directors who are considered to be noninterested parties."}, {"n": 36, "q": "A manager of a venture capital fund would be most interested in investing in", "a": "a well-established company going through management changes.", "b": "a company interested in going private.", "c": "a company listed on a major stock exchange.", "d": "a young, promising company.", "e": "Venture capitalists prefer to get involved in the earlier stages of a company's development. This would certainly not be a company listed, nor would it be likely that the company is already publicly traded."}, {"n": 37, "q": "When comparing mutual funds, one of the factors to consider is", "a": "the amount of sales charge levied on reinvested capital gain distributions.", "b": "the length of time it takes for the fund to redeem shares.", "c": "the fund’s net asset value per share.", "d": "the length of time the fund manager has been managing the fund.", "e": "Tenure in the job can be an important consideration when evaluating and comparing mutual funds. All funds must redeem in seven days, and no fund can levy a sale charge on reinvested capital gains."}, {"n": 38, "q": "Which of the following clients would be the best candidate(s) for a hedge fund?", "a": "Marcy, age 23, recent college graduate, student debt, low net worth, entry-level position at a local law firm", "b": "Bob and Carol, mid 30s, two young kids, homeowners, $50,000 net worth, long-term investment perspective", "c": "Ted and Alice, late 50s, no dependents, semiretired, $5 million net worth, moderate risk takers, diversified holdings", "d": "Howard, age 78, widowed, conservative risk taker, $250,000 net worth, lives on a fixed income", "e": "The best choice for a hedge fund is Ted and Alice. They have no dependents, have high net worth, have diversified holdings, and exhibit a moderate risk tolerance. A hedge fund is generally an unregistered, privately offered, managed pool of capital for wealthy, financially sophisticated investors. The other clients would not be considered candidates for a hedge fund based on net worth and investment objectives."}, {"n": 39, "q": "A 45-year-old client has just received an inheritance and would like to invest $100,000 into a growth mutual fund offered by your firm. The client intends to use the money to supplement retirement. You should probably recommend the purchase of", "a": "Class B shares", "b": "a fixed annuity", "c": "Class C shares", "d": "Class A shares", "e": "At a purchase level of $100,000, a breakpoint will be reached which should bring the front-end load to a low level. Combine that with the generally lower operating expenses and the expected long-term holding period and the regulators would like to see the investment in Class A shares. There is nothing wrong with a fixed annuity except the client wants a mutual fund."}, {"n": 40, "q": "If XYZ Mutual Fund has an expense ratio of 1.85% that includes a 12b-1 fee of 0.30%, which of the following statements are true?The fund may use the 12b-1 fee to pay for mailing sales literature.Advertising materials may state that the fund is no load.Management fees may be paid from the 12b-1 fee.The fund's prospectus is required to disclose the fee.", "a": "I and II", "b": "III and IV", "c": "I and IV", "d": "II and III", "e": "12b-1 fees may only be used to cover promotional expenses, not fund-management expenses. The amount of the fee must be disclosed in the prospectus. Funds that charge 12b-1 fees of more than 0.25% cannot call themselves no-load funds."}, {"n": 41, "q": "A hedge fund manager is compensated using the 2 & 20 rate. If the management contract calls for a hurdle rate of 5%, it means that if the fund's return is 20%,", "a": "the manager receives 2% of the 5% hurdle rate and 20% of the 15% in excess of the hurdle.", "b": "the manager’s incentive fee applies to the excess return of 15%.", "c": "the manager receives the 2% base rate but no incentive because the return did not exceed the 20% level.", "d": "the manager’s incentive fee applies to the full return because it exceeds the hurdle rate.", "e": "The hurdle rate in a hedge fund is the minimum performance required before the incentive rate (the 20%) kicks in. That incentive rate applies only to the performance in excess of the hurdle; in this case, 20% exceeds 5% by 15%."}, {"n": 42, "q": "By their very nature, pooled investment vehicles offer investors", "a": "guaranteed returns.", "b": "current income.", "c": "tax deferral.", "d": "diversification.", "e": "Most pooled investment vehicles invest in a broad range of investments, giving their investors diversification."}, {"n": 43, "q": "An open-end investment company is also referred to as", "a": "a face-amount certificate company.", "b": "a mutual fund.", "c": "an exchange-traded fund.", "d": "a unit investment trust.", "e": "Investment companies may be one of three types: unit investment trusts, face-amount certificates, or management companies. Within the category of management companies, you will find open- and closed-end companies. Open-end investment companies are also referred to as mutual funds."}, {"n": 44, "q": "To qualify as a REIT, a company must have the bulk of its assets and income connected to real estate investments and must distribute at least what percentage of its taxable income to shareholders annually in the form of dividends?", "a": "75%", "b": "90%", "c": "70%", "d": "50%", "e": "Under SEC rules, to qualify as a REIT, a company must have the bulk of its assets and income connected to real estate investments and must distribute at least 90% of its taxable income to shareholders annually in the form of dividends. Don't confuse this with the requirement to have at least 75% of its income from real estate or 75% of its assets invested in real estate–related assets."}, {"n": 45, "q": "When an open-end management investment company computes its net asset value per share, each of the following occurrences would have an impact except", "a": "a capital gains distribution.", "b": "a drop in the value of equity securities held in the fund’s portfolio.", "c": "interest payments made on debt securities held in the fund’s portfolio.", "d": "a greater value of shares being redeemed than purchased.", "e": "Because shares are purchased and redeemed at net asset value (NAV), net redemptions (this case) or net purchases have no effect on the NAV of the fund's shares. However, receipt of cash in the form of interest payments causes assets to increase, while falling equity prices leads to a decrease. Distribution of capital gains (or dividends) represents a payment of cash, thus decreasing the amount of assets on hand."}, {"n": 46, "q": "All of the following statements regarding a closed-end investment company whose shares are listed on the NYSE are true except", "a": "it differs from a mutual fund.", "b": "it sells at the market price based on supply and demand.", "c": "it is a type of management company.", "d": "it may redeem its own shares.", "e": "A closed-end investment company does not redeem its own shares. The term mutual fund refers to an open-end management investment company that issues redeemable shares. Although there is a category of closed-end funds that do redeem their shares (interval funds), those do not trade in the secondary markets like the NYSE."}, {"n": 47, "q": "Regarding open-end investment companies, which of the following sales charges is based on the NAV per share?", "a": "Redemption fee", "b": "Sales load", "c": "12b-1 fee", "d": "Commission", "e": "If the fund has a redemption charge (CDSC), it is based on the NAV per share, not the public offering price (POP). That is, if the client liquidated shares when the NAV was $10 per share and the POP was $10.50, the CDSC would be charged based on the $10 rather than the $10.50. Commission is not a term used with mutual funds. The 12b-1 fee is a charge against overall assets of the fund; it is not considered to be a charge related to the buying or selling of fund shares."}, {"n": 48, "q": "A client of yours comes to the office and shows you some sales literature from a mutual fund that has him very excited. According to the material, the fund's average annual return over the past 10 years has been in excess of 15% and it has achieved the highest rating from the major fund rating services. Before recommending this fund to your clients, the first thing you would probably check for in the fund's prospectus is", "a": "the portfolio manager’s tenure.", "b": "the fund’s sales charge.", "c": "the fund’s expense ratio.", "d": "the fund’s objectives.", "e": "Because this client has been \\\"sold\\\" on past performance, you need to verify if the manager achieving those results is still on the job. That is the prime reason why the regulations require disclosure of the fund manager's tenure; it is important for investors to know if the current manager was the one who had the winning streak or if that manager just came on board. The other choices are something to look at, but in this instance, they take a back seat to checking on the manager's tenure. Sure, the expense ratio is important, but the past performance is after expenses, so that has already been taken into consideration."}, {"n": 49, "q": "Which of the following statements is not true?", "a": "Mutual funds may be used as collateral in a margin account if they have been owned for more than 30 days.", "b": "The sale of open-end investment company shares is a continuous public offering and must be accompanied by a prospectus.", "c": "Open-end investment companies must have a minimum of $1 million in assets to have a public offering.", "d": "Mutual fund shares may not be purchased on margin because their shares are always public offerings of new shares.", "e": "Minimum assets of $100,000 are required."}, {"n": 50, "q": "You have a client who invested in the PQR Growth Fund 10 years ago and now, as retirement age approaches, asks you about using the exchange privilege to move into the PQR Balanced Fund. The client should know that", "a": "the exchange qualifies for any breakpoint reduction.", "b": "the old shares are liquidated at NAV and the new shares are purchased at the POP.", "c": "any tax consequences are deferred until the Balanced Fund shares are liquidated.", "d": "this exchange is considered a taxable event as of the date of the exchange.", "e": "The exchange privilege allows for an exchange at net asset value (NAV) between funds that are members of the same family. The exchange is considered a taxable event. Because the exchange is made at NAV, the concept of breakpoint is irrelevant."}, {"n": 51, "q": "Which of the following are features of Class C mutual fund shares?Typically charge no front-end loadTypically charge a front-end loadTypically impose lower 12b-1 fees than Class B shares Typically convert to Class A shares after they are held for a defined period", "a": "II and IV", "b": "I and IV", "c": "II and III", "d": "I and III", "e": "Class C shares generally have the following features: no front-end sales charge, 12b-1 charges that are the same as Class B, and conversion to Class A shares most commonly 8 years after purchase. It was rare to find the conversion to Class A shares prior to 2020, but effective January, 2022, it has become commonplace, especially since most fund distributors have ended the sale of Class B shares."}, {"n": 52, "q": "In the context of purchasing shares in a mutual fund, the term breakpoint refers to the point at which", "a": "the shares are selling for less than the net asset value (NAV).", "b": "the investor is assured of making a profit on the shares", "c": "the dollar amount of shares being purchased qualifies the investor for a lower sales charge.", "d": "the mutual fund company stops offering new shares to the public.", "e": "The term breakpoint refers to the point at which the number of shares being purchased is large enough to qualify the investor for a reduced sales load. FINRA prohibits broker-dealers and their agents from making a mutual fund sale at just below the breakpoint merely to obtain a larger commission."}, {"n": 53, "q": "A similarity between the capitalization of closed-end and open-end management investment companies is that both", "a": "raise capital through a continuous public offering of shares.", "b": "compute net asset value per share.", "c": "are traded on listed exchanges or in the over-the-counter market.", "d": "can issue common and preferred stock.", "e": "The only similarity here is that both kinds of management investment companies compute NAV. Open-ends must do it daily and closed-ends can compute daily or even weekly. It is only the open-end company where the capital is raised through a continuous offering of new shares. Closed-end funds generally have a single IPO of common stock and may, if they wish, also have a preferred stock issue. Open-end funds are limited to one class of equity security (not to be confused with different classes for sales charge purposes). There is no secondary market trading in open-end funds, only closed-ends."}, {"n": 54, "q": "Early in the year, an investor purchased shares of the GEMCO Fund at $10.40 per share when the net asset value per share was $9.53. Just before the last trading day of the year, this investor liquidated the position at $10.60 per share when the net asset value per share was $10.77. From this, you can discern that GEMCO Fund is", "a": "a unit investment trust.", "b": "a closed-end investment company.", "c": "a face-amount certificate company.", "d": "an open-end investment company.", "e": "It is only the closed-end investment company where shares trade at a premium or discount to the NAV per share."}]}, {"id": 4, "name": "Unit 4: Types and Characteristics of Equity Securities Including Derivative Products", "key": "CBADAAADBDBDDCABBBDBABCCBDCCBC", "questions": [{"n": 1, "q": "An investor purchases two PMJ Dec 16 calls at $0.85. If the commission charge is $8, the total cost is", "a": "$328.", "b": "$188.", "c": "$178.", "d": "$93.", "e": "A premium of 85 cents per share means each contract has a cost of $85. There are two of them, making that $170. Adding the $8 commission brings the total to $178."}, {"n": 2, "q": "Included in the definition of derivative would be all of the following except", "a": "rights.", "b": "leveraged ETFs.", "c": "forwards.", "d": "options.", "e": "ETFs, whether leveraged or not, are investment companies and are not included in the definition of derivative."}, {"n": 3, "q": "An investor would write a call option to", "a": "obtain income.", "b": "seek long-term capital gain.", "c": "protect the premium.", "d": "fix the purchase price to add stock to his portfolio.", "e": "The writing (selling) of an option always generates premium income to the writer. If the call is exercised, the writer must sell the stock, so this is not a way to add to your portfolio. In general, option writers only realize short-term gains, not long-term gains. If the question had said this was a covered call, then the second best choice would have been to protect the long position (not the premium)."}, {"n": 4, "q": "Kurt expects a certain stock to significantly rise in value in the near future. He is expecting a bond to mature in two months and does not want to miss out on any appreciation on the stock while waiting for the funds to become available. Which of the following would be the best option strategy for Kurt?", "a": "Buy a put option.", "b": "Sell a put option.", "c": "Sell a call option.", "d": "Buy a call option.", "e": "Kurt can lock in the price of the stock by purchasing a call option with an expiration date exceeding two months. Remember the phrase call up. If you think the stock's price is going up, buy a call."}, {"n": 5, "q": "Derivatives can serve many purposes. However, investors should be aware that there are positions which can result in", "a": "unlimited loss.", "b": "generation of income.", "c": "potential gains.", "d": "asset protection.", "e": "Although all of these are true, the focus of the regulators is on clients being aware of the risks before they learn the benefits. There are some derivative positions, such as an uncovered call, where the potential for loss is unlimited."}, {"n": 6, "q": "An investor will likely exercise a put option when the price of the stock is", "a": "below the strike price.", "b": "at the strike price.", "c": "above the strike price.", "d": "above the strike price plus the premium.", "e": "First of all, we know this investor is long the put. How? Because only those who own options (are long) can decide to exercise. The owner of a put (long put) profits when the stock falls. The put would be exercised when the price of the stock is below the strike price. For example, if this is a 50 put, the investor has the right to exercise and sell the stock at $50 per share. That is a benefit when the market price of the stock is below 50, and the lower the better. Remember the phrase put down because a put option becomes valuable to the holder when the market price goes below the exercise (strike) price."}, {"n": 7, "q": "Which of the following investments would not be considered exchange-traded derivatives?", "a": "Forwards", "b": "Warrants", "c": "Futures", "d": "Options", "e": "Forwards are never traded on an exchange; the other choices can be traded OTC or on an exchange."}, {"n": 8, "q": "An investor goes short five soybean futures contracts on the Chicago Mercantile Exchange (CME). When the contract expires,", "a": "only the exchange is obligated to perform.", "b": "only the seller is obligated to perform.", "c": "only the buyer is obligated to perform.", "d": "both the buyer and the seller are obligated to perform.", "e": "Among the ways in which futures differ from options is that both parties, long and short, are obligated to execute the contract. At expiration date, if not exercised before, the buyer must purchase at the contract price and the seller must deliver at the contract price. In the case of options, the buyer (long position) is the one who chooses to exercise or not, and it is the seller (short position) who becomes obligated to perform."}, {"n": 9, "q": "Which of the following statements best describes a preemptive right?", "a": "The right given to existing holders of a company's stock enabling them to vote ahead of preferred stockholders", "b": "A privilege extended to existing holders of a company's common stock enabling them to maintain their proportionate interest in the company when additional shares are issued", "c": "The right given to existing holders of a company's stock enabling them to receive dividends in proportion to their equity in the company", "d": "A privilege extended to existing holders of a company's common stock enabling them to sell their shares when additional shares are issued", "e": "The preemptive right is an equity security representing a common stockholder's entitlement to the first opportunity to purchase new shares issued by the corporation at a predetermined price (normally less than the current market price) in proportion to the number of shares already owned."}, {"n": 10, "q": "Which type of contract obligates both parties to act?\nForward contract\nFutures contract\nOptions contract\nWarrant", "a": "II and III", "b": "I and IV", "c": "I, II, and III", "d": "I and II", "e": "It is only in the case of forward and futures contracts that both parties are obligated to fulfill the terms of the contract. Only the seller of an options contract is obligated, and in the case of a warrant, it is the issuer of the warrant who is obligated to deliver the underlying shares if the owner exercises."}, {"n": 11, "q": "Which of the following financial instruments is not a derivative?", "a": "A call option", "b": "A share of stock", "c": "LEAPS", "d": "A put option", "e": "A derivative is a type of financial instrument that derives its value from another asset or combination of assets. The best known examples of derivatives are options, of which puts, calls, and LEAPS are examples."}, {"n": 12, "q": "George owns XYZ stock. Based on recent analyst projections and George's own research, he believes XYZ's price will remain flat over the next few months. Accordingly, which strategy would George most likely employ?", "a": "Sell a put option.", "b": "Buy a call option.", "c": "Buy a warrant.", "d": "Sell a call option.", "e": "When the price is expected to stay flat, selling an option is a way to profit with little risk of the option being exercised. Why sell the call instead of the put? Because George owns the XYZ stock, this is a covered call and entails no downside risk. The risk to a call writer (seller) is that the market price of the XYZ stock will increase significantly. If the call is not covered, then the writer has to buy it at the current market price (and deliver it at the lower strike price). When, as in this case, the seller owns the stock, regardless of how high the market price goes, it is unnecessary to buy the XYZ because George will deliver the shares he already owns. That is why covered call writing is such a relatively low risk strategy. Selling the put would expose George to potentially significant loss if the price of XYZ should suffer a large decline."}, {"n": 13, "q": "If declared by the board of directors, dividends may be paid on all of the following except", "a": "common stock.", "b": "preferred stock.", "c": "convertible preferred stock.", "d": "warrants.", "e": "Warrants do not pay dividends; the other instruments listed pay dividends when declared by the board of directors."}, {"n": 14, "q": "A manufacturer of soybean oil is concerned that the price of soybeans will increase over the next six months. The best strategy to employ would probably be", "a": "a neutral hedge.", "b": "a trimmed hedge.", "c": "a long hedge.", "d": "a short hedge.", "e": "The concern is that the price will go up. Just as with options, when we are concerned that the price of something will go up, we go long that item. With options, it would be a long call; with futures, it is simply hedging by going long (buying) the soybean futures. The soybean farmer who would be concerned about a decline in the price would go short soybean futures."}, {"n": 15, "q": "You have a client who is bullish on XYZ stock and currently owns 100 shares that last traded at $50. He has a CD coming due in March, six months from now, and is afraid that by the time those funds are available, XYZ will have shot up in price. How can he ensure that he'll be able to pick up the stock at today's price six months from now and not miss out on that market appreciation?", "a": "Buy an XYZ March 50 call option.", "b": "Sell an XYZ March 50 put option.", "c": "Buy XYZ stock rights.", "d": "Buy an XYZ March 50 put option.", "e": "A call option gives the holder the right, but not the obligation, to purchase shares of the underlying stock at the exercise price until the expiration date. Owning a March 50 call means that any time between now and the expiration date in March, the investor could exercise the option and purchase 100 shares per contract at $50 per share. If the stock doesn't rise in price, the investor can allow the option to expire. Buying a put option would be a good choice if the question asked, \"How can the client protect against a market decline?\" Selling a put obligates the client to buy the stock at $50, but that would only be exercised if the stock's price fell; this is not something this client would want to do. Stock rights would never run as long as six months."}, {"n": 16, "q": "Nonsecurities derivatives include futures and forwards. Among the differences between futures and forwards is that futures contracts", "a": "are nonstandardized, while forwards are.", "b": "are rarely exercised, while forwards generally are.", "c": "are preferred to forwards by producers.", "d": "are not regulated by the CFTC, while forwards are.", "e": "In the vast majority of the cases, futures contracts are closed out prior to expiration. That is one reason they are more popular with speculators than forwards. Because forwards are generally delivered, they are the preferred tool by producers, and it is futures that are standardized and CFTC regulates, not forwards."}, {"n": 17, "q": "All of the following are characteristics of a rights offering except", "a": "it is issued to current stockholders.", "b": "the subscription period is up to two years.", "c": "the subscription price is below the current market value.", "d": "the rights are marketable.", "e": "Rights offerings are usually very short-lived (30 to 45 days)."}, {"n": 18, "q": "All of the following are exchange traded EXCEPT:", "a": "index options.", "b": "forward contracts.", "c": "futures contract.", "d": "ETFs.", "e": "Forward contracts are a one-to-one investment where the buyer and seller set the terms of the deal. Lack of standardization makes exchange trading an impossibility."}, {"n": 19, "q": "An investor purchased a Mosaks, Inc., put option with a strike price of $105. If Mosaks' stock price is $115 at expiration, the value of the put option is", "a": "–$10.", "b": "$10.", "c": "$105.", "d": "$0.", "e": "The put has a value of $0 because it will not be exercised. Why would you want to exercise (sell the stock) at $105 per share when the current market value is $115?"}, {"n": 20, "q": "A speculator, believing that a drought in the Midwest will lead to a weak corn crop, would probably", "a": "take a long position in orange juice futures.", "b": "take a long position in corn futures.", "c": "take a long position in corn forwards.", "d": "take a short position in corn futures.", "e": "A weak corn crop means a shortage in the supply. That will lead to an increase in prices. When one is speculating that prices will go up, the best position is a long one. So, why not the long forwards? Those who purchase forward contracts anticipate accepting delivery of the asset. This individual is merely speculating and has no interest in taking physical possession of the commodity and paying for transportation, silage, and insurance until the commodity is sold. If the person in the question had been a user of corn (a cereal maker, for example), then the forward contract would have been a better choice."}, {"n": 21, "q": "The long party to a put option contract has", "a": "the right to sell the underlying asset.", "b": "the obligation to sell the underlying asset.", "c": "the right to buy the underlying asset.", "d": "the obligation to buy the underlying asset.", "e": "Being long a put option means owning the option. Owners have rights, while sellers have obligations. A put option gives the owner the right to sell the underlying asset at the exercise price. The seller of the put option is obliged to take delivery and pay the exercise price if the buyer exercises the option."}, {"n": 22, "q": "Which type of contract obligates both parties to act?\nForward contract\nFutures contract\nOptions contract\nWarrant", "a": "I and IV", "b": "I and II", "c": "II and III", "d": "I, II, and III", "e": "It is only in the case of forward and futures contracts that both parties are obligated to fulfill the terms of the contract. Only the seller of an options contract is obligated, and in the case of a warrant, it is the issuer of the warrant who is obligated to deliver the underlying shares if the owner exercises."}, {"n": 23, "q": "Which of the following statements regarding warrants is true?", "a": "Warrants give the holder a perpetual interest in the issuer's stock.", "b": "Warrants' terms are generally shorter than rights' terms.", "c": "Warrants are often issued with other securities to make the offering more attractive.", "d": "Warrants are safer than corporate bonds.", "e": "Warrants are generally issued with bond offerings to make the bonds more attractive. Warrants are long-term options to buy stock, and because they are equity securities, warrants, as investments, are considered less safe than bonds."}, {"n": 24, "q": "Which of the following is not considered a derivative?", "a": "Futures contract", "b": "Call option", "c": "Unit investment trust", "d": "Warrant", "e": "All of the other choices \"derive\" their value from some underlying asset. A UIT is an investment company, and its value is based on its own assets."}, {"n": 25, "q": "An investor goes short five soybean futures contracts on the Chicago Mercantile Exchange (CME). When the contract expires,", "a": "only the exchange is obligated to perform.", "b": "both the buyer and the seller are obligated to perform.", "c": "only the seller is obligated to perform.", "d": "only the buyer is obligated to perform.", "e": "Among the ways in which futures differ from options is that both parties, long and short, are obligated to execute the contract. At expiration date, if not exercised before, the buyer must purchase at the contract price and the seller must deliver at the contract price. In the case of options, the buyer (long position) is the one who chooses to exercise or not, and it is the seller (short position) who becomes obligated to perform."}, {"n": 26, "q": "Standardized equity options are issued and guaranteed by", "a": "the Commodities Futures Trading Commission (CFTC).", "b": "the National Futures Association (NFA).", "c": "the Chicago Board Options Exchange (CBOE).", "d": "the Options Clearing Corporation (OCC).", "e": "The OCC has the role of issuer and guarantor of all standardized equity options. That means if one party to an options contract fails to perform, the OCC steps in and takes that role (and then goes after the recalcitrant party)."}, {"n": 27, "q": "Rank the following securities from the same issuer from most suitable to least suitable for a client whose primary objective is income.\nCumulative preferred stock\nConvertible preferred stock\nCommon stock\nWarrant", "a": "I, III, II, IV", "b": "III, I, IV, II", "c": "I, II, III, IV", "d": "II, III, IV, I", "e": "For a client seeking income, preferred stock, especially one that is cumulative, would likely be the most suitable of the choices given. Convertible preferred stock generally pays a lower dividend rate than other preferred stocks. This is because of the attractiveness of the convertibility. Although there are some categories of common stock (e.g., utility stocks that pay liberal dividends), unless specifically mentioned, you can assume that preferred stock dividends are higher than those for common stock of the same issuer. Warrants never provide any income."}, {"n": 28, "q": "Which of the following statements is most accurate when describing equity straddle options?\nThe option buyer is looking for market volatility.\nThe option buyer is looking for market stability.\nThe option seller is looking for market volatility.\nThe option seller is looking for market stability.", "a": "I and III", "b": "II and IV", "c": "I and IV", "d": "II and III", "e": "A straddle is the combination of a put and a call on the same stock with the same strike prices and expiration dates. The solution to the question is the same for any option position in that option buyers need price movement and option sellers make money from stability. In the case of a straddle, a buyer is expecting sharp movement but does not know the direction of the move. The seller of the straddle will benefit if there is no significant price movement."}, {"n": 29, "q": "Which of the following are characteristics of newly issued warrants?", "a": "Intrinsic value but no time value", "b": "Time value but no intrinsic value", "c": "Time value and intrinsic value", "d": "No intrinsic value and no time value", "e": "Warrants can be thought of as call options with a long expiration period. They are always issued with a strike price in excess of the current market value, so there is no intrinsic value. One could say that, on issuance, they are always out of the money. The only value is in the time to expiration—usually several years or longer."}, {"n": 30, "q": "An investor has been following the price movements of ABC common stock and believes that the stock is positioned for a significant upward move in the very near term. If the investor's goal is capital gains, which of the following would be the most appropriate position for this investor to take?", "a": "Sell ABC put options.", "b": "Sell ABC call options.", "c": "Buy ABC call options.", "d": "Buy ABC put options.", "e": "When an investor is expecting the price of a security to rise, we say that investor has a bullish outlook. Bulls buy call options, especially when the expected market move is anticipated shortly. Put options are purchased by investors who are of the belief that a stock's price will decline in the near term. Selling options is done for income (the premium), not for capital gains."}]}, {"id": 5, "name": "Unit 5: Alternative Investments", "key": "BCDCABCBAABBCCCDDBADDDBABABCBDBDACCBCDDABB", "questions": [{"n": 1, "q": "Which of the following investments is NOT registered under the Investment Company Act of 1940?", "a": "UITs", "b": "ETNs", "c": "ETFs", "d": "FACCs", "e": "Exchange-traded notes, sometimes called equity-linked notes, are registered under the Securities Act of 1933 as debt instruments. All of the other choices are registered as investment companies under the Investment Company Act of 1940."}, {"n": 2, "q": "One of the benefits of including alternative investments in a client's portfolio is", "a": "increased income.", "b": "lower transaction costs.", "c": "portfolio diversification.", "d": "increased liquidity.", "e": "One of the benefits of including alternative investments in a client's portfolio is the potential for portfolio diversification. Most alternative investments have a low correlation to the overall market."}, {"n": 3, "q": "An investor who is bearish on the market, but does not have a margin account, could benefit from purchasing", "a": "a leveraged fund.", "b": "an equity index fund.", "c": "shares in a hedge fund.", "d": "an inverse fund.", "e": "An inverse (short) fund will increase in value as the market goes down. Leveraged funds can be long or short. Without knowing which, we can't give a definitive answer. Inverse funds can be purchased in a cash account."}, {"n": 4, "q": "Inverse ETFs use which of the following to achieve their objectives?", "a": "Private equity and debt", "b": "Common stock and bonds", "c": "Derivatives and debt", "d": "Cash equivalents and derivatives", "e": "Leveraged and inverse ETFs typically use derivatives such as options, futures contracts, or swaps, along with debt instruments, to achieve their investment objectives."}, {"n": 5, "q": "When evaluating direct participation programs (DPPs), an investor should consider which of the following?\nThe economic viability of the program\nThe tax benefits of the program\nThe management's track record\nThe program's start-up costs", "a": "I, II, III, and IV", "b": "I and II", "c": "I, II, and III", "d": "II and IV", "e": "An investor considering a DPP would want to evaluate the economic viability, the tax benefits, the management's track record, and the start-up costs. All four are important considerations."}, {"n": 6, "q": "What is the maximum amount of bitcoin that will ever be in circulation?", "a": "194,425 coins", "b": "21 million coins", "c": "Indefinite number of coins", "d": "21 billion coins", "e": "The maximum amount of bitcoin that will ever be in circulation is 21 million coins. This is a feature of the bitcoin protocol, which is designed to create a finite supply of the cryptocurrency, which will prevent inflation on BTC."}, {"n": 7, "q": "Which of the following investments is least appropriate for a client primarily concerned with liquidity?", "a": "Preferred stock", "b": "Municipal bond mutual fund", "c": "Direct participation program", "d": "Bank savings account", "e": "There is little secondary market liquidity for direct participation programs (DPPs). Compared to the other choices, they are the least appropriate for a client seeking liquidity."}, {"n": 8, "q": "The published value of an investment that can be used to gauge the fair value of that position, frequently referred to as the indicative value, is a term most commonly associated with", "a": "equity REITs.", "b": "ETNs.", "c": "inverse funds.", "d": "hedge funds.", "e": "The indicative value is a term most commonly associated with exchange-traded notes (ETNs). It is used to gauge the fair value of the ETN position."}, {"n": 9, "q": "An exchange-traded fund that is managed to perform contrary to the benchmark index it is tracking is known as", "a": "an inverse ETF.", "b": "a leveraged ETF.", "c": "a market-neutral ETF.", "d": "a contra-index ETF.", "e": "Inverse ETFs are designed to deliver returns that are the opposite of the benchmark index they track. They are also known as short or bear funds."}, {"n": 10, "q": "Which of the following products would show a negative correlation with the index it is tracking?", "a": "Inverse ETF", "b": "Leveraged ETF", "c": "Market-linked CD", "d": "Exchange-traded note", "e": "An inverse, or short, ETF will move in the opposite direction of the underlying index. That means the correlation between the two will be negative."}, {"n": 11, "q": "Which of the following are commodities?", "a": "Metals, such as gold and silver; dairy products, such as milk", "b": "Soybeans, wheat, and corn", "c": "Corn, wheat, and shares of stock in John Deere", "d": "Precious metals; U.S. Treasury notes", "e": "Soybeans, wheat, and corn are all agricultural commodities. Treasury notes and shares of stock are securities, not commodities. While gold and silver are commodities, dairy products like milk are not typically traded as commodities on futures exchanges."}, {"n": 12, "q": "One benefit of including commodities in a client's portfolio is", "a": "high positive correlation to stocks.", "b": "low or negative correlation with traditional financial assets.", "c": "high expected return.", "d": "guaranteed income.", "e": "One of the primary benefits of including commodities in a portfolio is their low or negative correlation with traditional financial assets like stocks and bonds, which provides diversification benefits."}, {"n": 13, "q": "Which of the following commodities is least likely to be affected by the weather?", "a": "Pork bellies", "b": "Wheat", "c": "Silver", "d": "Orange juice", "e": "Silver is a precious metal and its price is not influenced by the weather. Crops, such as wheat and oranges, certainly are, and livestock is affected as well."}, {"n": 14, "q": "Which of the following terms best describes ETNs and leveraged ETFs?", "a": "Speculative investments", "b": "Registered investment companies", "c": "Alternative investments", "d": "Forms of hedge funds", "e": "These are two popular alternative investments. Are they speculative? Yes, but there are many other speculative investments that are not considered alternative investments. The question asks for the best description and, although it might seem like a close call, these are \"alts.\" The leveraged ETF is a registered investment company, but the ETN is not."}, {"n": 15, "q": "When evaluating the suitability of a DPP for a client, all of the following factors would be considered except", "a": "the client's need for liquidity.", "b": "the amount of risk the client is willing to take.", "c": "the IRS approval of the program's tax deductions.", "d": "the client's tax bracket.", "e": "The IRS does not give advance approval of specific tax deductions for DPPs. All of the other factors listed are relevant suitability considerations."}, {"n": 16, "q": "Which of the following is a precious metal?", "a": "Tin", "b": "Copper", "c": "Nickel", "d": "Platinum", "e": "Platinum, along with gold and silver, is considered a precious metal. Tin, copper, and nickel are industrial metals."}, {"n": 17, "q": "A number of different pooled investment vehicles are included in the term alternative investment. One of them, a synthetic investment instrument that has been created to meet a specific need that cannot be met by a standardized financial instrument, is known as", "a": "an inverse fund.", "b": "an arbitrage.", "c": "a z-tranche CMO.", "d": "a structured product.", "e": "A structured product is a synthetic investment instrument created to meet a specific need that cannot be met by a standardized financial instrument available in the marketplace."}, {"n": 18, "q": "An investment adviser representative (IAR) has several clients who are interested in adding precious metals to their portfolios. Which of the following is the IAR most likely to recommend?", "a": "Aluminum", "b": "Platinum", "c": "Copper", "d": "Nickel", "e": "The only one of these considered a precious metal is platinum. For the exam, there are likely only going to be three precious metals: gold, silver, and platinum. Some students find it easy to remember the list of precious metals by looking at their frequent flyer status."}, {"n": 19, "q": "Commodity futures contracts are available on all of the following except", "a": "single-family homes.", "b": "eggs.", "c": "soybeans.", "d": "industrial metals.", "e": "Commodity futures contracts are available on metals, both precious and industrial; animal products, such as eggs; and agricultural crops, such as soybeans. Single-family homes are not a tradable commodity."}, {"n": 20, "q": "Commodities contracts are available on", "a": "pearls.", "b": "emeralds.", "c": "diamonds.", "d": "platinum.", "e": "You might like diamonds, pearls, emeralds, and rings with those stones mounted in a platinum setting. Only platinum is a precious metal with commodity contracts available."}, {"n": 21, "q": "An investor owns a 2x leveraged inverse ETF. If the underlying index should decrease in value,", "a": "the fund shares will increase in value.", "b": "the fund shares will also decrease in value.", "c": "there is no correlation between the fund and the value of the index.", "d": "the ETF shares will increase in value by two times the decrease in value of the index.", "e": "An inverse, or short, ETF will move in the opposite direction of the underlying index. It is known as a short (or bear) fund because as the underlying index goes down, the value of the shares increases. Because this is a 2x (2 times) leveraged fund, it will move at a rate that is twice that of the index. Although the choice, \"the fund shares will increase in value\" is a true statement, it is not the most accurate answer to the question because it ignores the 2x leverage."}, {"n": 22, "q": "If an investor was of the opinion that the market was going to have a bad day, to maximize that investor's gains, you might recommend", "a": "selling a call option on the S&P 500 Index.", "b": "a leveraged ETF.", "c": "an inverse ETF.", "d": "an inverse leveraged ETF.", "e": "An inverse ETF should go up if the market goes down. Adding leverage to it means moving by a factor of 2x or 3x, so to maximize the potential gain, we combine leverage to the inverse and suggest the inverse leveraged ETF."}, {"n": 23, "q": "One of your clients is 10 years away from retirement and is trying to decide what would be a suitable investment for this year's IRA contribution. You would probably not recommend", "a": "target date mutual funds.", "b": "leveraged ETFs.", "c": "broad market ETFs.", "d": "conservative growth mutual funds.", "e": "Because most leveraged funds reset daily, they are best utilized by investors with a very short time horizon."}, {"n": 24, "q": "Among the characteristics of leveraged exchange-traded funds is that", "a": "leveraged ETFs may be purchased on margin.", "b": "they are generally suitable for investors with a long time horizon.", "c": "they can only be sold to accredited investors.", "d": "leveraged ETFs generally obtain the leverage through bank borrowing.", "e": "Because an exchange-traded fund is purchased and sold on an exchange, the rules generally applying to all exchange products, such as purchasing them on margin, would apply. Leveraged funds use derivative products to generate the leverage, not bank borrowing. When it comes to suitability, they are for aggressive investors, but there is no requirement that they meet the accredited investor standard. However, the very nature of the product is that it is designed for short-term trading, not long-term trading."}, {"n": 25, "q": "A client who is interested in investing in commodities might look at any of the following except", "a": "corn.", "b": "debentures.", "c": "gold.", "d": "heating oil.", "e": "Debentures are a security; each of the others is a commodity."}, {"n": 26, "q": "All of the following would flow through as a loss to limited partners except", "a": "principal repayment on partnership debt.", "b": "depletion.", "c": "interest payments on partnership debt.", "d": "accelerated depreciation.", "e": "Principal repayments are not an expense for tax purposes. The interest on the debt is an expense and, along with depletion and depreciation expenses, does flow through to the limited partners as passive loss."}, {"n": 27, "q": "Which of the following investments is least appropriate for a client primarily concerned with liquidity?", "a": "Preferred stock", "b": "Direct participation program", "c": "Bank savings account", "d": "Municipal bond mutual fund", "e": "There is little secondary market liquidity for direct participation programs (DPPs). Compared to the other choices, they are the least appropriate for a client seeking liquidity."}, {"n": 28, "q": "An alternative investment vehicle that is managed to perform contrary to a benchmark market index such as the S&P 500 is", "a": "a leveraged exchange-traded fund.", "b": "a long put on the index.", "c": "an inverse exchange-traded fund.", "d": "an equity-linked note.", "e": "Inverse exchange-traded funds (ETFs), frequently referred to as bear or short funds, are designed to move in the opposite direction of the index they are tracking. They can be leveraged, but the term leveraged can also apply to an ETF that goes in the same direction as the index. A put option is not a managed alternative investment."}, {"n": 29, "q": "Commodity futures contracts are available on all of the following except", "a": "eggs.", "b": "single-family homes.", "c": "soybeans.", "d": "industrial metals.", "e": "Commodity futures contracts are available on metals, both precious and industrial; animal products, such as eggs; and agricultural crops, such as soybeans. Single-family homes are not a tradable commodity."}, {"n": 30, "q": "Which of the following investments is not registered under the Investment Company Act of 1940?", "a": "UITs", "b": "FACCs", "c": "ETFs", "d": "ETNs", "e": "Exchange-traded notes, sometimes called equity-linked notes, are registered under the Securities Act of 1933 as debt instruments. All of the other choices are registered as investment companies under the Investment Company Act of 1940."}, {"n": 31, "q": "Which of the following commodities is least likely to be affected by the weather?", "a": "Wheat", "b": "Silver", "c": "Orange juice", "d": "Pork bellies", "e": "Silver is a precious metal and its price is not influenced by the weather. Crops, such as wheat and oranges, certainly are, and livestock is affected as well."}, {"n": 32, "q": "What is the maximum amount of bitcoin that will ever be in circulation?", "a": "194,425 coins", "b": "21 billion coins", "c": "Indefinite number of coins", "d": "21 million coins", "e": "The maximum amount of bitcoin that will ever be in circulation is 21 million coins. This is a feature of the bitcoin protocol, which is designed to create a finite supply of the cryptocurrency, which will prevent inflation on BTC."}, {"n": 33, "q": "Which of the following is true regarding ETNs?", "a": "Their value can be impacted by changes in the issuer's credit rating.", "b": "As fixed-income investments, they do not have market risk.", "c": "They are noncallable prior to maturity.", "d": "They are suitable for conservative investors seeking income.", "e": "ETNs are unsecured debt obligations carrying credit risk based on the issuer's credit rating. Fixed-income investments have the market risk more commonly referred to as interest rate risk, and they are usually callable. These are sophisticated instruments that are not suitable for conservative investors."}, {"n": 34, "q": "Which of the following is a motivation for creating structured products?", "a": "Structured products improve profits for broker-dealers.", "b": "Structured products reduce costs to issuers.", "c": "Structured products improve market completeness.", "d": "Structured products are less expensive for investors to buy and trade.", "e": "The primary motivation for financial structuring is to increase market completeness. Structured products are created to meet a specific need for which there is nothing available in the current market. Creating this structured product is said to be \"completing the market.\""}, {"n": 35, "q": "A client invests $100,000 in a commercial real estate venture taking a 10% interest as a limited partner. Unfortunately, the demand for new office space deteriorates and the partnership is unable to meet the mortgage payments. The end result is foreclosure with a net loss of $2 million. This would have the effect of:", "a": "giving the client a passive loss of $200,000.", "b": "a potential claim against the agent who sold the client this program.", "c": "giving the client a passive loss of $100,000.", "d": "requiring the client to pay his share of the loss to the creditors.", "e": "The most the client can lose is the amount of the investment, in this example, $100,000. Because DPPs are considered passive investments, the loss may only be deducted against passive income. As a limited partner, the loss is \"limited\" to the original investment."}, {"n": 36, "q": "Inverse ETFs are suitable primarily for investors", "a": "who are bullish on the market's future.", "b": "with a very short time horizon.", "c": "wishing to leverage their income.", "d": "who follow a passive investment strategy.", "e": "Inverse and leveraged ETFs are structured in such a manner that makes holding them for more than a few days or a week become unattractive. They are for bearish investors, which is why they are often referred to as short funds. They are purchased for short-term capital gains; there is no income."}, {"n": 37, "q": "A number of different pooled investment vehicles are included in the term alternative investment. One of them, a synthetic investment instrument that has been created to meet a specific need that cannot be met by a standardized financial instrument, is known as", "a": "an inverse fund.", "b": "an arbitrage.", "c": "a structured product.", "d": "a z-tranche CMO.", "e": "Structured products are created as a tool to meet the issuer's debt financing needs when they will result in a lower cost than a standardized financial instrument available in the market place."}, {"n": 38, "q": "Which of the following terms best describes ETNs and leveraged ETFs?", "a": "Forms of hedge funds", "b": "Registered investment companies", "c": "Speculative investments", "d": "Alternative investments", "e": "These are two popular alternative investments. Are they speculative? Yes, but there are many other speculative investments that are not considered alternative investments. The question asks for the best description and, although it might seem like a close call, these are \"alts.\" The leveraged ETF is a registered investment company, but the ETN is not."}, {"n": 39, "q": "Someone who wishes to invest in precious metals would consider any of the following except", "a": "gold.", "b": "silver.", "c": "platinum.", "d": "lead.", "e": "Lead is not considered a precious metal. Some students find it easy to remember the list of precious metals by looking at their frequent flyer status. You might be a silver, a gold, or a platinum level, but no airline has a lead level flyer status."}, {"n": 40, "q": "A 3x leveraged fund priced at $42 tracks an index that is up 2% one day and then down 3% on the next day. What should this fund be approximately priced at following these two volatile days?", "a": "$40.50", "b": "$41.55", "c": "$43.18", "d": "$45.86", "e": "Starting with the $42 purchase price, a 2% increase to the index on Day 1 equals $0.84 up (0.02 x $42 = $0.84). Given the 3x leverage, this would equate to a $2.52 increase on Day 1 (3 x $0.84 = $2.52). At the start of Day 2, the fund would be priced at $44.52. On Day 2, the index falls by 3%. A 3% decrease equals $1.34 (0.03 x $44.52). Again due to the 3x leverage, the $1.34 decrease equates to a $4.02 drop. Therefore, after the two volatile days, the fund should be priced at approximately $40.50."}, {"n": 41, "q": "It would be correct to state that an inverse ETF", "a": "is suitable for sophisticated investors with a long time horizon.", "b": "utilizes derivatives to achieve its objectives.", "c": "moves in tandem with the index being tracked.", "d": "is a form of private equity fund.", "e": "Inverse, or short, ETFs move in the opposite direction of the index being tracked. To achieve their goals, various types of derivatives are used. This type of ETF is used only for short-term investments, rarely as long as a single month. These are registered investment companies, not private."}, {"n": 42, "q": "One of the benefits of adding precious metals to an investor's portfolio is", "a": "a high correlation to the stock market.", "b": "a potential inflation hedge.", "c": "generous income.", "d": "low transaction costs.", "e": "Precious metals are traditionally viewed as a hedge against inflation. One of their benefits is that they have a low correlation with the stock market. Transaction costs for precious metals tend to be higher than securities. One significant negative is that these investments generate no income."}]}, {"id": 6, "name": "Unit 6: Economic Factors and Business Information", "key": "DBCDACABABDBAABDDDDBBDAB", "questions": [{"n": 1, "q": "An investor purchasing gold bullion is most likely looking for an investment that is", "a": "cyclical.", "b": "income producing.", "c": "exchange traded.", "d": "countercyclical.", "e": "Countercyclical assets are those whose prices tend to move in the opposite direction of the overall economy. Historically, the price of precious metals, especially gold (and stock in gold-mining companies), moves up when the economy enters the contraction phase and moves in the reverse direction during expansion. Cyclical stocks follow the cycle. There is no \"gold bullion exchange.\" It is a dealer market with bullion dealers all over the world setting their own spreads. A bar of gold does not provide income."}, {"n": 2, "q": "While reviewing nationwide industrial production figures, an analyst notices that inventories have been rising. From that information, one would gather that the economy is most likely in which phase of the business cycle?", "a": "Peak", "b": "Contraction", "c": "Recovery", "d": "Expansion", "e": "Downturns in the business cycle (a contraction) tend to be characterized by rising inventories due to a lack of consumer demand. During expansion or recovery, demand is high and goods are less likely to remain in inventory."}, {"n": 3, "q": "All of the following actions will increase the deficit in the U.S. balance of payments except", "a": "investments by U.S. firms abroad.", "b": "U.S. foreign aid.", "c": "the purchase by foreigners of U.S. securities.", "d": "Americans buying Japanese cars.", "e": "A debit in the U.S. balance of payments occurs when the country pays out more abroad than it takes in. This occurs when the U.S. imports more than it exports, invests money abroad, or sends money to foreign countries in the form of foreign aid."}, {"n": 4, "q": "Which of the following industries would be least cyclical?", "a": "Heavy equipment", "b": "Leisure products", "c": "Automobile manufacturing", "d": "Supermarket chain", "e": "Industrial activity usually follows business cycles, which have more impact on some industries than others. The food industry is one for which the demand is not generally based on economic conditions."}, {"n": 5, "q": "A bond analyst notices that the yield spread between corporate bonds and government bonds is widening. This is typically predictive of", "a": "an economic slowdown.", "b": "increased concern over the national debt.", "c": "an expanding economy.", "d": "increasing interest rates.", "e": "A widening yield spread shows that the difference in yield between corporate bonds and U.S. Treasury bonds is increasing. This is usually caused by a flight to quality, the pattern of investors moving their investments to the safety of Treasury securities. This is commonly felt to be a prediction of a future recession or economic slowdown. During a slowdown, interest rates generally decline."}, {"n": 6, "q": "If the U.S. dollar is devalued relative to other world currencies, which of the following will occur with respect to the prices of goods?\nU.S. exports will be more price competitive overseas.\nU.S. exports will be less price competitive overseas.\nForeign imported goods will be more price competitive with ours.\nForeign imported goods will be less price competitive with ours.", "a": "I and III", "b": "II and III", "c": "I and IV", "d": "II and IV", "e": "If the dollar goes down in relation to foreign currencies, then foreigners can buy more U.S. goods with the same amount of their currency, making U.S. goods more competitive in foreign markets. This same movement in the dollar means it takes more dollars to buy the same amount of foreign goods in domestic markets, making foreign goods less competitive with U.S. goods."}, {"n": 7, "q": "Increases in which of the following indicators are regarded as predictors of the level of business activity?", "a": "Building permits", "b": "Corporate profits", "c": "Levels of inventories", "d": "Personal incomes", "e": "Increases in building permits are indicative of increased future business activity and therefore are considered a leading economic indicator. Increases in personal income reflect current, not future, activity and are therefore considered a coincident indicator. Increases in inventories indicate that goods are not being sold in anticipated quantities, so they function as a disincentive to manufacturing. Buildup in inventories is a lagging economic indicator. Corporate profits are not included in the Conference Board's list of economic indicators."}, {"n": 8, "q": "An economic indicator that has turning points that tend to occur after the turning points in the business cycle is classified as", "a": "a coincident indicator.", "b": "a lagging indicator.", "c": "a trailing indicator.", "d": "a leading indicator.", "e": "Lagging indicators have turning points that occur after business cycle turning points. That is why they are called lagging indicators. Leading indicators are ahead of the cycle and coincident indicators parallel the cycle."}, {"n": 9, "q": "Interest rates are rising. An analyst would be most likely to state that the business cycle is in which stage?", "a": "Expansion", "b": "Peak", "c": "Trough", "d": "Contraction", "e": "It is during periods of economic expansion that interest rates tend to increase. They tend to fall during contractions."}, {"n": 10, "q": "All of the following are leading indicators for economic growth except", "a": "average weekly initial claims for state unemployment compensation.", "b": "average prime rate.", "c": "stock prices as measured by the S&P 500 index.", "d": "orders for durable goods.", "e": "The average prime rate is a lagging indicator. The duration of unemployment is also a lagging indicator, but the number of initial unemployment claims is a leading indicator. The S&P 500 index and orders for durable goods are leading economic indicators."}, {"n": 11, "q": "A business reporter claims that we are suffering from inertial inflation. This means", "a": "prices are increasing at a steady rate.", "b": "the business cycle is heading toward a trough.", "c": "the economy is about to enter a deflationary period.", "d": "the current rate of inflation will remain at this level until economic shocks cause it to change.", "e": "Inertial inflation means that there is not expected to be a change in the inflation rate until some kind of economic event shakes things up and causes the rate to move up or down."}, {"n": 12, "q": "If disposable personal income has fallen steadily over the past year, which of the following is most likely going to be affected?", "a": "Firms that produce nondurable consumer goods", "b": "Automotive industry", "c": "Pharmaceutical industry", "d": "Tobacco industry", "e": "The automobile industry is cyclical and, of the choices, the most likely to be affected by a change in the business cycle as indicated by declining personal income. The tobacco industry and producers of nondurable consumer goods (e.g., toilet paper and basic clothing) are considered defensive industries: those where the demand is relatively constant, regardless of economic conditions."}, {"n": 13, "q": "The economy has gone through three consecutive quarters of economic decline with no immediate end in sight; therefore, it could be said to be", "a": "in a recession.", "b": "lagging.", "c": "in a recovery.", "d": "in a depression.", "e": "Recession is defined as two or more consecutive quarters of economic decline. It would have to be at least six quarters to be considered a depression."}, {"n": 14, "q": "An investor purchasing gold bullion is most likely looking for an investment that is", "a": "countercyclical.", "b": "income producing.", "c": "exchange traded.", "d": "cyclical.", "e": "Countercyclical assets are those whose prices tend to move in the opposite direction of the overall economy. Historically, the price of precious metals, especially gold (and stock in gold-mining companies), moves up when the economy enters the contraction phase and moves in the reverse direction during expansion."}, {"n": 15, "q": "If an economist were to describe defensive issues, he would probably not include companies that produce", "a": "food products.", "b": "building materials.", "c": "clothing.", "d": "tobacco products.", "e": "Defensive issues are issues that are defensive against a downturn in the economy. Building materials are usually susceptible to downturns when the economy is bad."}, {"n": 16, "q": "If the U.S. dollar is devalued relative to other world currencies, which of the following will occur with respect to the prices of goods?\nU.S. exports will be more price competitive overseas.\nU.S. exports will be less price competitive overseas.\nForeign imported goods will be more price competitive with ours.\nForeign imported goods will be less price competitive with ours.", "a": "II and III", "b": "II and IV", "c": "I and III", "d": "I and IV", "e": "If the dollar goes down in relation to foreign currencies, then foreigners can buy more U.S. goods with the same amount of their currency, making U.S. goods more competitive in foreign markets. This same movement in the dollar means it takes more dollars to buy the same amount of foreign goods in domestic markets, making foreign goods less competitive with U.S. goods."}, {"n": 17, "q": "The contraction phase of the business cycle is least likely accompanied by", "a": "low or negative economic growth.", "b": "decreasing inflation pressure.", "c": "decreasing business and consumer expenditures.", "d": "decreasing unemployment.", "e": "An economic contraction is likely to feature increasing unemployment (i.e., decreasing employment), along with declining economic output and decreasing inflationary pressure. Watch out for the double negatives."}, {"n": 18, "q": "The Conference Board releases information about the economy on a monthly basis. Included are a number of different indicators. Economic indicators can be leading, lagging, or coincidental, which indicates the timing of their changes relative to how the economy as a whole changes. Which of the following is a lagging economic indicator?", "a": "Building permits (housing starts)", "b": "Nonagricultural employment", "c": "Manufacturers' new orders for consumer goods", "d": "Average prime rate", "e": "The average prime rate is a lagging indicator because, in an economic downturn, the longer rates stay low, the quicker the recovery should be. Manufacturers' new orders for consumer goods and building permits are leading indicators. Nonagricultural employment is a coincidental indicator."}, {"n": 19, "q": "A common measurement used to evaluate attitudes regarding future economic conditions is the difference in yields between U.S. Treasury bonds and corporate bonds. This is known as", "a": "a business cycle.", "b": "the Consumer Price Index.", "c": "a yield curve.", "d": "a yield spread.", "e": "Many analysts compare the difference between yields on bonds with the same maturity but different quality (rating) to get a sense of the market sentiment. A common example of that is comparing the difference between the yield on a U.S. Treasury bond and a highly rated corporate bond. When investor sentiment is positive, the extra safety of the Treasury security is not considered as valuable, so the spread is narrow. When there is \"gloom and doom\" ahead, investors flock to the safety of the Treasury, causing the spread to widen."}, {"n": 20, "q": "Interest rates are rising. An analyst would be most likely to state that the business cycle is in which stage?", "a": "Contraction", "b": "Expansion", "c": "Trough", "d": "Peak", "e": "It is during periods of economic expansion that interest rates tend to increase. They tend to fall during contractions."}, {"n": 21, "q": "If the Consumer Price Index (CPI) is down but consumer demand is up, the economy is likely in which stage of the business cycle?", "a": "Recovery to trough", "b": "Recovery to expansion", "c": "Contraction to trough", "d": "Peak to contraction", "e": "As prices trend downward and consumer demand increases, the economy is moving from recovery to expansion. As demand continues to increase, assuming supply remains constant, upward pressure will be put on prices through the expansion to the peak."}, {"n": 22, "q": "A securities analyst's stock selection method is to begin by looking for superior companies, regardless of their industry sector or the condition of the overall economy. In so doing, this analyst is using", "a": "the business cycle approach.", "b": "the top-down approach.", "c": "the optimal portfolio approach.", "d": "the bottom-up approach.", "e": "This is the basic approach of bottom-up analysis. Rather than focusing the attention on the overall market (the macro view of the economy) or the sectors that are likely to outperform, this approach seeks to identify--usually based on the company's fundamentals--the most attractive individual stocks."}, {"n": 23, "q": "If the yield curve is positive (sloping upward), this means that long-term interest rates are", "a": "higher than short-term rates.", "b": "expected to decline.", "c": "lower than short-term rates.", "d": "the same as short-term rates.", "e": "A yield curve shows the relationship between short-term and long-term interest rates. When the yield curve is positive, it slopes upward. This means that long-term interest rates are higher than short-term rates."}, {"n": 24, "q": "Which of the following statements reflects the monetarist economic position?", "a": "The total amount of money in the economy is the result of the level of interest rates.", "b": "The amount of money in the economy determines the overall price level over time; therefore, the Federal Reserve should control the growth of the amount of money in the economy in a gradual and predictable way.", "c": "The best way to control the money supply is to raise taxes, which will reduce the amount of money in the economy and lower prices.", "d": "The amount of money in the economy is not significant because economic activity reflects the value of real goods and services; therefore, the Federal Reserve should not attempt to manage the money supply.", "e": "Monetarists believe that the economy and inflation are best controlled through the management of the money supply rather than through fiscal policy stimulation."}]}, {"id": 7, "name": "Unit 7: Financial Reporting, Business Concepts, and Investment Vehicle Characteristics", "key": "DBCCBDCDBDBBADBABCBACBBCCDCCAC", "questions": [{"n": 1, "q": "Current liabilities on a company's balance sheet would include", "a": "prepaid rent.", "b": "accounts receivable.", "c": "mortgage payable.", "d": "accounts payable.", "e": "Current liabilities are those that are expected to be paid within a normal operating cycle and would include accounts payable. A mortgage payable is a liability, but it is a long-term debt and would be included in fixed or long-term liabilities. Accounts receivable and prepaid expenses are current assets."}, {"n": 2, "q": "Due to changes in customer preferences, a manufacturing company has decided to discontinue the operations of one of its subsidiaries. An explanation of this decision would most likely be found in the company's", "a": "balance sheet.", "b": "footnotes to the financial statements.", "c": "income statement.", "d": "tax return.", "e": "Footnot

render ADRs in exchange for receiving the shares of the non-U.S. company.", "c": "Dividends are declared in the foreign currency, so exchange rate, or currency, risk is completely eliminated.", "d": "ADRs are denominated and pay dividends in U.S. dollars, not foreign currencies, thus saving the investor transaction costs with respect to converting currencies.", "e": "ADRs are receipts issued by a U.S. bank for shares of a foreign company purchased and held by a foreign branch of the bank."}, {"n": 38, "q": "One of the rights of being a stockholder is the ability to vote on important corporate matters, such as the election of members to the board of directors. The date that determines which shareholders are eligible to votes is", "a": "the ex-dividend date.", "b": "the last day of the company’s fiscal year.", "c": "the record date.", "d": "the election date.", "e": "The record date is a date announced by the company as the official date you must be an owner on the company's records."}, {"n": 39, "q": "A company that has issued cumulative preferred stock", "a": "pays the preferred dividend before paying the coupons due on its outstanding bonds", "b": "forces conversion of the preferred that is trading at a discount to par, thereby eliminating the need to pay past-due dividends", "c": "pays past and current preferred dividends before paying dividends on common stock", "d": "pays the current dividends on the preferred, but not the past dividends on the preferred, before paying a dividend on the common", "e": "Current and unpaid past dividends on cumulative preferred stock must be paid before common stockholders can receive a dividend."}, {"n": 40, "q": "ADRs are used to facilitate", "a": "the domestic trading of foreign securities", "b": "the domestic trading of U.S. government securities", "c": "the foreign trading of domestic securities", "d": "the foreign trading of U.S. government securities", "e": "An ADR is a negotiable security that represents an ownership interest in a non-U.S. company."}, {"n": 41, "q": "Ms. Abbot has a joint account with her sister. She enters a sell order in the account and instructs that the proceeds check be made out to her only. If your firm sends the check but makes it payable to both Ms. Abbot and her sister, this is an example of", "a": "not following instructions, a prohibited practice under the Uniform Securities Act", "b": "an unlawful practice because the transaction was unauthorized", "c": "an unfortunate error that can be reconciled with the broker-dealer through a process called reclamation", "d": "the proper joint account procedure", "e": "In joint accounts, either party may act. However, by law, all checks must be made payable to all owners."}, {"n": 42, "q": "When does a customer have to receive the OCC Options Disclosure Document?", "a": "Within 15 days of account approval by the firm's designated options supervisor", "b": "Before accepting the customer’s first order to trade options covered by the ODD", "c": "With the confirmation of the first options transaction", "d": "Within 5 business days of the first options trade", "e": "When opening an account to trade options, the owner must be told about the risks involved. The options disclosure document satisfies the risk disclosure requirements."}, {"n": 43, "q": "In an account opened by 2 individuals as joint tenants with rights of survivorship, all of the following are true EXCEPT", "a": "in the event of death, the other party assumes full ownership of the account", "b": "orders may be entered by either party", "c": "mail may be directed to the joint owner agreed upon by both parties to the account", "d": "stock certificates may be delivered in the name of either party", "e": "In a JTWROS account, each party has an equal, undivided interest. Upon the death of 1 party, the other party assumes full ownership."}, {"n": 44, "q": "One major difference between the customer identification program (CIP) and the new account opening rules of the regulatory bodies is that", "a": "the CIP requires a residence address for individuals while the regulatory bodies will accept a PO Box", "b": "the CIP only applies to individuals while the rules of the regulators apply to retail and institutional accounts", "c": "the CIP requires a statement of the customer’s goals while the regulators only require current financial information", "d": "the CIP requires date of birth while the regulators only require proof of legal age", "e": "The CIP requires the actual date of birth, not just proof of legal age."}, {"n": 45, "q": "One of the portions of the USA PATRIOT Act of 2001that affects the opening of an account for a new customer is", "a": "the customer identification program", "b": "the “know-your-customer rule", "c": "the Transportation Security Administration (TSA)", "d": "the requirement to obtain suitability information", "e": "The customer identification program (CIP) is mandated by the PATRIOT Act and requires that broker-dealers obtain certain specified information about new customers."}, {"n": 46, "q": "When does a customer have to receive the OCC Options Disclosure Document?", "a": "At or prior to the time the account is approved for options trading", "b": "With the confirmation of his first options transaction", "c": "Within 5 business days of the first options trade", "d": "Within 15 days of account approval", "e": "Before opening an account to trade options, the owner must be told about the risks involved with trading options."}, {"n": 47, "q": "A woman wants to buy from an agent who is not registered in her state. She decides to use a friend's address in the state in which the agent is licensed. This action is", "a": "acceptable as long as she has her friend's permission to use the address", "b": "acceptable because the agent can do business only with those who have a residence address in those states in which he is registered", "c": "not acceptable because the other party does not know you are using the address", "d": "not acceptable because there are no circumstances under which you are permitted to use someone else's address as yours", "e": "Use of a fictitious home address is not only a red flag, it is illegal under the federal customer identification program (CIP)."}, {"n": 48, "q": "All the following information must be obtained from new individual customers EXCEPT", "a": "educational background", "b": "Social Security number", "c": "date of birth", "d": "physical address", "e": "A customer's educational background is not required to open a new account."}, {"n": 49, "q": "Two sisters might wish to open an account as tenants in common (TIC) rather than JTWROS in order to", "a": "ensure that their respective shares go to their heirs instead of the surviving sister.", "b": "limit the right of each party to withdraw assets from the account.", "c": "provide for an undivided interest in the assets of the account.", "d": "allow the spouse of each sister to have access to the account.", "e": "In a TIC account, when one of the cotenants dies, that individual's share passes to her estate, not directly to the survivor."}, {"n": 50, "q": "All of the following statements relating to an account registered as tenants in common are true EXCEPT", "a": "cotenants can own unequal percentages of the assets in the account", "b": "each cotenant has an undivided interest in the entire account", "c": "upon the death of one of the cotenants, that individual’s share of the account passes to the survivor(s)", "d": "this form of registration is less common for married couples than JTWROS", "e": "Unlike an account registered JTWROS, when a cotenant in a TIC account dies, that individual's share passes to the individual's estate."}, {"n": 51, "q": "If a new joint tenants with rights of survivorship account is opened by two related individuals, all of the following statements are true EXCEPT", "a": "orders may be given by either party", "b": "mail may be sent to either party (with the permission of each party)", "c": "in the event of death, the decedent's interest in the account goes to the other party", "d": "checks may be drawn in the name of either party", "e": "While either party may enter an order, any money or securities delivered out of the account must be in the names of both owners."}, {"n": 52, "q": "The customer identification program (CIP) requires that certain information relating to new customers be obtained. Included in that requirement for individual clients who are citizens of the United States are all of the following EXCEPT", "a": "current employment status", "b": "a physical address", "c": "Social Security number", "d": "date of birth", "e": "The 4 primary requirements of the CIP are the individual client's name, physical address, DOB, and SSN."}, {"n": 53, "q": "Which of the following documents would aid an investment adviser in its responsibility to fully understand the needs of a client when making investment recommendations?", "a": "A proxy voting policy.", "b": "A restricted list.", "c": "A communications agreement.", "d": "An investment policy statement.", "e": "The IPS is the key document that defines an investor's risk and return objectives and any constraints for their investment."}, {"n": 54, "q": "Obtaining all of the following complies with the regulations regarding customer identification programs (CIPs) EXCEPT", "a": "date of birth", "b": "a PO Box, instead of a physical address, if it is the primary mailing address", "c": "name", "d": "taxpayer identification number", "e": "A PO Box is never acceptable without a physical address."}, {"n": 55, "q": "Although all new accounts must be approved by a designated supervisor before any trading activity may take place, there is one type of account that must be approved by a specially qualified supervisor. That would be", "a": "a discretionary account", "b": "an IRA", "c": "a margin account", "d": "an options account", "e": "Because trading options generally involves a higher degree of risk, a designated supervisory person must approve the account opening."}, {"n": 56, "q": "Under industry rules, customers who wish to trade options must receive a copy of the options disclosure document (ODD)", "a": "at or before the mailing of the confirmation representing the first options trade", "b": "at or before the mailing of the next monthly statement", "c": "within 15 days of account approval", "d": "at or before account approval", "e": "All prospective options customers must receive a copy of the ODD at or before the time the account is approved to trade options."}, {"n": 57, "q": "An advantage of structuring a business operation as an S corporation rather than a C corporation would be", "a": "the C corporation is limited to a maximum of 100 shareholders while no such limit exists for the S corporation", "b": "limited liability", "c": "simplicity when raising capital through a public offering", "d": "avoiding double taxation", "e": "Because an S corporation is taxed like a partnership, all earnings (or losses) flow directly through to the shareholders."}, {"n": 58, "q": "Which of the following individuals may NOT open a joint account?", "a": "Business colleagues", "b": "Parent and a minor", "c": "Two spouses", "d": "Three sisters", "e": "Any 2 or more persons can have a joint account, but a minor is specifically excluded from the definition of a person."}, {"n": 59, "q": "All of the following actions must be completed prior to customers entering their first option trade EXCEPT", "a": "receipt of a completed options agreement", "b": "delivery of the options disclosure document (ODD)", "c": "approval by a designated options supervisor", "d": "completion of the new account form", "e": "Customers do not have to complete (sign) the options agreement prior to entering an order; it must be signed and returned within 15 days."}, {"n": 60, "q": "Which of the following actions should be taken by an agent when a client decides to open an options account?", "a": "Assure that an options agreement has been signed prior to the first trade taking place", "b": "Provide an options disclosure document no later than 15 days after the first trade", "c": "Review with the client the risks involved when trading options before the first options trade", "d": "Obtain approval from the designated options supervisor to open the account no later than 1 business day after the first options trade", "e": "It is imperative that suitability and risk be addressed with the client before allowing option trading to take place."}, {"n": 61, "q": "A feature of which of the following business entities is limited liability for owners, as well as flow-through of income?", "a": "Sole proprietorship", "b": "Limited partnership", "c": "C corporation", "d": "General partnership", "e": "Limited partnership interests offer both flow-through of income (or loss) along with limited liability."}, {"n": 62, "q": "Small corporations that satisfy certain criteria can elect not to pay income tax at the corporate level but instead pass their earnings through to their shareholders. These corporations are known as", "a": "S corporations", "b": "Q corporations", "c": "R corporations", "d": "C corporations", "e": "The type of small corporation that can elect not to be taxed at the corporate level is an S corporation."}, {"n": 63, "q": "Which of the following is among the items of information that must be entered on a new account form?", "a": "Names of all persons who will have access to the account", "b": "Names of other broker-dealer firms already holding accounts for the prospective customer", "c": "What educational degree(s) the accountholder has earned", "d": "Names and addresses of at least 2 of the prospective customer's neighbors as personal references", "e": "The facts that are required on a new account form are aimed at facilitating the operation of the account and properly identifying the customer."}, {"n": 64, "q": "The federal legislation that requires broker-dealers to verify the identity of any person opening an account is", "a": "the Insider Trading and Securities Fraud Enforcement Act of 1988", "b": "the Uniform Securities Act of 1956", "c": "the USA PATRIOT Act of 2001", "d": "the Securities Exchange Act of 1934", "e": "The USA PATRIOT Act requires firms to obtain identifying information on each new customer, verify identity, maintain records, and check against lists of known or suspected terrorist groups."}, {"n": 65, "q": "Your clients, a married couple, are trying to decide whether to open an account as joint tenants with right of survivorship or tenants by the entirety. You might point out to them that one of the differences to consider is that:", "a": "only the JBE account avoids probate upon the death of the first tenant.", "b": "a JBE account requires the consent of both parties to make a trade.", "c": "any 2 people can open a JBE account, while JTWROS accounts are limited to married couples.", "d": "a JTWROS account requires the consent of both parties to make a trade.", "e": "One of the unique characteristics of the joint by the entirety (JBE) account is that the consent of the other party is necessary to enter a trade."}, {"n": 66, "q": "Which of the following types of businessowners has unlimited liability for the business's debts?", "a": "Member of a limited liability company (LLC)", "b": "Owner of a sole proprietorship", "c": "Shareholder of a corporation", "d": "Limited partner", "e": "The owner of a sole proprietorship has unlimited personal liability for the debts of the business."}, {"n": 67, "q": "There are many different legal ways to structure a new business entity. One of these is the general partnership. Among the benefits of using this structure would be", "a": "ease of formation", "b": "limited liability", "c": "the 50% dividends received exclusion", "d": "substantial capital can be raised with little effort and low cost", "e": "Compared with a corporation, it is generally easier to form (and dissolve) a partnership."}, {"n": 68, "q": "A client is completing a new account form that contains questions about the investor's investing experience and knowledge. More than likely, what type of account is being opened?", "a": "Discretionary", "b": "Retirement", "c": "Options", "d": "Margin", "e": ""}, {"n": 69, "q": "Which of the following business accounts does not require considering the suitability of the owners?", "a": "S corporations", "b": "General partnership", "c": "Sole proprietorship", "d": "C corporations", "e": ""}, {"n": 70, "q": "A customer and his spouse own shares in the ABC Fund as joint tenants with rights of survivorship. If the customer dies, what happens to the shares in the account?", "a": "The account would be frozen until the estate was settled.", "b": "Ownership of the shares must be determined by probate court.", "c": "The spouse would own all the shares.", "d": "Half the shares would belong to the spouse, and the remaining half would be distributed to the customer's estate.", "e": ""}, {"n": 71, "q": "Under the Uniform Securities Act, which of the following is an investment adviser?", "a": "Tom writes a newspaper column that analyzes and recommends securities.", "b": "Jane advises customers regarding the value of gold and silver coins.", "c": "The Trust Department of ABC Bank provides investment advice to its clients.", "d": "Jill is an attorney specializing in estate planning who, as a side job, structures portfolios for the beneficiaries of her deceased clients at a reduced fee.", "e": ""}, {"n": 72, "q": "Under the Uniform Securities Act, a person whose business model is selling reports on a subscription basis concerning specific securities to investors based on their individual objectives will be defined as", "a": "a broker-dealer", "b": "an investment adviser", "c": "a journalist", "d": "an agent", "e": ""}, {"n": 73, "q": "Which of the following is NOT a person as defined by the Uniform Securities Act?", "a": "XYZ Dry Cleaners, Inc., whose shareholders all work on the premises and also offer financial advice to customers who request it.", "b": "A small unincorporated investment club.", "c": "A child prodigy for whom his mother, as custodian, opened an account at a major securities firm.", "d": "Guelph, a small city outside of Toronto, Ontario, that maintains an investment account at a brokerage house to invest surplus funds.", "e": ""}, {"n": 74, "q": "The term \"investment counsel\" can be used by investment advisers", "a": "who are registered with the SEC under the Investment Advisers Act of 1940", "b": "who are also attorneys", "c": "who are also registered as broker-dealers", "d": "with a primary business of rendering investment advice", "e": "While this choice is only half correct, under the Investment Advisers Act of 1940, the term investment counsel may be used by any adviser that meets two standards."}, {"n": 75, "q": "Which of the following investment advisers would be permitted to use the term \"investment counsel\"?", "a": "A professional providing a market timing service with an annual subscription fee of $995, with this service attempting to maximize profits by suggesting entry and exit points for over 100 listed stocks", "b": "An investment adviser who has been admitted to the bar in the state in which the firm's principal office is located", "c": "A financial planner offering a wide range of services to his clients, including tax planning, estate planning, insurance planning, and investment advice", "d": "A firm whose exclusive business is placing clients' assets into model portfolios", "e": "In order for the term investment counsel to be used, two criteria must be met. First, the principal business must be the rendering of investment advice."}, {"n": 76, "q": "The responsibility for administering the Investment Advisers Act of 1940 lies with", "a": "FINRA", "b": "the Administrator", "c": "the Investment Advisers Association (IAA)", "d": "the SEC", "e": ""}, {"n": 77, "q": "Registration as an investment adviser is required for any firm in the business of giving advice on the purchase of", "a": "gold coins", "b": "apartments undergoing a conversion to condominiums", "c": "convertible bonds", "d": "rare convertible automobiles", "e": ""}, {"n": 78, "q": "A federal covered registered investment adviser who receives compensation for advice and whose business is primarily as an investment adviser may describe its business as investment counsel if", "a": "a substantial part of his business is providing investment supervisory services", "b": "it maintains custody of customer funds and/or securities", "c": "it maintains its registration by filing an updating amendment to its Form ADV annually", "d": "it receives SEC approval to use the definition", "e": ""}, {"n": 79, "q": "Under the Investment Advisers Act of 1940, which of the following is TRUE about the use of the term \"investment counsel\" by investment advisers?", "a": "Advisers may use the term without restriction as long as they are registered.", "b": "The use of the term is prohibited under any circumstances.", "c": "Advisers may use the term only if their principal business is acting as an investment adviser and a substantial part of their business consists of providing continuous advice based on a client's individual needs.", "d": "Advisers may use the term only if they are attorneys.", "e": ""}, {"n": 80, "q": "All of the following have legal standing as persons under the Uniform Securities Act EXCEPT", "a": "minor children", "b": "trusts where the interests of the beneficiaries are evidenced by a security", "c": "joint-stock companies", "d": "unincorporated organizations", "e": ""}, {"n": 81, "q": "Blue-sky laws pertain to all of the following EXCEPT", "a": "the registration of securities within a state", "b": "the regulation of securities transactions in a state", "c": "the registration of securities salespeople in a state", "d": "the regulation of securities trading in other countries", "e": "Blue-sky (Uniform Securities Act) laws refer to state securities regulation. Blue-sky laws require new securities to be registered with the state."}, {"n": 82, "q": "Under the Uniform Securities Act, which of the following is included in the definition of an investment adviser?", "a": "Publisher that receives a yearly subscription fee for a newsletter that provides nonspecific investment advice", "b": "Antiques dealer who receives a fee for advising customers as to the value of antiques and rare coins", "c": "Bank that offers investment counseling to its high-net-worth customers", "d": "A broker-dealer who receives a flat fee for analyzing a customer's investment objectives and recommending a portfolio of securities", "e": ""}, {"n": 83, "q": "Under the Uniform Securities Act, an accountant who charges hourly fees for securities recommendations in the regular course of his accounting practice is", "a": "included in the definition of an investment adviser because he is compensated for giving investment advice in the regular course of business", "b": "not included in the definition of an investment adviser because he is an accountant", "c": "included in the definition of an investment adviser because accountants are not among the professionals excluded from the definition", "d": "not included in the definition of an investment adviser because he receives an hourly rate instead of a commission", "e": ""}, {"n": 84, "q": "Which of the following statements best describes an investment supervisory service as described by the Investment Advisers Act of 1940?", "a": "An investment advisory firm offers nondiscretionary services on a non-client-specific basis.", "b": "An investment adviser sends monthly newsletters to 200 clients offering nonspecific advice.", "c": "An investment adviser provides continuous advice based on the client's individual needs.", "d": "No actions are taken in client accounts without first being approved by a senior supervisory person.", "e": "An investment supervisory service is an individualized service delivered to a specific client on a continual basis."}, {"n": 85, "q": "An investment adviser whose primary business is the rendering of investment advice providing investment supervisory services is entitled to use the term", "a": "senior adviser", "b": "pension consultant", "c": "investment counsel", "d": "financial planner", "e": ""}, {"n": 86, "q": "The responsibility for administering the Investment Advisers Act of 1940 lies with", "a": "the SEC.", "b": "the Investment Advisers Association (IAA).", "c": "FINRA.", "d": "the Administrator.", "e": ""}, {"n": 87, "q": "There are waivers from the Series 65 exam requirement for certain professional designations. Among those qualifying for the waiver are individuals who have which of the following designations?", "a": "CIMA", "b": "Ph.D. in economics", "c": "ChFC®", "d": "MBA in finance", "e": "There are waivers from the Series 65 exam requirement for certain professional designations including CFP, CIC, ChFC, PFS, and CFA."}, {"n": 88, "q": "The purpose of the Investment Advisers Act of 1940 is to provide", "a": "minimum standards of performance for those registered as investment advisers", "b": "regulation for investment companies and their operations", "c": "standards at the federal level for the regulation of investment advisers", "d": "standards among the various states for the regulation of investment advisers", "e": ""}, {"n": 89, "q": "Which of the following statements is not true of investment advisers under the Uniform Securities Act?", "a": "Compensation is a key factor in determining whether a person is required to register as investment adviser.", "b": "Only written advice concerning investments is covered by the act.", "c": "A natural person may register as an investment adviser.", "d": "Investment advice includes advice regarding the value of securities, as well as recommendations to buy or sell.", "e": ""}, {"n": 90, "q": "Which of the following persons does NOT meet the definition of providing investment advice as a business outlined in SEC Release IA-1092?", "a": "A management consultant whose only investment advice is suggesting to a couple of small business clients who had invested their surpluses in speculative securities that they should find something less risky", "b": "Attorney who advertises the availability of investment advice", "c": "A financial planner who provides specific investment advice as part of his fee- based services and also makes specific securities recommendations to his clients in his capacity as an agent for a broker-dealer", "d": "Accountant who charges clients an additional fee for providing investment advice", "e": ""}, {"n": 91, "q": "When, if ever, would a broker-dealer be required to register as an investment adviser?", "a": "If it is not registered with the SEC", "b": "Never", "c": "If it charges distinct fees for investment advice or management", "d": "Always", "e": ""}, {"n": 92, "q": "Under the Investment Advisers Act of 1940, which of the following is included in the definition of an investment adviser?", "a": "A bank that advertises to the public that it offers a complete line of trust services", "b": "A lawyer who advertises to the public that he offers comprehensive legal and investment advice to high-net-worth individuals", "c": "A professional research analyst who holds himself out to the public as an expert in trading the Euro and other foreign currencies", "d": "A research service that offers advice on the value of gold", "e": ""}, {"n": 93, "q": "Under SEC Release IA-1092, a financial planner would not be considered an investment adviser when", "a": "there is an up-front fee charged for creating a comprehensive financial plan, even when the plan is not put into place", "b": "he is a licensed insurance agent and credits the commission earned on the sale of insurance policies included in a comprehensive financial plan against the fee charged for the plan", "c": "the extent of his planning is limited to wills, estates and trust creation", "d": "he does financial planning as part of offering a wrap fee program as a licensed agent of a broker-dealer", "e": ""}, {"n": 94, "q": "Harrison is a Certified Financial Planner (CFP®) with an office in the state and a telephone directory listing under the category \"Financial Planners.\" Harrison has, for fees, written more than 100 comprehensive financial plans for various individual clients. However, only 20% of the plans' content entails advice regarding securities and investments. Which of the following statements best describes Harrison's status as an investment adviser under the USA?", "a": "Harrison is not required to register as an investment adviser because his securities advice is purely incidental to his overall planning activities.", "b": "Harrison is required to register as an investment adviser because he holds a recognized financial planning credential.", "c": "Harrison is not required to register as an investment adviser because he holds a recognized financial planning credential.", "d": "Harrison is required to register as an investment adviser because he regularly offers advice and receives compensation for advice concerning securities and investments, and holds himself out as a financial planner.", "e": ""}, {"n": 95, "q": "Under the Securities Act of 1933, the term \"person\" would NOT refer to which of the following?", "a": "A subdivision of a government", "b": "A deceased individual", "c": "A nonprofit, charitable corporation", "d": "An unincorporated amateur athletic club", "e": ""}, {"n": 96, "q": "If an investment adviser is registered in another state and has no place of business within an Administrator's state, the adviser is exempt from registration under the Uniform Securities Act if", "a": "most of the adviser's clients are accredited investors", "b": "most of the adviser's customers are municipalities", "c": "the adviser has no more than 5 clients who are residents of the state during the preceding 12 months", "d": "the adviser has no more than 14 customers within the state during the year", "e": "If an investment adviser has no more than 5 clients who are residents of the state during the preceding 12 months, the investment adviser does not have to register with the state."}, {"n": 97, "q": "Which of the following statements describes a person who provides investment advice on a regular basis but does not charge fees, yet would be considered an adviser under Release IA-1092?", "a": "A wealthy college professor gives free lectures on sound investment practices and makes specific securities recommendations based on a quantitative model he has developed.", "b": "The secretary of the U.S. Treasury, as part of his official duties, comments on conditions in the financial markets and their future investment implications.", "c": "A financial planner sold his business and spends his time consulting with pension plans on whether to retain or hire new investment managers based on their performance. He does not charge fees; however, those managers retained as a result of his recommendations routinely provide him with noncash benefits such as vacations, computers, and office space.", "d": "A retired chief investment officer of a well-known investment management company, without compensation, writes a column in a general circulation newspaper commenting on the value of investing in equity securities; many readers find his advice useful and become clients of his former investment management company.", "e": ""}, {"n": 98, "q": "Under the Uniform Securities Act, a person who exclusively provides advice on commodities is", "a": "a registered insurance agent", "b": "an options representative", "c": "a registered investment adviser representative", "d": "not a registered investment adviser", "e": ""}, {"n": 99, "q": "Which of the following does NOT meet the compensation test for defining investment advisers under SEC Release 1A-1092?", "a": "An insurance agent sells a life insurance policy and receives a commission on that policy. During the sale of the insurance policy, the agent provides some securities investment advice", "b": "Your next-door neighbor recommends the purchase of a certain security from his broker, which you eventually do", "c": "Subscription payments received by a publisher of a newsletter providing impersonal securities-related advice", "d": "A real estate agent advertises that she will give free advice regarding investing the proceeds from the sale of any home she lists", "e": ""}, {"n": 100, "q": "Under the Investment Advisers Act of 1940, who is not excluded from the definition of investment adviser when their investment advice is solely incidental to the individual's profession?", "a": "Engineers", "b": "Teachers", "c": "Attorneys", "d": "Insurance agents", "e": "The persons excluded from the definition of investment adviser when advice is provided solely incidental to their profession include lawyers, accountants, engineers, and teachers."}]}]}

<script>

var UNITS_DATA, EXAMS_DATA;
try { UNITS_DATA = JSON.parse(document.getElementById("unitsData").textContent); } catch(e) {
  try { UNITS_DATA = JSON.parse(document.getElementById("unitsData").innerHTML); } catch(e2) {}
}
try { EXAMS_DATA = JSON.parse(document.getElementById("examsData").textContent); } catch(e) {
  try { EXAMS_DATA = JSON.parse(document.getElementById("examsData").innerHTML); } catch(e2) {}
}

var activeTab = "units";
var DATA = UNITS_DATA;
var userAnswers = {};
var savedScores = {};
var currentQuizIdx = 0;
var mode = "exam";
var TOTAL_UNITS = UNITS_DATA ? UNITS_DATA.quizzes.reduce(function(s,q){return s+q.questions.length},0) : 0;
var TOTAL_EXAMS = EXAMS_DATA ? EXAMS_DATA.quizzes.reduce(function(s,q){return s+q.questions.length},0) : 0;
var TOTAL = TOTAL_UNITS + TOTAL_EXAMS;

function escHtml(s) {
  if (!s) return "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function init() {
  if (!UNITS_DATA && !EXAMS_DATA) {
    document.getElementById("navArea").innerHTML = "<p style='color:red'>Error loading quiz data</p>";
    return;
  }
  try { var saved = localStorage.getItem("s65m_answers"); if (saved) userAnswers = JSON.parse(saved); } catch(e) {}
  try { var m = localStorage.getItem("s65m_mode"); if (m) mode = m; } catch(e) {}
  try { var sc = localStorage.getItem("s65m_scores"); if (sc) savedScores = JSON.parse(sc); } catch(e) {}
  try { var lq = localStorage.getItem("s65m_lastQuiz"); if (lq) currentQuizIdx = parseInt(lq) || 0; } catch(e) {}
  try { var lt = localStorage.getItem("s65m_lastTab"); if (lt) activeTab = lt; } catch(e) {}

  DATA = activeTab === "exams" ? EXAMS_DATA : UNITS_DATA;
  buildNav();
  restoreNavScores();
  loadQuiz(currentQuizIdx < DATA.quizzes.length ? currentQuizIdx : 0);
  updateScores();
  updateModeButtons();
  updateTabButtons();

  document.getElementById("quizArea").addEventListener("click", function(e) {
    var label = e.target.closest(".option-label");
    if (!label) return;
    var qKey = label.getAttribute("data-qkey");
    var letter = label.getAttribute("data-letter");
    if (qKey && letter) pickAnswer(qKey, letter);
  });
  document.getElementById("modeExam").addEventListener("click", function() { setMode("exam"); });
  document.getElementById("modeStudy").addEventListener("click", function() { setMode("study"); });
  document.getElementById("btnScore").addEventListener("click", submitQuiz);
  document.getElementById("btnScore2").addEventListener("click", submitQuiz);
  document.getElementById("btnReset").addEventListener("click", resetQuiz);
  document.getElementById("btnReset2").addEventListener("click", resetQuiz);
  document.getElementById("btnResetAll").addEventListener("click", resetAll);
  document.getElementById("tabUnits").addEventListener("click", function() { switchTab("units"); });
  document.getElementById("tabExams").addEventListener("click", function() { switchTab("exams"); });
}

function switchTab(tab) {
  activeTab = tab;
  DATA = tab === "exams" ? EXAMS_DATA : UNITS_DATA;
  currentQuizIdx = 0;
  try { localStorage.setItem("s65m_lastTab", tab); } catch(e) {}
  updateTabButtons();
  buildNav();
  restoreNavScores();
  loadQuiz(0);
  updateScores();
}

function updateTabButtons() {
  document.getElementById("tabUnits").classList.toggle("active", activeTab === "units");
  document.getElementById("tabExams").classList.toggle("active", activeTab === "exams");
}

function updateModeButtons() {
  document.getElementById("modeExam").classList.toggle("active", mode === "exam");
  document.getElementById("modeStudy").classList.toggle("active", mode === "study");
}

function restoreNavScores() {
  for (var key in savedScores) {
    var el = document.getElementById("navScore" + key);
    if (el) el.textContent = savedScores[key];
  }
}

function qPrefix() { return activeTab === "exams" ? "e" : "u"; }

function buildNav() {
  var html = "";
  for (var d = 0; d < DATA.domains.length; d++) {
    html += '<div class="domain-title">' + escHtml(DATA.domains[d].name) + '</div><div class="quiz-links">';
    for (var i = 0; i < DATA.domains[d].ids.length; i++) {
      var qid = DATA.domains[d].ids[i];
      var qIdx = -1;
      for (var qi = 0; qi < DATA.quizzes.length; qi++) { if (DATA.quizzes[qi].id === qid) { qIdx = qi; break; } }
      if (qIdx < 0) continue;
      var qz = DATA.quizzes[qIdx];
      var shortName = qz.name.length > 50 ? qz.name.substring(0, 47) + "..." : qz.name;
      html += '<button class="quiz-link" data-idx="' + qIdx + '">' + escHtml(shortName) + '<span class="link-score" id="navScore' + qPrefix() + qIdx + '"></span></button>';
    }
    html += '</div>';
  }
  var navArea = document.getElementById("navArea");
  navArea.innerHTML = html;
  navArea.addEventListener("click", function(e) {
    var btn = e.target.closest(".quiz-link");
    if (!btn) return;
    var idx = parseInt(btn.getAttribute("data-idx"));
    if (!isNaN(idx)) loadQuiz(idx);
  });
}

function loadQuiz(idx) {
  currentQuizIdx = idx;
  try { localStorage.setItem("s65m_lastQuiz", String(idx)); } catch(e) {}
  var qz = DATA.quizzes[idx];
  var btns = document.querySelectorAll(".quiz-link");
  for (var b = 0; b < btns.length; b++) { btns[b].classList.toggle("active", parseInt(btns[b].getAttribute("data-idx")) === idx); }
  var html = "";
  var letters = ["A", "B", "C", "D"];
  var lkeys = ["a", "b", "c", "d"];
  var pfx = qPrefix();
  for (var i = 0; i < qz.questions.length; i++) {
    var q = qz.questions[i];
    var qKey = pfx + idx + "_" + i;
    html += '<div class="question-card" id="card_' + qKey + '">';
    html += '<div class="q-number">Question ' + (i + 1) + ' of ' + qz.questions.length + '</div>';
    html += '<div class="q-text">' + escHtml(q.q) + '</div>';
    html += '<div class="options">';
    for (var li = 0; li < 4; li++) {
      var sel = userAnswers[qKey] === letters[li] ? " selected" : "";
      var chk = userAnswers[qKey] === letters[li] ? " checked" : "";
      html += '<label class="option-label' + sel + '" id="opt_' + qKey + '_' + letters[li] + '" data-qkey="' + qKey + '" data-letter="' + letters[li] + '">';
      html += '<input type="radio" name="q_' + qKey + '"' + chk + '>';
      html += '<span class="option-letter">' + letters[li] + ')</span> <span>' + escHtml(q[lkeys[li]]) + '</span></label>';
    }
    html += '</div>';
    html += '<div class="result-badge" id="result_' + qKey + '"></div>';
    html += '<div class="explanation" id="expl_' + qKey + '"></div>';
    html += '</div>';
  }
  document.getElementById("quizArea").innerHTML = html;
  document.getElementById("resultsPanel").classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function pickAnswer(qKey, letter) {
  userAnswers[qKey] = letter;
  var card = document.getElementById("card_" + qKey);
  var labels = card.querySelectorAll(".option-label");
  for (var i = 0; i < labels.length; i++) {
    labels[i].classList.remove("selected");
    labels[i].querySelector("input").checked = false;
  }
  var chosen = document.getElementById("opt_" + qKey + "_" + letter);
  chosen.classList.add("selected");
  chosen.querySelector("input").checked = true;
  if (mode === "study") {
    var parts = qKey.substring(1).split("_"); var qIdx = parseInt(parts[0]); var qNum = parseInt(parts[1]);
    var correct = DATA.quizzes[qIdx].key[qNum];
    var badge = document.getElementById("result_" + qKey);
    var L = ["A", "B", "C", "D"];
    for (var li = 0; li < L.length; li++) {
      document.getElementById("opt_" + qKey + "_" + L[li]).classList.remove("correct-answer", "wrong-answer");
    }
    if (letter === correct) {
      card.classList.add("answered-correct", "study-mode"); card.classList.remove("answered-wrong");
      badge.className = "result-badge show correct"; badge.textContent = "Correct!";
      document.getElementById("opt_" + qKey + "_" + letter).classList.add("correct-answer");
    } else {
      card.classList.add("answered-wrong", "study-mode"); card.classList.remove("answered-correct");
      badge.className = "result-badge show wrong"; badge.textContent = "Incorrect. The correct answer is " + correct + ".";
      document.getElementById("opt_" + qKey + "_" + letter).classList.add("wrong-answer");
      document.getElementById("opt_" + qKey + "_" + correct).classList.add("correct-answer");
    }
    showExpl(qKey);
  } else {
    card.classList.remove("answered-correct", "answered-wrong", "study-mode");
    document.getElementById("result_" + qKey).className = "result-badge";
    document.getElementById("result_" + qKey).textContent = "";
    hideExpl(qKey);
  }
  updateScores(); saveState();
}

function showExpl(qKey) {
  var parts = qKey.substring(1).split("_"); var qIdx = parseInt(parts[0]); var qNum = parseInt(parts[1]);
  var q = DATA.quizzes[qIdx].questions[qNum];
  if (q.e) {
    var el = document.getElementById("expl_" + qKey);
    el.innerHTML = '<div class="explanation-title">Explanation</div>' + escHtml(q.e);
    el.classList.add("show");
  }
}

function hideExpl(qKey) {
  var el = document.getElementById("expl_" + qKey);
  el.classList.remove("show"); el.innerHTML = "";
}

function setMode(m) {
  mode = m; updateModeButtons();
  try { localStorage.setItem("s65m_mode", m); } catch(e) {}
  loadQuiz(currentQuizIdx);
}

function submitQuiz() {
  var qz = DATA.quizzes[currentQuizIdx];
  var pfx = qPrefix();
  var correct = 0; var answered = 0; var gridHtml = "";
  for (var i = 0; i < qz.questions.length; i++) {
    var qKey = pfx + currentQuizIdx + "_" + i;
    var userAns = userAnswers[qKey];
    var correctAns = qz.key[i];
    var card = document.getElementById("card_" + qKey);
    var badge = document.getElementById("result_" + qKey);
    card.classList.add("study-mode");
    var L = ["A", "B", "C", "D"];
    for (var li = 0; li < L.length; li++) document.getElementById("opt_" + qKey + "_" + L[li]).classList.remove("correct-answer", "wrong-answer");
    if (userAns) {
      answered++;
      if (userAns === correctAns) {
        correct++;
        card.classList.add("answered-correct"); card.classList.remove("answered-wrong");
        badge.className = "result-badge show correct"; badge.textContent = "Correct!";
        document.getElementById("opt_" + qKey + "_" + userAns).classList.add("correct-answer");
        gridHtml += '<div class="results-cell correct">' + (i + 1) + '</div>';
      } else {
        card.classList.add("answered-wrong"); card.classList.remove("answered-correct");
        badge.className = "result-badge show wrong"; badge.textContent = "Incorrect. The correct answer is " + correctAns + ".";
        document.getElementById("opt_" + qKey + "_" + userAns).classList.add("wrong-answer");
        document.getElementById("opt_" + qKey + "_" + correctAns).classList.add("correct-answer");
        gridHtml += '<div class="results-cell wrong">' + (i + 1) + '</div>';
      }
      showExpl(qKey);
    } else {
      gridHtml += '<div class="results-cell unanswered">' + (i + 1) + '</div>';
    }
  }
  var pct = qz.questions.length > 0 ? Math.round(correct / qz.questions.length * 100) : 0;
  var pass = pct >= 72;
  document.getElementById("quizScore").textContent = correct;
  document.getElementById("quizTotal").textContent = qz.questions.length;
  document.getElementById("quizPct").textContent = "(" + pct + "%)";
  document.getElementById("resultsTitle").textContent = qz.name + " Results";
  document.getElementById("resultsGrid").innerHTML = gridHtml;
  var gl = document.getElementById("gradeLabel");
  gl.textContent = pass ? "PASS" : "FAIL";
  gl.className = "grade-label " + (pass ? "grade-pass" : "grade-fail");
  if (answered < qz.questions.length) gl.textContent += " (" + (qz.questions.length - answered) + " unanswered)";
  document.getElementById("resultsPanel").classList.add("show");
  document.getElementById("resultsPanel").scrollIntoView({ behavior: "smooth" });
  var el = document.getElementById("navScore" + pfx + currentQuizIdx);
  if (el) {
    var scoreText = correct + "/" + qz.questions.length + " (" + pct + "%)";
    el.textContent = scoreText;
    savedScores[pfx + currentQuizIdx] = scoreText;
  }
  updateScores(); saveState();
}

function resetQuiz() {
  var qz = DATA.quizzes[currentQuizIdx];
  var pfx = qPrefix();
  for (var i = 0; i < qz.questions.length; i++) {
    var qKey = pfx + currentQuizIdx + "_" + i;
    delete userAnswers[qKey];
  }
  document.getElementById("resultsPanel").classList.remove("show");
  var el = document.getElementById("navScore" + pfx + currentQuizIdx); if (el) el.textContent = "";
  delete savedScores[pfx + currentQuizIdx];
  loadQuiz(currentQuizIdx);
  updateScores(); saveState();
}

function resetAll() {
  if (!confirm("Reset ALL answers across ALL quizzes in BOTH tabs?")) return;
  userAnswers = {};
  savedScores = {};
  try { localStorage.removeItem("s65m_answers"); localStorage.removeItem("s65m_mode"); localStorage.removeItem("s65m_scores"); localStorage.removeItem("s65m_lastQuiz"); localStorage.removeItem("s65m_lastTab"); } catch(e) {}
  var navScores = document.querySelectorAll("[id^=navScore]");
  for (var i = 0; i < navScores.length; i++) navScores[i].textContent = "";
  loadQuiz(currentQuizIdx);
  updateScores();
}

function updateScores() {
  var total = 0; var correct = 0;
  var keys = Object.keys(userAnswers);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var tabPrefix = k.charAt(0);
    var rest = k.substring(1).split("_");
    var qIdx = parseInt(rest[0]); var qNum = parseInt(rest[1]);
    var src = tabPrefix === "e" ? EXAMS_DATA : UNITS_DATA;
    if (src && src.quizzes[qIdx]) {
      total++;
      if (userAnswers[k] === src.quizzes[qIdx].key[qNum]) correct++;
    }
  }
  document.getElementById("totalAnswered").textContent = total;
  document.getElementById("totalCorrect").textContent = correct;
  document.getElementById("totalPct").textContent = total > 0 ? Math.round(correct / total * 100) + "%" : "0%";
  document.getElementById("progressFill").style.width = (total / TOTAL * 100) + "%";
}

function saveState() {
  try { localStorage.setItem("s65m_answers", JSON.stringify(userAnswers)); } catch(e) {}
  try { localStorage.setItem("s65m_scores", JSON.stringify(savedScores)); } catch(e) {}
}

init();

</script>
</body>
</html>

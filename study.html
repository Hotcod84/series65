{"domains": [{"name": "Domain 1: Economic Factors and Business Information", "ids": [77, 78, 79, 80]}, {"name": "Domain 2: Investment Vehicle Characteristics", "ids": [81, 82, 83, 84]}, {"name": "Domain 3: Client Investment Recommendations and Strategies", "ids": [85, 86, 87, 88]}, {"name": "Domain 4: Laws, Regulations, and Guidelines", "ids": [89, 90, 91, 92]}, {"name": "Full Practice Exam", "ids": [17]}], "quizzes": [{"id": 77, "name": "Series 65 Domain 1 (Quiz 1): Economic Factors and Business Information", "key": "DCCDCDABCACCDBBACBABDBBAA", "questions": [{"n": 1, "q": "Over time, a country's trade deficit will lead to a decline in the value of its currency because", "a": "domestic goods will become too expensive for foreigners to buy", "b": "the country's exports will exceed its imports", "c": "the money supply will decrease", "d": "the country's imports will exceed exports creating selling pressure on its currency", "e": "When a country's imports exceed its exports, a trade deficit will occur, which causes selling pressure on the country's currency, therefore lowering its exchange rate against other currencies. When a country's currency declines in price relative to other currencies, exports tend to increase over time because they become less expensive in terms of foreign currency, thus reversing the trade deficit."}, {"n": 2, "q": "A free trade agreement is entered into between Country A and Country B. As time goes on, the value of Country A's currency increases while that of Country B's decreases. The effect of this will likely be that", "a": "the free trade agreement will be abrogated", "b": "Country A’s exports to Country B will increase", "c": "Country A’s imports from Country B will increase", "d": "Country B’s imports from Country A will increase", "e": "As a country's currency increases in value, its exports become more expensive, so they will fall. On the other hand, with a stronger currency, the country's citizens will have a greater buying power, and this will cause imports to increase."}, {"n": 3, "q": "If the dollar weakens, which of the following statements is TRUE?", "a": "The dollar buys more foreign currency.", "b": "Foreign securities denominated in their domestic currency decrease in value to the U.S. investor.", "c": "An increase in U.S. interest rates might strengthen the dollar.", "d": "U.S. exports become less competitive.", "e": "When U.S. interest rates rise, foreign investors invest in U.S. dollar-denominated securities, thereby increasing the demand for dollars and causing the dollar to strengthen."}, {"n": 4, "q": "All of the following actions will increase the deficit in the U.S. balance of payments EXCEPT", "a": "U.S. foreign aid", "b": "investments by U.S. firms abroad", "c": "Americans buying Japanese cars", "d": "purchase by foreigners of U.S. securities", "e": "A debit in the U.S. balance of payments occurs when the country pays out more abroad than it takes in. This occurs when the U.S. imports more than it exports, invests money abroad, or sends money to foreign countries in the form of foreign aid."}, {"n": 5, "q": "A significant increase in the importing of goods into the United States would likely have what effect on the strength of the U.S. dollar?", "a": "No effect", "b": "Fluctuation both ways", "c": "Weaken", "d": "Strengthen", "e": "Currency rates tend to ebb and flow as the balance of payments shift from positive to negative. A significant increase in imports represents a large outflow of U.S. dollars which results in a negative trade balance. As this builds, the value of the dollar falls against those currencies who have a positive trade balance."}, {"n": 6, "q": "If a country's current account shows a trade deficit, it is most likely that", "a": "short-term flows are greater than long-term flows.", "b": "tax payments are greater than tax receipts.", "c": "net exports are greater than zero.", "d": "imports are greater than exports.", "e": "A trade deficit occurs when imports are greater than exports."}, {"n": 7, "q": "The primary function of the Federal Reserve System (the Fed) is to", "a": "carry out monetary policy.", "b": "implement fiscal policy.", "c": "manage the revenues and expenditures of the federal government.", "d": "issue bonds to the general public.", "e": "The Federal Reserve controls the money supply, enabling it to significantly affect interest rates. The Fed will follow a loose, or easy, monetary policy when it wants to increase the money supply to expand the levels of income and employment. In times of inflation, when it wants to constrict the money supply, the Fed will follow a tight monetary policy. The U.S. Treasury issues bonds to the general public to finance the budget deficits of the federal government."}, {"n": 8, "q": "A research analyst studying the performance of ABC Industries compares that with reports from other analysts reviewing other companies in other industries. This is known as", "a": "fundamental analysis", "b": "bottom-up analysis", "c": "top-down analysis", "d": "sector analysis", "e": "Bottom-up analysis starts by attempting to find superior performing companies, regardless of the industry. Those analysts believe that these companies will provide attractive returns even if they are in an industry sector that is in a negative position in the economic cycle."}, {"n": 9, "q": "XYZ Aircraft Manufacturing Corporation, based in the United States, announces a multibillion dollar order for its new jumbo jet from Fly Airlines, a Japanese-based carrier. When the sale is completed, there will be", "a": "a debit to the current account of the United States", "b": "no effect on the balance of trade", "c": "a credit to the current account of the United States", "d": "a credit to the current account of Japan", "e": "Whenever money from a foreign source enters the United States, it becomes a credit item in the U.S. balance of payments."}, {"n": 10, "q": "When a bank that is a member of the Federal Reserve System borrows from another member bank, the rate that is charged is known as", "a": "the federal funds rate", "b": "the call loan rate", "c": "the discount rate", "d": "the prime rate", "e": "Loans between banks, usually on an overnight basis, are made at the federal funds rate. It is the most volatile of the money market rates. The discount rate is the rate charged when banks borrow directly from the Federal Reserve."}, {"n": 11, "q": "A securities analyst's approach is to look at the overall economy and try to forecast which industry will outperform. Then, the analyst searches for those individual companies within that industry that appear to have the best expected return and add those to the recommended list. In so doing, this analyst is using", "a": "the bottom-up approach.", "b": "the optimal portfolio approach", "c": "the top-down approach.", "d": "the business cycle approach.", "e": "This is the basic approach of top-down analysis - start with the big picture and narrow it down to the most attractive individual stocks."}, {"n": 12, "q": "An expansionary fiscal policy would usually result in", "a": "a government decreasing government spending to slow down economic activity.", "b": "a government operating a balanced budget.", "c": "a government increasing government spending to stimulate economic activity.", "d": "a government increasing taxes in the economy.", "e": "An expansionary fiscal policy is one that is deliberately implemented to boost demand. Increased spending would be an expansionary policy."}, {"n": 13, "q": "A securities analyst's stock selection method is to begin by looking for superior companies, regardless of their industry sector or the condition of the overall economy. In so doing, this analyst is using", "a": "the business cycle approach.", "b": "the top-down approach.", "c": "the optimal portfolio approach.", "d": "the bottom-up approach.", "e": "This is the basic approach of bottom-up analysis. Rather than focusing the attention on the overall market (the macro view of the economy) or the sectors that are likely to outperform, this approach seeks to identify, usually based on the company's fundamentals, the most attractive individual stocks."}, {"n": 14, "q": "A securities analyst's approach is to look at the overall economy and try to forecast which industry will outperform. Then, the analyst searches for those individual companies within that industry that appear to have the best expected return and add those to their recommended list. In so doing, this analyst is using the", "a": "bottom-up approach.", "b": "top-down approach.", "c": "optimal portfolio approach.", "d": "business cycle approach.", "e": "This is the basic approach of top-down analysis - start with the big picture and narrow it down to the most attractive individual stocks."}, {"n": 15, "q": "Among the responsibilities of the Federal Reserve (the Fed) is influencing the supply of money and credit in the economy. When performing this function, adjusting which of the following is not a tool at its disposal?", "a": "The discount rate", "b": "The prime rate", "c": "The activities of the Federal Open Market Committee", "d": "The reserve requirements", "e": "The prime rate is set by the banks. All of the others are under the control of the Fed."}, {"n": 16, "q": "If the dollar weakens, which of the following statements is TRUE?", "a": "A rise in U.S. interest rates might strengthen the dollar.", "b": "U.S. exports will fall.", "c": "Foreign securities denominated in their domestic currency decrease in value to the U.S. investor.", "d": "The dollar buys more foreign currency.", "e": "When U.S. interest rates rise, foreign investors invest in U.S. dollar-denominated securities, thereby increasing the demand for dollars and causing the dollar to strengthen."}, {"n": 17, "q": "Final approval of the annual operating budget for the United States is given by", "a": "the president", "b": "the Conference of Governors", "c": "the Congress", "d": "the Cabinet", "e": "The United States Congress is responsible for voting approval of the budget submitted by the president."}, {"n": 18, "q": "An analyst uses a stock selection method that involves analyzing a specific corporation, followed by evaluating where it fits in its industry and then viewing the overall economy. The term that best describes this method is", "a": "efficient frontier", "b": "bottom-up", "c": "capital asset pricing model", "d": "top-down", "e": "The bottom-up method of stock selection goes from micro to macro - that is, identify the specific company and then working up through the overall economy. It is the opposite of top-down."}, {"n": 19, "q": "Country A develops a new product that is in high demand around the world. The likely effect of this would be", "a": "a trade surplus for Country A", "b": "a trade deficit for Country A", "c": "an increase in the income tax rates of Country A", "d": "a decrease in the value of the currency of Country A", "e": "When exports exceed imports (the likely case here), it leads to a trade surplus. Invariably, that causes a positive balance of payments, which has the tendency to increase the value of that country's currency relative to others. There is no way to know how this new product will impact the tax legislation of Country A."}, {"n": 20, "q": "A securities analyst's stock selection method is to begin by looking for superior companies, regardless of their industry sector or the condition of the overall economy. In so doing, this analyst is using the", "a": "optimal portfolio approach.", "b": "bottom-up approach.", "c": "top-down approach.", "d": "business cycle approach.", "e": "This is the basic approach of bottom-up analysis. Rather than focusing the attention on the overall market (the macro view of the economy) or the sectors that are likely to outperform, this approach seeks to identify, usually based on the company's fundamentals, the most attractive individual stocks."}, {"n": 21, "q": "Which of the following statements best describes what will happen when the value of the American dollar rises in relationship to foreign currencies?", "a": "Foreign goods and services will become more expensive for Americans.", "b": "The risk of stagflation will increase.", "c": "Shares of foreign stock will be worth more in terms of American dollars.", "d": "Foreign goods and services will become less expensive for Americans.", "e": "When the value of the dollar rises, it will buy more foreign money, making foreign goods and services less expensive for Americans. Because foreign securities are valued in foreign currencies, shares of foreign stock will be worth fewer American dollars when the value of the dollar increases."}, {"n": 22, "q": "Overnight loans between banks are made at", "a": "the discount rate", "b": "the federal funds rate", "c": "the prime rate", "d": "the call loan rate", "e": "When a bank borrows from another bank on an overnight basis, it is at the federal funds rate. When a bank borrows from the Federal Reserve, it does so at the discount rate. The prime rate is charged by the banks to their stronger borrowers, and the call loan rate is what broker-dealers pay on stock market collateral pledged for margin accounts."}, {"n": 23, "q": "Which of the following statements describes the federal funds rate?", "a": "Charge on loans to depositary institutions by the New York FRB", "b": "Rate charged on reserves traded among commercial banks for overnight use in amounts of $1 million or more", "c": "Charge on loans to brokers on stock exchange collateral", "d": "Base rate on corporate loans at large U.S. money center commercial banks", "e": "The federal funds rate represents the interest charge on reserves, traded among commercial banks for overnight use, in amounts of $1 million or more."}, {"n": 24, "q": "Which of the following statements reflects the monetarist economic position?", "a": "The amount of money in the economy determines the overall price level over time, therefore the Federal Reserve should control the growth in the amount of money in the economy in a gradual and predictable way.", "b": "The amount of money in the economy is not significant because economic activity reflects the value of real goods and services, therefore the Federal Reserve should not attempt to manage the money supply.", "c": "The total amount of money in the economy is the result of the level of interest rates.", "d": "The best way to control the money supply is to raise taxes which will reduce the amount of money in the economy and lower prices.", "e": "Monetarists believe that the economy and inflation are best controlled through the management of the money supply rather than through fiscal policy stimulation."}, {"n": 25, "q": "Which of the following is a component of U.S. fiscal policy?", "a": "Taxes and budgeting", "b": "Money supply", "c": "Reserve requirements", "d": "Discount rate", "e": "U.S. fiscal policy is determined by the president and Congress through budgeting and taxation. The other 3 choices are monetary policies employed by the Fed."}]}, {"id": 78, "name": "Series 65 Domain 1 (Quiz 2): Economic Factors and Business Information", "key": "DDDADBBDDACDDCABCDCCABBDD", "questions": [{"n": 1, "q": "Which school of economists encourages a government to spend money to move the economy into an expansionary phase?", "a": "Supply side", "b": "Classical", "c": "Monetarist", "d": "Keynesian", "e": "Keynesians advocate government intervention in the workings of the economy through increased government spending, which in turn increases aggregate demand."}, {"n": 2, "q": "When analyzing the business cycle, you would expect which phase to occur before reaching the trough?", "a": "Peak", "b": "Recovery", "c": "Expansion", "d": "Contraction", "e": "Before reaching the bottom (the trough), the business cycle is in the contraction phase."}, {"n": 3, "q": "Which term refers to the taxation, expenditures, and debt management of the federal government?", "a": "Open market operations", "b": "Revenue code procedures", "c": "Monetary policy", "d": "Fiscal policy", "e": "The primary components of a government's fiscal policy are taxes and expenses."}, {"n": 4, "q": "Which of the following is not a characteristic of expansionary monetary policy?", "a": "The reserve requirement will be increased.", "b": "Interest rates may decline.", "c": "More funds are available for banks to lend to borrowers.", "d": "The money supply will increase.", "e": "Expansionary monetary policy is also referred to as easy monetary policy. The Federal Reserve follows an easy monetary policy when it wants to expand the level of income and employment. The Federal Reserve may decrease rather than increase the reserve requirement affording banks the opportunity to loan more money to borrowers."}, {"n": 5, "q": "A free trade agreement is entered into between Country A and Country B. As time goes on, the value of Country A's currency decreases while that of Country B increases. The effect of this will likely be that", "a": "Country A’s imports from Country B will increase", "b": "Country A’s exports to Country B will decrease", "c": "Country B’s imports from Country A will increase", "d": "the free trade agreement will be abrogated", "e": "As a country's currency decreases in value, its exports become less expensive so they will rise. On the other hand, with a weaker currency, the country's citizens will have less buying power, and this will cause imports to decrease."}, {"n": 6, "q": "When a bank's reserve account is running low, it might choose to borrow from the Fed. When doing so, the bank will be charged", "a": "the prime rate", "b": "the discount rate", "c": "the federal funds rate", "d": "the call loan rate", "e": "When a bank borrows from the Federal Reserve, it does so at the discount rate. When borrowing from another bank, it is at the federal funds rate. The prime rate is charged by the banks to their stronger borrowers, and the call loan rate is what broker-dealers pay on stock market collateral pledged for margin accounts."}, {"n": 7, "q": "Which of the following statements reflects the monetarist economic position?", "a": "The best way to control the money supply is to raise taxes, which, in turn, will reduce the amount of money in the economy and lower prices.", "b": "The amount of money in the economy determines the overall price level over time and, therefore, the Federal Reserve should control the growth in the amount of money in the economy in a gradual and predictable way.", "c": "The total amount of money in the economy is the result of the level of interest rates.", "d": "The amount of money in the economy is not significant because economic activity reflects the value of real goods and services and, therefore, the Federal Reserve should not attempt to manage the money supply.", "e": "Monetarists believe that the economy and inflation are best controlled through the management of the money supply rather than through fiscal policy stimulation."}, {"n": 8, "q": "The economic theory that says economic growth results from lower tax rates and lower government spending is", "a": "Keynesian theory", "b": "monetary theory", "c": "demand-side theory", "d": "supply-side theory", "e": "Supply-side economics is the theory of Arthur Laffer, who believed that heavy taxing and government intervention have a negative effect on the economy."}, {"n": 9, "q": "If the U.S. dollar has been appreciating against foreign currencies, all of the following statements are true EXCEPT", "a": "the U.S. dollar buys more of foreign currencies", "b": "U.S. goods become more expensive in foreign countries", "c": "foreign goods become cheaper in the United States", "d": "U.S. exports become more competitive", "e": "The U.S. exports will cost more to foreigners and become less competitive. The dollar is worth more in terms of foreign currencies and will purchase more foreign goods per dollar."}, {"n": 10, "q": "Which of the following would lead to a debit to our foreign account balance?", "a": "U.S. residents taking vacations abroad", "b": "Foreign governments repaying loans to U.S. banks", "c": "An increase in exports", "d": "Residents of other countries buying apartments here", "e": "When our foreign account balance is debited, that creates a negative action. It is like a charge on your credit card - your account is debited. On the other hand, a credit to your card account is money coming to you. Our foreign accounts balance will be debited whenever our money goes out rather than coming in. When U.S. residents take vacations abroad, our money is being spent on hotel, restaurants, and other items in foreign countries. The other choices represent a credit to our foreign account balance."}, {"n": 11, "q": "Which of the following industries would be least cyclical?", "a": "Heavy equipment", "b": "Leisure products", "c": "Supermarket chain", "d": "Automobile manufacturing", "e": "Industrial activity usually follows business cycles, which have more impact on some industries than others. The food industry is one for which the demand is not generally based on economic conditions."}, {"n": 12, "q": "If an economist were to describe defensive issues, he would probably not include companies that produce", "a": "clothing", "b": "tobacco products", "c": "food products", "d": "building materials", "e": "Defensive issues are issues that are defensive against a downturn in the economy. Building materials are usually susceptible to downturns when the economy is bad."}, {"n": 13, "q": "During the past 2 quarters, the GDP declined by 3%, unemployment rose by 0.7%, and the Consumer Price Index fell off by 1.3%; this economic condition is called", "a": "inflation", "b": "depression", "c": "stagflation", "d": "recession", "e": "Two consecutive quarters of economic decline is termed a recession."}, {"n": 14, "q": "Economists have determined that the economy is slowing down. Orders for durable goods have been declining and unemployment, while not a reason for concern, has been steadily increasing over the past year. Given the information provided, what phase of the business cycle is the economy currently experiencing?", "a": "Deflation", "b": "Trough", "c": "Contraction", "d": "Expansion", "e": "The contraction phase is characterized by business sales falling, unemployment increasing, and the gross domestic product (GDP) growth falling."}, {"n": 15, "q": "Gross Domestic Product (GDP) is increasing. Real interest rates are relatively high. Consumer sentiment is strong, as are auto and retail sales. Labor productivity is declining. What state of the business cycle is the economy likely experiencing?", "a": "Expansion to peak", "b": "Trough to recovery", "c": "Peak to contraction", "d": "Recovery to expansion", "e": "When the economy is moving from expansion to peak, labor productivity starts to decline and interest rates are at a level where the Federal Reserve Board usually starts to contract or slow economic activity."}, {"n": 16, "q": "While reviewing nationwide industrial production figures, an analyst notices that inventories have been rising. From that information, one would gather that the economy is most likely in which phase of the business cycle?", "a": "Recovery", "b": "Contraction", "c": "Peak", "d": "Expansion", "e": "Downturns in the business cycle (a contraction) tend to be characterized by rising inventories due to a lack of consumer demand. During expansion or recovery, demand is high and goods are less likely to remain in inventory."}, {"n": 17, "q": "Which of the following industries would tend to be the most cyclical?", "a": "Food producers", "b": "Tobacco producers", "c": "Appliance manufacturers", "d": "Supermarkets", "e": "Cyclical refers to whether the industry is affected by business cycles of the economy. Items such as luxuries and large-ticket items (autos, homes, appliances) are normally cyclical. Food and tobacco are normally not cyclical."}, {"n": 18, "q": "Which of the following is considered the most accurate method of measuring GDP?", "a": "As a function of GNP", "b": "Eurodollars", "c": "Actual dollars", "d": "Constant dollars", "e": "Constant dollars are mathematically adjusted to remove the effects of inflation, so when economists compare the gross domestic product of one period with that of another, they measure economic activity rather than inflation."}, {"n": 19, "q": "If the Consumer Price Index (CPI) is down but consumer demand is up, the economy is likely in which stage of the business cycle?", "a": "Contraction to trough", "b": "Peak to contraction", "c": "Recovery to expansion", "d": "Recovery to trough", "e": "As prices trend downward and consumer demand increases, the economy is moving from recovery to expansion. As demand continues to increase, assuming supply remains constant, upward pressure will be put on prices through the expansion to the peak."}, {"n": 20, "q": "Which of the following is most likely to be regarded as a defensive stock?", "a": "A stock selling at an extremely high PE ratio", "b": "A stock with a strong cash position and little debt", "c": "A food company stock", "d": "An aerospace stock", "e": "A defensive stock maintains future earnings that are likely to withstand an economic downturn. Typical examples are stocks of those firms that supply basic consumer necessities such as foodstuffs. A stock selling at an extremely high PE ratio is indicative of a speculative company or one that can decline in value rapidly."}, {"n": 21, "q": "In comparing the change in the GDP from 1 year to another, to arrive at an accurate figure, each year's GDP should be converted to which of the following?", "a": "Constant dollars", "b": "International dollars", "c": "Dollars in terms of gold bullion", "d": "Dollars valued by exchange with foreign currencies", "e": "The GDP must be adjusted for inflation to get an accurate comparison from 1 year to the next."}, {"n": 22, "q": "An investment strategy that is designed to minimize risk and preserve the investor's principal is", "a": "a growth investment strategy", "b": "a defensive investment strategy", "c": "a market capitalization investment strategy", "d": "an aggressive investment strategy", "e": "An investment strategy can be either defensive or aggressive. A defensive strategy is one that is intended to minimize risk, preserve capital, and provide a somewhat stable income. An aggressive investment strategy is designed to maximize returns and assume greater risks."}, {"n": 23, "q": "The contraction phase of the business cycle is least likely accompanied by", "a": "decreasing inflation pressure.", "b": "decreasing unemployment.", "c": "decreasing business and consumer expenditures.", "d": "low or negative economic growth.", "e": "An economic contraction is likely to feature increasing unemployment (i.e., decreasing employment), along with declining economic output and decreasing inflationary pressure. Watch out for the double negatives."}, {"n": 24, "q": "Interest rates are rising. An analyst would be most likely to state that the business cycle is in which stage?", "a": "Contraction", "b": "Trough", "c": "Peak", "d": "Expansion", "e": "It is during periods of economic expansion that interest rates tend to increase. They tend to fall during contractions."}, {"n": 25, "q": "Interest rates are declining. An analyst would be most likely to state that the business cycle is in which stage?", "a": "Trough", "b": "Peak", "c": "Expansion", "d": "Contraction", "e": "It is during periods of economic contraction that interest rates tend to decline. They tend to rise during expansions."}]}, {"id": 79, "name": "Series 65 Domain 1 (Quiz 3): Economic Factors and Business Information", "key": "ADDACDDDBDCCBBBDADCBDCBCA", "questions": [{"n": 1, "q": "Which of the following would NOT be considered a defensive security?", "a": "Steel company stock", "b": "Tobacco stock", "c": "Food chain stock", "d": "Utility company stock", "e": "Steel is cyclical and is not considered defensive; defensive stocks are generally less affected by the business cycle."}, {"n": 2, "q": "To determine the amount of change in the GDP from 1 year to another, both years' GDP should be converted into", "a": "the exchange value of the dollar, as compared with major foreign currencies", "b": "the current dollar price of gold bullion", "c": "international depositary receipts", "d": "constant dollars", "e": "To compare GDP from 1 year to another, and thus to compare the amount of actual economic activity, economists use constant dollars to eliminate distortions caused by inflation."}, {"n": 3, "q": "The Conference Board, a nongovernmental nonprofit organization, regularly publishes a list of economic indicators. Which of the following would be included in their list of leading indicators?", "a": "Manufacturing and trade sales (in constant dollars)", "b": "Average prime rate", "c": "Average duration of unemployment", "d": "Average weekly initial claims for unemployment insurance", "e": "Of these, the only one that is included in the list of leading indicators is the average weekly initial claims for unemployment insurance. Manufacturing and trade sales is a coincident indicator, and average duration of unemployment and average prime rate are lagging indicators."}, {"n": 4, "q": "An investor purchasing gold bullion is most likely looking for an investment that is", "a": "countercyclical.", "b": "cyclical.", "c": "income producing.", "d": "exchange traded.", "e": "Countercyclical assets are those whose prices tend to move in the opposite direction of the overall economy. Historically, the price of precious metals, especially gold (and stock in gold mining companies), moves up when the economy enters the contraction phase and moves in the reverse direction during expansion."}, {"n": 5, "q": "The Conference Board releases information about the economy on a monthly basis. Included are a number of different indicators. Economic indicators can be leading, lagging, or coincidental, which indicates the timing of their changes relative to how the economy as a whole changes. Which of the following is a lagging economic indicator?", "a": "Nonagricultural employment", "b": "Manufacturers’ new orders for consumer goods", "c": "Building permits (housing starts)", "d": "Average prime rate", "e": "Both the S&P 500 and housing permits are leading economic indicators, as is the measure of hours worked because it reflects changes in the average workweek during the current period. The average prime rate is a lagging indicator."}, {"n": 6, "q": "If the Consumer Price Index (CPI) is up and consumer demand is also up, the economy is likely in which stage of the business cycle?", "a": "Peak to contraction", "b": "Contraction to trough", "c": "Recovery to trough", "d": "Expansion to peak", "e": "As prices trend higher and consumer demand increases, the economy is moving from expansion to a peak."}, {"n": 7, "q": "If a customer purchases a food company stock and a utility stock, the customer's portfolio is", "a": "balanced", "b": "cyclical", "c": "diversified", "d": "defensive", "e": "Food company stocks and utilities are defensive investments. Defensive investments are those that tend to hold up well in economic downturns."}, {"n": 8, "q": "The economy has gone through 3 consecutive quarters of economic decline with no immediate end in sight, and therefore could be said to be", "a": "in a recovery", "b": "lagging", "c": "in a depression", "d": "in a recession", "e": "Recession is defined as 2 or more consecutive quarters of economic decline. It would have to be at least 6 quarters to be considered a depression."}, {"n": 9, "q": "Which of the following statements about the Consumer Price Index (CPI) is NOT true?", "a": "The CPI is the most commonly used indicator of the inflation (or deflation) rate in the United States.", "b": "The CPI measures the increase or decrease in the level of consumer prices with respect to the level of wholesale prices on which consumer prices depend.", "c": "The CPI is computed monthly.", "d": "The CPI measures the rate of increase or decrease in a broad range of prices, such as food, housing, medical care, and clothing.", "e": "The CPI does not measure the increase or decrease in the level of consumer prices with respect to the level of wholesale prices. The CPI only measures retail prices, not whether wholesale prices are passed through to the consumer."}, {"n": 10, "q": "An economic condition where the rate of price increases reaches a stable equilibrium and stays there until a shock to the system occurs, at which time, the rate of inflation changes is known as", "a": "price controls.", "b": "stagnation.", "c": "stagflation.", "d": "inertial inflation.", "e": "This is a definition of inertial inflation. Just like it sometimes takes a shock to get people moving (lack of inertia), it can require a shock to move the economy."}, {"n": 11, "q": "Which of the following best describes the economic phase in which unemployment increases and businesses operate at their lowest capacity levels?", "a": "Contraction", "b": "Expansion", "c": "Trough", "d": "Peak", "e": "A trough in a business cycle occurs at the end of a contraction phase when businesses are operating at their lowest capacity levels."}, {"n": 12, "q": "Expansions in the business cycle are characterized by", "a": "higher consumer debt, rising inventories", "b": "increasing college enrollments and enlistment in military service", "c": "increasing consumer demand for goods and services, increasing industrial production, and rising stock markets and property values", "d": "increase in want ads in newspapers, decrease in nonfarm jobs", "e": "Expansions in the business cycle are characterized by increasing consumer demand for goods and services, increasing industrial production, and rising stock markets and property values."}, {"n": 13, "q": "To reflect a more accurate picture of economic results, gross domestic product is adjusted", "a": "to include bank reserves", "b": "for inflation", "c": "to match foreign GDP", "d": "downward by the balance of payments", "e": "By adjusting GDP for inflation, one can measure economic activity with less distortion. A constant dollar adjustment is made to remove the effects of inflation."}, {"n": 14, "q": "The Conference Board releases information about the economy on a monthly basis. Included are a number of different indicators. Economic indicators can be leading, lagging, or coincidental, which indicates the timing of their changes relative to how the economy as a whole changes. Which of the following is a lagging economic indicator?", "a": "Nonagricultural employment", "b": "Prime interest rate", "c": "Manufacturers' new orders for consumer goods", "d": "Building permits (housing starts)", "e": "Both the S&P 500 and housing permits are leading economic indicators, as is the measure of hours worked because it reflects changes in the average workweek during the current period. The average prime rate is a lagging indicator."}, {"n": 15, "q": "A business reporter claims that we are suffering from inertial inflation. This means", "a": "the economy is about to enter a deflationary period.", "b": "the current rate of inflation will remain at this level until economic shocks cause it to change.", "c": "the business cycle is heading towards a trough.", "d": "prices are increasing at a steady rate.", "e": "Inertial inflation means that there is not expected to be a change in the inflation rate until some kind of economic event shakes things up and causes the rate to move up or down."}, {"n": 16, "q": "Increases in which of the following indicators are regarded as predictors of the level of business activity?", "a": "Levels of inventories", "b": "Corporate profits", "c": "Personal incomes", "d": "Building permits", "e": "Increases in building permits are indicative of increased future business activity and therefore are considered a leading economic indicator."}, {"n": 17, "q": "Which of these industries would be considered defensive in the face of a recession?", "a": "Food producers", "b": "Automobile manufacturing", "c": "Trucking", "d": "Real estate construction", "e": "Defensive industries are least affected by normal business cycles. Companies in defensive industries generally produce nondurable consumer goods, such as food, pharmaceuticals, tobacco, and energy."}, {"n": 18, "q": "Under the concept of inertial inflation,", "a": "prices tend to remain the same until the system receives an economic shock.", "b": "inflation and deflation alternate at regular intervals.", "c": "core inflation is a better measure of the actual inflation rate than the CPI.", "d": "prices tend to increase at a steady rate until the system receives an economic shock.", "e": "Inertial inflation is an economic condition where the rate of price increases reaches a stable equilibrium and stays there until a shock to the system occurs, at which time, the rate of inflation changes."}, {"n": 19, "q": "Which of the following is a NOT a leading economic indicator?", "a": "Orders for durable goods", "b": "New housing permits", "c": "Duration of unemployment", "d": "Money supply", "e": "The average amount of time it takes for an unemployed person to find a new job is a lagging indicator, not a leading one. Employment is usually one of the last things to pick up as the economy enters a period of expansion."}, {"n": 20, "q": "The gross domestic product (GDP) for the United States is composed of", "a": "the national debt", "b": "the sum of all consumer goods, capital goods, and services produced in the United States and net exports to other countries", "c": "the sum of all goods and services, imports, and foreign investment", "d": "the balance of payments", "e": "The (GDP) comprises all consumer goods, capital goods, services produced in the United States, and net U.S. exports (exports minus imports)."}, {"n": 21, "q": "All of the following are leading indicators for economic growth EXCEPT", "a": "stock prices as measured by the S&P 500 index", "b": "orders for durable goods", "c": "average weekly initial claims for state unemployment compensation", "d": "average prime rate", "e": "The average prime rate is a lagging indicator. The duration of unemployment is also a lagging indicator, but the number of initial unemployment claims is a leading indicator. The S&P 500 index and orders for durable goods are leading economic indicators."}, {"n": 22, "q": "Which of these is a definition of inflation?", "a": "An increase in purchasing power", "b": "An increase in the value of the dollar", "c": "A decrease in the value of the monetary unit", "d": "A decrease in consumer demand", "e": "We tend to think solely in terms of our dollar, but inflation can occur worldwide and leads to a decrease in the purchasing power (or value) of the monetary unit in use in any particular jurisdiction."}, {"n": 23, "q": "The Conference Board releases information about the economy on a monthly basis. Included are a number of different indicators. Economic indicators can be leading, lagging, or coincidental, which indicates the timing of their changes relative to how the economy as a whole changes. Which of the following is a coincident economic indicator?", "a": "Stock market prices as measured by the S&P 500", "b": "Industrial production", "c": "Machine tool orders", "d": "Agricultural employment", "e": "Industrial production is a coincident indicator. The stock indices and manufacturing orders are leading indicators; economists do not use agricultural employment as an indicator."}, {"n": 24, "q": "The Conference Board releases information about the economy on a periodic basis. Included are a number of different indicators. These indicators can be used to predict how the economy as a whole might change. Which of the following would be considered a leading indicator?", "a": "Industrial production", "b": "CPI for services", "c": "Stock prices as measured by a broad index such as the S&P 500", "d": "Gross domestic product", "e": "The stock market, which anticipates economy activity, is a leading economic indicator. Industrial production is a coincident, or current, economic indicator. CPI for services is a lagging indicator."}, {"n": 25, "q": "An investor regularly reads financial blogs on the Internet and they are filled with articles suggesting that the economy is headed for a slump. Some are even saying that there will be price deflation. If these projections are accurate, the best place for the investor to place funds would probably be", "a": "U.S. Treasury bonds", "b": "common stock", "c": "commercial real estate", "d": "gold", "e": "When the economy is headed downward, safety is the imperative and nothing is as safe (at least for exam purposes) as U.S. Treasuries."}]}, {"id": 80, "name": "Series 65 Domain 1 (Quiz 4): Economic Factors and Business Information", "key": "DDDBAABDACBBDAAABDDDCADCC", "questions": [{"n": 1, "q": "Which of the following statements best describes what will happen when the value of the American dollar rises in relationship to foreign currencies?", "a": "Foreign goods and services will become more expensive for Americans.", "b": "The risk of stagflation will increase.", "c": "Shares of foreign stock will be worth more in terms of American dollars.", "d": "Foreign goods and services will become less expensive for Americans.", "e": "When the value of the dollar rises, it will buy more foreign money, making foreign goods and services less expensive for Americans. Because foreign securities are valued in foreign currencies, shares of foreign stock will be worth fewer American dollars when the value of the dollar increases."}, {"n": 2, "q": "Which of the following is a coincident economic indicator?", "a": "Machine tool orders", "b": "Agricultural employment", "c": "Stock market prices as measured by the S&P 500", "d": "Industrial production", "e": "Industrial production is a coincident indicator. The stock indexes and manufacturing orders are leading indicators. Economists do not use agricultural employment as an indicator."}, {"n": 3, "q": "All the pundits are predicting bad times ahead—not only a recession but a period where prices actually fall (deflation). If they are right, the best place for your client would probably be", "a": "real estate", "b": "gold", "c": "common stock", "d": "U.S. Treasury securities", "e": "It is times like this that the flight to safety has investors commit their funds to U.S. government securities."}, {"n": 4, "q": "Which of the following CORRECTLY defines the Consumer Price Index (CPI)?", "a": "The average cost of goods and services (market basket) in domestic currency, compared to the cost of those same goods and services in another country", "b": "The average cost of goods and services (market basket) purchased by consumers, compared to those same goods and services purchased during a base period", "c": "The wholesale cost of goods and services purchased by manufacturers, compared to those same goods and services purchased during a base period", "d": "The average increase in the general price level over a defined period of time", "e": "The Consumer Price Index (CPI) is the average cost of goods and services (market basket) purchased by consumers as compared to those same goods and services purchased during a base period."}, {"n": 5, "q": "During an economic downturn, one would expect to see", "a": "higher unemployment", "b": "manufacturer’s inventories to decline", "c": "bond prices fall", "d": "a rising CPI", "e": "When the economy enters the contraction portion of the business cycle, employers cut costs by letting employees go, thus increasing the number of unemployed persons."}, {"n": 6, "q": "Your client calls you after reading a story in the business section of his local newspaper. It seems that the article focused on changes to the core CPI and the client wants to know how that is different from the normal CPI. You should explain that it is", "a": "the Consumer Price Index excluding energy and food prices", "b": "the total of the leading indicators, excluding stock prices", "c": "the figure used to determine annual increases, if any, to Social Security benefits", "d": "the Consumer Price Index excluding housing and automobiles", "e": "Because of their high volatility, economists exclude energy and food prices from core inflation figures."}, {"n": 7, "q": "Stock market indices have a variety of uses. Which of the following is least accurate regarding the use of stock market indices?", "a": "They act as the basis of ETFs.", "b": "They help in portfolio performance measurement.", "c": "They act as a market barometer.", "d": "They are a lagging indicator of an economy’s corporate performance.", "e": "The stock market and market indices are leading indicators of the economy's corporate and financial performance."}, {"n": 8, "q": "What generally happens to outstanding fixed-income securities when the rate of inflation slows?", "a": "Short-term securities are affected the most.", "b": "Coupon rates go up.", "c": "Yields go up.", "d": "Prices go up.", "e": "When the rate of inflation slows and is expected to remain stable, coupons on new issue bonds will often decline to offer lower yields."}, {"n": 9, "q": "Which of the following statements about the consumer price index (CPI) is NOT true?", "a": "The CPI measures the increase or decrease in the level of consumer prices with respect to the level of wholesale prices upon which consumer prices depend.", "b": "The CPI measures the rate of increase or decrease in a broad range of prices, such as food, housing, medical care, and clothing.", "c": "The CPI measures the increase in the general price level of a basket of consumer goods.", "d": "The CPI is computed monthly.", "e": "The CPI does not measure the increase or decrease in the level of consumer prices with respect to the level of wholesale prices."}, {"n": 10, "q": "Core inflation is best described as an inflation rate", "a": "the central bank views as acceptable.", "b": "for producers’ raw materials.", "c": "that excludes certain volatile goods prices.", "d": "that includes food and energy prices.", "e": "Core inflation is measured using a price index that excludes food and energy prices. The primary reason for that is the volatility of those two."}, {"n": 11, "q": "An economic indicator that has turning points which tend to occur after the turning points in the business cycle is classified as a", "a": "trailing indicator.", "b": "lagging indicator.", "c": "coincident indicator.", "d": "leading indicator.", "e": "Lagging indicators have turning points that occur after business cycle turning points."}, {"n": 12, "q": "A business reporter claims that we are suffering from inertial inflation. This means", "a": "the business cycle is heading toward a trough.", "b": "the current rate of inflation will remain at this level until economic shocks cause it to change.", "c": "the economy is about to enter a deflationary period.", "d": "prices are increasing at a steady rate.", "e": "Inertial inflation means that a change in the inflation rate is not expected until some kind of economic event shakes things up and causes the rate to move up or down."}, {"n": 13, "q": "In the secondary market, U.S.Treasury bond prices are most influenced by", "a": "the Treasury Department", "b": "the prime rate", "c": "the primary dealers", "d": "the inflation rate", "e": "There are two major influences on the price of bonds in the secondary market. One is the amount of credit risk. The other, and generally stronger influence, is the inflation rate."}, {"n": 14, "q": "Ana is a bond analyst who notices a wider credit spread between Treasury bonds and AAA corporate debt. From this, she would be most likely to infer", "a": "the economy is weakening.", "b": "interest rates on Treasury bonds are increasing.", "c": "corporate bond prices are increasing.", "d": "corporate earnings are reaching record highs.", "e": "The reason the spread gets wider is that investors are getting out of corporate bonds and getting into Treasuries. This is an escape to quality."}, {"n": 15, "q": "As current interest rates go up, the market price of existing corporate bonds bearing lower interest rates will", "a": "decrease", "b": "change in unpredictable ways", "c": "increase", "d": "stay the same", "e": "There is an inverse relationship between interest rates and bond prices. This means that as current interest rates go up, the market price of existing bonds will go down."}, {"n": 16, "q": "A bond analyst reports that there is currently an inverted yield curve. That would mean", "a": "the closer the bond is to its maturity date, the higher the yield.", "b": "the closer the bond is to its maturity date, the lower the yield.", "c": "the further the bond is from its maturity date, the higher the yield.", "d": "bonds with intermediate maturities have the highest yields.", "e": "An inverted yield curve shows near-term maturities with higher yields than those of long-term maturities. Sometimes called a negative yield curve, it is usually an indication that interest rates are near a peak."}, {"n": 17, "q": "Yield curve analysis plays an important role as a benchmarking and forecasting tool for the future direction of interest rates. In most cases, this analysis involves examining", "a": "bonds of varying quality of similar maturities.", "b": "bonds of a single issuer over varying maturities.", "c": "bonds of similar quality over varying maturities.", "d": "bonds of varying quality over a number of maturities.", "e": "The most common yield curves are drawn using U.S. Treasury securities."}, {"n": 18, "q": "While listening to a commentator on cable TV, you hear the statement \"the flight to quality has ended.\" What would you expect the effect of this to be?", "a": "Yield spreads are widening.", "b": "Pessimism is spreading.", "c": "Airline stocks are in for a beating.", "d": "Yield spreads are narrowing.", "e": "The term yield spread refers to the difference in yield between very-high-quality debt instruments, such as U.S. government bonds, and those with lower ratings."}, {"n": 19, "q": "An inverted yield curve results in part by", "a": "declining interest rates", "b": "investors buying short-term bonds and selling long-term bonds", "c": "rising interest rates", "d": "investors buying long-term bonds and selling short-term bonds", "e": "The demand for longer-term bonds is higher than that of short-term bonds and causes a negative slope in the yield curve."}, {"n": 20, "q": "In the investment industry, the term spread has many different meanings. When used in a discussion about bonds, which of the following would be most appropriate?", "a": "Inverse spread", "b": "Calendar spread", "c": "Debit spread", "d": "Credit spread", "e": "A credit spread refers to the difference between yields of bonds with similar maturities but different ratings."}, {"n": 21, "q": "A common measurement used to evaluate attitudes regarding future economic conditions is the difference in yields between U.S. Treasury bonds and corporate bonds. This is known as", "a": "business cycle.", "b": "Consumer Price Index.", "c": "yield spread.", "d": "yield curve.", "e": "Many analysts compare the difference between yields on bonds with the same maturity, but different quality (rating) to get a sense of the market sentiment."}, {"n": 22, "q": "During an economic recession, which of the following items will most likely increase?", "a": "Bond prices", "b": "Interest rates", "c": "Inflation", "d": "Consumer confidence and profits", "e": "During a recessionary period, inflation and interest rates generally decline. This causes bond prices to increase because they are inversely related to the change in interest rates."}, {"n": 23, "q": "Which of the following would probably not be an attractive investment during periods of rising inflation?", "a": "Gold", "b": "Oil stocks", "c": "Real estate", "d": "Corporate bonds", "e": "Interest rates tend to increase with inflation. Rising interest rates cause the values of all fixed-income securities to decline."}, {"n": 24, "q": "Which of the following would probably NOT be an attractive investment during periods of rising inflation?", "a": "Real estate", "b": "Gold", "c": "Corporate bonds", "d": "Oil stocks", "e": "Interest rates tend to increase with inflation. Rising interest rates cause the values of all fixed-income securities to decline."}, {"n": 25, "q": "A bond analyst is plotting a yield curve and notices that short-term maturities have higher yields than intermediate and long-term maturities. This is an example of", "a": "a normal yield curve", "b": "an algorithmic yield curve", "c": "an inverted yield curve", "d": "a positive yield curve", "e": "An inverted, or negative, yield curve is one that results when debt with short-term maturities has higher yields than those with maturities that are longer."}]}, {"id": 81, "name": "Series 65 Domain 2 (Quiz 1): Investment Vehicle Characteristics", "key": "BBABADABBBBCACBBCBDCADDBC", "questions": [{"n": 1, "q": "Which of the following statements about equity securities is NOT true?", "a": "Preferred stock pays a fixed dividend.", "b": "Preferred stock is an equity security while common stock is a hybrid.", "c": "Common stock is less sensitive to interest rate risk than preferred stock.", "d": "Preferred stock is usually nonvoting.", "e": "Both common and preferred stock are equity securities. Common stock is never referred to as a hybrid; there are times when preferred stock is because of those features that are similar to a debt security. The dividend on preferred stock is fixed, and shares do not have voting rights."}, {"n": 2, "q": "Which of the following statements concerning equity securities is not correct?", "a": "Preferred stock is an equity security with an intermediate claim (between the bondholders and the common stockholders) on a firm's assets and earnings.", "b": "Equity securities represent a lending interest in a corporation.", "c": "Common stock is an equity security representing an ownership interest in a corporation.", "d": "Equity securities provide a residual claim, after payment of all obligations to fixed-income claims, on the income and assets of a corporation.", "e": "Equity securities represent an ownership interest in a corporation. Preferred stock, as a senior security, has a claim ahead of common, but behind debt securities."}, {"n": 3, "q": "The primary defining characteristic of an equity security is", "a": "it represents ownership in a corporation.", "b": "the ability to keep pace with inflation.", "c": "it pays dividends, usually quarterly.", "d": "voting rights.", "e": "What does the term equity mean? It means ownership and that is the single most significant fact about an equity security, whether common or preferred stock."}, {"n": 4, "q": "An investor in an equity security", "a": "has a say in the day-to-day operations of the business.", "b": "acquires an ownership interest in the companyq", "c": "is assured of a minimum rate of return.", "d": "becomes a creditor of the company.", "e": "Equity means ownership, and this is a characteristic shared by both common and preferred stock. Holders of debt securities are creditors, and, there are no guarantees when it comes to returns on equity securities."}, {"n": 5, "q": "All of the following represent ownership in corporation except", "a": "mortgage bonds.", "b": "common stock.", "c": "convertible preferred stock.", "d": "preferred stock.", "e": "Ownership in a corporation resides in its equity securities. All stock is equity while all bonds are debt."}, {"n": 6, "q": "Which of the following statements regarding international investing is NOT correct?", "a": "One method to engage in international investing is through American depositary receipts.", "b": "An international investor faces the additional risks of foreign currency risk and country risk.", "c": "International investing offers diversification and potentially higher returns.", "d": "An emerging market is a market in a highly developed foreign economy with stable political and social institutions.", "e": "Emerging markets are markets in lesser developed countries. As a result, the political risk tends to be higher than with developed economies. Whether it is emerging or developed, a U.S.-based investor will always face currency risk."}, {"n": 7, "q": "An ADR is used to", "a": "facilitate trading in foreign securities in U.S. markets by U.S. citizens living in the United States", "b": "reduce currency risk when investing in foreign securities", "c": "finance foreign trade in which U.S. citizens are engaged", "d": "facilitate trading in U.S. securities in foreign markets by U.S. citizens living abroad", "e": "American depositary receipts (ADRs) make trading in foreign securities easier in U.S. markets for U.S. investors."}, {"n": 8, "q": "A client is considering the purchase of American depositary receipts (ADRs). The client is looking to further diversify her portfolio. Which of the following is not a feature of this type of investment vehicle?", "a": "ADRs are denominated and pay dividends in U.S. dollars.", "b": "They are not subject to exchange rate, or currency, risk.", "c": "ADRs are both liquid and marketable.", "d": "Information regarding the foreign company is more easily attainable than if directly purchased.", "e": "Even though ADRs are denominated in U.S. dollars, they are subject to exchange rate, or currency, risk. The bank furnishes information about the underlying security in English rather than the foreign language."}, {"n": 9, "q": "Which of the following statements concerning international investing is correct?", "a": "The rates of return on foreign securities are generally less than those available from U.S. markets.", "b": "Information is not as readily available on foreign investments as on domestic ones.", "c": "The addition of foreign securities to a portfolio may result in increased portfolio risk due to the different movements of foreign markets and U.S. markets.", "d": "Foreign markets are usually mature and offer no growth advantages.", "e": "In general, foreign investments don't have the transparency of domestic ones. Investors may earn higher returns in foreign markets and including foreign securities in an investment portfolio may lower risk through greater diversification."}, {"n": 10, "q": "A technical analyst would be most interested in which of the following?", "a": "Working capital", "b": "200-day moving averages", "c": "Capitalization ratios", "d": "D. \"D) Price-to-earnings ratios", "e": "Technical analysts try to predict the market by examining price and volume trends. They expect the market to act in the future as it has in the past."}, {"n": 11, "q": "An investor may expect to receive dividends from", "a": "a put option", "b": "an ADR", "c": "a call option", "d": "a warrant", "e": "An American depositary receipt (ADR) represents ownership in a foreign corporation, and dividends declared by the corporation are paid to the ADR owner. The currency conversion is performed by the issuing domestic bank."}, {"n": 12, "q": "A technical analyst would be least concerned with", "a": "advance/decline", "b": "short interest", "c": "book value per share", "d": "S&P 500 index", "e": "A technical analyst is not concerned with any fundamental aspects of a company, including company financials."}, {"n": 13, "q": "A risk-averse investor, who had only invested funds in bank certificates of deposits, was informed by his investment adviser representative that higher returns with safety could be achieved by investing in U. S. Treasury notes with a 10-year maturity. The adviser representative assured his client that investment in federal government-backed securities is riskless. In this situation, the representative acted", "a": "unethically, because the agent failed to disclose that the customer retains interest rate risk", "b": "unethically, because Treasury notes are unsuitable for a risk-averse customer", "c": "properly, because Treasury notes carry no risk of principal default", "d": "properly because Treasury notes are suitable for a risk-averse customer", "e": "Although Treasury securities do not carry default risk, they are subject to interest rate risk."}, {"n": 14, "q": "Which of the following debt instruments does not make periodic interest payments?", "a": "T-bonds", "b": "TIPS", "c": "T-bills", "d": "T-notes", "e": "Treasury bills are always issued at a discount from their face value. At maturity, the investor receives the face value."}, {"n": 15, "q": "An investor interested in monthly interest income should invest in", "a": "utility company stock", "b": "GNMAs", "c": "Treasury bonds", "d": "corporate bonds", "e": "GNMAs pay monthly interest and principal, treasury bonds pay semiannual interest, utility stocks pay quarterly dividends, and corporate bonds pay semiannual interest."}, {"n": 16, "q": "An investor purchases a Treasury note and the confirmation shows a price of $102.25. Rounded to the nearest cent, the investor's cost, excluding commissions, is", "a": "$1,022.50.", "b": "$1,027.81.", "c": "$102.25.", "d": "$1,020.25.", "e": "Treasury notes are quoted in 32nds where each 32nd equals .3125."}, {"n": 17, "q": "Your client in the 28% federal income tax bracket currently owns some U.S. government bonds with a coupon yield of 6%. In order to receive the same income after taxes, she would need to buy municipal bonds with a coupon of", "a": "7.68%", "b": "1.68%", "c": "4.32%", "d": "6.00%", "e": "Because the 6% on the government bond is fully taxable on a federal basis, the client receives a net of 4.32%."}, {"n": 18, "q": "A client is trying to decide between a par value corporate bond carrying a coupon rate of 6.25% per year and a par value municipal bond that pays an annual coupon rate of 4.75%. Assuming all other factors are equal and your client is in a 28% marginal income tax bracket, which bond do you tell the client to purchase and why?", "a": "The municipal bond because its equivalent taxable yield is 6.3%", "b": "The municipal bond because its equivalent taxable yield is 6.6%", "c": "The corporate bond because the after-tax yield is 4.5%", "d": "The corporate bond because the after-tax yield is 6.25%", "e": "If we compute the tax-equivalent yield of the muni, we see that it is 6.6%, which is a higher return than the 6.25% on the corporate bond."}, {"n": 19, "q": "A client is in the 28% marginal federal income tax bracket, and the 3% state income tax bracket. Which of the following investments would produce the highest after-tax yield for the client?", "a": "A U. S. Treasury note yielding 7%", "b": "An A-rated corporate mortgage bond yielding 8.0%", "c": "A triple-A-rated debenture yielding 7.75%", "d": "A public purpose municipal bond yielding 6%", "e": "Because your client is in the 28% tax bracket, he has to earn more than the 6% on a taxable bond for the yield to be equal to, or higher than, the tax-free bond."}, {"n": 20, "q": "An analyst uses the dividend growth model to assist in determining appropriate stocks to recommend. This analyst would consider all of the following factors EXCEPT", "a": "required rate of return", "b": "growth of the dividend", "c": "market capitalization", "d": "current dividend", "e": "The classic definition of the dividend growth model is a stock valuation model that deals with dividends and their growth, discounted to today."}, {"n": 21, "q": "All of the following statements regarding technical analysis are correct except", "a": "technical analysts rely heavily on financial ratios in their analysis of stocks.", "b": "technical analysts attempt to predict the future movement of stock prices based on past trends.", "c": "technical analysts use terms such as trendline, support, and resistance in analyzing stocks.", "d": "technical analysts rely on charts to predict the future prices of stocks.", "e": "Technical analysts do not rely on financial ratios in their analysis of stocks. Instead, they rely on charts of past price history and volume to predict future price movements."}, {"n": 22, "q": "Your client in the 25% federal income tax bracket lives in a state where his earnings place him in the 6% bracket for state income tax purposes. If he were to purchase a 4% bond issued by a political subdivision of another state, his total tax-equivalent yield would be", "a": "4%", "b": "slightly more than 5.33%", "c": "approximately 12.90%", "d": "slightly less than 5.33%", "e": "When an individual owns a municipal bond issued in a state other than his state of residence, although the interest is tax free on a federal basis, it is taxable in that state."}, {"n": 23, "q": "When an investor divides the coupon rate of a municipal bond by the complement of her tax rate, she is computing the bond's", "a": "discounted cash flow.", "b": "inflation-adjusted return.", "c": "after-tax rate of return.", "d": "tax-equivalent yield.", "e": "The computation for the tax-equivalent yield of a municipal bond is performed by dividing the bond's coupon rate by the complement of the investor's tax rate."}, {"n": 24, "q": "Sortel Industries has preferred stock outstanding that pays annual dividends of $3.75 a share. If an investor wants to earn a rate of return of 8.5%, how much should she be willing to pay for a share of Sortel preferred stock?", "a": "$31.88", "b": "$44.12", "c": "$42.10", "d": "$33.89", "e": "This is a middle school math question. It is asking, 3.75 is 8.5% of what number? The computation is: 3.75 / 0.085 = $44.12."}, {"n": 25, "q": "Securities issued by which of the following agencies offer direct government backing?", "a": "Federal Home Loan Mortgage Corporation (Freddie Mac)", "b": "Federal National Mortgage Association", "c": "Government National Mortgage Association", "d": "Federal Intermediate Credit Bank", "e": "FNMA, FHLMC, and FICB are considered GSEs (government-sponsored enterprises). The only security without the word Treasury in its name that is backed by the U.S. government is a GNMA."}]}, {"id": 82, "name": "Series 65 Domain 2 (Quiz 2): Investment Vehicle Characteristics", "key": "CCAADBBDDCBCDACDABACCBBDC", "questions": [{"n": 1, "q": "A customer owns cumulative preferred stock (par value of $100) that pays an 8% dividend. The dividend has not been paid this year or for the 2 previous years. How much must the company pay the customer per share before it may pay dividends to the common stockholders?", "a": "$16.00", "b": "$8.00", "c": "$24.00", "d": "$0.00", "e": "If the company is going to pay a common stock dividend, it must pay the preferred dividends first. A cumulative preferred stockholder must also receive all dividends in arrears. There are 16 due in back dividends, in addition to 8 this year, for a total of $24."}, {"n": 2, "q": "A common stockholder's rights include all of the following EXCEPT", "a": "the receipt of dividends, if declared by the board of directors", "b": "electing the board of directors", "c": "the right to determine the par value of the stock", "d": "preemptive rights", "e": "Par value is an accounting decision made by the company when the stock is first issued and is not something voted on by shareholders."}, {"n": 3, "q": "Reasons why a corporation might issue a convertible preferred stock would include", "a": "giving those shareholders an opportunity to participate in the future success of the company", "b": "giving those shareholders the ability to convert into the issuer's bonds", "c": "a lower cost to the issuer than would be incurred by the issuance of convertible bonds", "d": "tax savings to the issuer", "e": "The benefit of any convertible security, bond or preferred stock, is that the ability to convert into the issuer's common stock allows those investors to participate in the potential future growth of the company."}, {"n": 4, "q": "A company's dividend on its common stock is", "a": "determined by its board of directors", "b": "voted on by shareholders", "c": "specified in the company charter", "d": "mandatory if the company is profitable", "e": "A common stock's dividend payment and amount are determined by the company's board of directors."}, {"n": 5, "q": "Corporations have found that one way to increase employee motivation is to grant options to purchase stock in the company. Incentive (qualified) options differ from nonqualified options in all of the following respects except", "a": "there is a maximum 10-year limit for exercising an ISO; no such time limit exists for an NSO.", "b": "the holder of an ISO can recognize capital gain (loss) as a result of exercise, whereas ordinary income (loss) is the result with an NSO.", "c": "ISOs may only be granted to employees while NSOs may be given to virtually anyone.", "d": "the recipient of the grant of the ISO has no income tax consequences at the time of the grant.", "e": "Whether the grant is of an ISO (qualified) or an NSO (nonqualified), there are no tax consequences to the recipient at the time of the grant."}, {"n": 6, "q": "Which of the following has the least exposure to inflation risk?", "a": "Cash", "b": "Common stock.", "c": "Fixed annuity", "d": "Preferred stock", "e": "The returns on common stock have historically outperformed inflation, making them less vulnerable to loss of purchasing power among the choices presented."}, {"n": 7, "q": "ABC Corporation has a 10% noncumulative preferred stock outstanding at 100parvalue.Twoyearsago,ABComitteditspreferreddividend,andlastyear,itpaidadividendof5 per share. To pay a dividend to common shareholders this year, each preferred share must be paid a dividend of", "a": "$15.00", "b": "$10.00", "c": "$5.00", "d": "$25.00", "e": "This stock has a par value of $100 and a dividend rate of 10%. Because this is noncumulative preferred stock, the company must pay only this year's full stated dividend of $10 per share before paying dividends to the common shareholders."}, {"n": 8, "q": "Investments in which of the following offer the best long-term protection against inflation?", "a": "Government bonds", "b": "Fixed annuities", "c": "Corporate bonds", "d": "Common stock", "e": "Common stocks have historically offered returns that outpace inflation over the long term."}, {"n": 9, "q": "One of the rights of those owning common stock is the opportunity to vote on issues brought up at the corporation's annual meeting. To be eligible to cast a vote,", "a": "the stockholder must be a natural person", "b": "the company must be current on its dividends to preferred stockholders", "c": "the stock must be paid for in full before the annual meeting", "d": "ownership must be established by the record date", "e": "Only stockholders who are on the company's books by the record date are eligible to vote."}, {"n": 10, "q": "An employee wishing to obtain long-term capital gain treatment would prefer the employer to offer", "a": "listed stock options", "b": "non-qualified stock options", "c": "incentive stock options", "d": "portable stock options", "e": "Assuming the time limit conditions are met, exercise of an ISO can result in long-term capital gains while non-qualified options are always treated as ordinary income."}, {"n": 11, "q": "Which of the following statements about dividends on common stock is NOT true?", "a": "Only those who are owners of the stock on the record date will receive dividends", "b": "Corporations are contractually obligated to pay dividends to their shareholders each year", "c": "Dividends represent a pro rata distribution of corporate profits to shareholders", "d": "Dividends may be paid in cash, property, or stock", "e": "Dividends are the share of a corporation's profits that the corporation pays to shareholders as owners of the corporation. Dividends must be declared by the corporation's board of directors."}, {"n": 12, "q": "A client has 100 shares of GHI when the stock undergoes a split. After the split, the client has", "a": "a proportionately decreased interest in the company", "b": "greater exposure", "c": "no effective change in the value of the position", "d": "a proportionately increased interest in the company", "e": "When a stock splits, the number of shares each stockholder has either increases or decreases (in the case of a reverse split). The customer experiences no effective change in position."}, {"n": 13, "q": "One of the features of convertible preferred stock is that", "a": "the owner has the opportunity to convert the stock into the issuer’s bonds", "b": "the holder is able to select the conversion price", "c": "the dividend is paid ahead of all other securities", "d": "the owner has the opportunity to participate in the growth of the company", "e": "Any convertible security, preferred stock or debenture, is convertible into the issuer's common stock. It is the debtholder, not the issuer who determines when and if to convert."}, {"n": 14, "q": "Which of the following statements best describes cumulative preferred stock?", "a": "Owners have a continuing claim to their dividends, and all arrears must be paid before any dividends can be paid on common stock.", "b": "Owners lose any claim to dividends that are not paid in any one year.", "c": "Owners are allowed to vote for directors using the cumulative voting procedures.", "d": "Owners receive an extra dividend, along with common shareholders, in addition to the preferred dividend.", "e": "Owners of cumulative preferred stock have a continuing claim to their dividends, even when the directors pass a dividend."}, {"n": 15, "q": "Which of the following statements regarding preemptive rights is TRUE?", "a": "Both common and preferred stockholders have the right to subscribe to a rights offering.", "b": "Common stockholders do not have the right to subscribe to a rights offering.", "c": "Preferred stockholders do not have the right to subscribe to a rights offering.", "d": "Neither common nor preferred stockholders have the right to subscribe to a rights offering.", "e": "Preferred stockholders have a preference as to liquidation and distribution of dividends, but the right to maintain a proportionate interest in the company only applies to common stock."}, {"n": 16, "q": "If a customer owns 7% of a publicly-traded company's stock and his spouse owns 6% and wants to sell her shares, which of the following statements is true?", "a": "The spouse is not an affiliate and Rule 144 does not apply.", "b": "The spouse is an affiliate and Rule 144 does not apply.", "c": "The spouse is not an affiliate and Rule 144 applies.", "d": "The spouse is an affiliate and Rule 144 applies.", "e": "Together, the client and wife own 13% of the company's stock, so the spouse is considered an affiliate and is bound by Rule 144."}, {"n": 17, "q": "One way in which incentive stock options (ISOs) differ from nonqualified stock options (NQSOs) is that", "a": "the bargain element of the ISO is an AMT preference item.", "b": "the bargain element of the ISO is reported as wages on the tax returns of the employer and the employee.", "c": "there is a maximum 5-year limit for exercise on the ISO while the time limit on the NQSO is 10 years.", "d": "gains on an ISO are always short-term while those on an NQSO are long-term.", "e": "The only true statement here is that the bargain element of the ISO (but not the NQSO) is one of the preference items for the alternative minimum tax."}, {"n": 18, "q": "A corporation would like to offer their employees an opportunity to participate in the future growth of the company. Among the methods you might suggest are", "a": "voting-trust certificates", "b": "employee stock options", "c": "subordinated debentures", "d": "preemptive rights", "e": "One of the most popular ways to give employees the chance to benefit from an increase in the value of the employer's stock is through employee stock options."}, {"n": 19, "q": "An investor holding which of the following equity securities would NOT expect to have preemptive rights?", "a": "Preferred stock", "b": "Common stock acquired in a private placement", "c": "Control stock", "d": "Common stock", "e": "Preferred stockholders do not have preemptive rights. Preemptive rights allow common stockholders to subscribe to additional issues of shares before they are offered to the public."}, {"n": 20, "q": "Which of the following is not a characteristic of American depositary receipts (ADRs)?", "a": "Because ADRs are traded on the exchanges, they are relatively liquid and marketable investments.", "b": "ADR holders may surrender ADRs in exchange for receiving the shares of the non-U.S. company.", "c": "Dividends are declared in the foreign currency, so exchange rate, or currency, risk is completely eliminated.", "d": "ADRs are denominated and pay dividends in U.S. dollars, not foreign currencies, thus saving the investor transaction costs with respect to converting currencies.", "e": "ADRs are receipts issued by a U.S. bank for shares of a foreign company purchased and held by a foreign branch of the bank."}, {"n": 21, "q": "One of the rights of being a stockholder is the ability to vote on important corporate matters, such as the election of members to the board of directors. The date that determines which shareholders are eligible to votes is", "a": "the ex-dividend date.", "b": "the last day of the company’s fiscal year.", "c": "the record date.", "d": "the election date.", "e": "The record date is a date announced by the company as the official date you must be an owner on the company's records in order to participate in the annual meeting and corporate election."}, {"n": 22, "q": "A client is considering the purchase of American depositary receipts (ADRs). She is looking to further diversify her portfolio. Which of the following is not a feature of this type of investment vehicle?", "a": "ADRs are traded on exchanges and the OTC markets.", "b": "They are not subject to exchange rate, or currency, risk.", "c": "ADRs are denominated in and pay dividends in U.S. dollars.", "d": "Information regarding the foreign company is easily attainable.", "e": "Even though ADRs are denominated in U.S. dollars, they are subject to exchange rate, or currency, risk."}, {"n": 23, "q": "Which of the following statements regarding international investing is not correct?", "a": "An international investor faces the additional risks of foreign currency risk and country risk.", "b": "An emerging market is a market in a highly-developed foreign economy with stable political and social institutions.", "c": "One method to engage in international investing is through American depositary receipts.", "d": "International investing offers diversification and potentially higher returns.", "e": "Emerging markets are markets in lesser-developed countries. As a result, the political risk tends to be higher than with developed economies."}, {"n": 24, "q": "An employee is offered a nonqualified stock option with an exercise price of 20pershare.Iftheoptionisexercisedwhenthecurrentmarketvalueofthestockis30, the employee", "a": "has a capital gain of $10 per share", "b": "is taxed on $30 per share as if it were salary", "c": "is taxed on $20 per share as if it were salary", "d": "is taxed on $10 per share as if it were salary", "e": "In the case of NSOs, the difference between the exercise (or strike) price and the current market value is considered salary to the employee."}, {"n": 25, "q": "A client is considering the purchase of American depositary receipts (ADRs). She is looking to further diversify her portfolio. Which of the following is NOT a feature of this type of investment vehicle?", "a": "ADRs are traded on exchanges and the OTC markets.", "b": "Information regarding the foreign company is easily attainable.", "c": "They are not su

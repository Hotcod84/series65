es are used to explain extraordinary items such as the sale of a subsidiary."}, {"n": 3, "q": "Which of the following statements about balance sheets are true?\nBalance sheets provide a snapshot of a company's financial position on a given date.\nBalance sheets represent the relationship between a company's assets, liabilities, and stockholders' equity.\nBalance sheets provide a record of a company's earnings over a given period.", "a": "II and III", "b": "I, II, and III", "c": "I and II", "d": "I and III", "e": "A balance sheet shows a company's assets, liabilities, and stockholders' equity on a specific date. The financial statement that reflects a company's operating activities and earnings over a period of time is the income statement."}, {"n": 4, "q": "A client asks her investment adviser representative what footnotes to the financial statements are for. The best reply would be that footnotes", "a": "are used to explain how the various ratios are computed because companies recognize that many shareholders do not have a financial background.", "b": "contain a detailed history of the enterprise and its products or services.", "c": "contain information that doesn't have a place in the main body of the financial statements.", "d": "serve as a bibliography indicating where additional information may be obtained.", "e": "There are many important financial details that cannot be properly placed in either the balance sheet or the income statement. Examples of these are method of accounting used, collateral securing debt, pension liabilities, and many others. Footnotes are an integral part of the financial statements and are usually found with this notation: \"The accompanying footnotes to the financial statements are an integral part of these statements.\""}, {"n": 5, "q": "Which of the following best describe the balance sheet formula?\nAssets minus liabilities equals net worth.\nSales minus expenses equals operating income.\nLiabilities plus equity equals assets.\nDividends plus retained earnings equals net income.", "a": "II and IV", "b": "I and III", "c": "I and IV", "d": "II and III", "e": "A balance sheet basically lists what is owned (assets) and what is owed (liabilities). The difference between these two is the net worth or equity. Sales, expenses, and dividends are all found on the income statement."}, {"n": 6, "q": "The total of the cash from operations, investing, and financing, as reported on the statement of cash flows, is", "a": "reported as a separate line item on the balance sheet.", "b": "reported as cash income on the income statement.", "c": "an integral part of the footnotes to the balance sheet required by generally accepted accounting principles.", "d": "the net change in the cash position of the firm for the reporting period.", "e": "The total of the cash from operations, investing, and financing, as reported on the statement of cash flows, is the net change in the cash position of the firm for the reporting period. The sum total, or the net change in cash, is not reported on either the balance sheet or the income statement. It is the sum total of the entries on the statement of cash flows, which is a separate financial statement."}, {"n": 7, "q": "Net income", "a": "is paid out in cash to stockholders in addition to any declared dividends.", "b": "must be paid out in dividends.", "c": "represents the amount of money remaining after all expenses, including taxes.", "d": "reflects the operating profits of a firm only.", "e": "Net income is not a cash item that is paid out to stockholders. Dividends, both preferred and common, are generally cash distributions paid out from net income. Net income after taxes can reflect all sources of income in addition to the operating income generated by business activities. Net income also reflects investment income, as well as operating income. Net income may be paid out in the form of dividends; however, most firms retain a portion of net income in order to reinvest the funds in the business."}, {"n": 8, "q": "A corporation ends its accounting year on September 30. It would be correct to state that it uses", "a": "a nine-month year.", "b": "an alternative year.", "c": "an accounting year.", "d": "a fiscal year.", "e": "Fiscal-year accounting is the term used to describe whenever an entity ends its accounting year on a date other than December 31."}, {"n": 9, "q": "When an analyst adds back the current year's depreciation to the net income, she is computing the company's", "a": "cash flow from investments.", "b": "cash flow from operations.", "c": "net value of fixed assets.", "d": "earnings per share.", "e": "Cash flow from operations is computed by adding the year's depreciation deduction to the net income."}, {"n": 10, "q": "Many businesses choose to use a date other than December 31 to close out their financial year for accounting purposes. When this is done, it is said that the entity is reporting on", "a": "a nontraditional basis.", "b": "an alternative-year basis.", "c": "a calendar-year basis.", "d": "a fiscal-year basis.", "e": "Fiscal-year accounting uses a date other than December 31 as its year-end."}, {"n": 11, "q": "Looking at the balance sheet, a corporation builds its capital structure with all of the following except", "a": "long-term debt.", "b": "cash.", "c": "capital stock.", "d": "retained earnings.", "e": "A corporation's capital structure consists of its long-term debt plus shareholders' equity. Included in shareholders' equity are the equity capital (stock) and the retained earnings."}, {"n": 12, "q": "On a balance sheet, dividends payable would fall under the category of", "a": "fixed liabilities.", "b": "current liabilities.", "c": "assets.", "d": "stockholders' equity.", "e": "Dividends payable are dividends that have been declared but have not yet paid out. They are a type of current liability—that is, an obligation that will come due within one year from the date on the balance sheet."}, {"n": 13, "q": "Due to changes in market rates, a corporation is able to purchase some of its outstanding 20-year bonds at a discount. Which of the following is correct?\nWorking capital is increased.\nWorking capital is reduced.\nNet worth is increased.\nNet worth is reduced.", "a": "II and III", "b": "II and IV", "c": "I and III", "d": "I and IV", "e": "Even though the bonds are purchased for less than par value, working capital is reduced because the company is using a current asset—cash—to pay off a long-term liability. However, the fact that it is reducing its debt for less than the amount shown on the books will result in an increase to net worth."}, {"n": 14, "q": "Federal securities laws require publicly traded companies to disclose certain information on a regular basis. Which of these forms must be submitted quarterly?", "a": "Form PF", "b": "Form 10-K", "c": "Form 8-K", "d": "Form 10-Q", "e": "Domestic companies must submit quarterly reports on Form 10-Q (Q for quarterly) and annual reports on Form 10-K. Form 8-K is used to report certain events, and Form PF is for private fund investment advisers."}, {"n": 15, "q": "The owners' equity portion of a corporation's balance sheet would contain all of the following except", "a": "preferred stock.", "b": "net income.", "c": "paid-in capital.", "d": "Treasury stock.", "e": "Net income is only found on the income statement. The other three are part of stockholders' equity (net worth). Treasury stock is company stock that has been issued to the public and then reacquired by the issuer (the company). It appears as a negative number, so it reduces the net worth (owners' equity). Note, even though the Treasury stock reduces the owners' equity, the question is asking for the items you would see in the owners' equity section on the balance sheet, and if it exists, it would appear there as a deduction."}, {"n": 16, "q": "ABC Manufacturing Company is in the business of making high-quality machine tools. Which of the following would be included in ABC's cash flow from financing activities?", "a": "Payment of cash dividends", "b": "The purchase of a new building to store inventory", "c": "The sale of XYZ Lathe Manufacturing bonds", "d": "The purchase of a new computer-driven lathe", "e": "All financing activities deal with the flow of cash to or from the business owners. Who do dividends go to? The company's shareholders, and that is why they are included in financing activities. The other choices are part of cash flow from investing activities. This is a perfect example of the need to read every word in the question and answer choices. Payment of cash dividends is a financing activity while receipt of cash dividends is considered an operating activity."}, {"n": 17, "q": "When cash flow of a business is negative, all of the following are true except", "a": "the company might not be agile enough to respond to new opportunities.", "b": "the company will probably increase its dividend.", "c": "the company might have a hard time figuring out how to cover expenses it hasn't budgeted for.", "d": "the company may struggle to pay its bills.", "e": "The basic definition of negative cash flow is when a business does not have enough cash on hand to pay its immediate outstanding bills. It certainly would not be the time to increase its dividend. In fact, the dividend might be cut or even eliminated. Negative cash flow may also lead to the company being unable to take advantage of a business opportunity and meeting emergencies."}, {"n": 18, "q": "Which of the following best describe the balance sheet formula?\nAssets minus liabilities equals net worth.\nSales minus expenses equals operating income.\nLiabilities plus equity equals assets.\nDividends plus retained earnings equals net income.", "a": "II and IV", "b": "I and IV", "c": "I and III", "d": "II and III", "e": "A balance sheet basically lists what is owned (assets) and what is owed (liabilities). The difference between these two is the net worth or equity. Sales, expenses, and dividends are all found on the income statement."}, {"n": 19, "q": "Due to changes in customer preferences, a manufacturing company has decided to discontinue the operations of one of its subsidiaries. An explanation of this decision would most likely be found in the company's", "a": "income statement.", "b": "footnotes to the financial statements.", "c": "tax return.", "d": "balance sheet.", "e": "Footnotes are used to explain extraordinary items such as the sale of a subsidiary."}, {"n": 20, "q": "If, during a given year, a company has net income of $1 million and pays out dividends of $800,000, its retained earnings will", "a": "increase by $200,000.", "b": "decrease by $200,000.", "c": "increase by $1 million.", "d": "decrease by $1 million.", "e": "Retained earnings represent the net income a company has retained and not paid out in dividends. If a company has net income of $1 million and pays out only $800,000 in dividends, its retained earnings will increase by $200,000."}, {"n": 21, "q": "If a corporation issues mortgage bonds, all of the following would be affected except", "a": "total liabilities.", "b": "working capital.", "c": "shareholders' equity.", "d": "total assets.", "e": "When issued, the corporation receives the net proceeds in cash, increasing current assets (and thus total assets). Simultaneously, the corporation's long-term liabilities increase, reflecting the debt (and thus total liabilities). Working capital increases because of the increase in current assets. Shareholders' equity, or net worth, is only affected by the sale of new equity securities or by any profit or loss generated by the corporation."}, {"n": 22, "q": "When a member of the board of directors of a publicly traded company resigns due to a disagreement over an operational matter,", "a": "FINRA must be notified promptly.", "b": "Form 8-K must be filed with the SEC within four business days of the event.", "c": "the administrator must be notified no later than the close of the business day following the event.", "d": "Form 10-K must be filed with the SEC within four business days of the event.", "e": "Form 8-K is used to report significant events of importance to investors. Examples would be the resignation of a member of the board because of an operational dispute, liquidation of a significant asset, filing for bankruptcy, or a change in management control. When any of these occur, Form 8-K must be filed with the SEC no later than four business days after the event. Form 10-K is the company's annual filing, and that is due—depending on the size of the company—60 to 90 days after the end of the fiscal year."}, {"n": 23, "q": "If a publicly traded corporation was going to sell a wholly owned subsidiary, the information would be made available through the filing of Form", "a": "10-K.", "b": "8-K.", "c": "10-Q.", "d": "13F.", "e": "Form 8-K is filed with the SEC within four business days of any one of a number of significant actions, including the sale of a significant asset such as a wholly owned subsidiary."}, {"n": 24, "q": "Which of the following statements about balance sheets are true?\nBalance sheets provide a snapshot of a company's financial position on a given date.\nBalance sheets represent the relationship between a company's assets, liabilities, and stockholders' equity.\nBalance sheets provide a record of a company's earnings over a given period.", "a": "I, II, and III", "b": "I and III", "c": "I and II", "d": "II and III", "e": "A balance sheet shows a company's assets, liabilities, and stockholders' equity on a specific date. The financial statement that reflects a company's operating activities and earnings over a period of time is the income statement."}, {"n": 25, "q": "An analyst is reviewing the financial statements of Penta, Ltd. Over the period shown, Penta has sales of $5 million, a net profit of $1.5 million, annual bond interest charges of $500,000, and total assets of $2 million. Penta's net profit margin is", "a": "25%.", "b": "35%.", "c": "30%.", "d": "20%.", "e": "Profit margin = net profit ÷ sales = $1.5 million ÷ $5 million = 30%. Profit margin is based on operating costs. Because interest on bonds is a fixed expense, it is not included in the computation. As is often the case, there is more information supplied than needed."}, {"n": 26, "q": "An analyst who wants to examine a firm's financing transactions during the most recent period is most likely to evaluate the firm's statement of", "a": "comprehensive income.", "b": "changes in equity.", "c": "financial position.", "d": "cash flows.", "e": "The statement of cash flows describes a firm's inflows and outflows of cash during a reporting period from operating, investing, and financing activities. Financing transactions such as issuance of debt or stock are shown on the statement of cash flows. The statement of financial position (balance sheet) presents the firm's assets, liabilities, and equity at a point in time. The statement of comprehensive income (income statement) does not directly reflect a firm's financing transactions. Cash raised is not included in a firm's revenues and dividends paid and debt principal repaid are not included in its expenses."}, {"n": 27, "q": "One of the components of a cash flow statement is cash flow from investing activities. Included would be", "a": "cash proceeds from issuing stocks or bonds.", "b": "cash receipts (money coming in) from items such as interest and dividends.", "c": "transactions and events involving the purchase and sale of land, buildings, and equipment.", "d": "payments to retire bonds and the payment of dividends.", "e": "Investing activities include transactions and events involving the purchase and sale of securities, land, buildings, equipment, and other assets not generally held for resale as a product of the business. The proceeds from issuing securities (stocks or bonds) is a financing activity, as is using funds to retire bonds and/or pay dividends. Cash receipts are included in cash flow from operating activities, even when generated through investments such as interest or dividends."}, {"n": 28, "q": "Federal securities laws require publicly traded companies to disclose certain information on a regular basis. Which of these forms must be submitted quarterly?", "a": "Form 8-K", "b": "Form PF", "c": "Form 10-Q", "d": "Form 10-K", "e": "Domestic companies must submit quarterly reports on Form 10-Q (Q for quarterly) and annual reports on Form 10-K. Form 8-K is used to report certain events, and Form PF is for private fund investment advisers."}, {"n": 29, "q": "The owners' equity portion of a corporation's balance sheet would contain all of the following except", "a": "net income.", "b": "preferred stock.", "c": "paid-in capital.", "d": "Treasury stock.", "e": "Net income is only found on the income statement. The other three are part of stockholders' equity (net worth). Treasury stock is company stock that has been issued to the public and then reacquired by the issuer (the company). It appears as a negative number, so it reduces the net worth (owners' equity). Note, even though the Treasury stock reduces the owners' equity, the question is asking for the items you would see in the owners' equity section on the balance sheet, and if it exists, it would appear there as a deduction."}, {"n": 30, "q": "Current assets on a corporate balance sheet would include which of these?\nAccounts payable\nAccrued wages\nCash\nInventory", "a": "I and II", "b": "II and IV", "c": "III and IV", "d": "I and III", "e": "Cash is the most obvious current asset. The general definition of current asset is one that is expected to be turned into cash within the year. One would certainly hope that to be true of inventory. Accounts payable and accrued wages are liabilities—obligations that must be paid on a current basis."}]}, {"id": 8, "name": "Unit 8: Securities and Transactions: What Qualifies and Exemptions from Registration", "key": "BCCDADABABACACCDABADCCADAABCDDDDCADDCADDBC", "questions": [{"n": 1, "q": "Which of the following are exempt from state registration?\nA common stock traded on the OTC Link whose bonds are listed on the NYSE\nAn isolated nonissuer transaction\nA transaction by an administrator of an estate\nA transaction with no commissions, directed by the offeror to no more than 50 persons in the state who buy the security for investment purposes only", "a": "III and IV", "b": "II and III", "c": "I and IV", "d": "I and II", "e": "Isolated nonissuer transactions and transactions by an administrator are included in the list of exempt transactions. The private placement exemption is limited to a maximum of 10 offers to retail clients. If this were to institutions (where there is no numerical limitation), commissions would be paid and immediate resale is permitted. If the common stock is federal covered (listed on the NYSE) and, therefore, exempt from registration, then a senior security (such as the bond) would also be covered. But it doesn't work in reverse."}, {"n": 2, "q": "Under the provisions of the Uniform Securities Act, all of the following transactions are exempt except", "a": "transactions in preorganization certificates if no commission is paid, no subscriber makes any payment, and the number of subscribers does not exceed 10.", "b": "liquidation of a security pledged as collateral for a loan.", "c": "a transaction pursuant to an offer directed by the issuer to no more than 10 individual investors in the state within a 12-month period, as long as no payment is made.", "d": "transactions by executors.", "e": "A transaction pursuant to an offer by an issuer to no more than 10 noninstitutional persons in the state would qualify as a private placement and would be exempt. However, unlike a preorganization certificate, the subscribers do pay for their purchases. All the other transactions are exempt."}, {"n": 3, "q": "Which of the following statements regarding the antifraud provisions of the Uniform Securities Act (USA) is true?", "a": "The only securities exempt from the provisions are those issued by national governments or political subdivisions of countries that maintain diplomatic relations with the United States.", "b": "Exempt securities are not subject to the antifraud provisions of the USA.", "c": "No securities are exempt from the antifraud provisions of the act.", "d": "The only securities exempt from the provisions are those that are properly registered under blue-sky laws.", "e": "Neither exempt nor nonexempt securities are ever exempt from the USA's antifraud provisions."}, {"n": 4, "q": "It would be considered a violation of the anti-fraud provisions of the Uniform Securities Act for an agent to:", "a": "tell a client that the stock he is recommending has applied for listing on the NYSE.", "b": "disregard client complaints sent to the agent's personal email address.", "c": "inform the client that he has recently passed the Series 66 examination and is now a registered investment adviser representative.", "d": "attempt to prevent a possible heart attack by telling his elderly client that the largest position in the client's account is only down 10% when, in fact, the company is preparing to file for protection under the bankruptcy laws and the stock is now almost worthless.", "e": "The anti-fraud provisions of the Uniform Securities Act prohibit agents from misrepresenting the status of client's accounts, even if there is a health situation as in this question. Disregarding customer written complaints (an email is a written complaint) is a prohibited practice, but is not fraud."}, {"n": 5, "q": "All of the following are exempt from state registration under the Uniform Securities Act except", "a": "variable annuities or other variable insurance products offered by an insurance company authorized to do business in the state.", "b": "debt securities issued by or guaranteed by an insurance company licensed to do business in this state.", "c": "securities issued by a nonprofit organization.", "d": "bonds issued by a bank that is a member of the Federal Reserve System.", "e": "A variable annuity (or other variable insurance product) offered by an insurance company is a nonexempt security under the Uniform Securities Act. Securities issued by or guaranteed by an insurance company are covered by extensive state insurance regulations and are exempt from state securities registration. Securities issued by banks are exempt because banks are covered by extensive state and federal banking regulations."}, {"n": 6, "q": "Which of the following are federal covered securities?\nA security quoted on the Nasdaq Stock Market\nShares of an investment company registered under the Investment Company Act of 1940\nAn offering in a security exempt from registration under the Securities Act of 1933\nA security that has a federally imposed exemption from state securities registration", "a": "I and IV", "b": "III and IV", "c": "I and II", "d": "I, II, and IV", "e": "Any Nasdaq security, shares of a registered investment company, a security that has a federally imposed exemption from state securities registration, and a security traded on a regulated exchange are all federal covered securities. Please note that the question is asking to identify federal covered securities. An offering is not a security; it is an attempt to sell."}, {"n": 7, "q": "Under the Uniform Securities Act, a registration by qualification becomes effective when", "a": "the Administrator approves the registration.", "b": "30 days have passed from the date of filing.", "c": "the Administrator receives the complete application.", "d": "the SEC gives its approval.", "e": "A registration by qualification becomes effective only when the Administrator approves the registration."}, {"n": 8, "q": "Under the National Securities Markets Improvement Act, a federal covered security is", "a": "a nonexempt security.", "b": "a security listed on a nationally recognized exchange, such as the NYSE or Nasdaq.", "c": "a security exempt from SEC registration.", "d": "any security registered under the Securities Act of 1933.", "e": "A federal covered security under NSMIA includes securities listed on nationally recognized exchanges such as the NYSE or Nasdaq."}, {"n": 9, "q": "Of the following transactions, which is not exempt from registration?", "a": "The sale of Canadian government securities to a client in the United States", "b": "A sale by a fiduciary", "c": "An unsolicited order from a client", "d": "A transaction between two broker-dealers", "e": "The sale of Canadian government securities to a client is not an exempt transaction. Sales by fiduciaries, unsolicited orders, and transactions between broker-dealers are all exempt transactions under the USA."}, {"n": 10, "q": "Blue-sky laws include all of the following except", "a": "antifraud regulations.", "b": "regulation of securities in other countries.", "c": "securities registration requirements.", "d": "agent and broker-dealer registration requirements.", "e": "Blue-sky laws are state securities laws that include antifraud regulations, securities registration requirements, and agent and broker-dealer registration requirements. They do not regulate securities in other countries."}, {"n": 11, "q": "Which of the following securities are exempt from registration in a state?\nSecurities listed on the NYSE\nSecurities issued by a religious nonprofit organization\nSecurities guaranteed by an insurance company authorized to do business in the state\nGovernment securities", "a": "I, II, III, and IV", "b": "I only", "c": "II and III", "d": "I and IV", "e": "All four are exempt from state registration: NYSE-listed securities are federal covered, nonprofit religious organizations' securities are exempt, insurance company guaranteed securities are exempt, and government securities are exempt."}, {"n": 12, "q": "Which of the following statements about registration under the Uniform Securities Act is not true?", "a": "Registration by qualification is generally used in the issuance of penny stocks.", "b": "Registration by filing is used for securities that are also registered with the SEC.", "c": "The Administrator may not require the escrow of the proceeds from an offering.", "d": "In the registration by qualification process, the effective date is determined by the Administrator.", "e": "The Administrator may require that the proceeds from an offering be placed in escrow. This is done to protect investors in the event that the offering is not successful."}, {"n": 13, "q": "Under the USA, exemptions from registration are available for issuers of all of the following except", "a": "a savings and loan company that is not authorized to do business in the state.", "b": "government bonds.", "c": "securities issued by a public utility.", "d": "securities issued by a credit union.", "e": "A savings and loan company not authorized to do business in the state would not have its securities exempt from registration. Government bonds, public utility securities, and credit union securities are all exempt."}, {"n": 14, "q": "Which of the following is not a security?", "a": "Treasury stock", "b": "Variable annuity contract", "c": "Participating whole life insurance that pays annual dividends", "d": "Collateral trust certificate", "e": "Whole life insurance policies, even those that pay dividends, are not securities; variable life and variable annuities are. Corporate equity is stock, and corporate debt is bonds and debentures."}, {"n": 15, "q": "An interest in which of the following is a security under the Uniform Securities Act?\nEvidence of indebtedness\nCertificate of deposit for a security\nOil and gas drilling program\nCattle feeding program", "a": "II and III", "b": "I only", "c": "I, II, III, and IV", "d": "III only", "e": "The best strategy is to memorize the short list of things that are not securities rather than try to remember all of the things that are. An example of a certificate of deposit for a security is an ADR. Oil and gas drilling programs and cattle feeding programs are types of DPPs. A common example of an evidence of indebtedness is a bond or a debenture."}, {"n": 16, "q": "An agent who, in effecting a securities transaction, deliberately omits to state a material fact that is necessary in order to make other statements made not misleading, has", "a": "not committed a fraudulent act because of intent to protect the customer.", "b": "violated both state and federal antifraud provisions.", "c": "not committed a fraudulent act because the agent didn't actually lie.", "d": "committed a fraudulent act.", "e": "Deliberately omitting material facts necessary to make other statements not misleading is a fraudulent act under both state and federal securities laws."}, {"n": 17, "q": "Which of the following securities are exempt from state registration?\nBonds issued by the government of Canada\nCommon stock listed on the NYSE", "a": "I and II", "b": "I only", "c": "Neither I nor II", "d": "II only", "e": "Both Canadian government bonds and NYSE-listed common stock are exempt from state registration. Government securities of foreign countries with diplomatic relations with the U.S. are exempt, and NYSE-listed securities are federal covered."}, {"n": 18, "q": "The Equity Protective Life Insurance Company (EPLIC) is authorized to do business in State K. As such, which of the following securities would be exempt from registration with the State K Administrator?", "a": "Variable annuities issued by EPLIC with a guaranteed income rider", "b": "The issuance of three million shares of the company's $100 par value preferred stock", "c": "Fixed index annuities issued by EPLIC", "d": "Variable life insurance policies issued by EPLIC", "e": "When an insurance company is authorized to do business (sell its policies) in a state, any securities it issues (such as stock or bonds) are exempt from registration under the Uniform Securities Act. That exemption does not apply to products sold by the insurance company; it applies solely to securities issued for the purpose of raising capital. Aren't fixed index annuities exempt from registration? Well, they are excluded from the definition of a security, and the question specifically asks about securities being exempt."}, {"n": 19, "q": "According to the Uniform Securities Act, which of the following would be considered exempt transactions?\nThe sale of an unlisted corporate bond by an executor of an estate\nThe gift of 100 shares of a NYSE-listed stock from a father to his minor child\nPreorganization certificates subscribed to by 14 institutional investors during a 12-month period for which no payment has been made\nAn unsolicited order from an individual client to purchase a nonexempt, unregistered security", "a": "I and IV", "b": "II and III", "c": "III and IV", "d": "I and II", "e": "Fiduciary transactions and unsolicited orders, regardless of the security being purchased or sold, are always exempt transactions under the USA. Preorganization certificates are limited to a maximum of 10 subscribers, whether individuals or institutions. A gift of securities is not a sale, so no transaction has taken place."}, {"n": 20, "q": "Which of the following transactions is not included in the definition of exempt transaction under Section 402(b) of the Uniform Securities Act?", "a": "Transactions between issuers and underwriters", "b": "Unsolicited nonissuer transactions effected through a broker-dealer", "c": "Isolated nonissuer transactions", "d": "The sale of Treasury bills to an individual client", "e": "Even though the Treasury bill is an exempt security, the sale to an individual is not an exempt transaction. Isolated nonissuer transactions, unsolicited transactions effected through a broker-dealer, and transactions between issuers and underwriters are exempt transactions under the provisions of the USA."}, {"n": 21, "q": "Under the Securities Act of 1933, securities issued by a charitable organization are exempt if", "a": "the organization is operated by funds through government grants.", "b": "a minimum of 5% of its assets are distributed each year.", "c": "the organization is a nonprofit.", "d": "no commissions are paid on sales of its securities.", "e": "The Securities Act of 1933 exempts securities issued by charitable or religious organizations from the registration and prospectus delivery requirements as long as the organizations are nonprofits."}, {"n": 22, "q": "The RAN Corporation's common stock is listed on the New York Stock Exchange. To raise additional working capital, RAN's board of directors has authorized the sale of $75 million in subordinated debentures. Under the Uniform Securities Act, which of the following is not a true statement?", "a": "The Administrator can require that the issuer provide a notice filing in the state.", "b": "The Administrator may require a filing fee to be paid prior to sales taking place in the state.", "c": "The Administrator can require the RAN Corporation to register the debentures prior to an offering in the state.", "d": "The Administrator can bring an enforcement action against the issuer if it is deemed that the issue is fraudulent.", "e": "Because the RAN Corporation's common stock is listed on the NYSE, it (and any security equal or senior to it) is a federal covered security. As such, the state has no registration authority over the security. However, notice filing and payment of fees may be required. The Administrator always has the power to enforce antifraud statutes."}, {"n": 23, "q": "Which of the following statements regarding the Uniform Securities Act (USA) are true?\nState securities Administrators may deny, by rule or order, an exemption to an exempt transaction under the USA, if the security involved is not covered by federal exemption.\nState securities Administrators may not deny, by rule or order, an exemption to an exempt transaction under the USA if the security involved is not covered by federal exemption.\nState securities Administrators may deny, by rule or order, an exemption to a federal covered security.\nState securities Administrators may not deny, by rule or order, an exemption to a federal covered security.", "a": "I and IV", "b": "II and IV", "c": "II and III", "d": "III and IV", "e": "State securities Administrators may deny, by rule or order, an exemption to an exempt transaction under the USA unless the security involved is covered by a federal exemption. State securities Administrators may not, however, deny an exemption provided to a federal covered security. Federal covered securities are granted exemption from state registration by federal law, so the state Administrator has no authority to deny the exemption granted by the federal government."}, {"n": 24, "q": "Which of the following is defined as a security under the Uniform Securities Act?", "a": "A guaranteed, lump-sum payment to a beneficiary", "b": "Fixed, guaranteed payments made for life or for a specified period", "c": "Commodity futures contracts", "d": "An investment contract", "e": "As a result of the Howey decision, investment contracts are defined as (and often serve as a synonym for) a security under the Uniform Securities Act. A guaranteed, lump-sum payment to a beneficiary is an endowment policy excluded from the definition of a security. Fixed, guaranteed payments made for life or for a specified period are fixed annuity contracts not defined as securities. Commodity futures contracts and the commodities themselves are not securities."}, {"n": 25, "q": "Under the Uniform Securities Act, the Administrator may require that a prospectus for a security registered under qualification be sent or given to each person to whom an offer is made", "a": "before the sale of the security.", "b": "before or concurrent with the filing of the registration statement.", "c": "only upon request of the offeree.", "d": "at least 48 hours before the effective date.", "e": "Under registration by qualification, the USA specifies that the Administrator has the power to require prospectus delivery before the sale of the security. That means the offeree (the investor), receives the prospectus prior to making a purchase. There is no prospectus prior to or concurrent with the filing. Because the prospectus is not available until the effective date, one can't be distributed prior to the effective date."}, {"n": 26, "q": "In the Howey decision, the U.S. Supreme Court held that an investment contract is a security if it represents", "a": "an investment of money in a common enterprise with the expectation of profit from the managerial efforts of others.", "b": "an investment of money in a common enterprise with the expectation of profit or tax-deductible losses from the managerial efforts of others.", "c": "an investment of money in a common enterprise with the expectation of profit from the efforts of the investor.", "d": "an interest in a publicly traded corporation whose managers are engaged in a regulated business enterprise.", "e": "The Howey decision defined an investment contract as a security when there is (1) an investment of money (2) in a common enterprise (3) where there is an expectation of a profit (4) through the efforts of a third party and not the investor."}, {"n": 27, "q": "Barzell Manufacturing Works (BMW) produces structural steel. To raise additional capital to modernize its plant, BMW decides to go public by issuing shares. Doing so would make BMW", "a": "a commodities dealer.", "b": "an issuer.", "c": "a manufacturer.", "d": "a broker-dealer.", "e": "When a company issues shares to the public, it is an issuer. Yes, BMW is also a manufacturer, but the question asks about the effect of issuing shares—answer the question being asked."}, {"n": 28, "q": "Under the National Securities Markets Improvement Act of 1996, the federal covered security exemption from state registration includes which of these?\nSecurities issued by investment companies registered under the Investment Company Act of 1940\nSecurities traded on the Nasdaq Stock Market\nSecurities traded on the New York Stock Exchange\nSecurities traded on the NYSE American LLC (formerly known as the American Stock Exchange [AMEX])", "a": "II and III", "b": "I and II", "c": "I, II, III, and IV", "d": "III and IV", "e": "Federal covered securities refer to securities exempt from registration because they are regulated, or covered by federal legislation. The National Securities Markets Improvement Act of 1996 (NSMIA) eliminated dual regulation of securities by both federal and state securities legislation. The term federal covered security also refers to any security listed on a national securities exchange, any security equal to or senior in standing to one listed on a national securities exchange, or a right or warrant to purchase a security listed on a national securities exchange."}, {"n": 29, "q": "Which of the following securities are exempt from registration under the Uniform Securities Act?\nMunicipal securities\nGovernment securities\nStock or bonds issued by an insurance company authorized to do business in this state", "a": "I only", "b": "II and III", "c": "I and III", "d": "I, II, and III", "e": "All government and municipal securities are exempt from registration requirements under the Uniform Securities Act, as are insurance company securities if the company is authorized to do business in this state."}, {"n": 30, "q": "A client of a broker-dealer calls his agent and submits an order to purchase 1,000 shares of a Chilean silver mining company. As the order ticket is being prepared, the agent notices that this is a nonexempt, unregistered stock. The agent should", "a": "inform the client that no orders for this stock may be accepted until it is properly registered in the state.", "b": "wait for firm approval before processing the order.", "c": "continue to process the order because this is an exempt security.", "d": "continue to process the order because this is an exempt transaction.", "e": "Because the client initiated the process, this is an unsolicited order. As such, it is included in the USA's definition of exempt transaction. Even when the security is nonexempt, registration is not required when the transaction is exempt. Therefore, this order may be taken as placed."}, {"n": 31, "q": "Under the Uniform Securities Act, which of the following persons is responsible for proving that a securities issue is exempt from registration?", "a": "State Administrator", "b": "Underwriter", "c": "No need to prove eligibility for an exemption", "d": "Issuer", "e": "The burden of proof for claiming eligibility for an exemption falls to the person claiming the exemption. In the event the registration statement was filed by someone other than the issuer, such as selling stockholders or a broker-dealer, that person must prove the claim."}, {"n": 32, "q": "The Uniform Securities Act would consider which of the following insurance products to be a security?", "a": "Modified endowment life insurance", "b": "Mortgage life insurance", "c": "Fixed annuity", "d": "Variable life insurance", "e": "The key is the word variable. Insurance products are excluded from the definition of a security unless the word variable is part of the description. So, variable life and variable annuities are securities—the rest are not."}, {"n": 33, "q": "All of the following describe exempt transactions except", "a": "ABC Securities, a registered broker-dealer functioning as an underwriter, purchases securities from XYZ Corporation.", "b": "Amalgamated National Bank sells its publicly traded bond portfolio to ABC Insurance Company.", "c": "Joe, an employee in the consumer lending department of Amalgamated National Bank, buys securities from ABC Securities, a broker-dealer registered in the state.", "d": "First National Bank sells its entire publicly traded bond portfolio to Amalgamated National Bank.", "e": "The purchase of securities from a broker-dealer by an employee of a bank is a nonexempt transaction because it is a sale of a security by a broker-dealer to a member of the public. Transactions between broker-dealers and issuers, between banks, and between banks and insurance companies are exempt because they occur between financial institutions. Exempt transactions are most often identified by the transaction's parties, rather than the type of security involved."}, {"n": 34, "q": "A primary issue is", "a": "a new offering of an issuer sold to investors", "b": "the first transaction between two parties in the over-the-counter market.", "c": "a sale between investors of securities traded on the New York Stock Exchange.", "d": "a secondary market transaction in a security recently offered to the public.", "e": "A primary issue is a new offering of securities by an issuer sold to investors. Transactions between two investors in the over-the-counter market refer to secondary transactions (the market between investors). A sale between investors of securities traded on the New York Stock Exchange is another example of a secondary transaction."}, {"n": 35, "q": "Which of the following financial instruments are considered securities under the Uniform Securities Act?\nCollateral trust certificates\nInvestment contracts, including interests in oil and gas drilling partnerships\nOptions listed on the Chicago Board Options Exchange\nForeign currency options contracts traded on the Philadelphia Stock Exchange", "a": "II, III, and IV", "b": "II and III", "c": "I and II", "d": "I, II, III, and IV", "e": "Collateral trust certificates, investment contracts, options, and option contracts, regardless of the underlying asset, are identified as securities in the Uniform Securities Act and are subject to its provisions. Currencies are not securities, but options on currencies are. The key to questions like this is to remember those things that are not securities."}, {"n": 36, "q": "Under the Uniform Securities Act, an example of a nonissuer transaction is", "a": "an initial public offering of common or preferred stock.", "b": "a Regulation D private placement sale of limited partnership interests.", "c": "the issuance of mutual fund shares.", "d": "the purchase and sale of shares of common stock on the NYSE.", "e": "In a nonissuer transaction, the proceeds do not flow to the issuer; rather, the proceeds are credited to selling shareholders. A secondary market trade, such as a transaction executed on the floor of an exchange, is a nonissuer transaction. An IPO, the purchase of mutual fund shares, and the purchase of limited partnership interests all benefit the issuer and are called issuer transactions."}, {"n": 37, "q": "All of the following are exempt from state registration except", "a": "fixed-income securities issued by a bank.", "b": "common stock in Mutual Savings Bank.", "c": "variable annuities issued by a major insurance company.", "d": "fixed annuities issued by a small insurance company.", "e": "Fixed annuities are not securities, so there is no registration required. Of the other choices listed, only variable annuities are required to be registered."}, {"n": 38, "q": "Which of the following are nonissuer transactions?\nAn investment manager purchases 100,000 shares of XYZ on the NYSE.\nAn investment adviser sells a block of YYY Corp. shares to an overseas investor in a private transaction.\nThe president of Dot.com, Inc., sells his personal shares of Dot.com on the NYSE.\nDot.com purchases its own shares on the open market in order to place them in Treasury.", "a": "I, II, III, and IV", "b": "I only", "c": "III and IV", "d": "I and II", "e": "A nonissuer transaction is a transaction in which the proceeds do not directly or indirectly go to the issuer, as in a secondary transaction. When the investment manager purchases XYZ shares on the NYSE, the proceeds of the sale do not go to XYZ Corp. but to the investors who sold the stock. When an investment adviser sells YYY Corp. shares to an overseas private investment group, YYY Corp. does not benefit directly or indirectly because the proceeds go to the investment adviser, not to YYY Corp. When Dot.com purchases its own shares on the open market, the proceeds go to outside investors, not to Dot.com as the purchaser. However, if Dot.com resold its shares, the transaction would be an issuer transaction."}, {"n": 39, "q": "An interest in which of the following is a security under the Uniform Securities Act?\nEvidence of indebtedness\nCertificate of deposit for a security\nOil and gas drilling program\nCattle feeding program", "a": "II and III", "b": "III only", "c": "I only", "d": "I, II, III, and IV", "e": "The best strategy is to memorize the short list of things that are not securities rather than try to remember all of the things that are. An example of a certificate of deposit for a security is an ADR. Oil and gas drilling programs and cattle feeding programs are types of DPPs. A common example of an evidence of indebtedness is a bond or a debenture."}, {"n": 40, "q": "Ways in which offerings under Rule 506(c) of Regulation D of the Securities Act of 1933 differ from those under Rule 506(b) include each of these except", "a": "the issuer must take \"reasonable steps\" to verify that all purchasers are accredited investors in a 506(c) offering, while no such obligation falls upon issuers in a 506(b) offering.", "b": "all purchasers of the Rule 506(c) securities must be accredited investors as defined in Rule 501, whereas Rule 506(b) permits a limited number of sophisticated but not accredited investors.", "c": "general solicitation is permitted under Rule 506(c) offerings; no advertising is permitted under Rule 506(b).", "d": "securities issued under Rule 506(c) are federal covered, while those under Rule 506(b) are not.", "e": "Under the NSMIA, any security issued under the federal transaction exemption offered under Rule 506, either (b) or (c), is considered a federal covered security. Rule 506(c) permits advertising (general solicitation) but requires that the issuer take reasonable steps to ensure all purchasers meet the accredited investor standard. In a Rule 506(b) offering, up to 35 nonaccredited investors are permitted with no limit placed on the number of accredited investors."}, {"n": 41, "q": "The National Securities Markets Improvement Act of 1996 (NSMIA) created a new definition known as a covered security. In general, these securities do not have to register on a state level. If XYZ common stock is listed for trading on the NYSE, which of the following XYZ securities are considered covered?\nXYZ participating preferred stock\nXYZ first mortgage bonds\nWarrants to purchase XYZ common stock\nRights issued in advance of an offering of additional XYZ common stock", "a": "I and IV", "b": "I, II, III, and IV", "c": "I, II, and III", "d": "II and III", "e": "Common stock listed on the New York Stock Exchange is a covered security as defined in the NSMIA. Furthermore, any security equal to or senior to that common stock is considered to be covered as well. Warrants and rights are equal to the common stock and the preferred stock and mortgage bonds are senior to the common stock."}, {"n": 42, "q": "If a public customer plans to purchase stock in a company that has been listed on a stock exchange for the past year in a regular-way secondary transaction, when must the customer receive the prospectus?", "a": "Before the settlement date", "b": "No later than three days from the settlement date", "c": "No prospectus delivery requirements for this transaction", "d": "Before the order entry", "e": "Because this is a secondary market transaction in a listed stock, there is no requirement that a prospectus be delivered to the customer."}]}, {"id": 9, "name": "Unit 9: Investment Adviser and Investment Adviser Representative Regulation", "key": "BCADBCAABDAAACDDDDABAAAABDABBAAAABBCDBDACADBBB", "questions": [{"n": 1, "q": "An investment adviser registered in 4 states would be permitted to enter into an advisory contract with all of the following prospective clients except", "a": "a state-chartered savings institution", "b": "a registered investment company", "c": "the investment committee of the local firefighter's union", "d": "a wealthy individual residing in a 5th state who wishes to change advisers", "e": "Under federal law, an investment adviser to a registered investment company must register with the SEC and, as a federal covered adviser, would not register with any state. A state-registered investment adviser can only advise noninstitutional clients who reside in a state where the adviser is registered or has a de minimis exemption. However, institutional clients can be taken on regardless of where they are located."}, {"n": 2, "q": "Peterson Financial Planning is an investment advisory firm headquartered in State A. Peterson has $10 million in assets under management, has 25 clients, and has a branch office in State B. Under the provisions of the Uniform Securities Act (USA), Peterson's registration requirement is to", "a": "register with the SEC", "b": "register with the state Administrator in State A only", "c": "register with state Administrators in both State A and State B", "d": "register with the SEC and state Administrators in State A and State B", "e": "Peterson has a place of business in both states and only $10 million under management, so it must register with the state Administrators in both states. SEC registration requires $100 million or more in AUM."}, {"n": 3, "q": "When can an investment adviser registered with the SEC use the term investment counsel as a title or in advertising?\nI. When a substantial portion of the IA's business involves the provision of continuous investment advice based on the individual needs of each client\nII. When the IA has been granted permission by the state Administrator", "a": "I and II", "b": "II only", "c": "I only", "d": "Neither I nor II", "e": "Under the Investment Advisers Act of 1940, an SEC-registered investment adviser may use the title investment counsel if it provides continuous investment advice based on the individual needs of each client as a substantial part of its business. Some states also require permission from the Administrator."}, {"n": 4, "q": "Under the Uniform Securities Act, all of the following may provide investment advice incidental to their normal business without requiring registration as an investment adviser except", "a": "a teacher at a local community college", "b": "an engineer", "c": "a lawyer", "d": "an economist", "e": "The USA excludes from the definition of investment adviser certain professionals whose advice is solely incidental to their profession. These are lawyers, accountants, teachers, and engineers (LATE). Economists are not included in this exclusion."}, {"n": 5, "q": "Which of the following would NASAA consider to be a substantial prepayment of fees?", "a": "$400 for services to be rendered over the next 2 months", "b": "$600 covering the entire contract year", "c": "$400 for the next 3 months of advisory services", "d": "$500 for the next 6 months of advisory services", "e": "NASAA considers a fee of more than $500 paid 6 or more months in advance to be a substantial prepayment. $600 for the entire contract year (12 months) exceeds both thresholds."}, {"n": 6, "q": "A pension consultant who advises corporate retirement plans with assets of $135 million must register with", "a": "the SEC because the adviser manages more than $110 million", "b": "the SEC because the adviser is a pension consultant", "c": "the state because the adviser does not manage assets", "d": "both the SEC and the state because of the amount of money involved", "e": "A pension consultant advises but does not manage assets. The AUM threshold applies to assets under management, not assets under advisement. Since the consultant does not manage assets, the consultant must register with the state."}, {"n": 7, "q": "The Investment Advisers Act of 1940 excludes from the definition of investment adviser persons whose advice does which of these?\nI. Involves only government securities\nII. Relates solely to securities that are direct obligations of or guaranteed by the United States\nIII. Does not relate to securities", "a": "II and III", "b": "II only", "c": "I, II, and III", "d": "I only", "e": "The Investment Advisers Act of 1940 excludes persons whose advice relates solely to U.S. government securities or does not relate to securities at all. It does not broadly exclude all government securities (such as municipal securities)."}, {"n": 8, "q": "To be defined as an investment adviser under the Uniform Securities Act, which of the following must apply?\nI. The person must be in the business of providing advice\nII. The person must provide advice regarding securities\nIII. The person must charge a fee directly to clients", "a": "I and II", "b": "I, II, and III", "c": "II and III", "d": "I and III", "e": "The definition requires being in the business of providing advice about securities for compensation. However, the compensation does not need to be a fee charged directly to clients; it can be any form of economic benefit."}, {"n": 9, "q": "Under the NASAA Model Rule on financial requirements for investment advisers, investment advisers who have custody of customer funds are usually required to have a net worth in the amount of", "a": "$5,000", "b": "$35,000", "c": "$10,000", "d": "$50,000", "e": "The NASAA Model Rule on financial requirements for investment advisers, unless an exception exists, requires an investment adviser with custody of customer funds or securities to have a minimum net worth in the amount of $35,000."}, {"n": 10, "q": "There are waivers from the Series 65 exam requirement for certain professional designations. Among those qualifying for the waiver are individuals who have which designation?", "a": "PhD in economics", "b": "CIMA", "c": "MBA in finance", "d": "ChFC", "e": "The ChFC (Chartered Financial Consultant) designation qualifies for a waiver from the Series 65 exam requirement. Other qualifying designations include CFP, CIC, PFS, and CFA."}, {"n": 11, "q": "In defining an investment adviser under SEC Release IA-1092, which of the following would meet the business standard?\nI. A person who holds himself out as an investment adviser\nII. A person who is in the business of giving investment advice\nIII. A person who on a regular basis advises others on the value of securities", "a": "I, II, and III", "b": "II and III", "c": "I and II", "d": "I only", "e": "SEC Release IA-1092 considers a person to be in the business of providing investment advice if they hold themselves out as providing advice, are in the business of giving advice, or regularly advise others on securities."}, {"n": 12, "q": "Regarding recordkeeping requirements under the Uniform Securities Act, an investment adviser who has an office in State A but is also registered in State B, C, and D would be required to follow the recordkeeping requirements set by", "a": "the Administrator of the adviser's home state, State A", "b": "the Administrator of each state in which the adviser is registered", "c": "NASAA", "d": "the SEC", "e": "Under the USA, the recordkeeping requirements are set by the Administrator of the state where the adviser maintains its principal office and place of business (the home state)."}, {"n": 13, "q": "Under the Uniform Securities Act, an investment adviser's registration becomes effective when?", "a": "At noon on the 30th day after the application was filed, if no action has been taken by the Administrator", "b": "Immediately upon filing of the application", "c": "When the adviser begins advising clients", "d": "At the discretion of the Administrator, with no specified time frame", "e": "Under the USA, registration of an investment adviser becomes effective at noon on the 30th day after filing, unless the Administrator has taken action before then."}, {"n": 14, "q": "Shibboleth Research Associates is an investment adviser with approximately $250 million in assets under management. Shibboleth wishes to register with the SEC. Under the Investment Advisers Act of 1940, registration is accomplished by filing", "a": "Form ADV Part 1A", "b": "Forms ADV Part 1A and Part 2A and Part 2B", "c": "Forms ADV Part 1A and Part 2A", "d": "Form ADV Part 2A", "e": "Registration with the SEC as an investment adviser requires filing Form ADV Part 1A (which contains information about the adviser's business) and Part 2A (the brochure). Part 2B (the brochure supplement) is not filed with the SEC but is delivered to clients."}, {"n": 15, "q": "Initial application for registration as an investment adviser requires which of these?\nI. Filing of Form ADV\nII. Payment of the filing fee\nIII. Posting of a surety bond\nIV. Filing of a consent to service of process", "a": "I and IV", "b": "I, II, and III", "c": "I and II", "d": "I, II, III, and IV", "e": "Initial application requires all four: Form ADV filing, the filing fee, a surety bond (if required by the state), and a consent to service of process."}, {"n": 16, "q": "Under the Uniform Securities Act, which of the following persons has to register as an investment adviser?", "a": "An agent of a broker-dealer who gives investment advice within the course of his duties with the firm, for which a fee is charged", "b": "An attorney who writes a legal opinion for a municipal bond indenture", "c": "A broker-dealer who gives investment advice that is incidental to the course of its business and for which no special compensation is received", "d": "A broker-dealer who gives advice for which he charges a specific fee", "e": "Broker-dealers need not register as investment advisers unless they charge a separate fee for providing investment advice. If the advice is strictly incidental and without a separate charge, the broker-dealer is not an investment advisor."}, {"n": 17, "q": "Under which of the following circumstances may attorneys and accountants claim an exclusion from the definition of investment adviser under the Investment Advisers Act of 1940?", "a": "The investment advisory activities have grown to represent 30% of their business.", "b": "They advertise that they are available to provide investment advice.", "c": "They charge a separate fee for the provision of investment advice from that received for their professional services.", "d": "The advice is incidental to the practice of their profession.", "e": "Under the Investment Advisers Act of 1940, lawyers, accountants, teachers, and engineers (LATE) giving investment advice that is incidental to their professions are not considered investment advisers."}, {"n": 18, "q": "If an investment adviser files an initial registration with a state on June 30, which of the following statements regarding the filing fee to be paid is true?", "a": "No filing fee is required until December 31.", "b": "The fee will be prorated from the effective date.", "c": "The fee will be prorated from the filing date.", "d": "The full year's fee must be paid.", "e": "While some states make exceptions for filings late in the year, under the USA, there is no pro rating of filing fees. The full year's fee must be paid with the initial registration request."}, {"n": 19, "q": "Which of the following statements describes a person who provides investment advice on a regular basis but does not charge fees, yet would be considered an adviser under Release IA-1092?", "a": "A financial planner sold his business and spends his time consulting with pension plans on whether to retain or hire new investment managers based on their performance. He does not charge fees; however, those managers retained as a result of his recommendations routinely provide him with noncash benefits such as vacations, computers, and office space.", "b": "A retired chief investment officer of a well-known investment management company, without compensation, writes a column in a general circulation newspaper commenting on the value of investing in equity securities; many readers find his advice useful and become clients of his former investment management company.", "c": "The secretary of the U.S. Treasury, as part of his official duties, comments on conditions in the financial markets and their future investment implications.", "d": "A wealthy college professor gives free lectures on sound investment practices and makes specific securities recommendations based on a quantitative model he has developed.", "e": "If an individual is in the business of providing advice and receives any economic benefit, such benefit is considered compensation under Release IA-1092. The noncash benefit, as in this case, need not come directly from the beneficiary of the services to be considered compensation."}, {"n": 20, "q": "The sole proprietor of an insurance business that exclusively provides advice on fixed-income annuity contracts", "a": "must register as a broker-dealer with the SEC.", "b": "need not register under any securities laws.", "c": "must register as an investment adviser representative under the USA.", "d": "must register as an investment adviser under the Investment Advisers Act of 1940.", "e": "The sole proprietor of an insurance business need not register under the Uniform Securities Act or Investment Advisers Act of 1940. She provides advice on fixed-income annuities only, which are insurance products, not securities."}, {"n": 21, "q": "Under the Uniform Securities Act, an accountant who charges hourly fees for securities recommendations in the regular course of his accounting practice is", "a": "included in the definition of an investment adviser because he is compensated for giving investment advice in the regular course of business.", "b": "included in the definition of an investment adviser because accountants are not among the professionals excluded from the definition.", "c": "not included in the definition of an investment adviser because he is an accountant.", "d": "not included in the definition of an investment adviser because he receives an hourly rate instead of a commission.", "e": "An accountant who gives advice in the course of business and receives compensation, hourly or not, for providing the advice in the regular course of business falls within the definition of an investment adviser under the Uniform Securities Act. To be excluded, the advice must be on an incidental basis."}, {"n": 22, "q": "Under the Uniform Securities Act, which of the following is an investment adviser?", "a": "Jill is an attorney specializing in estate planning who, as a side job, structures portfolios for the beneficiaries of her deceased clients at a reduced fee.", "b": "Tom writes a newspaper column that analyzes and recommends securities.", "c": "The trust department of ABC Bank provides investment advice to its clients.", "d": "Jane advises customers regarding the value of gold and silver coins.", "e": "Although an attorney is generally excluded, Jill is giving investment advice for a fee in a manner that is not incidental to her legal practice. Jane's advice does not concern securities; banks are excluded from the definition; and Tom's advice is not specific on the basis of the situation of each client (impersonal advice)."}, {"n": 23, "q": "Investment advisers who manage investment portfolios that total less than $100 million must register with", "a": "a state only.", "b": "both a state and the SEC.", "c": "the SEC only.", "d": "neither the SEC nor a state.", "e": "Investment advisers (IAs) who manage less than $100 million of investment assets are prohibited from registering with the SEC and are required to register with a state Administrator unless exempt under the laws of that state."}, {"n": 24, "q": "The primary responsibility for supervising the activities of an investment adviser representative (IAR) who is affiliated with a federal covered investment adviser lies with", "a": "the investment adviser the IAR represents.", "b": "the Administrator.", "c": "the SEC.", "d": "the IAR.", "e": "It is the obligation of every registered investment adviser, whether SEC or state registered, to supervise its representatives."}, {"n": 25, "q": "Based on the Investment Advisers Act of 1940, which of the following would be excluded from the definition of investment adviser?\nI. A lawyer who advertises financial planning services\nII. Persons whose advice relates solely to government securities\nIII. An accountant who receives separate fees for providing investment advice", "a": "II and III", "b": "II only", "c": "I and III", "d": "I only", "e": "Lawyers and accountants may not claim the exclusion if they advertise their investment advisory or financial planning services or if they charge a separate fee for such services."}, {"n": 26, "q": "The agreement that the Administrator can receive subpoenas on behalf of a registered agent, broker-dealer, or investment adviser involved in any securities sale that violates the Uniform Securities Act is", "a": "the agreement to actionable offenses.", "b": "the right of retribution.", "c": "the right of rescission.", "d": "the consent to service of process.", "e": "Every applicant for registration and every issuer must file an irrevocable consent to service of process appointing the Administrator as attorney to receive service of any lawful process in any civil suit, action, or proceeding."}, {"n": 27, "q": "Under the Securities Act of 1933, the term person would not refer to which of the following?", "a": "A deceased individual", "b": "A subdivision of a government", "c": "A nonprofit, charitable corporation", "d": "An unincorporated amateur athletic club", "e": "There are three specific nonpersons on this exam. They are (1) deceased individuals, (2) individuals declared mentally incompetent, and (3) minors."}, {"n": 28, "q": "Under the Investment Advisers Act of 1940, the exclusion for providing investment advice that is solely incidental to the practice of a profession is available to all of the following EXCEPT:", "a": "attorneys.", "b": "economists.", "c": "accountants.", "d": "teachers.", "e": "An exclusion from the definition of an investment adviser is given to engineers, teachers, lawyers, and accountants whose advice is incidental to their normal profession and who do not charge fees for the advice. Economists are not eligible for this exclusion."}, {"n": 29, "q": "To register a sole proprietorship as an investment adviser in a state, the application for initial registration (Form ADV) must be filed with the appropriate party. This application must include all of the following except", "a": "the appropriate fees.", "b": "a copy of the articles of incorporation for the business.", "c": "any information to be furnished or disseminated to any client or prospective client.", "d": "a consent to service of process.", "e": "Articles of incorporation only apply to corporations. Sole proprietorships are not incorporated."}, {"n": 30, "q": "Registering with a state Administrator is required for which of these?\nI. An adviser who only provides impersonal investment advice through newspaper columns, magazine articles, or financial publications of general and regular circulation\nII. Investment adviser representatives of federal registered advisers who have natural person clients and have a place of business in the state\nIII. An investment adviser who has no place of business in the state and has five advisory clients in the state\nIV. A person who is an officer of a federal registered investment adviser who has no natural person clients", "a": "II only", "b": "I only", "c": "II and III", "d": "I, II, III, and IV", "e": "The investment adviser representatives of a federal registered adviser are required to register in each state in which they have a place of business. The de minimis exemption allows fewer than 6 clients without registration."}, {"n": 31, "q": "Which of the following persons does not meet the definition of providing investment advice as a business outlined in SEC Release IA-1092?", "a": "A management consultant whose only investment advice is suggesting to a couple of small-business clients who had invested their surpluses in speculative securities that they should find something less risky", "b": "An attorney who advertises the availability of investment advice", "c": "A financial planner who provides specific investment advice as part of his fee-based services and also makes specific securities recommendations to his clients in his capacity as an agent for a broker-dealer", "d": "An accountant who charges clients an additional fee for providing investment advice", "e": "The management consultant's advice to clients is more like personal opinion than investment advice as a business. In the other choices, investment advice is offered as part of the individual's regular business."}, {"n": 32, "q": "The Uniform Securities Act would not provide an exemption from registration as an investment adviser to an investment adviser who", "a": "is an out-of-state investment adviser and directed business communications to fewer than 12 clients in the state in the past 12-month period.", "b": "has no place of business in the state and limits clientele to other investment advisers.", "c": "has no place of business in the state and limits clientele to broker-dealers.", "d": "has no place of business in the state and limits clientele to banks and insurance companies.", "e": "There is a de minimis exemption, but it is for no more than 5 (not 12) clients during a 12-month period."}, {"n": 33, "q": "State laws provide for exclusions from the definition of investment adviser. Which of the following persons are specifically excluded under the Uniform Securities Act?", "a": "Investment adviser representatives", "b": "Economists whose advice is strictly incidental to their professional activity", "c": "Broker-dealers receiving special compensation", "d": "Bank subsidiaries offering investment advice", "e": "The USA specifically excludes IARs from its definition of investment adviser. Excluded are banks but not subsidiaries offering investment advice. Once broker-dealers receive special compensation, they lose their exclusion."}, {"n": 34, "q": "The term private fund, as defined under federal and state law, would not apply to", "a": "an issuer that would be an investment company, as defined in Section 3 of the Investment Company Act of 1940, but for section 3(c)(1) or 3(c)(7) of that act.", "b": "a leveraged ETF.", "c": "a hedge fund.", "d": "a venture capital fund.", "e": "ETFs are publicly traded. Hedge funds and venture capital funds meet the definition of a private fund."}, {"n": 35, "q": "Martin holds both the CPA and the CFP designations. Within the previous year, if he has provided portfolio advice to approximately 40 clients, is Martin required to register as an investment adviser?", "a": "Yes, because he could receive commission income from investment clients.", "b": "Yes, because he provides investment advice on a more-than-incidental basis.", "c": "No, because he is a CPA.", "d": "No, because he falls under the de minimis exemption having relatively few clients.", "e": "Although Martin is an accountant, he provides investment advice on a more-than-incidental basis (typically regarded as more than 10 client contacts per year)."}, {"n": 36, "q": "An investment adviser is eligible to register with the SEC if it", "a": "has more than 100 investment adviser representatives.", "b": "would be required to register in at least 10 different states.", "c": "anticipates acquiring at least $100 million in assets under management within the next 120 days.", "d": "has rendered advice to more than 5 retail clients during the most recent 12-month period.", "e": "IAs must have at least $100 million in AUM in order to register with the SEC. If it is reasonable to expect reaching that level within the next 120 days, SEC registration is allowable now."}, {"n": 37, "q": "The Investment Advisers Act of 1940 would consider each of the following investment advisers to be exempt from registration except", "a": "an adviser whose only clients are venture capital funds.", "b": "an adviser whose only clients are insurance companies.", "c": "an adviser who maintains an office in only one state, advises only residents of that state (none of whom is a private fund), and gives advice relating solely to securities not traded on any national exchange.", "d": "an adviser whose only clients are banks.", "e": "Advising only banks does not qualify one for the exemption. Advisers who only service insurance companies or venture capital funds are exempt, as are advisers performing intrastate who do not give advice to private funds or on listed securities."}, {"n": 38, "q": "Under the Investment Advisers Act of 1940, which of the following criteria are considered in determining whether a person is in the business of rendering investment advice?\nI. The person regularly gives advice on securities.\nII. The person derives his earnings from executing transactions on recommended securities.\nIII. The person receives compensation from rendering advice on securities.", "a": "I, II, and III", "b": "I and III", "c": "II and III", "d": "I and II", "e": "To be in the business of rendering investment advice, a person must regularly provide advice about securities and must be compensated for giving such advice. Those whose earnings are based on securities transactions are broker-dealers and/or agents."}, {"n": 39, "q": "The term federal covered investment adviser would apply to a person who", "a": "limits the advice offered strictly to securities issued or guaranteed by the U.S. government or one of its political subdivisions.", "b": "limits the advice offered strictly to securities listed on the New York Stock Exchange (NYSE).", "c": "is registered as such under the Investment Company Act of 1940.", "d": "is registered as such under the Investment Advisers Act of 1940.", "e": "Only federal covered investment advisers register under the Investment Advisers Act of 1940."}, {"n": 40, "q": "Kapco Investment Advisers currently has $18 million in assets under management and has offices in Colorado and Utah. Kapco's only clients in Utah are two insurance companies domiciled in that state. Kapco has no office in Washington but does service the accounts of three middle-class individuals. Kapco recently opened an advisory account for a pension plan for a corporation located in Montana. Under the Uniform Securities Act, Kapco would have to register with the Administrator in which states?\nI. Colorado\nII. Montana\nIII. Utah\nIV. Washington", "a": "I and III", "b": "I and IV", "c": "I and II", "d": "III and IV", "e": "With less than $100 million in AUM, Kapco must register in each state in which it maintains an office, regardless of clientele. Registration would not be required in Washington (de minimis) or Montana (only institutional client)."}, {"n": 41, "q": "Create A Large Legacy, Inc., (CALL) is a state-registered investment adviser with offices in States X, Y, and Z. CALL currently does not have a place of business in State W but does have five retail clients who are residents there. Opening an account for which of the following prospective clients domiciled in State W would now require CALL to register in State W?", "a": "An insurance company account with an opening balance of $750,000", "b": "A small community bank depositing $500,000", "c": "A trust having four minor children as beneficiaries with total trust assets of $5 million", "d": "A county in State W desiring advice on investment over $250,000 of surplus funds", "e": "A trust account, unless one for an employee benefit plan with at least $1 million in assets, is considered a retail rather than institutional client. Once the investment adviser goes over the de minimis limit of five, registration with the state is required."}, {"n": 42, "q": "All of the following have legal standing as persons under the Uniform Securities Act except", "a": "minor children.", "b": "unincorporated organizations.", "c": "joint-stock companies.", "d": "trusts where the interests of the beneficiaries are evidenced by a security.", "e": "The definition of a person under the act includes, among others, individuals, joint-stock companies, unincorporated organizations, and trusts where the interests of the beneficiaries are evidenced by a security. Minor children are not persons under the act."}, {"n": 43, "q": "All of the following statements regarding the registration of an investment adviser in a state are true except", "a": "the initial application must include a consent to service of process along with Form ADV and the appropriate fees.", "b": "the adviser's registration expires on December 31 each year.", "c": "if the investment adviser is not an individual, any officer or partner active in the advisory business is automatically registered as an investment adviser representative.", "d": "the annual renewal process involves payment of the appropriate fees and refiling of the consent to service of process.", "e": "The consent to service is a permanent document that remains on file with the Administrator; it need not be resubmitted for yearly renewal."}, {"n": 44, "q": "Under the Uniform Security Act, all of the following persons with no place of business in the state are exempt from registration as an investment advisers EXCEPT:", "a": "advisers who deal exclusively with federal covered investment advisers located in the state.", "b": "advisers who have conducted business with no more than 6 individual clients in the state within the last 12 months.", "c": "advisers who deal exclusively with savings banks located in the state.", "d": "advisers who deal exclusively with investment companies regist

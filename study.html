elps offset lost revenue, recruitment costs, and business disruption."}, {"n": 42, "q": "A buy-sell agreement funded by life insurance", "a": "allows an employee to purchase additional company stock at a discount.", "b": "provides funds for surviving business owners to purchase a deceased owner's interest in the business.", "c": "is used to fund employee retirement benefits.", "d": "eliminates the need for a business valuation.", "e": "A buy-sell agreement funded by life insurance provides the surviving business owners or the business itself with funds to purchase the deceased owner's interest. This ensures a smooth transition of ownership and provides the deceased owner's heirs with fair compensation for the business interest."}, {"n": 43, "q": "Split-dollar life insurance is an arrangement in which", "a": "two insurance companies share the risk of insuring one individual.", "b": "the premium costs and policy benefits are shared between an employer and an employee.", "c": "the death benefit is split equally among all beneficiaries.", "d": "the cash value is divided between two separate accounts.", "e": "Split-dollar life insurance is an arrangement in which the premium costs and policy benefits (cash value and death benefit) are shared between an employer and an employee. The employer typically pays most of the premium, and the arrangement provides an executive benefit while the employer recovers its costs from the cash value or death benefit."}, {"n": 44, "q": "Indexed universal life insurance provides cash value growth linked to", "a": "a fixed interest rate guaranteed by the insurer.", "b": "the performance of a stock market index, with a floor protecting against losses.", "c": "the performance of a separate account of mutual funds.", "d": "the federal funds rate.", "e": "Indexed universal life (IUL) insurance provides cash value growth linked to the performance of a stock market index, with a guaranteed floor (typically 0-1%) that protects against losses. It offers upside potential linked to market performance while providing downside protection, combined with the premium flexibility of universal life."}, {"n": 45, "q": "Which of the following is NOT a standard provision in a life insurance policy?", "a": "Grace period for late premium payments", "b": "Incontestability clause after 2 years", "c": "Guaranteed investment returns", "d": "Beneficiary designation", "e": "Guaranteed investment returns are not a standard provision of life insurance policies. Standard provisions include a grace period for late premiums, an incontestability clause (typically after 2 years, the insurer cannot contest the policy based on misstatements in the application), and beneficiary designation."}]}, {"id": 22, "name": "Unit 22: Quantitative Methods and Performance Measures", "key": "BBBCCCBCBBBBBDCBBBBBBBCBBCBBBBBCCCACBBABBBABCBCB", "questions": [{"n": 1, "q": "Holding period return is calculated by", "a": "dividing annual income by the initial investment.", "b": "adding income received plus the change in value, then dividing by the initial investment.", "c": "dividing the ending value by the beginning value.", "d": "subtracting the risk-free rate from the total return.", "e": "Holding period return (HPR) measures the total return on an investment over the period it was held. It is calculated as: HPR = (Income + Capital Gain or Loss) / Initial Investment. It includes all sources of return—income received plus any change in value."}, {"n": 2, "q": "An investor purchased a stock at $40, received $3 in dividends, and sold it one year later for $46. The holding period return is", "a": "15.0%.", "b": "22.5%.", "c": "7.5%.", "d": "10.0%.", "e": "HPR = (Dividends + Capital Gain) / Purchase Price = ($3 + $6) / $40 = $9 / $40 = 22.5%. The investor received $3 in dividends and had a $6 capital gain ($46 - $40)."}, {"n": 3, "q": "Time-weighted return is the preferred method for evaluating portfolio manager performance because it", "a": "gives greater weight to periods when more money was invested.", "b": "eliminates the impact of external cash flows into and out of the portfolio.", "c": "always produces a higher return than dollar-weighted return.", "d": "accounts for the timing of the investor's contributions.", "e": "Time-weighted return eliminates the impact of external cash flows (deposits and withdrawals) that are beyond the portfolio manager's control. This makes it the fairest measure of a manager's investment skill because it isolates the return generated by the manager's decisions."}, {"n": 4, "q": "Dollar-weighted return is most similar to", "a": "time-weighted return.", "b": "geometric mean return.", "c": "internal rate of return (IRR).", "d": "arithmetic mean return.", "e": "Dollar-weighted return is most similar to the internal rate of return (IRR). Both measures account for the timing and size of cash flows, reflecting the actual return earned by the investor. This differs from time-weighted return, which ignores cash flow timing."}, {"n": 5, "q": "Which return measure is most affected by the timing and size of cash flows?", "a": "Time-weighted return", "b": "Geometric mean return", "c": "Dollar-weighted return", "d": "Annualized return", "e": "Dollar-weighted return (IRR) is the most affected by the timing and size of cash flows. If an investor adds money just before a period of strong performance, the dollar-weighted return will be higher than the time-weighted return, and vice versa."}, {"n": 6, "q": "The real rate of return adjusts the nominal rate of return for", "a": "taxes.", "b": "commissions.", "c": "inflation.", "d": "currency fluctuations.", "e": "The real rate of return adjusts the nominal (stated) rate of return for the effects of inflation. It represents the actual increase in purchasing power. The approximate formula is: Real Return ≈ Nominal Return - Inflation Rate."}, {"n": 7, "q": "An investment earned a nominal return of 10% during a period when inflation was 4%. The approximate real rate of return was", "a": "14%.", "b": "6%.", "c": "2.5%.", "d": "40%.", "e": "Using the approximation: Real Return ≈ Nominal Return - Inflation Rate = 10% - 4% = 6%. This represents the investor's actual increase in purchasing power after accounting for the erosion caused by inflation."}, {"n": 8, "q": "After-tax return is calculated by", "a": "multiplying the pre-tax return by the investor's tax rate.", "b": "subtracting the tax rate from the pre-tax return.", "c": "multiplying the pre-tax return by (1 minus the tax rate).", "d": "dividing the pre-tax return by the tax rate.", "e": "After-tax return is calculated by multiplying the pre-tax return by (1 minus the investor's marginal tax rate). This removes the portion of the return that goes to taxes, showing what the investor actually keeps."}, {"n": 9, "q": "An investor in the 24% marginal tax bracket earns an 8% return on a taxable investment. The after-tax return is", "a": "1.92%.", "b": "6.08%.", "c": "5.76%.", "d": "3.20%.", "e": "After-tax return = Pre-tax return × (1 - tax rate) = 8% × (1 - 0.24) = 8% × 0.76 = 6.08%. The investor keeps 76 cents of every dollar earned after paying 24% in taxes."}, {"n": 10, "q": "The tax-equivalent yield of a municipal bond is calculated by", "a": "multiplying the municipal yield by (1 minus the tax rate).", "b": "dividing the municipal yield by (1 minus the tax rate).", "c": "subtracting the tax rate from the municipal yield.", "d": "dividing the taxable yield by the municipal yield.", "e": "Tax-equivalent yield = Municipal yield / (1 - tax rate). This formula converts a tax-exempt municipal bond yield to the equivalent yield a taxable investment would need to provide to offer the same after-tax return."}, {"n": 11, "q": "A municipal bond yields 3.5%. For an investor in the 35% federal tax bracket, the tax-equivalent yield is approximately", "a": "2.28%.", "b": "5.38%.", "c": "4.85%.", "d": "1.23%.", "e": "Tax-equivalent yield = 3.5% / (1 - 0.35) = 3.5% / 0.65 = 5.38%. A taxable investment would need to yield approximately 5.38% to match the after-tax benefit of the 3.5% tax-exempt municipal bond for this investor."}, {"n": 12, "q": "Current yield on a bond is calculated by dividing", "a": "the coupon rate by the par value.", "b": "the annual coupon payment by the current market price.", "c": "the yield to maturity by 2.", "d": "the par value by the years to maturity.", "e": "Current yield is calculated by dividing the annual coupon payment (in dollars) by the bond's current market price. It measures the income component of the bond's return based on its current price, not its par value."}, {"n": 13, "q": "A bond with a 5% coupon rate and a par value of $1,000 is currently trading at $950. The current yield is approximately", "a": "5.00%.", "b": "5.26%.", "c": "4.75%.", "d": "5.50%.", "e": "Annual coupon = 5% × $1,000 = $50. Current yield = $50 / $950 = 5.26%. Because the bond is trading below par (at a discount), the current yield is higher than the coupon rate."}, {"n": 14, "q": "Yield to maturity (YTM) takes into account all of the following EXCEPT", "a": "coupon payments.", "b": "the current market price.", "c": "any capital gain or loss at maturity.", "d": "the investor's marginal tax rate.", "e": "Yield to maturity accounts for coupon payments, the current market price, and any capital gain or loss if the bond is held to maturity. It does not account for the investor's marginal tax rate—that would be reflected in an after-tax yield calculation."}, {"n": 15, "q": "A bond purchased at a discount and held to maturity will have a yield to maturity that is", "a": "equal to the coupon rate.", "b": "less than the coupon rate.", "c": "greater than the coupon rate.", "d": "equal to zero.", "e": "A bond purchased at a discount (below par) will have a YTM greater than the coupon rate because the investor receives both the coupon payments AND a capital gain when the bond matures at par. The capital gain component increases the total yield above the coupon rate."}, {"n": 16, "q": "A bond purchased at a premium and held to maturity will have a yield to maturity that is", "a": "equal to the coupon rate.", "b": "less than the coupon rate.", "c": "greater than the coupon rate.", "d": "equal to the current yield.", "e": "A bond purchased at a premium (above par) will have a YTM less than the coupon rate because the investor suffers a capital loss when the bond matures at par. The capital loss reduces the total yield below the coupon rate."}, {"n": 17, "q": "Yield to call (YTC) is most relevant for", "a": "bonds trading at a discount.", "b": "bonds trading at a premium that are callable.", "c": "zero-coupon bonds.", "d": "Treasury bills.", "e": "Yield to call is most relevant for callable bonds trading at a premium because these bonds are most likely to be called by the issuer. When interest rates decline, issuers call high-coupon bonds to refinance at lower rates. Investors should calculate YTC to understand the worst-case return scenario."}, {"n": 18, "q": "The Sharpe ratio measures", "a": "excess return per unit of systematic risk.", "b": "excess return per unit of total risk (standard deviation).", "c": "the portfolio's alpha.", "d": "the correlation between the portfolio and the market.", "e": "The Sharpe ratio measures excess return (return above the risk-free rate) per unit of total risk as measured by standard deviation. It evaluates risk-adjusted performance considering both systematic and unsystematic risk."}, {"n": 19, "q": "The Sharpe ratio is calculated as", "a": "(Portfolio Return - Risk-Free Rate) / Beta.", "b": "(Portfolio Return - Risk-Free Rate) / Standard Deviation.", "c": "(Portfolio Return - Market Return) / Standard Deviation.", "d": "Alpha / Beta.", "e": "Sharpe ratio = (Portfolio Return - Risk-Free Rate) / Standard Deviation. A higher Sharpe ratio indicates better risk-adjusted performance—the portfolio is generating more return for each unit of total risk taken."}, {"n": 20, "q": "A portfolio with a return of 14%, a standard deviation of 20%, and a risk-free rate of 4% has a Sharpe ratio of", "a": "0.70.", "b": "0.50.", "c": "1.40.", "d": "2.00.", "e": "Sharpe ratio = (14% - 4%) / 20% = 10% / 20% = 0.50. This means the portfolio earned 0.50 percentage points of excess return for each percentage point of standard deviation (total risk)."}, {"n": 21, "q": "The Treynor ratio differs from the Sharpe ratio in that the Treynor ratio uses", "a": "standard deviation as its risk measure.", "b": "beta (systematic risk) as its risk measure instead of standard deviation.", "c": "alpha as its risk measure.", "d": "the market return as its denominator.", "e": "The Treynor ratio uses beta (systematic risk) as its risk measure, while the Sharpe ratio uses standard deviation (total risk). The Treynor ratio is most appropriate for evaluating well-diversified portfolios where unsystematic risk has been largely eliminated."}, {"n": 22, "q": "The Treynor ratio is calculated as", "a": "(Portfolio Return - Risk-Free Rate) / Standard Deviation.", "b": "(Portfolio Return - Risk-Free Rate) / Beta.", "c": "(Portfolio Return - Market Return) / Beta.", "d": "Alpha / Standard Deviation.", "e": "Treynor ratio = (Portfolio Return - Risk-Free Rate) / Beta. A higher Treynor ratio indicates better risk-adjusted performance relative to the portfolio's systematic risk exposure."}, {"n": 23, "q": "Alpha represents", "a": "the portfolio's total risk.", "b": "the portfolio's systematic risk.", "c": "the difference between actual return and expected return based on risk.", "d": "the risk-free rate of return.", "e": "Alpha measures the difference between a portfolio's actual return and its expected return based on its level of risk (as measured by beta and CAPM). It represents the value added or subtracted by the portfolio manager's investment decisions."}, {"n": 24, "q": "A portfolio with a positive alpha has", "a": "underperformed its expected return given its risk.", "b": "outperformed its expected return given its risk.", "c": "a beta greater than 1.0.", "d": "more total risk than the market.", "e": "A positive alpha indicates the portfolio outperformed its expected return given its level of risk. The manager added value through superior security selection or market timing beyond what the portfolio's beta would predict."}, {"n": 25, "q": "A portfolio with a negative alpha has", "a": "outperformed the market.", "b": "underperformed its expected return given its risk.", "c": "a beta less than zero.", "d": "lower risk than a risk-free asset.", "e": "A negative alpha indicates the portfolio underperformed its expected return given its level of risk. The manager detracted value—the portfolio earned less than what investors should expect given the amount of systematic risk taken."}, {"n": 26, "q": "Beta measures", "a": "total risk of a portfolio.", "b": "the excess return of a portfolio.", "c": "systematic risk (volatility relative to the market).", "d": "the portfolio manager's stock selection ability.", "e": "Beta measures systematic risk—the volatility of a security or portfolio relative to the overall market. A beta of 1.0 means the security moves in line with the market, greater than 1.0 means more volatile, and less than 1.0 means less volatile."}, {"n": 27, "q": "A stock with a beta of 1.0 would be expected to", "a": "be twice as volatile as the market.", "b": "move in line with the market.", "c": "move in the opposite direction of the market.", "d": "have no systematic risk.", "e": "A stock with a beta of 1.0 is expected to move in line with the market. If the market rises 10%, the stock is expected to rise approximately 10%. If the market falls 10%, the stock is expected to fall approximately 10%."}, {"n": 28, "q": "A stock with a beta of 0.5 would be expected to", "a": "be twice as volatile as the market.", "b": "be half as volatile as the market.", "c": "move in the opposite direction of the market.", "d": "have a return equal to the risk-free rate.", "e": "A stock with a beta of 0.5 is expected to be half as volatile as the market. If the market rises 10%, the stock would be expected to rise approximately 5%. This lower volatility indicates less systematic risk."}, {"n": 29, "q": "Standard deviation measures", "a": "only the systematic risk of a security.", "b": "the total risk (both systematic and unsystematic) of a security or portfolio.", "c": "the excess return above the risk-free rate.", "d": "the correlation between two securities.", "e": "Standard deviation measures total risk—the dispersion or variability of returns around the mean (average) return. It captures both systematic risk (market-related) and unsystematic risk (company-specific), making it a comprehensive measure of total risk."}, {"n": 30, "q": "A higher standard deviation indicates", "a": "lower risk and more predictable returns.", "b": "greater variability of returns and higher total risk.", "c": "better risk-adjusted performance.", "d": "a more efficient portfolio.", "e": "A higher standard deviation indicates greater variability in returns, meaning the actual returns are more spread out from the average. This represents higher total risk because there is more uncertainty about what the investment will return."}, {"n": 31, "q": "In a normal distribution, approximately what percentage of returns fall within one standard deviation of the mean?", "a": "50%.", "b": "68%.", "c": "95%.", "d": "99%.", "e": "In a normal distribution, approximately 68% of all observations fall within one standard deviation of the mean (34% above and 34% below). This is a fundamental statistical concept used in risk measurement."}, {"n": 32, "q": "In a normal distribution, approximately what percentage of returns fall within two standard deviations of the mean?", "a": "68%.", "b": "90%.", "c": "95%.", "d": "99%.", "e": "In a normal distribution, approximately 95% of all observations fall within two standard deviations of the mean. This means there is only about a 5% chance that returns will fall outside this range (2.5% on each tail)."}, {"n": 33, "q": "The correlation coefficient ranges from", "a": "0 to 1.", "b": "0 to 100.", "c": "-1 to +1.", "d": "-100 to +100.", "e": "The correlation coefficient ranges from -1.0 to +1.0. A value of +1.0 indicates perfect positive correlation, -1.0 indicates perfect negative correlation, and 0 indicates no linear correlation between the two variables."}, {"n": 34, "q": "A correlation coefficient of +1.0 between two securities indicates that they", "a": "move in exactly opposite directions.", "b": "have no relationship.", "c": "move in perfect tandem.", "d": "are risk free.", "e": "A correlation of +1.0 means the two securities move in perfect tandem—when one goes up, the other goes up by a proportional amount. This provides no diversification benefit because both securities respond identically to market forces."}, {"n": 35, "q": "A correlation coefficient of -1.0 between two securities indicates that they", "a": "move in exactly opposite directions, providing maximum diversification benefit.", "b": "are perfectly correlated.", "c": "have no relationship to each other.", "d": "both have negative returns.", "e": "A correlation of -1.0 means the two securities move in exactly opposite directions. When one goes up, the other goes down by a proportional amount. This provides the maximum diversification benefit and, in theory, could eliminate portfolio risk entirely."}, {"n": 36, "q": "A correlation coefficient of 0 between two securities indicates", "a": "they move in perfect tandem.", "b": "they move in opposite directions.", "c": "there is no linear relationship between their returns.", "d": "one security has no risk.", "e": "A correlation coefficient of 0 indicates no linear relationship between the returns of the two securities. Their movements are independent of each other. Adding securities with zero or low correlation to a portfolio provides diversification benefits."}, {"n": 37, "q": "The efficient frontier represents", "a": "the set of portfolios with the lowest possible fees.", "b": "the set of portfolios offering the highest expected return for each level of risk.", "c": "the boundary between taxable and tax-exempt investments.", "d": "a single portfolio with zero risk.", "e": "The efficient frontier is the set of optimal portfolios that offer the highest expected return for each given level of risk, or equivalently, the lowest risk for a given expected return. Portfolios below the efficient frontier are suboptimal because they offer less return for the same risk."}, {"n": 38, "q": "The capital asset pricing model (CAPM) calculates expected return using the formula", "a": "Expected Return = Alpha + Beta.", "b": "Expected Return = Risk-Free Rate + Beta × (Market Return - Risk-Free Rate).", "c": "Expected Return = Standard Deviation × Market Return.", "d": "Expected Return = (Portfolio Return - Risk-Free Rate) / Beta.", "e": "The CAPM formula is: Expected Return = Risk-Free Rate + Beta × (Market Return - Risk-Free Rate). The term (Market Return - Risk-Free Rate) is called the market risk premium, and beta scales this premium based on the security's systematic risk."}, {"n": 39, "q": "According to CAPM, a security with a beta of 1.5, a risk-free rate of 3%, and a market return of 10% would have an expected return of", "a": "13.5%.", "b": "15.0%.", "c": "10.5%.", "d": "7.5%.", "e": "Expected Return = 3% + 1.5 × (10% - 3%) = 3% + 1.5 × 7% = 3% + 10.5% = 13.5%. The risk-free rate provides the baseline, and the beta-adjusted market risk premium adds compensation for the security's systematic risk."}, {"n": 40, "q": "The security market line (SML) plots the relationship between", "a": "a portfolio's total risk and its expected return.", "b": "a security's beta and its expected return.", "c": "a security's standard deviation and its alpha.", "d": "the risk-free rate and the market return.", "e": "The security market line (SML) plots the relationship between a security's beta (systematic risk) and its expected return. Securities plotting above the SML are undervalued (positive alpha), while those below are overvalued (negative alpha)."}, {"n": 41, "q": "The capital market line (CML) differs from the security market line (SML) in that the CML", "a": "uses beta as its risk measure.", "b": "plots expected return against total risk (standard deviation) for efficient portfolios.", "c": "is used to evaluate individual securities.", "d": "applies only to bonds.", "e": "The CML plots expected return against total risk (standard deviation) for efficient portfolios only, while the SML plots expected return against systematic risk (beta) for all securities and portfolios. The CML uses standard deviation; the SML uses beta."}, {"n": 42, "q": "R-squared (coefficient of determination) measures", "a": "the total return of a portfolio.", "b": "the percentage of a portfolio's movements explained by movements in the benchmark index.", "c": "the excess return generated by the manager.", "d": "the portfolio's standard deviation.", "e": "R-squared (coefficient of determination) measures the percentage of a portfolio's return variability that can be explained by the variability of the benchmark index. It indicates how closely the portfolio tracks the benchmark and ranges from 0 to 1.0 (or 0% to 100%)."}, {"n": 43, "q": "A portfolio with an R-squared of 0.95 indicates that", "a": "95% of the portfolio's movements can be explained by movements in the benchmark.", "b": "the portfolio earned a 95% return.", "c": "the portfolio has 95% less risk than the benchmark.", "d": "5% of the portfolio is invested in the benchmark.", "e": "An R-squared of 0.95 means that 95% of the portfolio's return movements can be explained by movements in the benchmark index. Only 5% of the portfolio's variability is due to factors other than the benchmark, indicating the portfolio closely tracks its benchmark."}, {"n": 44, "q": "When R-squared is high (close to 1.0), which performance measure is most appropriate?", "a": "Sharpe ratio", "b": "Treynor ratio", "c": "Standard deviation alone", "d": "None of the above", "e": "When R-squared is high (close to 1.0), the portfolio closely tracks its benchmark, meaning beta is a reliable measure of risk. In this case, the Treynor ratio (which uses beta) is most appropriate because beta accurately captures the portfolio's risk exposure."}, {"n": 45, "q": "When R-squared is low, which performance measure is most appropriate?", "a": "Treynor ratio", "b": "Alpha", "c": "Sharpe ratio", "d": "Beta", "e": "When R-squared is low, beta is not a reliable measure of the portfolio's risk because the portfolio does not closely track the benchmark. In this case, the Sharpe ratio (which uses standard deviation/total risk) is more appropriate because it does not depend on the relationship to a benchmark."}, {"n": 46, "q": "The information ratio measures", "a": "the portfolio's total return.", "b": "the portfolio's active return relative to a benchmark divided by the tracking error.", "c": "the risk-free rate.", "d": "the portfolio's beta.", "e": "The information ratio measures the portfolio's active return (the difference between the portfolio's return and the benchmark's return) divided by the tracking error (the standard deviation of the active return). It evaluates how consistently a manager outperforms the benchmark."}, {"n": 47, "q": "Duration measures a bond's sensitivity to changes in", "a": "the issuer's credit rating.", "b": "the stock market.", "c": "interest rates.", "d": "inflation.", "e": "Duration measures a bond's price sensitivity to changes in interest rates. It estimates the percentage change in a bond's price for a 1% change in interest rates. Higher duration means greater interest rate sensitivity."}, {"n": 48, "q": "A bond with a duration of 6 years would be expected to decline in price by approximately what percentage if interest rates rise by 1%?", "a": "3%.", "b": "6%.", "c": "12%.", "d": "1%.", "e": "A bond with a duration of 6 years would be expected to decline in price by approximately 6% if interest rates rise by 1%. Duration provides a linear approximation of price sensitivity: % Price Change ≈ -Duration × Change in Yield."}]}, {"id": 23, "name": "Unit 23: Options, Derivatives, and Alternative Investments", "key": "BBBBBCBCCCBBCDCCBBBBBCBBCBABBBBDBBBCBBCDBBBBDCBC", "questions": [{"n": 1, "q": "A call option gives the holder the right to", "a": "sell the underlying security at the strike price.", "b": "buy the underlying security at the strike price.", "c": "receive dividends from the underlying security.", "d": "vote on corporate matters.", "e": "A call option gives the holder (buyer) the right, but not the obligation, to buy the underlying security at the strike price before or on the expiration date. The holder pays a premium for this right."}, {"n": 2, "q": "A put option gives the holder the right to", "a": "buy the underlying security at the strike price.", "b": "sell the underlying security at the strike price.", "c": "convert the option into shares of common stock.", "d": "receive interest payments.", "e": "A put option gives the holder (buyer) the right, but not the obligation, to sell the underlying security at the strike price before or on the expiration date. Put options are used for hedging or speculating on price declines."}, {"n": 3, "q": "An investor who purchases a call option is considered", "a": "bearish on the underlying security.", "b": "bullish on the underlying security.", "c": "neutral on the market.", "d": "hedging a long position.", "e": "An investor who buys a call option is bullish—they expect the price of the underlying security to rise above the strike price, allowing them to buy at a lower price. They profit when the stock price exceeds the strike price plus the premium paid."}, {"n": 4, "q": "An investor who purchases a put option is considered", "a": "bullish on the underlying security.", "b": "bearish on the underlying security.", "c": "neutral on the market.", "d": "writing a covered call.", "e": "An investor who buys a put option is bearish—they expect the price of the underlying security to decline below the strike price, allowing them to sell at a higher price. They profit when the stock price falls below the strike price minus the premium paid."}, {"n": 5, "q": "The premium of an option is", "a": "the strike price.", "b": "the price paid by the buyer to the seller for the option contract.", "c": "the commission charged by the broker.", "d": "the difference between the market price and the strike price.", "e": "The premium is the price paid by the option buyer to the option seller (writer) for the rights conveyed by the option contract. It represents the cost of the option and is the maximum amount the buyer can lose."}, {"n": 6, "q": "The strike price (exercise price) of an option is", "a": "the market price of the underlying security.", "b": "the price at which the option was purchased.", "c": "the predetermined price at which the underlying security can be bought or sold.", "d": "the premium paid for the option.", "e": "The strike price (exercise price) is the predetermined price at which the holder of the option can buy (call) or sell (put) the underlying security. It is fixed at the time the option contract is created and does not change during the life of the option."}, {"n": 7, "q": "An option contract is said to be in the money when", "a": "the holder has paid the premium.", "b": "exercising the option would be profitable (before considering the premium).", "c": "the option has expired.", "d": "the premium equals the strike price.", "e": "An option is in the money when exercising it would result in a positive cash flow (before considering the premium paid). For calls, this means the market price is above the strike price. For puts, this means the market price is below the strike price."}, {"n": 8, "q": "A call option with a strike price of $50 when the underlying stock is trading at $55 is", "a": "out of the money.", "b": "at the money.", "c": "in the money by $5.", "d": "worthless.", "e": "A call option is in the money when the market price of the underlying stock exceeds the strike price. Here, the stock is trading at $55, which is $5 above the $50 strike price, so the call is in the money by $5 (its intrinsic value)."}, {"n": 9, "q": "A put option with a strike price of $60 when the underlying stock is trading at $55 is", "a": "out of the money.", "b": "at the money.", "c": "in the money by $5.", "d": "in the money by $60.", "e": "A put option is in the money when the market price of the underlying stock is below the strike price. Here, the stock is trading at $55, which is $5 below the $60 strike price, so the put is in the money by $5 (its intrinsic value)."}, {"n": 10, "q": "A call option with a strike price of $40 when the underlying stock is trading at $35 is", "a": "in the money by $5.", "b": "at the money.", "c": "out of the money.", "d": "automatically exercised.", "e": "A call option is out of the money when the market price is below the strike price. Here, the stock is at $35, which is $5 below the $40 strike price. Exercising would not be profitable, so the option has no intrinsic value."}, {"n": 11, "q": "The intrinsic value of an in-the-money call option is calculated as", "a": "strike price minus market price.", "b": "market price minus strike price.", "c": "premium minus strike price.", "d": "market price minus premium.", "e": "The intrinsic value of a call option equals the market price minus the strike price (when positive). It represents the immediate economic value of exercising the option. If the market price is below the strike price, intrinsic value is zero (not negative)."}, {"n": 12, "q": "The time value of an option is the portion of the premium that", "a": "represents the intrinsic value.", "b": "exceeds the intrinsic value, reflecting the possibility the option will become more valuable before expiration.", "c": "is returned to the buyer at expiration.", "d": "equals the strike price.", "e": "Time value is the portion of an option's premium that exceeds its intrinsic value. It reflects the possibility that the option could become more valuable before expiration due to favorable price movements. Time value = Premium - Intrinsic Value."}, {"n": 13, "q": "As an option approaches its expiration date, the time value", "a": "increases.", "b": "remains constant.", "c": "decreases (time decay).", "d": "becomes equal to the intrinsic value.", "e": "As an option approaches expiration, its time value decreases—a phenomenon known as time decay (theta). All else being equal, options lose time value as expiration nears because there is less time for the underlying asset to move favorably. At expiration, time value is zero."}, {"n": 14, "q": "The maximum loss for the buyer of a call option is", "a": "unlimited.", "b": "the strike price.", "c": "the market price of the underlying stock.", "d": "the premium paid.", "e": "The maximum loss for the buyer of a call option is limited to the premium paid. If the stock price never rises above the strike price, the call expires worthless and the buyer loses only the premium. This is a key advantage of options—limited, defined risk for the buyer."}, {"n": 15, "q": "The maximum gain for the buyer of a call option is", "a": "limited to the premium paid.", "b": "limited to the strike price.", "c": "theoretically unlimited.", "d": "limited to the intrinsic value at purchase.", "e": "The maximum gain for a call buyer is theoretically unlimited because there is no upper limit to how high the underlying stock's price can rise. The profit equals the stock price minus the strike price minus the premium paid."}, {"n": 16, "q": "The maximum loss for the buyer of a put option is", "a": "unlimited.", "b": "the strike price minus the premium.", "c": "the premium paid.", "d": "the market price of the underlying stock.", "e": "The maximum loss for a put buyer is limited to the premium paid. If the stock price remains above the strike price, the put expires worthless and the buyer loses only the premium."}, {"n": 17, "q": "The maximum gain for the buyer of a put option is", "a": "unlimited.", "b": "the strike price minus the premium paid.", "c": "the premium paid.", "d": "the market price of the stock.", "e": "The maximum gain for a put buyer is the strike price minus the premium paid. This occurs if the underlying stock drops to zero. For example, with a $50 strike price and a $3 premium, the maximum gain is $47 ($50 - $3)."}, {"n": 18, "q": "A covered call strategy involves", "a": "buying a call option without owning the underlying stock.", "b": "writing (selling) a call option while owning the underlying stock.", "c": "buying both a call and a put on the same stock.", "d": "short selling the underlying stock.", "e": "A covered call strategy involves writing (selling) a call option while owning the underlying stock. The stock \"covers\" the obligation to deliver shares if the option is exercised. This is considered a conservative income-generating strategy."}, {"n": 19, "q": "An investor who writes a covered call does so primarily to", "a": "speculate on a large price increase.", "b": "generate additional income from the premium received.", "c": "protect against a market crash.", "d": "eliminate all risk from the stock position.", "e": "The primary purpose of writing a covered call is to generate additional income from the premium received. The investor collects the premium from the call buyer. The risk is that if the stock rises above the strike price, the investor may have to sell the stock at the strike price, missing out on additional gains."}, {"n": 20, "q": "A protective put strategy involves", "a": "selling a put option on a stock the investor does not own.", "b": "buying a put option on a stock the investor already owns.", "c": "buying a call and selling a put simultaneously.", "d": "writing a naked put option.", "e": "A protective put involves buying a put option on a stock the investor already owns. The put acts as insurance, providing a floor price at which the investor can sell the stock if it declines significantly."}, {"n": 21, "q": "An investor who buys a protective put does so primarily to", "a": "generate income from the premium.", "b": "protect a long stock position against a significant decline in price.", "c": "speculate on rising prices.", "d": "increase leverage.", "e": "A protective put is purchased to protect a long stock position against a significant decline in price. The put option guarantees the investor can sell the stock at the strike price regardless of how far the market price falls, limiting downside risk."}, {"n": 22, "q": "A naked (uncovered) call writer faces", "a": "limited risk equal to the premium received.", "b": "risk limited to the strike price.", "c": "theoretically unlimited risk.", "d": "no risk because they received the premium.", "e": "A naked (uncovered) call writer does not own the underlying stock, so if the option is exercised, they must buy the stock at the prevailing market price to deliver it at the strike price. Since the stock price can rise without limit, the potential loss is theoretically unlimited."}, {"n": 23, "q": "A straddle involves the simultaneous purchase of", "a": "two call options on different stocks.", "b": "a call and a put on the same stock with the same strike price and expiration date.", "c": "two put options on the same stock.", "d": "a stock and a bond.", "e": "A straddle involves the simultaneous purchase (long straddle) or sale (short straddle) of a call and a put on the same underlying stock with the same strike price and expiration date. It is a volatility strategy."}, {"n": 24, "q": "An investor who buys a straddle expects", "a": "the stock price to remain stable.", "b": "significant price movement in either direction.", "c": "a gradual increase in the stock price.", "d": "interest rates to decline.", "e": "A buyer of a straddle profits from significant price movement in either direction. The investor pays two premiums (call + put) and needs the stock to move far enough in either direction to cover the total premium cost. Straddle buyers expect high volatility."}, {"n": 25, "q": "Options contracts are standardized and traded on", "a": "the New York Stock Exchange only.", "b": "the over-the-counter market only.", "c": "options exchanges such as the CBOE, and are cleared by the OCC.", "d": "private exchanges between individual investors.", "e": "Listed options are standardized contracts traded on options exchanges such as the Chicago Board Options Exchange (CBOE). The Options Clearing Corporation (OCC) acts as the guarantor and counterparty for all listed option contracts, ensuring performance on both sides."}, {"n": 26, "q": "The Options Clearing Corporation (OCC) serves as", "a": "the regulator of the options market.", "b": "the guarantor and counterparty for all listed option contracts.", "c": "the issuer of the underlying securities.", "d": "a broker-dealer that executes option trades.", "e": "The OCC is the issuer and guarantor of all listed option contracts. It interposes itself between the buyer and writer, guaranteeing that the terms of the contract will be fulfilled. This eliminates counterparty risk in the listed options market."}, {"n": 27, "q": "A futures contract obligates the buyer to", "a": "purchase the underlying asset at a specified price on a future date.", "b": "sell the underlying asset at any time before expiration.", "c": "purchase an option on the underlying asset.", "d": "forfeit the premium if the contract is not exercised.", "e": "A futures contract obligates the buyer to purchase (and the seller to deliver) the underlying asset at a specified price on a specified future date. Unlike options, both parties are obligated to perform under a futures contract."}, {"n": 28, "q": "A key difference between options and futures is that", "a": "options obligate both parties, while futures give the buyer a choice.", "b": "futures obligate both parties, while options give the buyer a choice but not an obligation.", "c": "both options and futures give the buyer a choice.", "d": "futures have no expiration date.", "e": "In futures, both parties are obligated to perform—the buyer must buy and the seller must sell at the specified price and date. In options, only the seller (writer) is obligated; the buyer has the right but not the obligation to exercise."}, {"n": 29, "q": "A forward contract differs from a futures contract in that forward contracts are", "a": "standardized and traded on exchanges.", "b": "customized agreements traded over the counter between two parties.", "c": "cleared through a central clearinghouse.", "d": "available only for equity securities.", "e": "Forward contracts are customized, privately negotiated agreements traded over the counter (OTC) between two parties. They are not standardized, not exchange-traded, and not cleared through a clearinghouse, making them subject to counterparty risk."}, {"n": 30, "q": "A swap is a derivative contract in which two parties agree to", "a": "exchange ownership of their portfolios.", "b": "exchange cash flows based on different financial instruments over a specified period.", "c": "swap their brokerage accounts.", "d": "trade options for futures contracts.", "e": "A swap is a derivative contract in which two parties agree to exchange (swap) cash flows based on different financial instruments over a specified period. The most common types are interest rate swaps and currency swaps."}, {"n": 31, "q": "An interest rate swap typically involves one party exchanging", "a": "equity returns for bond returns.", "b": "fixed-rate interest payments for floating-rate interest payments.", "c": "principal amounts of two different loans.", "d": "stock dividends for bond coupons.", "e": "In a typical (plain vanilla) interest rate swap, one party exchanges fixed-rate interest payments for floating-rate interest payments with another party. This allows each party to manage their interest rate exposure according to their needs or market expectations."}, {"n": 32, "q": "Hedge funds typically differ from mutual funds in all of the following ways EXCEPT", "a": "hedge funds may use leverage and short selling.", "b": "hedge funds are generally available only to accredited investors.", "c": "hedge funds charge performance-based fees.", "d": "hedge funds are registered investment companies under the Investment Company Act of 1940.", "e": "Hedge funds are NOT registered investment companies under the Investment Company Act of 1940. They rely on exemptions from registration. They do use leverage and short selling, are generally available only to accredited investors, and commonly charge performance-based fees."}, {"n": 33, "q": "The typical hedge fund fee structure known as \"2 and 20\" refers to", "a": "a 2% front-end load and a 20% back-end load.", "b": "a 2% management fee and a 20% performance fee on profits.", "c": "a 2% expense ratio and 20% turnover rate.", "d": "2% of AUM distributed as dividends and 20% reinvested.", "e": "The \"2 and 20\" fee structure means the hedge fund charges a 2% annual management fee on assets under management plus a 20% performance fee (incentive fee) on any profits earned. This compensation structure aligns the manager's interests with investors but can be costly."}, {"n": 34, "q": "A lock-up period in a hedge fund refers to", "a": "the time during which the fund manager cannot trade.", "b": "a period during which investors cannot withdraw their capital.", "c": "the period before the fund begins accepting investments.", "d": "the time between performance reporting periods.", "e": "A lock-up period is a specified time (often 1 to 3 years) during which investors in a hedge fund cannot withdraw or redeem their capital. This allows the fund manager to invest in less liquid strategies without worrying about meeting redemption requests."}, {"n": 35, "q": "A high-water mark provision in a hedge fund fee structure ensures that", "a": "the fund always charges the maximum fee.", "b": "the manager only earns a performance fee on new profits above the previous highest value.", "c": "investors receive a guaranteed minimum return.", "d": "the fund's NAV never declines.", "e": "A high-water mark ensures the fund manager only earns a performance fee on new profits that exceed the fund's previous highest net asset value. If the fund loses money, the manager must recover those losses before earning additional performance fees, protecting investors from paying fees on recovered losses."}, {"n": 36, "q": "Private equity investments are characterized by", "a": "high liquidity and daily pricing.", "b": "investments in publicly traded securities.", "c": "investments in private companies with long holding periods and limited liquidity.", "d": "guaranteed returns backed by the government.", "e": "Private equity investments involve investing in companies that are not publicly traded. They are characterized by long holding periods (often 7-10 years), limited liquidity (investors cannot easily sell their interests), and the potential for high returns but with significant risk."}, {"n": 37, "q": "Venture capital is a subset of private equity that focuses on", "a": "acquiring mature, profitable companies.", "b": "investing in early-stage or startup companies with high growth potential.", "c": "buying distressed debt at a discount.", "d": "investing in real estate.", "e": "Venture capital focuses on investing in early-stage, startup, or emerging companies with high growth potential. These investments carry high risk because many startups fail, but successful investments can generate very high returns."}, {"n": 38, "q": "A leveraged buyout (LBO) involves", "a": "purchasing a company using primarily equity financing.", "b": "acquiring a company using a significant amount of borrowed funds.", "c": "investing in publicly traded bonds.", "d": "selling a company's assets to pay off debt.", "e": "A leveraged buyout (LBO) involves acquiring a company using a significant amount of borrowed funds (debt), with the acquired company's assets often serving as collateral for the loans. The goal is to improve the company and eventually sell it at a profit."}, {"n": 39, "q": "Real assets as an alternative investment class include", "a": "stocks and bonds.", "b": "money market instruments.", "c": "real estate, commodities, precious metals, and natural resources.", "d": "hedge funds and private equity.", "e": "Real assets include physical, tangible assets such as real estate, commodities (oil, agricultural products), precious metals (gold, silver), timber, and natural resources. They often provide inflation protection because their values tend to rise with the general price level."}, {"n": 40, "q": "Commodities as an investment include all of the following EXCEPT", "a": "crude oil.", "b": "gold and silver.", "c": "agricultural products such as wheat and corn.", "d": "corporate bonds.", "e": "Corporate bonds are traditional fixed-income securities, not commodities. Commodities include physical goods such as crude oil, precious metals (gold and silver), and agricultural products (wheat, corn, soybeans, coffee, etc.)."}, {"n": 41, "q": "An investor in commodity futures should understand that", "a": "commodity prices are guaranteed to increase over time.", "b": "commodities can serve as an inflation hedge because their prices often rise with inflation.", "c": "commodity futures carry no risk of loss.", "d": "commodities always pay dividends.", "e": "Commodities can serve as an inflation hedge because their prices often rise when inflation increases, as they represent the raw materials whose rising costs contribute to inflation. However, commodity prices are volatile and can decline, so they carry significant risk."}, {"n": 42, "q": "Structured products typically combine", "a": "two equity securities.", "b": "a traditional debt instrument with a derivative component.", "c": "only government bonds.", "d": "multiple mutual funds into a single vehicle.", "e": "Structured products typically combine a traditional debt instrument (such as a bond or note) with a derivative component (such as an option or swap) that links the return to the performance of an underlying asset, index, or benchmark."}, {"n": 43, "q": "A principal-protected note is a structured product that", "a": "guarantees the investor will earn a profit.", "b": "guarantees return of the investor's principal at maturity while providing potential upside linked to an index or asset.", "c": "has no credit risk.", "d": "is backed by the FDIC.", "e": "A principal-protected note guarantees the return of the investor's principal at maturity (subject to the credit risk of the issuer) while providing potential upside linked to the performance of an index or asset. The guarantee applies only if held to maturity."}, {"n": 44, "q": "The primary risk of investing in structured products, beyond market risk, is", "a": "inflation risk.", "b": "credit risk of the issuing institution.", "c": "currency risk.", "d": "political risk.", "e": "Beyond market risk, the primary risk of structured products is credit risk of the issuing institution. Structured products are typically unsecured obligations of the issuer, so if the issuer defaults or becomes insolvent, investors may lose their principal even with principal protection features."}, {"n": 45, "q": "Collectibles as alternative investments include all of the following EXCEPT", "a": "fine art and antiques.", "b": "rare coins and stamps.", "c": "vintage wine.", "d": "index mutual funds.", "e": "Index mutual funds are traditional investment vehicles, not collectibles. Collectibles include fine art, antiques, rare coins, stamps, vintage wine, classic cars, and other tangible items valued for their rarity, age, or cultural significance."}, {"n": 46, "q": "A key disadvantage of alternative investments compared to traditional investments is generally", "a": "higher liquidity.", "b": "lower fees.", "c": "limited liquidity and higher fees.", "d": "greater regulatory oversight.", "e": "Alternative investments generally have limited liquidity (difficulty selling quickly at fair value) and higher fees compared to traditional investments. They may also have less transparency, less regulatory oversight, and more complex strategies. These characteristics should be weighed against potential diversification and return benefits."}, {"n": 47, "q": "Managed futures involve", "a": "investing in a portfolio of mutual funds.", "b": "professional management of a portfolio of futures contracts across various asset classes.", "c": "investing in futures contracts on individual stocks only.", "d": "buying and holding physical commodities.", "e": "Managed futures involve professional money managers (commodity trading advisors or CTAs) who actively trade a portfolio of futures contracts across various asset classes including commodities, currencies, interest rates, and equity indices. They can go both long and short."}, {"n": 48, "q": "Due diligence when evaluating alternative investments should include all of the following EXCEPT", "a": "understanding the investment strategy and risks.", "b": "reviewing the fund manager's track record and qualifications.", "c": "relying solely on past performance as a guarantee of future results.", "d": "evaluating the fee structure and liquidity terms.", "e": "Past performance should never be relied upon as a guarantee of future results. Proper due diligence for alternative investments includes understanding the strategy and risks, reviewing the manager's track record, evaluating fees and liquidity terms, and assessing operational and regulatory risks."}]}, {"id": 24, "name": "Unit 24: Economic Factors and Business Information", "key": "ABCCBCBCBCCCCDBBBBBBBBBBBBBBBBBBBCBBBBBBAABBBBCC", "questions": [{"n": 1, "q": "Gross domestic product (GDP) measures", "a": "the total value of all goods and services produced within a country's borders during a specific period.", "b": "only the value of goods manufactured for export.", "c": "the total government spending on infrastructure.", "d": "the value of a country's imports minus its exports.", "e": "Gross domestic product (GDP) measures the total market value of all final goods and services produced within a country's borders during a specific period, usually a quarter or year. It is the broadest measure of a nation's economic output and health."}, {"n": 2, "q": "An economy is generally considered to be in a recession when GDP declines for", "a": "one fiscal quarter.", "b": "two consecutive quarters.", "c": "six consecutive months.", "d": "one full calendar year.", "e": "A recession is commonly defined as two consecutive quarters of declining GDP. During a recession, economic output falls, unemployment typically rises, consumer spending decreases, and business investment declines."}, {"n": 3, "q": "The Consumer Price Index (CPI) is primarily used to measure", "a": "unemployment.", "b": "the level of consumer spending.", "c": "changes in the price level of a basket of consumer goods and services (inflation).", "d": "gross domestic product.", "e": "The Consumer Price Index (CPI) tracks changes in the price level of a basket of consumer goods and services purchased by households. It is the most widely used measure of inflation and reflects the cost of living for average consumers."}, {"n": 4, "q": "The inflation rate is most commonly measured by changes in the", "a": "federal funds rate.", "b": "prime rate.", "c": "Consumer Price Index (CPI).", "d": "money supply.", "e": "The inflation rate is most commonly measured by the percentage change in the Consumer Price Index (CPI) over a specified period. The CPI tracks the prices of a representative basket of consumer goods and services."}, {"n": 5, "q": "Deflation is defined as", "a": "a rapid increase in the general price level.", "b": "a sustained decrease in the general price level.", "c": "a period of slow economic growth.", "d": "an increase in the unemployment rate.", "e": "Deflation is a sustained decrease in the general price level of goods and services. It is the opposite of inflation. Deflation can be harmful because it may lead to reduced consumer spending (as people wait for lower prices), lower corporate revenues, and increased real debt burdens."}, {"n": 6, "q": "Stagflation is characterized by", "a": "rapid economic growth and low inflation.", "b": "declining prices and high employment.", "c": "slow economic growth, high unemployment, and rising prices simultaneously.", "d": "falling interest rates and rising GDP.", "e": "Stagflation is an economic condition characterized by slow economic growth, high unemployment, and rising prices (inflation) occurring simultaneously. This combination is particularly challenging for policymakers because measures to fight inflation (raising rates) can worsen unemployment, and vice versa."}, {"n": 7, "q": "The business cycle consists of four phases in order:", "a": "peak, contraction, trough, expansion.", "b": "expansion, peak, contraction, trough.", "c": "trough, contraction, expansion, peak.", "d": "contraction, trough, peak, expansion.", "e": "The business cycle consists of four phases: expansion (growing economy), peak (highest point before decline), contraction (declining economy), and trough (lowest point before recovery). The cycle then repeats as a new expansion begins."}, {"n": 8, "q": "During the expansion phase of the business cycle, which of the following typically occurs?", "a": "Rising unemployment", "b": "Declining GDP", "c": "Increasing production, employment, and consumer spending", "d": "Falling stock prices", "e": "During the expansion phase, the economy is growing. Production increases, employment rises, consumer spending increases, corporate profits grow, and consumer confidence improves. This is the growth phase of the business cycle."}, {"n": 9, "q": "During the contraction phase of the business cycle, which of the following typically occurs?", "a": "Rising corporate profits", "b": "Declining production, employment, and consumer spending", "c": "Increasing consumer confidence", "d": "Rising stock market valuations", "e": "During the contraction phase, economic activity declines. Production decreases, unemployment rises, consumer and business spending falls, corporate profits decline, and overall economic output (GDP) decreases."}, {"n": 10, "q": "A leading economic indicator is one that", "a": "changes after the economy has already changed direction.", "b": "changes at the same time as the overall economy.", "c": "tends to change direction before the overall economy changes direction.", "d": "measures only government spending.", "e": "A leading economic indicator tends to change direction before the overall economy changes direction, providing advance warning of economic turning points. They are used by economists and investors to forecast future economic activity."}, {"n": 11, "q": "Which of the following is considered a leading economic indicator?", "a": "Consumer Price Index", "b": "GDP", "c": "Building permits for new housing", "d": "Average duration of unemployment", "e": "Building permits for new housing are a leading economic indicator because construction activity reflects builder confidence about future demand. Other leading indicators include stock market prices, the money supply, average weekly manufacturing hours, and new orders for consumer goods."}, {"n": 12, "q": "Which of the following is considered a lagging economic indicator?", "a": "Stock market prices", "b": "Building permits", "c": "Average prime rate charged by banks", "d": "Consumer expectations", "e": "The average prime rate charged by banks is a lagging economic indicator because it changes after the economy has already shifted direction. Other lagging indicators include the average duration of unemployment, outstanding commercial and industrial loans, and the ratio of consumer installment credit to personal income."}, {"n": 13, "q": "Which of the following is considered a coincident economic indicator?", "a": "Building permits for new housing", "b": "Stock market returns", "c": "Nonfarm payroll employment", "d": "Average duration of unemployment", "e": "Nonfarm payroll employment is a coincident economic indicator because it changes approximately at the same time as the overall economy. Other coincident indicators include personal income less transfer payments, industrial production, and manufacturing and trade sales."}, {"n": 14, "q": "The Federal Reserve's primary tools of monetary policy include all of the following EXCEPT", "a": "open market operations.", "b": "the discount rate.", "c": "the federal funds rate target.", "d": "setting income tax rates.", "e": "Setting income tax rates is a tool of fiscal policy (Congress and the President), not monetary policy (the Federal Reserve). The Fed's primary monetary policy tools are open market operations, the discount rate, the federal funds rate target, and reserve requirements."}, {"n": 15, "q": "When the Federal Reserve conducts open market operations by purchasing government securities, this action tends to", "a": "decrease the money supply and raise interest rates.", "b": "increase the money supply and lower interest rates.", "c": "have no effect on interest rates.", "d": "increase taxes.", "e": "When the Fed buys government securities (expansionary monetary policy), it pays for them by increasing bank reserves, which increases the money supply. More money in the system leads to lower interest rates, stimulating borrowing, spending, and economic growth."}, {"n": 16, "q": "When the Federal Reserve sells government securities in the open market, this action tends to", "a": "increase the money supply and lower interest rates.", "b": "decrease the money supply and raise interest rates.", "c": "increase government spending.", "d": "lower the discount rate.", "e": "When the Fed sells government securities (contractionary monetary policy), buyers pay for them, reducing bank reserves and the money supply. Less money in the system leads to higher interest rates, which slows borrowing, spending, and economic growth."}, {"n": 17, "q": "The federal funds rate is the rate at which", "a": "the Federal Reserve lends money to member banks.", "b": "banks lend reserves to each other overnight.", "c": "the U.S. Treasury borrows from foreign governments.", "d": "consumers borrow for home mortgages.", "e": "The federal funds rate is the interest rate at which depository institutions (banks) lend reserve balances to each other overnight on an uncollateralized basis. The Federal Open Market Committee (FOMC) sets a target for this rate as a key tool of monetary policy."}, {"n": 18, "q": "The discount rate is the rate at which", "a": "banks lend to each other overnight.", "b": "the Federal Reserve lends money directly to member banks.", "c": "the U.S. Treasury issues new bonds.", "d": "consumers receive interest on savings accounts.", "e": "The discount rate is the interest rate the Federal Reserve charges commercial banks and other depository institutions for short-term loans made through the Fed's discount window. It is typically set above the federal funds rate and serves as a lending facility of last resort."}, {"n": 19, "q": "If the Federal Reserve wants to stimulate economic growth, it would most likely", "a": "raise interest rates and sell government securities.", "b": "lower interest rates and buy government securities.", "c": "increase the reserve requirement.", "d": "raise taxes.", "e": "To stimulate economic growth (expansionary monetary policy), the Fed would lower interest rates and buy government securities. Lower rates encourage borrowing and spending, while buying securities injects money into the banking system, increasing the money supply."}, {"n": 20, "q": "If the Federal Reserve wants to slow down an overheating economy and control inflation, it would most likely", "a": "lower interest rates and buy government securities.", "b": "raise interest rates and sell government securities.", "c": "decrease the reserve requirement.", "d": "increase government spending.", "e": "To slow an overheating economy and control inflation (contractionary monetary policy), the Fed would raise interest rates and sell government securities. Higher rates discourage borrowing and spending, while selling securities removes money from the banking system."}, {"n": 21, "q": "Fiscal policy refers to", "a": "the Federal Reserve's management of the money supply and interest rates.", "b": "the government's use of taxation and spending to influence the economy.", "c": "the regulation of the banking system.", "d": "international trade agreements.", "e": "Fiscal policy refers to the government's use of taxation and spending to influence the economy. It is controlled by Congress and the President, unlike monetary policy which is controlled by the Federal Reserve."}, {"n": 22, "q": "An expansionary fiscal policy would include", "a": "increasing taxes and decreasing government spending.", "b": "decreasing taxes and increasing government spending.", "c": "raising interest rates.", "d": "selling government securities.", "e": "Expansionary fiscal policy involves decreasing taxes (putting more money in consumers' and businesses' hands) and increasing government spending to stimulate economic growth and reduce unemployment. This typically increases the budget deficit."}, {"n": 23, "q": "A contractionary fiscal policy would include", "a": "decreasing taxes and increasing government spending.", "b": "increasing taxes and decreasing government spending.", "c": "lowering interest rates.", "d": "buying government securities.", "e": "Contractionary fiscal policy involves increasing taxes and decreasing government spending to slow down economic growth and control inflation. This reduces the budget deficit or creates a surplus but may slow the economy."}, {"n": 24, "q": "The yield curve plots the relationship between", "a": "a bond's credit rating and its yield.", "b": "the maturity of bonds and their yields for similar credit quality.", "c": "a bond's price and its coupon rate.", "d": "the stock market and bond market returns.", "e": "The yield curve plots the relationship between bond maturities (on the x-axis) and their yields (on the y-axis) for bonds of similar credit quality, typically U.S. Treasury securities. It provides insight into market expectations about future interest rates and economic conditions."}, {"n": 25, "q": "A normal (upward-sloping) yield curve indicates that", "a": "short-term interest rates are higher than long-term rates.", "b": "long-term interest rates are higher than short-term rates.", "c": "all interest rates are equal.", "d": "the economy is in a recession.", "e": "A normal yield curve slopes upward, meaning long-term interest rates are higher than short-term rates. This is the most common shape and reflects the expectation of economic growth and the additional compensation investors require for the greater risk of holding longer-term bonds."}, {"n": 26, "q": "An inverted yield curve, where short-term rates exceed long-term rates, is often considered a predictor of", "a": "rapid economic expansion.", "b": "an economic recession.", "c": "rising inflation.", "d": "a bull market in stocks.", "e": "An inverted yield curve, where short-term rates exceed long-term rates, has historically been a reliable predictor of economic recession. It suggests that the market expects future interest rates (and economic growth) to decline."}, {"n": 27, "q": "A flat yield curve indicates that", "a": "the economy is growing rapidly.", "b": "there is little difference between short-term and long-term interest rates.", "c": "long-term bonds are significantly riskier than short-term bonds.", "d": "inflation is accelerating.", "e": "A flat yield curve indicates there is little difference between short-term and long-term interest rates. It often occurs during transitions between normal and inverted curves and may signal economic uncertainty or a potential shift in economic conditions."}, {"n": 28, "q": "The balance of trade measures", "a": "the total amount of government debt.", "b": "the difference between a country's exports and imports of goods and services.", "c": "the total GDP of a country.", "d": "the difference between government revenue and spending.", "e": "The balance of trade measures the difference between a country's exports and imports of goods and services. A positive balance (trade surplus) means exports exceed imports, while a negative balance (trade deficit) means imports exceed exports."}, {"n": 29, "q": "A trade deficit occurs when a country's", "a": "exports exceed its imports.", "b": "imports exceed its exports.", "c": "GDP exceeds its national debt.", "d": "government spending exceeds tax revenue.", "e": "A trade deficit occurs when a country imports more goods and services than it exports. The United States has run a trade deficit for many years, meaning it buys more from foreign countries than it sells to them."}, {"n": 30, "q": "The money supply is classified into categories, with M1 including", "a": "large time deposits and institutional money market funds.", "b": "currency in circulation, demand deposits, and other checkable deposits.", "c": "only physical currency and coins.", "d": "all bank deposits regardless of type.", "e": "M1 is the narrowest measure of the money supply and includes the most liquid forms of money: currency in circulation (physical cash and coins), demand deposits (checking accounts), and other checkable deposits. These are the funds most readily available for spending."}, {"n": 31, "q": "M2 includes all of M1 plus", "a": "large time deposits only.", "b": "savings deposits, small time deposits, and retail money market mutual fund balances.", "c": "foreign currency holdings.", "d": "government securities.", "e": "M2 is a broader measure of the money supply that includes everything in M1 plus savings deposits, small time deposits (CDs under $100,000), and retail money market mutual fund balances. These are slightly less liquid than M1 components."}, {"n": 32, "q": "Interest rates and bond prices have a relationship that is", "a": "direct (they move in the same direction).", "b": "inverse (they move in opposite directions).", "c": "unrelated.", "d": "direct only for government bonds.", "e": "Interest rates and bond prices have an inverse relationship. When interest rates rise, existing bond prices fall (because their fixed coupon payments become less attractive relative to new bonds with higher rates). When interest rates fall, existing bond prices rise."}, {"n": 33, "q": "When interest rates rise, existing bond prices will", "a": "increase.", "b": "decrease.", "c": "remain unchanged.", "d": "increase for corporate bonds but decrease for government bonds.", "e": "When interest rates rise, existing bonds with lower coupon rates become less attractive compared to newly issued bonds with higher coupon rates. Therefore, the market price of existing bonds must decrease to make their yield competitive with new bonds."}, {"n": 34, "q": "All other factors being equal, a bond with a longer maturity will experience a price change that is", "a": "smaller than a shorter-maturity bond when interest rates change.", "b": "the same as a shorter-maturity bond when interest rates change.", "c": "greater than a shorter-maturity bond when interest rates change.", "d": "unaffected by interest rate changes.", "e": "Longer-maturity bonds experience greater price changes than shorter-maturity bonds for the same change in interest rates. This is because the fixed payments are locked in for a longer period, making the bond more sensitive to rate changes. This concept is closely related to duration."}, {"n": 35, "q": "The prime rate is", "a": "the rate the Federal Reserve charges member banks.", "b": "the rate banks charge their most creditworthy corporate borrowers.", "c": "the overnight lending rate between banks.", "d": "the rate on 30-year Treasury bonds.", "e": "The prime rate is the interest rate that commercial banks charge their most creditworthy corporate borrowers. It serves as a benchmark for many other lending rates, including those on credit cards, home equity lines of credit, and small business loans."}, {"n": 36, "q": "The LIBOR rate was historically used as", "a": "the rate for Federal Reserve lending.", "b": "a benchmark for short-term international interbank lending rates.", "c": "the rate on U.S. Treasury bills.", "d": "the rate charged to retail mortgage borrowers.", "e": "LIBOR (London Interbank Offered Rate) was historically the benchmark rate at which major global banks lent to one another in the international interbank market. It served as a reference rate for trillions of dollars in financial contracts worldwide before being phased out."}, {"n": 37, "q": "The Secured Overnight Financing Rate (SOFR) has replaced LIBOR as a key benchmark and is based on", "a": "the federal funds rate.", "b": "overnight transactions in the U.S. Treasury repurchase agreement market.", "c": "the prime rate.", "d": "the discount rate.", "e": "SOFR (Secured Overnight Financing Rate) is based on overnight transactions in the U.S. Treasury repurchase agreement (repo) market. It replaced LIBOR as the primary benchmark for dollar-denominated derivatives, loans, and other financial contracts, and is considered more reliable because it is based on actual transactions."}, {"n": 38, "q": "Supply-side economics emphasizes", "a": "increasing government spending to stimulate demand.", "b": "reducing taxes and regulation to encourage production and economic growth.", "c": "increasing the money supply to lower interest rates.", "d": "government control of prices and wages.", "e": "Supply-side economics emphasizes reducing taxes and government regulation to encourage production, investment, and economic growth. The theory holds that lower tax rates incentivize work, saving, and investment, leading to increased economic output that can ultimately increase tax revenue."}, {"n": 39, "q": "Keynesian economics emphasizes", "a": "free markets with no government intervention.", "b": "government spending and fiscal policy to manage aggregate demand and stabilize the economy.", "c": "reducing the money supply to control inflation.", "d": "eliminating all taxes to stimulate growth.", "e": "Keynesian economics, developed by John Maynard Keynes, emphasizes the role of government spending and fiscal policy in managing aggregate demand to stabilize the economy. Keynesians argue that during recessions, the government should increase spending and cut taxes to stimulate demand."}, {"n": 40, "q": "The multiplier effect in economics refers to", "a": "the Federal Reserve's ability to multiply the money supply.", "b": "the concept that an initial change in spending leads to a larger overall change in economic output.", "c": "the compounding of interest over time.", "d": "the effect of multiple tax rate increases.", "e": "The multiplier effect is the concept that an initial change in spending (such as government spending or investment) leads to a larger overall change in economic output. For example, a $1 billion increase in government spending might result in a $2 billion increase in GDP if the multiplier is 2."}, {"n": 41, "q": "Purchasing power parity (PPP) theory suggests that", "a": "exchange rates should adjust so that identical goods cost the same in different countries.", "b": "interest rates determine exchange rates.", "c": "trade deficits have no effect on currency values.", "d": "government intervention determines exchange rates.", "e": "Purchasing power parity (PPP) theory suggests that exchange rates between currencies should adjust so that identical goods cost the same in different countries when priced in the same currency. If a product costs more in one country, the exchange rate should eventually adjust to equalize prices."}, {"n": 42, "q": "When the U.S. dollar strengthens relative to foreign currencies, the effect on U.S. companies is generally that", "a": "exports become more expensive for foreign buyers, potentially reducing export sales.", "b": "imports become more expensive for U.S. buyers.", "c": "both exports and imports are unaffected.", "d": "U.S. companies always benefit from a strong dollar.", "e": "When the U.S. dollar strengthens, American goods become more expensive for foreign buyers, potentially reducing U.S. export sales. Conversely, foreign goods become cheaper for American consumers, potentially increasing imports. A strong dollar hurts exporters but benefits importers and U.S. consumers purchasing foreign goods."}, {"n": 43, "q": "The federal budget deficit is", "a": "the total accumulated debt of the federal government.", "b": "the amount by which government spending exceeds government revenue in a single fiscal year.", "c": "the difference between exports and imports.", "d": "the interest paid on the national debt.", "e": "The federal budget deficit is the amount by which government spending exceeds government revenue (primarily taxes) in a single fiscal year. It represents the shortfall that must be financed through borrowing (issuing Treasury securities)."}, {"n": 44, "q": "The national debt is", "a": "the annual budget deficit.", "b": "the total accumulated amount the federal government owes.", "c": "the trade deficit.", "d": "the money supply.", "e": "The national debt is the total accumulated amount the federal government owes, built up over years of budget deficits. It represents the sum of all past deficits minus any surpluses. The national debt grows each year that the government runs a deficit."}, {"n": 45, "q": "The producer price index (PPI) measures changes in prices", "a": "paid by consumers for a basket of goods and services.", "b": "received by domestic producers for their output.", "c": "of imported goods only.", "d": "of financial assets.", "e": "The Producer Price Index (PPI) measures changes in the selling prices received by domestic producers for their output. Unlike the CPI which measures prices paid by consumers, the PPI measures prices at the wholesale or producer level. Rising PPI may foreshadow rising consumer prices."}, {"n": 46, "q": "Quantitative easing (QE) is a monetary policy tool in which the Federal Reserve", "a": "raises the federal funds rate to high levels.", "b": "purchases large quantities of financial assets to increase the money supply and lower long-term interest rates.", "c": "reduces government spending.", "d": "increases the reserve requirement for banks.", "e": "Quantitative easing (QE) is an unconventional monetary policy tool used when short-term interest rates are near zero. The Fed purchases large quantities of financial assets (government bonds, mortgage-backed securities) to inject money into the economy, lower long-term interest rates, and encourage lending and investment."}, {"n": 47, "q": "The natural rate of unemployment includes", "a": "only frictional unemployment.", "b": "only structural unemployment.", "c": "both frictional and structural unemployment but not cyclical unemployment.", "d": "frictional, structural, and cyclical unemployment.", "e": "The natural rate of unemployment includes frictional unemployment (workers between jobs or entering the workforce) and structural unemployment (mismatch between workers' skills and available jobs). It does not include cyclical unemployment, which results from economic downturns."}, {"n": 48, "q": "Cyclical unemployment is caused by", "a": "workers voluntarily changing jobs.", "b": "a mismatch between workers' skills and available jobs.", "c": "a downturn in the business cycle.", "d": "government regulations.", "e": "Cyclical unemployment is caused by downturns in the business cycle—during recessions, demand for goods and services falls, leading employers to lay off workers. Cyclical unemployment rises during contractions and falls during expansions. It is the type of unemployment that economic policy most directly aims to reduce."}]}]}
</script>

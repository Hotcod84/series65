ered under the Investment Company Act of 1940.", "e": "The de minimis rule for a registered investment adviser who has no place of business in the state is fewer than 6 retail clients. Doing business with 6 clients within the last 12 months exceeds this de minimis amount."}, {"n": 45, "q": "An investment adviser need not register in a state if it has", "a": "a place of business in the state and advises fewer than five banks.", "b": "no place of business in the state and only advises three insurance companies located in the state.", "c": "a place of business in the state and only advises employee benefit plans with more than $1 million.", "d": "no place of business in the state, does not direct business communications in the state, and advises more than five high-net-worth individuals located in the state.", "e": "An investment adviser need not register in a state if it has no place of business in the state and advises such institutional clients as insurance companies or banks. The number of clients is irrelevant as long as they all are of an institutional nature."}, {"n": 46, "q": "Under both state and federal law, there are a number of exclusions from the definition of investment adviser. Which of the following would not qualify for an exclusion?", "a": "An economist who teaches a course in fundamental analysis at a local community college", "b": "A publisher of a newsletter that is paid to make reports to be used in the sale of specific securities", "c": "A CPA who gives high-tax-bracket clients a chart showing the tax-equivalent yield of municipal bonds", "d": "A personal injury attorney who recommends that clients consult with a CFP for advice on how to deal with the large settlements they receive", "e": "Although there is an exclusion for publishers, the publication must be of general and regular circulation, and the publisher cannot be the recipient of compensation from the issuers of any securities covered."}]}, {"id": 10, "name": "Unit 10: Investment Adviser Representatives", "key": "DBCABADADAD", "questions": [{"n": 1, "q": "Which of the following is not exempt from registration as an investment adviser representative in the state in which they conduct business?\nI. A CERTIFIED FINANCIAL PLANNER who, while affiliated with a broker-dealer and an investment adviser, prepares comprehensive financial plans and whose only compensation is commissions generated from the purchase of recommended securities\nII. An insurance agent affiliated with the company's advisory division, who prepares comprehensive financial plans and receives compensation only on insurance products purchased by his clients\nIII. A broker-dealer with extensive business in the state\nIV. A mutual fund company with offices and clients in the state", "a": "I only", "b": "I, II, III, and IV", "c": "III and IV", "d": "I and II", "e": "A CERTIFIED FINANCIAL PLANNER (CFP) who prepares comprehensive financial plans and is compensated by the commissions earned when the customer purchases the recommended securities must register in the state as an investment adviser representative of the advisory firm. An insurance agent affiliated with an investment adviser, who prepares comprehensive financial plans for commissions is also acting in the capacity of an investment adviser representative and must register accordingly. Broker-dealers and mutual fund companies are not investment advisers under the USA."}, {"n": 2, "q": "Under the Uniform Securities Act, all of the following are required to be registered as investment adviser representatives except", "a": "an employee who solicits new customers for ABD Advisers, Inc.", "b": "ABD Advisers, Inc.", "c": "an individual who furnishes investment advice to clients of ABD Advisers, Inc.", "d": "a vice president of ABD Advisers, Inc., who serves on the firm's advisory committee.", "e": "An individual or a firm may be registered as an investment adviser, but only an individual can be an investment adviser representative. The USA defines an investment adviser representative as anyone who is a partner, officer, director, or other employee associated with an investment adviser who makes recommendations, manages accounts, determines advice, solicits advisory services, or supervises such persons."}, {"n": 3, "q": "Washington, Adams, and Jefferson, Inc., (WAJI) is an investment adviser whose principal and only office is in Alexandria, VA. WAJI's sole business is advising institutional investors. Rutherford Buchanan is employed by the firm in the main office and has the responsibility of servicing the firm's bank and insurance company clients. Which of the following statements is correct regarding Rutherford's licensing requirements?", "a": "Rutherford is exempt from registration because his only clients are institutions.", "b": "Rutherford is exempt from registration because he has fewer than six retail clients.", "c": "Rutherford must register as an IAR of WAJI with the State of Virginia.", "d": "Rutherford cannot register as an IAR of WAJI because providing advice exclusively to institutions exempts the firm from registration.", "e": "Regardless of whom the clients are, Rutherford has a place of business in Virginia and that requires registration with the Administrator as an IAR. The de minimis exemption for fewer than six retail clients only applies when there is no place of business in the state."}, {"n": 4, "q": "To transact business in a state as an investment adviser representative (IAR), a person must", "a": "be registered as a representative of an investment adviser and have passed the appropriate NASAA exam for IARs.", "b": "have passed the agent's exam and taken no other exams.", "c": "be employed by a commercial bank located in the state.", "d": "be registered as an agent of a brokerage house and have passed the appropriate NASAA exam for IARs.", "e": "To transact business in a state as an investment adviser representative, a person must be registered as a representative of an investment adviser and have passed either the NASAA Series 65 or Series 66 exam."}, {"n": 5, "q": "Which of the following regarding the registration of investment advisers and their representatives is true?", "a": "ABC Advisers, Inc., is an investment advisory firm registered with the Administrator; therefore, its representatives need not be registered with the Administrator.", "b": "ABC Advisers, Inc., registered with the Administrator, employs an investment adviser representative who left the employment of another investment advisory firm six months ago. ABC must notify the Administrator of this association promptly.", "c": "An investment adviser representative terminated his employment with ABC Advisers, Inc., a state-registered investment adviser and, six months later, was employed as an advisory representative by KLM, a federal covered adviser. Each firm is required to notify the Administrator of each event.", "d": "XYZ Advisers, Inc., is a federal covered investment advisory firm registered with the SEC; therefore, its representatives need not be registered with the Administrator.", "e": "Only state-registered investment advisory firms are required to notify the appropriate state Administrator when employment is terminated or begun. In the case of investment adviser representatives of federal covered advisers, notification is the responsibility of the adviser representative."}, {"n": 6, "q": "According to the Uniform Securities Act, which of the following is an investment adviser representative?\nI. A clerical employee of the AAA Investment Management Company, an investment advisory firm registered in the state that offers investment portfolio services to the public\nII. An employee of AAA Investment Management Company who is properly registered under the USA and supervises analysts who provide research to clients\nIII. An employee of a federal covered adviser with an office in the state who offers investment advice to the public\nIV. An agent of a broker-dealer with strong investment opinions who sells securities only on a commission basis", "a": "II and III", "b": "I and IV", "c": "III and IV", "d": "I and II", "e": "An employee who supervises analysts who deal with the public must be an investment adviser representative. The employee of the federal covered adviser with an office in the state is also an investment adviser representative. Clerical employees are excluded, and an agent of a broker-dealer is not an IAR."}, {"n": 7, "q": "An individual who is employed by or associated with an investment adviser (IA) that is registered or required to be registered under the Uniform Securities Act or who has a place of business in this state and is employed by or associated with a federal covered adviser and whose only role is to solicit, offer, or negotiate for the sale of or sell investment advisory services would be considered", "a": "an administrative employee exempt from registration.", "b": "an IAR only if soliciting noninstitutional clients.", "c": "an investment adviser and required to register as such.", "d": "an investment adviser representative and required to register as such.", "e": "The term investment adviser representative is quite broad and includes any individual employed by or associated with an investment adviser who solicits, offers, or negotiates for the sale of or sells investment advisory services, among other functions."}, {"n": 8, "q": "The registration of an investment adviser would automatically register which of the following as investment adviser representatives?\nI. Directors\nII. Officers\nIII. Partners", "a": "I, II, and III", "b": "I and III", "c": "I and II", "d": "II and III", "e": "Section 202(a) of the Uniform Securities Act states that registration of an investment adviser automatically constitutes registration of any investment adviser representative who is a partner, officer, or director, or a person occupying a similar status or performing similar functions."}, {"n": 9, "q": "Under the Uniform Securities Act, any partner, officer, or director of a registered investment adviser is an investment adviser representative if that individual does which of the following?\nI. Offers advice concerning securities\nII. Manages client accounts or portfolios\nIII. Determines securities recommendations for representatives to disseminate\nIV. Supervises personnel engaged in the above activities but does not sell these services to the public", "a": "I and II", "b": "I and IV", "c": "II and III", "d": "I, II, III, and IV", "e": "The Uniform Securities Act defines any individuals associated with an investment adviser as investment adviser representatives if they manage accounts or portfolios, determine securities recommendations, supervise personnel engaged in the listed activities, or offer advice concerning securities."}, {"n": 10, "q": "Registration of an investment adviser automatically confers registration on whom?\nI. Officers, partners, and directors of the firm who are functioning as IARs\nII. Any employee who is functioning as an IAR\nIII. Clerical employees handling back-office operations\nIV. An employee who will be soliciting clients for the adviser", "a": "I only", "b": "I and III", "c": "I, II, and III", "d": "I, II, III, and IV", "e": "Under Section 202(a) of the Uniform Securities Act, registration of an investment adviser automatically constitutes registration of any investment adviser representative who is a partner, officer, or director, or a person occupying a similar status or performing similar functions."}, {"n": 11, "q": "Under the Uniform Securities Act, which of the following statements regarding the employment of investment adviser representatives by a state-registered investment adviser is true?\nI. The investment adviser must notify the Administrator whenever an investment adviser representative is terminated.\nII. An investment adviser is not required to notify the Administrator when an investment adviser representative begins employment.\nIII. The registration of an investment adviser representative is effective only as long as the individual is employed by a registered investment adviser.", "a": "III only", "b": "I only", "c": "I, II, and III", "d": "I and III", "e": "Whenever an individual begins or ends association as an IAR with a state-registered IA, the IA must notify the Administrator. An IAR's registration is only valid while employed by a registered IA."}]}, {"id": 11, "name": "Unit 11: Broker-Dealers and Agents", "key": "CCBDABCAACBADCDAAABACDCDBBDDCDA", "questions": [{"n": 1, "q": "Prompt notification to the Administrator must be made when\nI. a broker-dealer opens a new branch office in the state.\nII. a broker-dealer terminates an agent.\nIII. an agent terminates her affiliation with a broker-dealer.\nIV. there is a material change to any information contained in a broker-dealer's application for registration that is on file with the state.", "a": "I, II, and III", "b": "II and III", "c": "I, II, III, and IV", "d": "IV only", "e": "Opening a branch office and the association or disassociation of an agent with a broker-dealer require prompt notification to the Administrator, as does a material change to any information contained in a broker-dealer's application for registration."}, {"n": 2, "q": "Under the Securities Exchange Act of 1934, the term associated person would include each of the following except", "a": "an employee who solicits the purchase and sale of securities for the broker-dealer.", "b": "a partner of a securities firm who is actively engaged in managing the day-to-day securities operations of the firm.", "c": "a person whose functions are solely ministerial.", "d": "a director of a securities firm who is actively engaged in managing the firm's day-to-day securities operations.", "e": "Under the Securities Exchange Act of 1934, the term associated person of a broker or dealer means any partner, officer, director, or branch manager of such broker or dealer (or any person occupying a similar status or performing similar functions), any person directly or indirectly controlling, controlled by, or under common control with such broker or dealer, or any employee of such broker or dealer, except that any person associated with a broker or dealer whose functions are solely clerical or ministerial shall not be included in the meaning of such term."}, {"n": 3, "q": "First Growth Securities, Inc., a member of the Financial Industry Regulatory Authority (FINRA), has its main office in Illinois and is therefore", "a": "registered by FINRA to sell securities in Illinois.", "b": "required to register as a broker-dealer in the state of Illinois.", "c": "a registered investment adviser licensed to sell securities in Illinois.", "d": "automatically registered as a securities agent in Illinois.", "e": "Securities firms that are members of FINRA must register as broker-dealers in the states in which they conduct business. Under the USA, broker-dealers are firms engaged in the business of effecting security transactions in customer or proprietary accounts. A broker-dealer is not a registered investment adviser, although many broker-dealers own separate legal subsidiaries that are investment advisers. FINRA does not license its members to conduct business in the states; the state securities licensing agent is the state securities Administrator. Also, a broker-dealer is not an agent; an agent is a person who is employed by a broker-dealer to conduct securities transactions as a representative of the broker-dealer."}, {"n": 4, "q": "An individual has been hired by a person to assist in the selling of securities it is issuing to residents of State A. The individual would be defined as an agent under the Uniform Securities Act if the issuer is", "a": "issuing commercial paper in minimum denominations of $100,000 with a AA rating and a six-month maturity.", "b": "a trust company organized and supervised under the laws of State B.", "c": "the city of Saskatoon, Saskatchewan (Canada).", "d": "a credit union organized and supervised under the laws of State A.", "e": "Please remember the broad definition of person—it does not mean an individual unless preceded by the word natural. When an individual represents the issuer of certain exempt securities in the sale of those securities to the public, that individual is not included in the USA's definition of agent. Credit unions are not in that list, so those individuals are agents and must be registered as such. Individuals representing banks, including savings institutions and trust companies when organized and supervised under the laws of any state (not necessarily the state in which the securities will be sold), are not agents. If the agent represents the issuer of commercial paper meeting the exemption requirements of the USA ($50,000 minimum denomination, top three grades, and maximum nine-month maturity), that individual is not an agent. Finally, representing the United States or Canadian federal government, or any of their political subdivisions, excludes one from the definition of agent."}, {"n": 5, "q": "Which of the following persons are included in the definition of an agent under the Uniform Securities Act?\nI. An individual who represents First Securities Brokers, Inc., in selling shares of XYZ Corporation, a New York Stock Exchange–listed company\nII. An individual who, as part of the job description, represents the City of Chicago in selling its bonds to the public\nIII. An individual who represents a corporation traded on the New York Stock Exchange in selling securities to the public\nIV. An individual who is employed by the Federal Reserve Board to sell Treasury bills to retail investors", "a": "I and III", "b": "II and IV", "c": "III and IV", "d": "I and II", "e": "Under the USA, an agent is defined as an individual who represents a broker-dealer selling any type of security, whether that security is exempt or nonexempt. Individuals who represent issuers in trading exempt securities or exempt transactions are not defined as agents. An individual who represents an issuer selling nonexempt securities is an agent and must be registered."}, {"n": 6, "q": "How quickly must a broker-dealer notify the Administrator if material information relating to that broker-dealer's registration should change?", "a": "Within days", "b": "Promptly", "c": "No later than the time of license renewal", "d": "Within 24 hours", "e": "If the information contained in any document filed with the Administrator is or becomes inaccurate or incomplete in any material respect, the registrant must file a correcting amendment promptly."}, {"n": 7, "q": "If information filed with the Administrator by a broker-dealer as part of its registration changes in a material way, the registrant must", "a": "submit an entirely new registration form within 30 days of the material change in information.", "b": "update the information on the registration on the next annual renewal date.", "c": "amend or update the information promptly, regardless of the renewal date.", "d": "amend the registration statement within 60 days of the material change.", "e": "When material information changes, the registrant must promptly amend or update the information, regardless of the renewal date. The requirement to amend a registration applies to investment advisers, broker-dealers, and securities. However, the Uniform Securities Act does not define the term promptly."}, {"n": 8, "q": "Under what conditions may an unregistered employee of a broker-dealer receive bonuses or incentives?", "a": "When such bonuses or incentives are not tied to transactions, commission activity, or referrals generated by the unregistered person", "b": "Under no circumstances if the employee is not registered", "c": "Only when the employee's contract calls for being compensated in such a manner", "d": "When such bonuses or incentives are tied to transactions, commission activity, or referrals generated by the unregistered person", "e": "Unregistered persons are regarded as employees of the member and should not be compensated on any basis other than a salary or hourly wage. However, the payment of performance bonuses or other forms of incentive compensation, such as through participation in a member's profit-sharing plan, are permitted as long as such bonuses or incentives are not tied to transactions, commission activity, or referrals generated by the unregistered person."}, {"n": 9, "q": "Both state and federal law have recordkeeping requirements for broker-dealers. When it comes to email correspondence, the requirements are", "a": "the same as they would be for written correspondence.", "b": "only that the correspondence be reviewed by a principal.", "c": "that a receipt that the email has been read is sufficient.", "d": "that the firm must keep the correspondence in cloud storage for three years.", "e": "Email correspondence is treated the same as written correspondence. The records must be kept for three years. One method is cloud storage, but there are other acceptable methods as well."}, {"n": 10, "q": "Which of the following persons are excluded from the definition of, or exempt from registration as, a broker-dealer under the Uniform Securities Act?\nI. A broker-dealer with no office in the state that effects trades exclusively with other broker-dealers in the state\nII. A trust company with an office in the state that deals with the general public\nIII. A broker-dealer with no office in the state that has no more than five retail clients resident in the state within the past year\nIV. A broker-dealer with no office in the state that effects securities trades exclusively with trust companies or other broker-dealers", "a": "I and II", "b": "I, II, III, and IV", "c": "I, II, and IV", "d": "III and IV", "e": "As long as a broker-dealer does not have an office in the state, it is possible to qualify for exclusion from the definition. The primary requirement for the exclusion is that the broker-dealer confine trading to financial institutions or other broker-dealers. Unlike with investment advisers, there is no de minimis exemption for broker-dealers. Trust companies are excluded from the definition of broker-dealer."}, {"n": 11, "q": "Which of the following must register as a broker-dealer under the USA?", "a": "A broker-dealer with no place of business in the state that effects transactions exclusively with issuers of securities in that state", "b": "A broker-dealer with a place of business in the state that effects transactions exclusively with broker-dealers registered in other states", "c": "A broker-dealer with no place of business in the state that deals exclusively with broker-dealers with offices in that state", "d": "A broker-dealer with no place of business in the state that has directed offers to clients who have more than 30 days' temporary residency in the state", "e": "If a broker-dealer has an office in the state, it must register with the state, regardless of what types of clientele it serves. The term broker-dealer excludes anyone without a place of business in the state who effects transactions exclusively with issuers, other broker-dealers, or institutions, or who directs an offer in the state to an existing customer who temporarily resides in the state where the offer is received, regardless of the length of time. As long as the broker-dealer is properly registered in the vacationer's state of permanent residence and does not maintain an office in the state being visited, it is not defined as a broker-dealer."}, {"n": 12, "q": "Which of the following must register as an agent when representing a broker-dealer?", "a": "An employee who accepts unsolicited orders from institutional clients", "b": "The telephone switchboard operator who directs orders to the appropriate extension", "c": "An individual who represents an underwriter only in transactions between an issuer and the underwriter", "d": "A partner of a broker-dealer who has no securities sales functions", "e": "An employee of a broker-dealer who accepts orders must register as an agent. The fact that it is unsolicited and/or from an institution (making them exempt transactions) has no bearing on the requirement for the individual to register as an agent. A partner of a broker-dealer with no securities sales functions and an individual who represents an underwriter only in transactions between an issuer and the underwriter need not register. Individuals whose function is strictly clerical do not register as agents."}, {"n": 13, "q": "Under the Uniform Securities Act, the definition of a broker-dealer includes", "a": "an authorized representative of the issuer who receives a commission.", "b": "a trust company when executing transactions in accounts in which it does not act in a fiduciary capacity.", "c": "an agent handling principal transactions with major institutional clients.", "d": "a person in the business of making trades in his own account or for the accounts of others.", "e": "A broker-dealer is defined as any person in the business of making trades in its own account or for the accounts of others."}, {"n": 14, "q": "When applying for registration as an agent, which of the following must be disclosed?", "a": "Residential history for the past three years", "b": "Highest educational level achieved and the institution attended", "c": "Certain financial information such as any unsatisfied judgments or liens against the applicant", "d": "Complete employment history for the past five years", "e": "This question probably contains more detailed information than will be covered on the exam. Negative financial information, such as unsatisfied judgments or liens and bankruptcy filings, must be disclosed. Employment history for the past 10 years and residential history for the past 5 years must be shown. If, during the past 10 years, the applicant was a full-time student, then that must be shown, but that is the extent of educational information required."}, {"n": 15, "q": "It would not be a violation of the Uniform Securities Act for an applicant for registration as an agent to do which of the following while the application is pending?", "a": "Conduct seminars on asset allocation", "b": "Limit his sales activity to immediate family members only", "c": "Use a preliminary prospectus to obtain indications of interest for a new issue but wait until he is registered before accepting any orders", "d": "Sell fixed annuities", "e": "While registration as an agent is pending, the applicant can take no active role in the sale or offering of securities. However, because fixed annuities are not securities, registration as an agent is not required. Yes, we know that an insurance license would be required, but apparently NASAA doesn't care about that."}, {"n": 16, "q": "KAPCO Securities is a broker-dealer registered with the SEC, doing business throughout the Midwest. KAPCO must meet the net capital requirements of", "a": "the SEC, even if one or more of the states in which they are registered has a higher net capital standard.", "b": "the state with the highest net capital requirements of the states in which it does business.", "c": "the state in which its principal office is located.", "d": "each state in which they do business.", "e": "SEC rules preempt those of the states. As long as the broker-dealer complies with the SEC's net capital rule, all state requirements are satisfied. It is state-registered investment advisers who must meet the net worth (or capital) requirements of the state in which their principal office is located."}, {"n": 17, "q": "Which of the following would be included in the USA's definition of an agent?", "a": "A research analyst for a broker-dealer who maintains a limited retail customer base.", "b": "An individual employed by an issuer.", "c": "A broker-dealer selling nonexempt securities to its customers.", "d": "A sales assistant of an agent who is responsible for mailing trade confirmations to the agent's clients.", "e": "Broker-dealers and sales assistants whose duties are clerical in nature are not included in the definition of an agent. An employee of an issuer would only be defined as an agent if the job function was selling the issuer's securities and neither they nor the transaction were exempt. A research analyst who maintains even a small clientele is an agent, as defined by the USA, and must register as such."}, {"n": 18, "q": "A broker-dealer registered in all 50 states, using both radio and television advertisements to promote its services, directs prospects to a toll-free number that will connect them with a registered agent. An existing customer living in New York calls and is connected to an agent in Cleveland who is registered in Ohio, Michigan, and Pennsylvania. The client asks the agent to recommend something that would fit the existing account's stated investment objectives. Under the Uniform Securities Act, the agent:", "a": "should transfer the call to an agent who is registered in New York.", "b": "can make a recommendation because the call was received in Ohio, a state in which the agent is registered.", "c": "can only recommend securities that are exempt from registration.", "d": "can make a recommendation because the call was made on an unsolicited basis from an existing client.", "e": "Agents must be registered in the state of residence of the client."}, {"n": 19, "q": "USATrade Securities, a FINRA member broker-dealer, is registered in 10 Midwest states. Regarding financial requirements, USATrade must meet those of", "a": "the state with the most stringent financial requirements.", "b": "the SEC.", "c": "the state in which the principal office of the member is located.", "d": "FINRA.", "e": "It may be assumed that a broker-dealer member of FINRA is also registered with the SEC. As such, when it comes to financial requirements, bonding, recordkeeping, and so forth, the SEC's requirements always trump those of the states."}, {"n": 20, "q": "Those persons meeting the Uniform Securities Act's definition of a broker-dealer in a state must, unless otherwise exempted, register in that state. Which of the following is correct regarding the initial registration and expiration of the registration of a broker-dealer?", "a": "The effective date of an initial registration is at noon on the 30th day after receipt of a completed application; expiration, unless renewed, is each December 31st.", "b": "The effective date of an initial registration is when ordered by the Administrator, and the same is true of the expiration date.", "c": "The effective date of an initial registration is when ordered by the Administrator, and the expiration, unless renewed, is each December 31st.", "d": "The effective date of an initial registration is at noon on the 30th day after receipt of a completed application; expiration, unless renewed, is on the anniversary date of the initial registration.", "e": "Under the USA, it states, \"If no denial order is in effect and no proceeding is pending under section 204, registration becomes effective at noon of the thirtieth day after an application is filed.\" Further, it states, \"Every registration or notice filing under this section expires December 31st unless renewed.\""}, {"n": 21, "q": "Under the USA, agent registrations expire", "a": "365 days after the effective date.", "b": "2 years after the effective date.", "c": "each year on December 31.", "d": "3 years after the effective date.", "e": "Every agent, broker-dealer, investment adviser, and investment adviser representative registration expires each year on December 31."}, {"n": 22, "q": "A broker-dealer is registered in States A and B. An agent of theirs is registered in State A, and one of the agent's clients moves from State A to State C. If the agent wishes to continue to do business with this client, which of the following statements is correct?", "a": "Only the broker-dealer must register in State C.", "b": "As long as they have five or fewer retail clients in State C, neither the broker-dealer nor the agent must register there.", "c": "Only the agent must register in State C.", "d": "Both the broker-dealer and the agent must register in State C.", "e": "As long as a broker-dealer has at least one retail client in a state, registration is required. Furthermore, an agent cannot do business with a client who has become a resident of a state unless she is registered as an agent of a registered broker-dealer in that state. Unlike investment advisers, there is no de minimis exemption for broker-dealers and agents."}, {"n": 23, "q": "Except as limited by the Securities Exchange Act of 1934, the state securities Administrator may require, by rule or order, that broker-dealers make or maintain which of the following records?\nI. Account ledgers\nII. Correspondence\nIII. Papers and memoranda\nIV. Blotters and books", "a": "II and III", "b": "III and IV", "c": "I, II, III, and IV", "d": "I and II", "e": "The Administrator may require broker-dealers to keep and maintain account ledgers, correspondence, papers and memoranda, and blotters and books, provided the state requirements do not exceed federal requirements under the Securities Exchange Act of 1934."}, {"n": 24, "q": "Under the Uniform Securities Act, an individual does not meet the definition of an agent if he is employed by a broker-dealer and only:", "a": "accepts unsolicited orders.", "b": "trades for the firm's market-making account.", "c": "represents the broker-dealer in effecting transactions between the issuer and underwriter.", "d": "serves as a partner, officer, or director of the firm with full-time responsibilities in back office management.", "e": "Broker-dealer employees who have only administrative or operational duties are not defined as agents under the USA. Any type of sales activity by an employee of a broker-dealer would require that individual to be registered as an agent."}, {"n": 25, "q": "In general, a broker-dealer is required to register with the SEC. An exception to that requirement would apply to a broker-dealer who", "a": "is currently registered with the SEC as an investment adviser.", "b": "maintains a place of business in a single state, only deals with residents of that states, and does not execute transactions in securities traded on a national exchange.", "c": "is registered with the Administrator of the states in which it does business and only deals with issuers of the securities it trades.", "d": "does not have a place of business in the state and limits its clientele to institutional clients.", "e": "The only exemption from SEC registration applies to broker-dealers functioning strictly on an intrastate basis. Many broker-dealers are registered with the SEC as both broker-dealers and IAs—one does not suffice for the other. The exemptions from state registration as a broker-dealer are much broader and would include the cases where the broker-dealer does not have a place of business in the state and its only clients are institutions or it effects transactions in this state exclusively with or through the issuers of the securities involved in the transactions."}, {"n": 26, "q": "Angelo lives and votes in State W. He winters in State C, splitting his time 60/40 between the two states. Angelo has a brokerage account with Sunset Investment Securities (SIS) and trades with an agent housed in SIS's State W office. SIS is also registered in States M and I but, having no place of business there, is not registered in State C. In order for Angelo's agent to handle the account, registration as an agent is required", "a": "solely with FINRA.", "b": "in State W.", "c": "in State C.", "d": "in State W and State C.", "e": "By not having a place of business in State C and only having a client who is temporarily in the state, SIS (and those functioning as its agents) qualifies for the snowbird exemption."}, {"n": 27, "q": "Which of the following is not included in the definition of broker-dealer as found in the Uniform Securities Act?", "a": "Investment advisers", "b": "Attorneys", "c": "Credit unions", "d": "Banks", "e": "In the Uniform Securities Act, it specifically states: \"Broker-dealer\" means any person engaged in the business of effecting transactions in securities for the account of others or for his own account. \"Broker-dealer\" does not include (1) an agent, (2) an issuer, (3) a bank, savings institution, or trust company. Attorneys are excluded from the definition of investment adviser, as long as their advice is incidental to their legal practice, but that exclusion does not apply to the term \"broker-dealer\". Even though credit unions engage in banking activity, they are not included in the exclusion. Being an investment adviser does not exclude a person from the need to register as a broker-dealer if that person is performing the functions of a BD."}, {"n": 28, "q": "Under the USA, an individual would not be considered an agent while representing the issuer in any of the following transactions except", "a": "promissory notes, such as commercial paper, with a maturity of nine months or less.", "b": "investment contracts issued in connection with an employee's stock purchases, savings, pension, profit-sharing, or similar employee benefit plan.", "c": "issuers in exempt transactions.", "d": "nonexempt, initial public offerings.", "e": "Persons who represent nonexempt issuers of new securities are agents under the USA unless it is stated that the transaction is exempt. Representing issuers in exempt transactions excludes the person from the definition of agent."}, {"n": 29, "q": "All of the following statements regarding broker-dealers are true except", "a": "they act in an agency capacity when executing orders to buy and sell securities on the various stock exchanges in the secondary market.", "b": "they may act as dealers who buy and sell securities for their own accounts.", "c": "they employ only registered investment adviser representatives.", "d": "they are regulated by the SEC as well as individual stock exchanges.", "e": "Agents work for broker-dealers, while investment adviser representatives work for investment advisers. The term broker-dealer is used because they sometimes act in an agency capacity (brokers) and other times in a principal capacity (dealers)."}, {"n": 30, "q": "Under the Uniform Securities Act, which of the following is responsible for notifying the Administrator when an agent changes his place of employment from one broker-dealer to another?", "a": "Former broker-dealer", "b": "Agent", "c": "New broker-dealer", "d": "The agent, the former employer, and the new employer", "e": "All three parties must notify the Administrator."}, {"n": 31, "q": "The antifraud provisions of the Uniform Securities Act apply to all of the following except", "a": "an individual employed by a registered broker-dealer whose sole function is selling commodity futures contracts.", "b": "newsletter publishers who do not give advice to subscribers on the subscribers' specific investment situations.", "c": "persons availing themselves of the de minimis exemption.", "d": "a broker-dealer registered pursuant to the limited registration option available to Canadian broker-dealers and their agents.", "e": "The Uniform Securities Act's antifraud provisions deal with securities; commodities are not a security. Even if one is exempt from registration due to meeting the de minimis exemption or is excluded from the definition of investment adviser under the publisher's exclusion, the antifraud provisions still apply. The same is true for those Canadian securities professionals who do business in the United States by using the limited registration option available to them."}]}, {"id": 12, "name": "Unit 12: State and Federal Securities Acts: The Uniform Securities Act and Its Administration", "key": "ADADACBDBBACABADDDBDDCBBBCBDB", "questions": [{"n": 1, "q": "John, an investment adviser, employs an investment adviser representative who is found guilty of defrauding many of the firm's clients over a long period of time. Which of the following are true under the Uniform Securities Act?The investment adviser representative is subject to criminal penalties specified in the act and to civil liabilities resulting from clients who sue as a result.John may be subject to civil liabilities resulting from actions taken by the investment adviser representative.John is not subject to civil liabilities as a supervisor if he can prove that he had no knowledge of the actions of the representative and, while exercising reasonable care, he could not have had knowledge of the violations.", "a": "I, II, and III", "b": "I and III", "c": "II and III", "d": "I and II", "e": "Persons convicted of willful violations are subject to the criminal penalties specified in the act (three years and/or $5,000 fine). Thus, the representative is subject to criminal penalties and civil liabilities resulting from clients who sue him for loss of money. The act subjects to civil liabilities any person supervising those who violate the law. However, a supervisor may not be held liable for the actions of those whom he supervises if it can be proved that the supervisor used reasonable care to discover and prevent the violations and has no knowledge of the violations."}, {"n": 2, "q": "Penalties for violations of the Uniform Securities Act include which of these?Fines of up to $5,000 and/or imprisonment for up to three years.Fines of up to $5,000 and/or imprisonment for up to five years.Imprisonment for three years and/or fines of up to $5,000, regardless of whether the violator had knowledge of the rule or order.Fines of up to $5,000 or imprisonment, regardless of whether an indictment had been returned later than five years after the alleged violation.", "a": "I, II, III, and IV", "b": "I, III, and IV", "c": "I, II, and III", "d": "I only", "e": "Under the Uniform Securities Act, penalties can include fines for up to $5,000, imprisonment for up to three years, or both. No person, however, may be imprisoned for a violation if he proves that he had no knowledge of the rule or order, and no indictment can be returned later than five years after the alleged violation. Remember the distinction between criminal penalties and civil liability."}, {"n": 3, "q": "An Administrator may summarily suspend the registration of an agent or an IAR pending final determination of proceedings under the Uniform Securities Act. However, the Administrator may not enter a final order without which of these?Appropriate prior notice to the applicant as well as the employer or prospective employer of the applicantAn opportunity for a hearingFindings of fact and conclusions of lawPrior written acknowledgment of the applicant", "a": "I, II, and III", "b": "I and II", "c": "I only", "d": "I, II, III, and IV", "e": "With the exception of those proceedings awaiting final determination, the Administrator must provide an appropriate prior notice to the applicant as well as the employer or prospective employer of the applicant and provide the opportunity for a hearing. In addition, the Administrator may only issue a final order after findings of fact and conclusions of law. An applicant is not required to provide written acknowledgment before an order is issued."}, {"n": 4, "q": "An offer to sell describes", "a": "the purchase of a new issue.", "b": "the exercise of warrants.", "c": "the receipt of a stock dividend.", "d": "the attempt to dispose of a security for value.", "e": "An offer to sell includes any attempt to dispose of a security for value. A stock dividend is not an offer or a sale, whereas the exercise of a warrant is a sale, not an offer."}, {"n": 5, "q": "The Uniform Securities Act provides for both civil and criminal prosecution. In which of these cases might an agent face civil liability?A sale was made of an unregistered, nonexempt security.During a sales presentation, the agent misstated a material fact that resulted in the prospect deciding to make the purchase.The agent was included in the judgment, along with the broker-dealer, for a civil infraction.", "a": "I, II, and III", "b": "I and III", "c": "II and III", "d": "I and II", "e": "These are all cases for civil, not criminal, liability. Unless it can be proven that the agent acted willfully and with knowledge, it is hard to have a criminal case."}, {"n": 6, "q": "An agent based in Alabama directs a solicitation to a customer who lives in Connecticut while the customer is temporarily in Indiana. The customer does not accept the offer until he arrives back in Connecticut. According to the Uniform Securities Act, the Administrators of which of the following states have jurisdiction?", "a": "Alabama and Indiana", "b": "Alabama and Connecticut", "c": "Alabama, Connecticut, and Indiana", "d": "Indiana and Connecticut", "e": "The Administrator from any state from which an offer is made, directed, or accepted has jurisdiction over the offer."}, {"n": 7, "q": "Under the Uniform Securities Act, which of the following negates a client's right to a civil suit for damages?The advice that is the subject of the suit was given more than three years ago.The client has died.The client willingly signed a statement waiving the adviser's compliance with the provision of the act on which the suit is based.", "a": "II and III", "b": "I only", "c": "I, II, and III", "d": "I and II", "e": "A civil suit under the terms of the USA must be filed within three years of the alleged infraction or two years from discovering the violation, whichever comes first. The death of the adviser or the client does not remove a cause of action for civil liability; it is the estate of the deceased client who is the plaintiff. In the case where the claim was against an individual securities professional, that individual's estate is liable. Waivers to statements signed by the client waiving the adviser's compliance with the provision of the act on which the suit is based are never valid on the exam."}, {"n": 8, "q": "The Administrator may deny registration of an agent because the agent", "a": "was convicted of a drug-related misdemeanor.", "b": "is being investigated by the SEC for possible insider trading violations.", "c": "is under investigation by the Administrator of another state.", "d": "was convicted of a felony within the past 10 years.", "e": "The Administrator may deny a registration for any felony conviction, not just those involving securities. If the misdemeanor conviction were securities related, that would be sufficient grounds for denial. However, denial would not be appropriate when a case is only in the investigation stage."}, {"n": 9, "q": "Under the Uniform Securities Act, which of the following are defined as sales?A gift of an assessable stockA gift of a nonassessable stockA security given as a bonus for purchasing a bondAn offer of securities", "a": "I and II", "b": "I and III", "c": "II and IV", "d": "III and IV", "e": "A sale is a contract or transaction for value. Therefore, when a security is given as a bonus in connection with the sale of another security, it is also considered a sale. Because an assessable stock may require a payment made by the recipient, the gift is considered a sale. The gift of a nonassessable stock is not a sale because it is not a contract for value. An offering of securities is not a transaction or sale of securities until the offer is accepted."}, {"n": 10, "q": "An agent is registered with a broker-dealer whose principal office is located in State X, but who also does business in State Y. However, the agent is licensed only in State Y and confines her business to residents of that state. The Administrator of State X has what kind of authority over this agent?", "a": "Can only take action against this agent when she is physically present in State X", "b": "Cannot check the records of the agent in State Y because it is not State X’s jurisdiction", "c": "Can check the records of the agent in State Y with no prior notification", "d": "Can check the records of the agent in State Y only with proper prior notification", "e": "Even though the broker-dealer is registered in State X, the agent in question is not; she is only registered in State Y. Therefore, the Administrator has no jurisdiction over the activities of this agent in a state other than his own."}, {"n": 11, "q": "The Administrator may impose disciplinary action against a registrant when the registrant has done which of these?Violated the provisions of federal securities lawEngaged in unethical practices, even if no law was brokenFailed to properly supervise an employee who committed prohibited practices as defined by the actFailed to lend money to a very good client", "a": "I, II, and III", "b": "I and III", "c": "II, III, and IV", "d": "II and IV", "e": "Disciplinary action may be imposed by a state Administrator for violations of federal securities regulations, improper supervision, and unethical practices committed, whether or not a law was broken. Even in those few cases where a broker-dealer or investment adviser is permitted to lend money to a client, there is never a case where they are obligated to do so."}, {"n": 12, "q": "Under the Uniform Securities Act, a sale includes all of the following except", "a": "a disposition of a security for value.", "b": "a contract of sale.", "c": "a pledge of securities for the purpose of obtaining a margin loan.", "d": "a contract to sell.", "e": "Under the Uniform Securities Act, a sale includes every contract of sale, contract to sell, or disposition of a security for value. A pledge of securities is not a sale because the title to the shares is not transferred; it is merely assigned. This is similar to a loan on your car. The title has an assignment to the lender, but you are still the owner because you have not sold the car."}, {"n": 13, "q": "Under the USA, the Administrator may take all of the following actions except", "a": "issue an arrest warrant for an investment adviser representative.", "b": "file a civil complaint against an agent.", "c": "file a criminal complaint against an investment adviser.", "d": "issue a cease and desist order against a broker-dealer.", "e": "An arrest warrant can only be issued by a court of law. Filing both civil and criminal complaints and issuing cease and desist orders are all within an Administrator's power."}, {"n": 14, "q": "Under the USA, which of the following fits the definition of a sale?", "a": "Issuing a prospectus", "b": "Contract to dispose of a security", "c": "Solicitation of an offer to buy a security for value", "d": "Attempt to dispose of a security for value", "e": "Sales involve any contract or disposition for value; solicitations and attempts to dispose are offers."}, {"n": 15, "q": "An Administrator may summarily deny or revoke a security's exemption", "a": "without a hearing if the issuer is given an opportunity for a hearing after the revocation.", "b": "if the Administrator, in a court of competent jurisdiction, proves that a security does not qualify for an exemption.", "c": "if the Administrator determines that an exemption applicable to federal covered securities is inconsistent with state securities law.", "d": "for a federal covered security if its issuer is in violation of state law.", "e": "An Administrator may summarily deny or revoke a security's exemption without a hearing if the issuer is given an opportunity for a hearing after the revocation. Upon the entry of a summary order, the Administrator shall promptly notify all interested parties that it has been entered and of the reasons therefor and that within 15 days of the receipt of a written request the matter will be set down for hearing.The issuer requesting an exemption must prove the exemption; this is not the responsibility of the Administrator. The Administrator cannot revoke exemptions of federal covered securities."}, {"n": 16, "q": "Which of the following statements regarding the Uniform Securities Act (US", "a": "II and III", "b": "I and II", "c": "I and III", "d": "II and IV", "e": "If the sale of a security is in violation of the USA, the buyer may sue the seller to recover the money paid for the security. If the seller of a security discovers that he made an illegal sale, he may offer to repurchase the security at the price paid plus, not less, interest charges. This offer of rescission is held open for 30 days. The buyer of the securities may not sue if he failed to accept or reject the offer within that time period. Criminal penalties for violations of the USA are punishable by fines of up to $5,000, imprisonment for up to three years, or both."}, {"n": 17, "q": "Fusion Financial is a broker-dealer registered in States A, B, and C, with its home office in State B. A complaint is filed against the firm by a client who resides in State A. Under the powers granted under the Uniform Securities Act, the Administrator of State B could do all of the following except", "a": "subpoena witnesses from State C.", "b": "gather evidence from State B.", "c": "gather evidence from State A.", "d": "issue an injunction against Fusion Financial.", "e": "​​An Administrator has the power to gather evidence both within and outside of the home state, as well as subpoena evidence and witnesses in any state.​ Only the courts can issue an injunction.​"}, {"n": 18, "q": "An Administrator does not have jurisdiction over an offer to sell that is made where?In a TV broadcast originating outside the stateIn a newspaper published outside the stateIn a newspaper published inside the state, where more than 2/3 of its circulation is outside the state", "a": "II only", "b": "II and III", "c": "I only", "d": "I, II, and III", "e": "Under the broadcast and publishing exceptions, the Administrator does not have jurisdiction if the offer is made in a TV or radio broadcast originating outside the state or in a newspaper published outside the state. Furthermore, if a newspaper is published inside a state but more than 2/3 of its circulation is outside the state, the Administrator does not have jurisdiction."}, {"n": 19, "q": "Which of the following statements is true?An Administrator can suspend a pending registration on a summary basis.An Administrator may not issue a stop order without prior notice and opportunity for a hearing.An Administrator may cancel a registration for the same reasons he revoked or suspended a registration.", "a": "III only", "b": "I and II", "c": "I only", "d": "II and III", "e": "An Administrator can, on a summary basis, suspend a pending registration but may not issue a stop order without a prior notice and an opportunity for a hearing. Cancellation is different from revocation and is not a result of disciplinary action; it occurs when a registrant no longer exists, ceases to do business, is declared mentally incompetent, or cannot be located."}, {"n": 20, "q": "Under the USA, what is the maximum penalty for a securities-related felony?", "a": "$5,000 and five years' imprisonment", "b": "$3,000 and three years' imprisonment", "c": "$3,000 and five years' imprisonment", "d": "$5,000 and three years' imprisonment", "e": "Under the USA, the maximum penalty is $5,000 and/or three years' imprisonment for a securities-related felony."}, {"n": 21, "q": "An agent mistakenly sold an unregistered, nonexempt security to a customer. Which of the following actions should the broker-dealer take?Offer to buy the security back from the customer.Ask the customer to sign a customer agreement.Register the stock by notification.Offer to pay interest at an annual rate determined by the Administrator, less income paid, from the date the security was purchased.", "a": "I and III", "b": "II and III", "c": "I, II, III, and IV", "d": "I and IV", "e": "In the case of an agent who mistakenly sells an unregistered, nonexempt security, the broker-dealer should offer to buy back the security from the customer and pay the customer interest on the amount invested in the security for the period from the original purchase to the resale back to the firm, minus any income or profit realized by the client on the security. This is known as the right of rescission."}, {"n": 22, "q": "A client of a broker-dealer files a civil suit claiming damages for the sale of an unregistered security. During the proceedings, the client suffers a fatal stroke. The suit", "a": "has no basis, as a civil suit may not be brought for this reason.", "b": "is dismissed.", "c": "is continued by the deceased's executor.", "d": "is continued by the deceased's spouse.", "e": "Death of a party to a suit does not end the suit. Unless the account was specified as a joint account with rights of survivorship, the executor of the deceased's estate will continue the suit."}, {"n": 23, "q": "Which of the following involves an offer or sale?", "a": "A pledge of stock", "b": "A gift of an assessable security", "c": "An exchange of securities due to a reorganization", "d": "A stock dividend", "e": "The gift of an assessable security, where the recipient may be required (assessed) to put up money, involves both an offer and a sale."}, {"n": 24, "q": "Which of the following statements regarding agent registration under the Uniform Securities Act are true?In the absence of any action by the Administrator, the effective date of a registration is noon of the 30th day.The Administrator may initiate a disciplinary action within two years of an agent's withdrawal of registration.The administrator may request the agent furnish a statement of assets and liabilities.If, before the effective date of the registration, the Administrator requires amendments to the application, the registration will be considered to have first been filed upon filing of those amendments.", "a": "I and II", "b": "I and IV", "c": "II and III", "d": "III and IV", "e": "Normally, registration of persons becomes effective at noon of the 30th day following filing. If the Administrator requires the filing of amendments, the clock starts over again with the filing of those amendments. Agents do not have financial requirements, and the Administrator has a maximum of one year after termination to initiate any actions."}, {"n": 25, "q": "An individual applying for registration as an investment adviser representative could be denied registration by the Administrator for what reasons?The applicant had no previous securities experience.The application was incomplete.The applicant was not a resident of the state.There was an order of suspension in effect in another jurisdiction.", "a": "I and II", "b": "II and IV", "c": "I and IV", "d": "II and III", "e": "An incomplete application and a suspension in another jurisdiction are causes for an Administrator to deny registration to an IAR."}, {"n": 26, "q": "In which of the following circumstances has John, employed at AAA Securities Corporation, made an offer as defined in the USA?John calls a long-standing client, Brenda, to indicate that a security on his firm's restricted list is suitable for her portfolio. John indicates that he cannot sell the securities unless Brenda requests them on an unsolicited basis. Brenda considers making the purchase but ultimately declines.John discovers that Brenda has inherited shares in a manufacturing firm trading on the New York Stock Exchange and suggests that she sell them to him in a private transaction in which no commission would be charged.John owned XYZ securities for several years and decided to transfer them to his college's endowment fund in lieu of giving a cash gift. He then took a tax deduction for the value of the securities transferred.Baxter, as a reward for the years of John's service as his agent, transferred $5,000 worth of XYZ Corporation securities to John, claiming the transfer as a business expense on his tax form.", "a": "I, II, III, and IV", "b": "I, II, and III", "c": "I and II", "d": "I only", "e": "Under the USA, the term offer includes an attempt to dispose of securities for value or a solicitation of an offer to buy a security. Gifts, whether legal or not, are not considered an offer except when dealing with gifts of assessable stock."}, {"n": 27, "q": "Included among the powers of the Administrator is the ability to", "a": "deny the registration of a securities professional, if doing so is in the public interest.", "b": "request that the court appoint a receiver to freeze the bank accounts of a broker-dealer who is the subject of an injunction.", "c": "arrest an agent who violates the USA.", "d": "sentence an investment adviser representative who has been convicted of fraud to a prison sentence, not to exceed three years.", "e": "If a temporary or permanent injunction is issued against any securities professional, upon request of the Administrator, a receiver or conservator may be appointed over the defendant's assets. The Administrator cannot arrest but can seek a warrant. In order to deny a registration, not only must it be in the public interest but also there must be some other issue, such as insolvency, incomplete application, et cetera. Although the maximum prison sentence under the USA is three years, it is the courts that do the sentencing, not the Administrator."}, {"n": 28, "q": "The state securities Administrator has a broad range of powers. However, one thing the Administrator cannot do is", "a": "submit evidence to the state’s attorney general requesting prosecution of an agent accused of stealing funds from a client.", "b": "issue an order revoking the registration of an agent who has stolen funds from a client.", "c": "require a surety bond of an agent who has discretionary power over a client’s account.", "d": "issue an order to arrest an agent who has stolen funds from a client.", "e": "Administrators, as powerful as they may be, do not have the power to arrest anyone. They can turn over evidence to the state's attorney general who may then issue an arrest order, but that's as far as the Administrator can go. Revocation of an agent's registration is a power possessed by the Administrator, as is the ability to require a surety bond when an agent has discretionary authorization over a customer's account."}, {"n": 29, "q": "Which of the following constitutes either an offer or a sale?", "a": "Peggy receives a gift of nonassessable securities.", "b": "Thomas is offered warrants by his registered agent as the best way to take a position in XYZ Corporation.", "c": "Sierra pledges her portfolio to secure a loan for her son who plans to use the proceeds of the loan to buy a major interest in a publicly traded company.", "d": "Marge, a wealthy client, receives salable stock in lieu of a cash dividend as a result of her large holdings in ABC.", "e": "The agent who offered Thomas warrants has made an offer of securities under the USA. Sierra's pledge of securities to her son does not constitute a sale or offer to sell. Marge's receipt of a stock dividend is not a sale or an offer to sell because she did not get anything of value in return for the shares. A gift of nonassessable stock is not a sale; it is a gift."}]}, {"id": 13, "name": "Unit 13: Ethical Practices and Fiduciary Obligations", "key": "DCCAABBBAADCCBBAAABBCACBACBACDBDDBCCCCDDADACDCBDDDBA", "questions": [{"n": 1, "q": "Which of the following conditions would most likely meet compliance standards of state regulators?", "a": "At a minimum, a firm that permits use of social media sites must hold biannual training as part of its continuing education obligations.", "b": "Only those in a supervisory role need to recognize the difference between business and nonbusiness communications.", "c": "Maintaining an under-the-radar system of monitoring social media use by its agents is permissible when determining compliance with NASAA's rules.", "d": "Both supervisory personnel and agents need to understand the difference between interactive and static content.", "e": "Before allowing associated persons to use social media for business purposes, a firm's policies and procedures must provide for personnel training and education relating to the parameters of permitted use. Both supervisory personnel and agents need to understand the difference between interactive and static content and between business and nonbusiness communications. A firm should consider requiring training in the use of social media prior to permitting use. At a minimum, a firm that permits use of social media sites must hold annual training as part of its continuing education obligations."}, {"n": 2, "q": "One way in which an investment adviser acting in the capacity of an agent in a transaction with a client differs from a broker-dealer performing the same task is that the investment adviser", "a": "may not charge a commission on the transaction.", "b": "shall notify the Administrator of its capacity in the proposed transaction.", "c": "shall obtain client consent before completion of the transaction.", "d": "shall disclose the agency capacity before the transaction.", "e": "In order to act as an agent (or principal) in a trade with an advisory client, there are two requirements:Client receives full written disclosure as to the capacity in which the adviser proposes to actConsent of the clientBoth of these are required before the completion of the transaction."}, {"n": 3, "q": "Which of the following are prohibited practices?\nAn investment advisory firm organized as a partnership fails to inform its clients of the departure of a partner with a very small interest in the partnership.\nAn investment advisory firm charges an annual fee equal to 2% of the first $250,000 in assets under management; 1% of the next $500,000; and 0.5% for everything in excess of $750,000.\nThe majority stockholder of a registered investment adviser pledges his stock as collateral for a loan taken out by the firm to expand its services without obtaining client consent for assignment of their contracts.\nAn investment advisory firm engages in agency cross transactions.", "a": "I and IV", "b": "I, II, III, and IV", "c": "I and III", "d": "III and IV", "e": "Any change in the ownership of an investment advisory firm organized as a partnership, no matter how small, requires notification to all clients within a reasonable amount of time. If the firm is structured as a corporation, pledging a controlling interest in the company's stock is viewed as an assignment of the contracts. This requires the consent of the clients. Agency cross transactions—that is, where the adviser represents both sides of the trade—are permitted as long as the adviser makes the proper written disclosures and does not make the buy-sell recommendations to both parties. Choice II is an example of a graduated fee schedule where the management fee is reduced as the size of the account increases—there is nothing prohibited about this very common practice in the industry."}, {"n": 4, "q": "Under NASAA's Model Rule on Unethical Business Practices of Investment Advisers, Investment Adviser Representatives, and Federal Covered Advisers, the contract between an investment adviser and its clients shall", "a": "be in writing.", "b": "call for annual renewal.", "c": "project expected performance.", "d": "charge a fixed fee for the length of the contract.", "e": "Under the NASAA Model Rule, all contracts, both initial and renewal, must be in writing. There is no standard renewal term and the fee can vary based on assets under management. There is no way to project performance."}, {"n": 5, "q": "Under the antifraud provisions of the Investment Advisers Act of 1940, an investment adviser must disclose to clients", "a": "the association between the investment adviser and the broker-dealer with whom the overall investment plan will be implemented.", "b": "the number of clients with whom the adviser does business.", "c": "that the adviser has never been subject to disciplinary action or censure by the SEC.", "d": "that any transactions made on the adviser's own account are consistent with the advice given to clients.", "e": "Advisers must disclose to clients any outside interests or potential conflicts of interest involved in their recommendations or transactions for those clients. Failure to disclose additional compensation related to the advisory function would be considered fraudulent. If an advisory firm is also a broker-dealer and will enjoy transaction-related compensation if the advisory client acts on the adviser's recommendation, this must be disclosed in writing and the client must consent. There is no requirement that an adviser disclose to its clients the number of its other clients. The adviser is required to disclose disciplinary actions taken by regulatory authorities but not the absence of such actions. The adviser is not required to disclose its consistent transactions but must make disclosure if its transactions are not consistent with the advice given."}, {"n": 6, "q": "Western Securities, Inc., (WSI) is a broker-dealer that also offers portfolio management. One of WSI's portfolio managers notices an article on asset allocation that harmonizes with WSI's investment philosophy. If WSI should post a link to this article on its website, it would probably be considered", "a": "estrangement.", "b": "adoption.", "c": "entanglement.", "d": "fulfillment.", "e": "A firm will be responsible for the content of a linked third-party site if the firm adopts its content on any of the firm's sites. Adoption is defined as a firm's endorsement of the content of a third-party site. This is not illegal, but the firm is responsible for the content of the linked information and must be sure that it complies with the firm's policies. Entanglement is adoption taken one step further. This is when the firm (or one of its representatives) contributes to the third-party information and then posts it."}, {"n": 7, "q": "An agent receives a notice of execution for 500 shares on a customer's order for only 400 shares. Which of the following actions should he take?", "a": "Promptly sell the 100-share overage at the best available price.", "b": "Report the problem immediately to his supervisor.", "c": "Promptly report the execution of 500 shares to the customer and waive commissions on the overage.", "d": "Break the trade within five minutes, enter a corrected order, and place the transaction on the error log.", "e": "Agents are not empowered to fix errors. Agents should report errant trades to a supervisory individual immediately."}, {"n": 8, "q": "Great Western Securities, Inc. (GWSI), a registered broker-dealer, is also the distributor for the Westcore Value Fund. When an agent registered with GWSI recommends the purchase of the Westcore Value Fund, the agent", "a": "shall obtain the approval of a designated supervisor before making the recommendation.", "b": "shall disclose the potential conflict of interest to the client.", "c": "shall ensure that the fund's sales charge is fair and reasonable.", "d": "is committing an unethical business practice by recommending an affiliated entity.", "e": "Anytime a broker-dealer is also the distributor of a mutual fund, disclosure of the potential conflict of interest shall be made whenever that fund is recommended to the firm's clients. Agents have nothing to do with the sales charge levied by a mutual fund—that is stated in the fund's prospectus."}, {"n": 9, "q": "A state-registered investment adviser would be permitted to", "a": "use Part 2 of Form ADV to satisfy the brochure requirement.", "b": "make annual delivery of the brochure within 150 days of the end of the fiscal year.", "c": "deliver the brochure to a new client no later than 48 hours after entering into the contract.", "d": "use Part 1 of Form ADV to satisfy the brochure requirement.", "e": "Part 2, but not Part 1, of Form ADV may be used in lieu of a fancy brochure. The brochure must be delivered to a new client no later than the entry of the contract—the 48 hours is a \"prior to\" entry requirement in order to avoid having to offer a penalty-free withdrawal. That rule applies only to state-registered investment advisers. The annual delivery must be made within 120 days under both state and federal law, not 150."}, {"n": 10, "q": "When recommending a corporate security, an IAR indicates that the top officers of the company were responsible for the rapid growth of LJB Corporation, a well-known, successful firm in the same industry. Under the Uniform Securities Act, all of the following statements by the agent are permitted except", "a": "there is no doubt that the officers will repeat the success they enjoyed with LJB Corporation.", "b": "the president of this company was responsible for LJB Corporation's success.", "c": "time will tell whether the officers can repeat the success they enjoyed with LJB Corporation.", "d": "the president of this company used to run LJB Corporation.", "e": "This statement implies guaranteed performance and is not permitted."}, {"n": 11, "q": "When opening an account at a broker-dealer, if the most recent copy of the firm's fee schedule is not available, NASAA recommends that the client", "a": "promptly notify the Administrator of the firm's failure to comply.", "b": "go ahead with the account opening but refrain from trading until its receipt.", "c": "select another broker-dealer and open the account there.", "d": "not place any assets in the account until it is provided.", "e": "It is proper for fees to be disclosed at the time a customer account is opened. If not presented, clients should ask for the fee schedule and make sure it's up to date. If it is not readily available, clients should not place any assets into the account until it is provided. NASAA believes that clients have the right to know the fees in advance."}, {"n": 12, "q": "A client, who is a famous tennis player, offers to record a testimonial for a covered investment adviser. The recording will be used in a television commercial. Under the SEC's Marketing Rule for Investment Advisers, the firm may", "a": "use the testimonial, provided the athlete receives no compensation.", "b": "go ahead with the recording only if it is an endorsement rather than a testimonial.", "c": "use the testimonial, provided disclosure is made that the athlete is a client and about the extent of any compensation paid.", "d": "have to file the testimonial with the SEC.", "e": "Testimonials promoting investment advisers' services are permitted under the SEC rule. The rule distinguishes between a testimonial and an endorsement. The former is from a client and the latter is from someone who is not a client. When accepting a testimonial, the fact that the person is a client must be disclosed. Disclosure is also required if any compensation is being paid. Advertisements are not filed with the SEC."}, {"n": 13, "q": "Under the Investment Advisers Act of 1940, in which of the following cases has an investment adviser acted improperly by not making appropriate disclosures to clients?\nAn adviser that requires prepayment of $1,000 in fees, nine months in advance, has liabilities that exceed its assets and does not disclose this fact to clients.\nAn adviser that has investment discretion over client accounts cannot meet its financial obligations as they come due and does not disclose this fact to clients.\nAn adviser that does not require prepayment of fees and does not have discretion over accounts or custody of client securities or funds has just been found by a state court to have violated a rule issued by the SEC and does not disclose this fact to clients.", "a": "I and III", "b": "I, II, and III", "c": "II and III", "d": "I and II", "e": "An adviser's financial impairment must be disclosed to clients if the adviser has discretion, has custody, or requires prepayment of more than $1,200 in fees, six or more months in advance. Legal or disciplinary action taken against an adviser by a court or a regulatory authority within the past 10 years must be disclosed to clients in any case. Note also that by requiring prepayment of over $1,200 in fees, six or more months in advance, an adviser is required to include an audited balance sheet with Part 2 of Form ADV, which must be filed with the SEC and made part of the adviser's disclosure brochure."}, {"n": 14, "q": "Defalcator Investment Planning (DIP) has $175 million in AUM and has offices in States A, K, and R. DIP would be required to provide a balance sheet as part of its brochure if it charged fees of", "a": "$1,500 for the next three months of advisory service.", "b": "$1,500 for the next year's advisory service.", "c": "$600 for the next six months of advisory service.", "d": "$1,200 for the next six months of advisory service.", "e": "Federal covered investment advisers, who charge substantial prepayment of advisory fees, must include a balance sheet with their brochure. The definition of a substantial prepayment is more than $1,200, six or more months in advance. The correct choice is the only one meeting both requirements. Remember, it isn't $1,200 or more, it is more than $1,200 and it must be for at least six months of service to count. Please notice that with $175 million in AUM, DIP must be SEC registered; the location of its offices is irrelevant to the question."}, {"n": 15, "q": "As long as properly disclosed, a broker-dealer would be permitted to charge a fee for all of these except", "a": "annual maintenance fees.", "b": "solicitation of proxies.", "c": "issuing a stock certificate.", "d": "wiring funds to the client's bank.", "e": "Broker-dealers are not permitted to charge for soliciting proxies; the issuer is responsible for reimbursing the broker-dealer for any of its expenses. All of the other charges are permitted if fully disclosed to clients. This is a case where you answer the question correctly because you know the other choices are permitted charges. On the exam, the correct choice might be something that is not covered in the course. However, as is the case with this question, the three incorrect choices are well described in the LEM."}, {"n": 16, "q": "Mary is a sole proprietor investment adviser registered with the SEC. Eight years ago, she was the subject of an SEC investigation involving improper actions between her customers and herself, which resulted in a $5,000 fine. Under the Investment Advisers Act of 1940, Mary's obligation to her clients is to do which of these?\nDisclose to prospective clients in her Form ADV, Part 2 that she was the subject of a proceeding and the proceeding's outcome.\nMake disclosures in her Form ADV, Part 2 regarding the case only if the prospect becomes a client.\nMake disclosures in her Form ADV, Part 2 only if the event was resolved in her favor or was reversed, suspended, or vacated.", "a": "I only", "b": "II only", "c": "I, II, and III", "d": "I and III", "e": "If an investment adviser has been the subject of a material criminal, civil, or regulatory action within the past 10 years, that fact must be disclosed to all clients and prospective clients in Form ADV, Part 2A. The only time disclosure of an investigation need not be made is when the event was resolved in her favor or was reversed, suspended, or vacated. In other words, no guilty verdict, no fine. Unlike broker-dealers, where only a handful are structured as sole proprietorships, that structure is not unusual for investment advisers, especially those registered at the state level."}, {"n": 17, "q": "Which types of accounts are billed a single fee that includes a group of services, such as execution of transactions and advice?", "a": "Wrap fee accounts", "b": "Margin accounts", "c": "Option accounts", "d": "Discretionary accounts", "e": "Wrap fee accounts are accounts for which firms provide a group of services—such as asset allocation, portfolio management, executions, and ad

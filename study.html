ministration—for a single fee. Wrap fee accounts are generally considered investment advisory accounts."}, {"n": 18, "q": "An investment adviser who is affiliated with a broker-dealer recommends only products that are provided through that broker-dealer. This is", "a": "permitted following disclosure of the potential conflict of interest.", "b": "prohibited and a violation.", "c": "permitted without restriction.", "d": "prohibited only if the adviser participates in commissions in conjunction with sales of the proprietary products.", "e": "It is not prohibited for an investment adviser to limit recommendations to proprietary products available through an affiliated broker-dealer. However, the fact that this is a potential conflict of interest must be disclosed to the client."}, {"n": 19, "q": "Paradime Investment Group (PIG), an SEC-registered broker-dealer with offices in 22 states, has recently begun offering a wrap fee program. When promoting this new program to existing brokerage clients, it would be appropriate to point out that the wrap fee charges cover which of the following services?", "a": "Free ATM usage for PIG's debit card and wiring funds to the client's bank", "b": "Investment advice and execution of brokerage transactions", "c": "Research reports and seminar fees", "d": "Financial planning and securities recommendations", "e": "Although firms can bundle a number of items into their wrap fee accounts, the two primary services that are always present are advisory services and execution of trades. Research reports and seminar fees are items that are usually provided by broker-dealers to investment advisers as soft-dollar compensation."}, {"n": 20, "q": "Differences between static and interactive content on social media include which of these?\nOnly static content can be reused by others.\nOnly static content needs preapproval.\nOnly static content can be changed by the person who originated it.\nOnly interactive content can be commented on by others.", "a": "I and IV", "b": "II and IV", "c": "I and III", "d": "II and III", "e": "Static content requires preapproval. Interactive content can be reused by others and can be commented on by others. Both static and interactive content can be changed by its originator, but static can be changed only by its originator and interactive by the originator or others."}, {"n": 21, "q": "In their advertising campaigns, state-registered investment advisers are prohibited from doing all of the following except", "a": "showing past performance of the best performing recommendations.", "b": "exaggerating the capabilities of the firm and its personnel.", "c": "offering free services.", "d": "guaranteeing future performance.", "e": "It is not unethical to advertise free services as a benefit of using a firm, but failing to supply services offered as free is unethical. Guaranteeing future performance and exaggerating the capabilities of the firm and its personnel are unethical. When showing past performance of recommendations, investment advisers are not permitted to cherry-pick the best performers; all recommendations must be shown."}, {"n": 22, "q": "When a broker-dealer engages in a customer transaction from its own account, which of the following statements are true?\nPartners of the broker-dealer are trading in their personal accounts.\nThe broker-dealer is trading from its inventory with customers.\nThe broker-dealer must disclose its capacity as a principal in the transaction.\nThe broker-dealer must disclose its capacity as an agent in the transaction.", "a": "II and III", "b": "III and IV", "c": "I and III", "d": "I and IV", "e": "The Uniform Securities Act defines a broker-dealer as a legal person (entity) engaging in the business of effecting securities transactions for the account of others or for its own account. In this context, trading for its own account means that the broker-dealer is trading from its inventory with customers. The broker-dealer has an ethical responsibility to disclose its capacity as a principal in the transaction. When trading for its own account, a broker-dealer is functioning as a principal or dealer. When trading for the accounts of others with no participation as a direct party to the trade, a broker-dealer functions in an agency capacity."}, {"n": 23, "q": "A state-registered investment adviser offers wrap fee programs to certain clients. Which of the following statements about wrap fee arrangements is not true?", "a": "Nonmaterial changes to wrap fee programs must be disclosed to the Administrator within 90 days of fiscal year-end.", "b": "Information in Appendix 1 of Form ADV, Part 2A must also be contained in client disclosure documents.", "c": "Because this investment adviser offers wrap fee programs, it must make certain annual disclosures to the SEC.", "d": "Material changes to wrap fee programs must be filed promptly with the Administrator.", "e": "As a state-registered investment adviser, all filings are with the Administrator, not the SEC. In the case of wrap fees, the form used is Appendix 1 of Form ADV, Part 2A. Every investment adviser, state-registered or federal covered, must update the information on file within 90 days of the end of the adviser's fiscal year. One of the most important parts of this is the annual updating amendment regarding eligibility to register with the SEC or remain state-registered. Even nonmaterial information is included. However, the customer brochure, or a summary, needs to be delivered only if there are material changes."}, {"n": 24, "q": "If an investment adviser has engaged a website designer, what may the designer include on the website?", "a": "Compensated third party endorsements from someone subject to the bad-actor rules", "b": "A general description of the types of investment advisory programs offered by the firm", "c": "Recommendations on specific stocks", "d": "Recommendations on specific managed investments, such as mutual funds", "e": "It is permissible to post general information about an investment adviser on a public website, which comes under the SEC definition of advertising. Advertising implies that the publisher of the material has no control over who may view it. Thus, recommendations of specific securities, including managed products, are prohibited because it is not possible to determine the suitability of specific investments for unknown viewers. Although showing past performance is permitted if certain conditions are met, investment advisers cannot cherry-pick from past performance. That is, if the ad is going to show past performance of recommendations, it must show all of them—losers as well as winners."}, {"n": 25, "q": "Under the brochure rule of the Investment Advisers Act of 1940, each client must be", "a": "delivered a written disclosure statement no later than at the time of agreement to contract for the adviser's services.", "b": "delivered a written disclosure statement no later than 48 hours after signing the contract", "c": "offered a written disclosure statement at the time of signing the contract", "d": "offered a written disclosure statement at least 48 hours before signing a contract.", "e": "No agreement between an investment adviser and a client may commence without delivery of the written disclosure statement known as the adviser's brochure. Thereafter, SEC rules require that a brochure—or summary of material changes, if any—be delivered to all clients within 120 days of the end of the adviser's fiscal year. If there are no material changes, a brochure does not have to be sent."}, {"n": 26, "q": "When an agent recommends a proprietary mutual fund to a client, it is considered", "a": "a violation of the agent's fiduciary responsibility.", "b": "an unethical business practice.", "c": "a potential conflict of interest.", "d": "an obvious attempt to maximize personal compensation.", "e": "There is nothing improper about recommending a proprietary mutual fund, as long as the potential conflict of interest is disclosed. It is investment advisers and their representatives who have a fiduciary responsibility to their clients; agents operate under a best interest standard, which is not quite the same."}, {"n": 27, "q": "When communicating with clients, which of the following designations may not be used?", "a": "MBA", "b": "RIA", "c": "CLU®", "d": "CFP®", "e": "The initials RIA do not represent a specific designation and may not be used in communications with clients. Registered investment adviser is the proper term. The other designations are permitted, assuming, of course, that they were earned."}, {"n": 28, "q": "As an incentive to encourage clients to invest in a particular stock recommended by the broker-dealer, clients are told that anytime within six months after the purchase date, they may sell the stock back to the firm at original cost plus interest at the state's legal rate. This would be", "a": "a prohibited guarantee against loss.", "b": "an offer that could only be made to accredited investors.", "c": "a right of rescission.", "d": "a violation of the antifraud provisions of the Uniform Securities Act.", "e": "Offering to buy back a stock at its original cost, even without paying interest, is a prohibited guarantee against loss. Rescission is only when there was something improper about the sale. Technically, this offer is not a case of fraud, and in any event, we must always select the answer that best addresses the question—in this case, a guaranteed price."}, {"n": 29, "q": "Under NASAA's Model Rule on Unethical Business Practices of Investment Advisers, Investment Adviser Representatives, and Federal Covered Advisers, the contract between an investment adviser and its clients shall include all of the following except", "a": "the services to be provided.", "b": "whether the contract grants discretionary power to the adviser.", "c": "a provision to reduce or waive fees in the case of underperformance.", "d": "the formula for computing the fee.", "e": "There is never any case where waivers of this nature would be permitted."}, {"n": 30, "q": "The most common way in which to distinguish whether social media content is static or interactive is the ability for others to", "a": "link to it.", "b": "comment on it.", "c": "like it.", "d": "change it.", "e": "Static content can only be changed by the originator (or someone under that person's control)."}, {"n": 31, "q": "Which of the following would be a violation of the NASAA Contents of Investment Advisory Contract Model Rule?", "a": "An investment adviser permits clients to renew their investment advisory contracts by email.", "b": "Without the consent of advisory contract holders, the owner of a majority of the stock of the advisory firm pledges that stock to a bank as collateral for a loan enabling the firm to acquire better cybersecurity technology.", "c": "It is indicated that a performance-based contract has a fee arrangement that may create an incentive for the investment adviser to make investments that are riskier or more speculative than would be the case in the absence of a performance fee.", "d": "An investment adviser organized as a partnership has the practice of notifying clients of any change in the membership of the partnership within a reasonable time after the change.", "e": "The NASAA Contents of Investment Advisory Contract Model Rule states that no direct or indirect assignment or transfer of the contract may be made by the investment adviser without the consent of the client or other party to the contract. Pledging a majority interest in the company as collateral for a loan to the business is considered an indirect assignment; the reason for the loan is of no significance. All contract renewals for state-registered advisers must be in writing—email is considered written communication. Notification of changes to members of the partnership and warning of the incentive in a performance-based contract are requirements of the Model Rule."}, {"n": 32, "q": "A state-registered investment adviser would like to employ the services of an individual as a solicitor to help bring in more business. The solicitor will be compensated by receiving a percentage on all assets placed under management. In order to do this, all of the following must be complied with except", "a": "the solicitor is considered a supervised person.", "b": "the terms of the investment adviser's compensation must be spelled out.", "c": "the solicitor must be registered as an investment adviser representative in order to receive compensation based upon advice.", "d": "the client must sign the advisory contract at the same time that the investment adviser's brochure is delivered.", "e": "The investment advisor's (IA's) brochure must be delivered prior to or at the time of the initial sales presentation. As a practical matter, the signing of the contract generally won't take place until the prospective client decides to engage the services of the IA. Any individual employed by an investment adviser whose role is soliciting for advisory clients must be registered as an IAR. Do not confuse this with unaffiliated third parties who are endorsing the investment adviser for compensation."}, {"n": 33, "q": "Under the USA, all of the following statements are true regarding investment advisory contracts except", "a": "they can allow fees to be performance related only under certain limited circumstances.", "b": "they cannot be assigned without customer approval.", "c": "they must be in writing.", "d": "they cannot allow for prepaid advisory fees.", "e": "Nothing in the USA prohibits prepaid advisory fees. The contract must describe the nature of these fees and the circumstances, if any, under which any or all of the prepaid fee may be returned in the event of early cancellation of the contract. The USA requires initial and renewal contracts to be in writing and to state that assignment may take place only with the client's consent. There are certain circumstances, such as an investor with a net worth of more than $2.2 million, where performance-based fees are permitted."}, {"n": 34, "q": "Which of the following are prohibited practices?\nAn investment adviser transferred a client's account to a brokerage house because the account went below the firm's minimum size and then informed the client.\nAn investment adviser organized as a partnership did not notify its clients of the departure of a partner who had only a very small interest in the firm.\nAn investment adviser subsidiary of a publicly traded bank holding company failed to inform its clients of the departure of the firm's chairman and major stockholder.\nAn investment adviser firm organized as a general partnership sends prompt notification to all clients after the addition of a new partner.", "a": "I and IV", "b": "I and II", "c": "III and IV", "d": "II and III", "e": "Transfer or assignment of an advisory account without prior client consent is always prohibited. An investment adviser need not inform clients of departures of employees, senior or otherwise, from investment advisory firms that are incorporated. Clients must, however, be informed of the departure or addition of any minority partner if the firm is organized as a partnership. The legal requirement for this notification is \"within a reasonable period of time,\" but there is nothing prohibited about doing it promptly."}, {"n": 35, "q": "Which of the following statements regarding the brochure delivery requirements of the Investment Advisers Act of 1940 are true?\nThe brochure must be updated each time Part 1A of Form ADV is updated.\nThe brochure delivery requirement does not apply to investment companies or clients who are serviced on an impersonal basis, such as with a newsletter, with an annual cost of less than $500.\nA brochure, or summary of material changes, if any, must be delivered to all clients within 120 days of the end of the adviser's fiscal year.", "a": "I and II", "b": "I, II, and III", "c": "II and III", "d": "I and III", "e": "Because the information in the brochure is derived from Part 2A of the Form ADV, changes to Part 1A will not necessarily apply to items that are important to the client. Therefore, stating that the brochure must be updated whenever there is a change to Part 1A would not be correct. SEC rules require that a brochure, or summary of material changes, if any, be delivered to all clients within 120 days of the end of the adviser's fiscal year. If there are no material changes, a brochure does not have to be sent. The brochure delivery requirements do not apply to customers that are investment companies or for clients of impersonal services (those that do not purport to meet the investment objectives or needs of specific clients), as long as the cost of the service is less than $500 per year."}, {"n": 36, "q": "An investment adviser executes a transaction for a client who has a contract for advisory services. The adviser also represents the person who is the contra party in the sale and is paid a commission. Which of the following best describes this transaction?\nA riskless and simultaneous transaction.\nAn agency cross transaction.\nNot permitted under any circumstances.\nPermitted with prior written disclosure and consent.", "a": "II and III.", "b": "I and III.", "c": "II and IV.", "d": "I and IV.", "e": "This is an example of an agency cross transaction in which the investment adviser represents both parties in a trade. This transaction is permissible if the adviser did not recommend the trade to both parties and the client received written disclosure prior to the first cross and gave consent."}, {"n": 37, "q": "Under the Investment Advisers Act of 1940, a third party receiving compensation from an investment adviser in return for providing an endorsement of the advisers' service is permitted", "a": "under no circumstances.", "b": "with no restrictions.", "c": "when a written agreement providing certain disclosures has been entered into between the investment adviser and the third party if the compensation exceeds $1,000 over a 12-month period.", "d": "only if the referring party is registered as an investment adviser representative.", "e": "The marketing rule for investment advisers permits investment advisers to pay third parties for their endorsement as long as the required disclosures are made. A written agreement between the parties is required when the compensation, cash or non-cash, exceeds the de minimis amount (more than $1,000 during the preceding 12 months)."}, {"n": 38, "q": "Quick and Fast Executions, Inc., a broker-dealer registered with the administrator, maintains a website describing the services offered by the firm. Which of the following statements would be in compliance with the requirement to maintain certain books and records?", "a": "Retention of any revised design must be kept for a period of at least three years after the initial design's retention period ends.", "b": "The original website design must be retained for a period of at least five years from initial use.", "c": "The original website design must be retained for a period of at least three years from initial use.", "d": "Because websites tend to be fluid, administrators require only that they be available for spot-checking.", "e": "Websites, like any other advertisement, must be retained for a period of at least three years from initial use. Because they are fluid (frequently changing), each design change must be filed after first use, beginning a new three-year holding period."}, {"n": 39, "q": "Active Technicians (AT) is a state-registered investment adviser. In its brochure supplement, it would include information relating to each of the following individuals except", "a": "those exercising discretion over assets of clients in this state, even if no direct contact is involved.", "b": "those providing investment advice and having direct contact with retail clients in the state.", "c": "those providing investment advice and having direct contact with institutional clients in the state.", "d": "members of AT's board of directors who are active in the firm's business.", "e": "Unless the individual has direct contact with clients (retail or institutional) or exercises discretion, a copy of the Part 2B brochure supplement for each individual is not required. This would include officers and members of the board of directors. Of course, if any of these individuals had direct client contact or exercised discretion, a supplement for them would need to be prepared."}, {"n": 40, "q": "If an investment adviser places an advertisement in a newspaper offering a free brochure to those who call, under NASAA's Model Rule on Unethical Business Practices of Investment Advisers, Investment Adviser Representatives, and Federal Covered Advisers, what may the adviser require from callers as a condition of receiving the brochure?", "a": "The names of three friends who might be interested", "b": "A purchase", "c": "A financial profile", "d": "Nothing, because no obligation may be placed on the callers", "e": "It is unethical to offer free services unless the offer is free of any obligation, monetary or otherwise."}, {"n": 41, "q": "In addition to transaction costs (e.g., commissions or markups), most broker-dealers have a schedule of miscellaneous fees. The purpose of these fees is to", "a": "help reimburse the broker-dealer for expenses incurred in performing the transaction or a service for the client.", "b": "build in a hidden markup.", "c": "increase the broker-dealer's net income.", "d": "keep commissions low while making up the difference with fees.", "e": "Executing a transaction for clients frequently incurs expenses that commissions don't cover, such as clearing fees and execution facility fees. There are services performed for clients, such as postage and handling, for which expenses are incurred. Although charging these fees does have a positive effect on the firm's bottom line, they are designed for reimbursement purposes, not as an additional source of income."}, {"n": 42, "q": "Which of the following situations violates the contractual requirements for investment advisory partnerships under the Uniform Securities Act?", "a": "A partner with a 25% interest in an advisory firm dies and is replaced by a new member. The partnership continues business with its existing clients and informs them of the change in partnership composition within a reasonable period.", "b": "A renewal of an investment advisory contract requires the written repetition that an adviser shall not be compensated on the basis of a share of capital gains, not assign a contract without consent, and notify clients of any change in membership of the partnership.", "c": "A partnership, without undergoing any change in membership, assigns its smallest accounts to another firm with written consent of the clients.", "d": "A partner with a 5% interest in an advisory firm leaves the firm, and the remaining partners do not inform their clients because the departing partner held a minority interest in the firm.", "e": "An investment advisory partnership must notify clients of any change in membership within a reasonable time. The death of a minority partner does not constitute assignment of contract. A partnership may assign contracts with written consent of clients. A contract renewal does require written repetition that an adviser shall not be compensated on the basis of a share of capital gains, not assign a contract without consent, and notify clients of any change in membership of the partnership."}, {"n": 43, "q": "An investment adviser representative (IAR) has uncovered an unusual investment opportunity that he believes is perfect for one of his clients. When presenting the recommendation to the client, it becomes clear that the client is concerned about the potential of loss. To alleviate that concern, the IAR tells the client that he agrees to repurchase the security from the client anytime within the next six months at the original purchase price. In so doing, the IAR has", "a": "committed the unethical business practice of guaranteeing against loss.", "b": "committed the unethical business practice of recommending an unsuitable investment.", "c": "acted ethically because he has not guaranteed a profit to the client.", "d": "acted fraudulently because his actions would be considered market manipulation.", "e": "The unethical business practice of guaranteeing against loss can take several forms. This is one of them—offering to buy back a security at the purchase price. There is nothing in this question to indicate that the recommendation is unsuitable; we're only told the client is concerned about losing money. The prohibition against guarantees does not require that the client be ensured a profit, only that there is no loss. Although market manipulation is a fraudulent activity, there is nothing here that would manipulate the market."}, {"n": 44, "q": "An investment advisory firm advertises a stock-picking system that helps investors choose the timing and selection of securities for purchase. Under the Investment Advisers Act of 1940, which of the following must be disclosed in the advertisement?\nThe number of years the system has been used successfully\nThe difficulty of using the system\nThe limitations of the system", "a": "I and II", "b": "I only", "c": "II and III", "d": "I and III", "e": "The act prohibits reference to any formula, charting, or graphing device without disclosing the difficulties or limitations in their use. The number of years used is not required."}, {"n": 45, "q": "Strategic Capital Asset Managers (SCAM) is an investment adviser that is registered in five states. In lieu of preparing a fancy brochure, SCAM is permitted to provide its clients with a copy of its", "a": "Form ADV, Part 2, Appendix 1.", "b": "annual renewal form provided to the SEC.", "c": "Form ADV, Part 1 and Part 1B.", "d": "Form ADV, Part 2A and Part 2B.", "e": "Form ADV, Part 2 (both parts) is acceptable for use as the firm's brochure. Part 1 is for registration purposes, and Part 1B is only used by state-registered advisers (as this firm is). Part 2, Appendix 1 is used for investment advisers who offer wrap fee programs. As a state-registered investment adviser, SCAM does not file any forms with the SEC."}, {"n": 46, "q": "An SEC-registered investor adviser would like to advertise its performance. The SEC marketing rule requires that any advertisement showing gross performance must also show net performance and reflect all of the following except", "a": "the same methodology.", "b": "the same prominence in the presentation.", "c": "the same results.", "d": "the same time period.", "e": "Net and gross performance are never going to be the same. Net performance is always going to be less than gross performance, and that is why the SEC requires any ad showing the gross must always include the net. It must be an apples-to-apples disclosure where the same time period and the same methodology are used. The net performance must be shown with the same prominence (type size or font) as the gross performance."}, {"n": 47, "q": "A client purchased a security per an agent's recommendation, and soon after, it declined by more than 50%. To compensate for the loss, the agent promised the client 1,000 shares in an oversubscribed IPO. In this situation, the agent has", "a": "acted properly, provided the client pays for the IPO in full prior to resale for a profit.", "b": "engaged in an unethical business practice as outlined in NASAA's Statement of Policy on Dishonest or Unethical Business Practices of Broker-Dealers and Agents.", "c": "engaged in a fraudulent activity.", "d": "acted properly because he did not guarantee the profit on the IPO.", "e": "There are two problems here. First of all, NASAA's Statement of Policy prohibits the compensation of clients for losses on accounts. Provided the agent made the recommendation on good investment grounds per the provisions of the Uniform Securities Act, the agent has no liability toward the client. The nature of stocks is to fluctuate in value. Secondly, that same Statement of Policy requires that oversubscribed IPOs be fairly allocated among clients. The actions of this agent would not pass the fairness test."}, {"n": 48, "q": "Which of the following actions by an investment adviser registered in three states is permitted?", "a": "Guaranteeing a rate of return equivalent to a 5-year insured bank CD or waiving their yearly fees", "b": "Stating in the advisory contract that fees will be reimbursed if account performance is less than agreed upon", "c": "Delivering the brochure within 48 hours after signing of the contract, as long as there is a 5-day, penalty-free withdrawal provision", "d": "As long as the firm's brochure indicates that fees are negotiable, announcing that the first 50 new clients to sign up will receive a 25% discount on their fees for the first year", "e": "This is not considered discrimination, because the discount applies equally to all (if they are among the first 50). The regulators consider this to be a negotiated fee. Fee reimbursement or waivers are not permitted. The five-day withdrawal provision applies to state-registered investment advisers when the brochure is not delivered at least 48 hours prior to (not after) the signing of the contract."}, {"n": 49, "q": "Securities regulators have taken a strong position on the need for registered broker-dealers to disclose the fees they charge. Which of these are among the most common ways for making this disclosure?\nPresenting a chart with all of the fees\nPreparing a list of all of the fees\nDisplaying the fees in tabular form", "a": "II and III", "b": "I and III", "c": "I and II", "d": "I, II, and III", "e": "Whether using a table, a chart, or a list, broker-dealers must make sure that it is easy for customers to determine what the fees and charges are and how they are computed."}, {"n": 50, "q": "A working group convened by NASAA has developed a model fee disclosure schedule to help investors better understand the costs involved in doing business with their broker-dealer. The template has broker-dealers disclose all of the following fees except", "a": "the cost of overnight delivery services.", "b": "interest on debit balances in margin accounts.", "c": "safekeeping of customer funds and securities.", "d": "markups and markdowns on trades done as a principal.", "e": "There are three primary expenses involved with brokerage accounts that are not included in the fee disclosure template. Those are commissions;markups and markdowns; andadvisory fees for those firms that are also registered as investment advisers."}, {"n": 51, "q": "An agency cross transaction can be described as", "a": "a sale of securities between different agencies of the federal government.", "b": "a transaction where a person acts as both an investment adviser and broker-dealer in the same transaction.", "c": "a sale of a security owned by a broker-dealer to the general public.", "d": "a transaction between an issuer and a broker-dealer.", "e": "An agency cross transaction occurs when an investment adviser acts as both adviser and broker-dealer, and it requires prior written approval from the client and special reporting requirements. The adviser cannot recommend the transaction to both parties, only one side or the other."}, {"n": 52, "q": "Prosperity Asset Partners (PAP) is organized as a general partnership. PAP is registered in four states. All of the following statements regarding the NASAA investment adviser brochure model rule are true except", "a": "the disclosure brochure must be signed by either an officer or a general partner of Prosperity Assets Partners.", "b": "the brochure rule permits advisers to deliver the disclosure brochure when the client enters the contract, provided the client is allowed to cancel the contract without penalty within 5 business days.", "c": "the disclosure brochure must contain essentially the same information as is contained in Form ADV, Part 2A and, if applicable, Part 2B.", "d": "the disclosure brochure must be delivered no later than 48 hours before entering into an advisory contract for there to be no requirement to offer a 5-day refund right.", "e": "When an investment adviser's business structure is a general partnership (as is the case with PAP), the brochure must be signed by a general partner; an officer's signature is not sufficient. If the firm is a corporation, then an officer's signature is acceptable. The investment adviser's disclosure brochure must contain the relevant information from Form ADV, Part 2A and, for those where it applies, Part 2B. For a state-registered IA, the brochure rule does permit advisers to deliver the brochure when the client enters the contract, provided the client is allowed to cancel the contract without penalty within five business days; otherwise, the brochure must be delivered no later than 48 hours before entering into an advisory contract."}]}, {"id": 14, "name": "Unit 14: Investment Risk and Portfolio Concepts", "key": "BBBBCCCDCCCCCBCBCCBACCBCBBCCCCBBBCBBBCCBCBBCB", "questions": [{"n": 1, "q": "Which of the following risks can be reduced through diversification?", "a": "Interest rate risk", "b": "Business risk", "c": "Purchasing power risk", "d": "Market risk", "e": "Business risk is a nonsystematic (unsystematic) risk that is specific to a particular company or industry. It can be reduced or eliminated through diversification. Interest rate risk, purchasing power (inflation) risk, and market risk are all examples of systematic risk, which cannot be diversified away."}, {"n": 2, "q": "An investor who is concerned primarily about purchasing power risk would be most concerned with", "a": "a decline in interest rates.", "b": "an increase in the rate of inflation.", "c": "a decline in the stock market.", "d": "a change in the tax laws.", "e": "Purchasing power risk, also known as inflation risk, is the risk that the return on an investment will not keep pace with inflation. An increase in the rate of inflation is the primary concern for an investor worried about purchasing power risk."}, {"n": 3, "q": "All of the following are examples of systematic risk EXCEPT", "a": "market risk.", "b": "business risk.", "c": "interest rate risk.", "d": "purchasing power risk.", "e": "Business risk is an unsystematic (nonsystematic) risk because it affects a specific company or industry. Market risk, interest rate risk, and purchasing power risk are all systematic risks that affect the overall market and cannot be eliminated through diversification."}, {"n": 4, "q": "Which of the following best describes nonsystematic risk?", "a": "Risk that affects the entire market", "b": "Risk that can be diversified away", "c": "Risk measured by beta", "d": "Risk associated with changes in the general level of interest rates", "e": "Nonsystematic risk (also called unsystematic, diversifiable, or company-specific risk) is risk unique to a specific company or industry that can be reduced or eliminated through diversification. Systematic risk affects the entire market and is measured by beta."}, {"n": 5, "q": "An investor holds a portfolio concentrated in airline stocks. Which of the following would be LEAST helpful in reducing the unsystematic risk in this portfolio?", "a": "Adding pharmaceutical company stocks", "b": "Adding technology company stocks", "c": "Adding additional airline stocks", "d": "Adding utility company stocks", "e": "Adding more airline stocks would not reduce unsystematic risk because the portfolio would remain concentrated in the same industry. To reduce unsystematic risk, an investor should diversify across different industries and sectors, such as pharmaceuticals, technology, or utilities."}, {"n": 6, "q": "Which of the following types of risk would be of greatest concern to a holder of long-term, fixed-income securities?", "a": "Business risk", "b": "Regulatory risk", "c": "Interest rate risk", "d": "Political risk", "e": "Interest rate risk is the greatest concern for holders of long-term, fixed-income securities. When interest rates rise, bond prices fall, and this inverse relationship is magnified for bonds with longer maturities or durations."}, {"n": 7, "q": "Reinvestment risk is best described as the risk that", "a": "the issuer will default on coupon payments.", "b": "interest rates will rise, causing bond prices to fall.", "c": "income received from an investment will be reinvested at a lower rate.", "d": "inflation will erode the purchasing power of fixed payments.", "e": "Reinvestment risk is the risk that when interest or principal payments are received, the investor will not be able to reinvest at the same rate of return. This is particularly concerning in a declining interest rate environment."}, {"n": 8, "q": "A U.S. investor who purchases shares of stock in a German company listed on the Frankfurt Stock Exchange faces all of the following risks EXCEPT", "a": "currency risk.", "b": "political risk.", "c": "sovereign risk.", "d": "liquidity risk if it is a large-cap stock.", "e": "A large-cap stock traded on a major exchange (Frankfurt Stock Exchange) would generally have sufficient liquidity. However, the U.S. investor would face currency risk (exchange rate fluctuations), political risk (from investing in a foreign country), and sovereign risk (risk related to the foreign government's actions)."}, {"n": 9, "q": "Which of the following measures the volatility of a security relative to the overall market?", "a": "Alpha", "b": "Standard deviation", "c": "Beta", "d": "Sharpe ratio", "e": "Beta measures the volatility (systematic risk) of a security or portfolio relative to the overall market. A beta of 1.0 means the security moves in line with the market, while a beta greater than 1.0 indicates greater volatility."}, {"n": 10, "q": "A stock with a beta of 1.5 would be expected to", "a": "move 50% less than the market.", "b": "move in the opposite direction of the market.", "c": "move 50% more than the market.", "d": "have no relationship to market movements.", "e": "A stock with a beta of 1.5 is expected to be 50% more volatile than the market. If the market rises 10%, the stock would be expected to rise 15%. Conversely, if the market declines 10%, the stock would be expected to decline 15%."}, {"n": 11, "q": "Opportunity cost is best defined as", "a": "the risk of losing money on an investment.", "b": "the cost of trading securities.", "c": "the potential benefit given up when choosing one alternative over another.", "d": "the commission paid to a broker-dealer.", "e": "Opportunity cost is the potential benefit that is foregone when one alternative is chosen over another. For example, if an investor puts money in a savings account earning 2% instead of a stock that returns 10%, the opportunity cost is the 8% difference in returns."}, {"n": 12, "q": "Which of the following is considered the risk-free rate of return for purposes of calculating risk premiums?", "a": "The current rate on AAA-rated corporate bonds", "b": "The rate of inflation", "c": "The rate on 91-day U.S. Treasury bills", "d": "The current discount rate set by the Federal Reserve", "e": "The 91-day (13-week) U.S. Treasury bill rate is considered the risk-free rate of return because it is backed by the full faith and credit of the U.S. government and has virtually no default risk. It is used as the baseline for calculating risk premiums."}, {"n": 13, "q": "Which of the following statements about the capital asset pricing model (CAPM) is CORRECT?", "a": "It uses standard deviation to measure risk.", "b": "It considers both systematic and unsystematic risk.", "c": "It uses beta as its measure of risk.", "d": "It is used primarily for measuring bond returns.", "e": "The capital asset pricing model (CAPM) uses beta as its measure of risk. CAPM is concerned only with systematic risk (measured by beta), not total risk (measured by standard deviation). The CAPM formula is: Expected Return = Risk-Free Rate + Beta x (Market Return - Risk-Free Rate)."}, {"n": 14, "q": "Legislative risk would have the greatest impact on", "a": "U.S. Treasury bonds.", "b": "municipal bonds.", "c": "corporate bonds.", "d": "money market instruments.", "e": "Legislative risk (also called regulatory risk) would have the greatest impact on municipal bonds because changes in tax law could affect the tax-exempt status of municipal bond interest, significantly impacting their value and attractiveness to investors."}, {"n": 15, "q": "An investor who places a large amount of money into a thinly traded small-cap stock is most exposed to", "a": "market risk.", "b": "credit risk.", "c": "liquidity risk.", "d": "reinvestment risk.", "e": "Liquidity risk is the risk that an investor will not be able to sell a security quickly at a fair price. Thinly traded small-cap stocks are particularly susceptible to liquidity risk because there may not be sufficient buyers when the investor wants to sell."}, {"n": 16, "q": "Standard deviation is a measure of", "a": "a security's performance relative to the market.", "b": "the total risk of a security or portfolio.", "c": "only the systematic risk of a security.", "d": "the excess return generated by a portfolio manager.", "e": "Standard deviation measures the total risk (both systematic and unsystematic risk) of a security or portfolio. It measures the dispersion of returns around the average return. A higher standard deviation indicates greater variability and thus greater total risk."}, {"n": 17, "q": "A bond's duration is most directly related to its sensitivity to changes in", "a": "the issuer's credit rating.", "b": "the general level of stock prices.", "c": "prevailing interest rates.", "d": "the rate of inflation.", "e": "Duration measures a bond's sensitivity to changes in interest rates. The higher the duration, the more sensitive the bond's price is to interest rate changes. It is a critical concept for managing interest rate risk in fixed-income portfolios."}, {"n": 18, "q": "Which of the following would NOT be considered a type of systematic risk?", "a": "A change in Federal Reserve monetary policy", "b": "An unexpected increase in the consumer price index", "c": "A labor strike at a major automobile manufacturer", "d": "A global pandemic affecting worldwide economic activity", "e": "A labor strike at a specific automobile manufacturer is an example of unsystematic (nonsystematic) risk because it affects only that company or industry. Changes in monetary policy, increases in the consumer price index (inflation), and a global pandemic are all systematic risks affecting the broader market."}, {"n": 19, "q": "The risk premium for a given security is best described as", "a": "the security's total return.", "b": "the return in excess of the risk-free rate.", "c": "the return generated by the portfolio manager's skill.", "d": "the return attributable to inflation.", "e": "The risk premium is the return in excess of the risk-free rate that investors demand for taking on additional risk. It compensates investors for bearing the uncertainty associated with an investment beyond what they could earn on a risk-free security."}, {"n": 20, "q": "An investor holds a portfolio of high-quality corporate bonds. If interest rates rise, the investor would most likely experience", "a": "a decline in the market value of the bonds.", "b": "an increase in the market value of the bonds.", "c": "an increase in the coupon rate of the bonds.", "d": "no change, because the bonds are high quality.", "e": "Bond prices and interest rates have an inverse relationship. When interest rates rise, existing bonds with lower coupon rates become less attractive, causing their market value to decline. This is true regardless of the credit quality of the bonds."}, {"n": 21, "q": "Country risk would encompass all of the following EXCEPT", "a": "political instability.", "b": "currency exchange controls.", "c": "the financial condition of a specific company.", "d": "sovereign debt default.", "e": "Country risk (also called sovereign risk or political risk) relates to the risk of investing in a particular country and includes political instability, currency exchange controls, and the possibility of sovereign debt default. The financial condition of a specific company is a business risk, which is a form of unsystematic risk."}, {"n": 22, "q": "Modern portfolio theory (MPT) assumes that investors are", "a": "risk seekers who prefer maximum returns regardless of risk.", "b": "irrational and driven by emotions.", "c": "risk averse and prefer less risk for a given level of return.", "d": "concerned only with unsystematic risk.", "e": "A fundamental assumption of modern portfolio theory is that investors are risk averse. This does not mean they avoid risk entirely, but that given two investments with the same expected return, they will choose the one with less risk."}, {"n": 23, "q": "According to the efficient market hypothesis (EMH), which form suggests that current stock prices reflect all publicly available information?", "a": "Weak form", "b": "Semi-strong form", "c": "Strong form", "d": "Random form", "e": "The semi-strong form of the efficient market hypothesis states that current stock prices reflect all publicly available information. The weak form states that prices reflect only past trading data. The strong form states that prices reflect all information, including insider information."}, {"n": 24, "q": "If two securities have a correlation coefficient of -1.0, this indicates that", "a": "they move in perfect tandem.", "b": "there is no relationship between their returns.", "c": "they move in exactly opposite directions.", "d": "one security has a beta of zero.", "e": "A correlation coefficient of -1.0 indicates a perfect negative correlation, meaning the two securities move in exactly opposite directions. When one goes up, the other goes down by a proportional amount. This represents the maximum diversification benefit."}, {"n": 25, "q": "Which of the following portfolios lies on the efficient frontier?", "a": "A portfolio with 8% return and 12% standard deviation, when another portfolio offers 8% return and 10% standard deviation", "b": "A portfolio with 10% return and 15% standard deviation, when no other portfolio offers 10% return with less risk", "c": "A portfolio with 6% return and 20% standard deviation", "d": "A portfolio below the capital market line", "e": "A portfolio on the efficient frontier offers the highest expected return for a given level of risk. If no other portfolio can achieve the same return with less risk, then the portfolio is efficient. Choice A is dominated by a lower-risk portfolio with the same return."}, {"n": 26, "q": "The Sharpe ratio measures", "a": "the portfolio's return relative to the overall market.", "b": "excess return per unit of total risk.", "c": "excess return per unit of systematic risk.", "d": "the portfolio manager's stock-picking ability.", "e": "The Sharpe ratio measures the excess return (return above the risk-free rate) per unit of total risk (standard deviation). It is calculated as (Portfolio Return - Risk-Free Rate) / Standard Deviation. A higher Sharpe ratio indicates better risk-adjusted performance."}, {"n": 27, "q": "Which of the following is NOT an assumption of the capital asset pricing model?", "a": "Investors can borrow and lend at the risk-free rate.", "b": "There are no transaction costs or taxes.", "c": "Markets are inefficient.", "d": "All investors have homogeneous expectations.", "e": "CAPM assumes that markets are efficient, not inefficient. Other assumptions include that investors can borrow and lend at the risk-free rate, there are no transaction costs or taxes, and all investors have homogeneous expectations about future returns."}, {"n": 28, "q": "Alpha represents", "a": "the volatility of a security relative to the market.", "b": "the total risk of a portfolio.", "c": "the difference between a portfolio's actual return and its expected return based on its risk level.", "d": "the risk-free rate of return.", "e": "Alpha represents the difference between a portfolio's actual return and its expected return based on its level of risk (as measured by beta). A positive alpha indicates outperformance, while a negative alpha indicates underperformance relative to what was expected."}, {"n": 29, "q": "An investment with a positive alpha has", "a": "performed worse than expected given its risk.", "b": "a beta greater than 1.0.", "c": "outperformed expectations given its level of risk.", "d": "more unsystematic risk than the market.", "e": "A positive alpha means the investment has outperformed its expected return given its level of risk. Alpha is a measure of the value added (or subtracted) by the portfolio manager's investment decisions."}, {"n": 30, "q": "The efficient frontier represents the set of portfolios that", "a": "have the lowest possible risk.", "b": "have the highest possible return.", "c": "offer the highest return for each level of risk.", "d": "are equally weighted between stocks and bonds.", "e": "The efficient frontier is the set of optimal portfolios that offer the highest expected return for a given level of risk, or equivalently, the lowest risk for a given level of expected return. Portfolios below the efficient frontier are suboptimal."}, {"n": 31, "q": "In the capital asset pricing model, the expected return on a security with a beta of 0 would be", "a": "zero.", "b": "the risk-free rate.", "c": "the market return.", "d": "the market return minus the risk-free rate.", "e": "According to CAPM, Expected Return = Risk-Free Rate + Beta x (Market Return - Risk-Free Rate). If beta equals 0, the entire risk premium component drops out, and the expected return equals the risk-free rate. A security with zero beta has no systematic risk."}, {"n": 32, "q": "Strategic asset allocation is based on the principle that", "a": "investors should time the market to maximize returns.", "b": "the long-term mix of asset classes is the primary determinant of portfolio returns.", "c": "individual security selection is the most important factor.", "d": "portfolios should be concentrated in a single asset class.", "e": "Strategic asset allocation is based on the principle that the long-term mix of asset classes (stocks, bonds, cash) is the primary determinant of portfolio performance. Studies have shown that asset allocation accounts for the vast majority of a portfolio's return variability."}, {"n": 33, "q": "Tactical asset allocation differs from strategic asset allocation in that tactical allocation", "a": "ignores the investor's risk tolerance.", "b": "involves short-term adjustments to take advantage of perceived market opportunities.", "c": "is a buy-and-hold strategy.", "d": "does not require rebalancing.", "e": "Tactical asset allocation involves making short-term deviations from the strategic (long-term) asset allocation to take advantage of perceived market opportunities or mispricings. Unlike strategic allocation, it involves active adjustments based on market conditions."}, {"n": 34, "q": "Which of the following best describes rebalancing a portfolio?", "a": "Selling all positions and starting over", "b": "Moving all assets to cash during market downturns", "c": "Returning the portfolio to its target asset allocation", "d": "Maximizing the portfolio's concentration in the best-performing asset class", "e": "Rebalancing involves returning a portfolio to its original target asset allocation after market movements have caused the weightings to drift. For example, if stocks outperform and become overweighted, the investor would sell some stocks and buy other asset classes."}, {"n": 35, "q": "An investment policy statement (IPS) should include all of the following EXCEPT", "a": "the client's investment objectives.", "b": "a guarantee of minimum return.", "c": "the client's risk tolerance.", "d": "the client's time horizon.", "e": "An investment policy statement (IPS) should include the client's investment objectives, risk tolerance, time horizon, liquidity needs, and any constraints. It should never include a guarantee of minimum return, as no investment return can be guaranteed."}, {"n": 36, "q": "Dollar-cost averaging is a strategy that involves", "a": "investing a lump sum when prices are low.", "b": "investing a fixed dollar amount at regular intervals.", "c": "buying only when the market is trending upward.", "d": "investing equal numbers of shares at regular intervals.", "e": "Dollar-cost averaging involves investing a fixed dollar amount at regular intervals (e.g., monthly). When prices are high, fewer shares are purchased; when prices are low, more shares are purchased. This results in an average cost per share that is lower than the average price per share."}, {"n": 37, "q": "Which of the following statements about dollar-cost averaging is TRUE?", "a": "It guarantees a profit over time.", "b": "The average cost per share will always be less than the average price per share.", "c": "It works best when applied to speculative securities.", "d": "It requires the investor to time the market.", "e": "With dollar-cost averaging, the average cost per share will always be less than the average price per share (assuming prices fluctuate). This is a mathematical certainty. However, it does not guarantee a profit, nor does it require market timing."}, {"n": 38, "q": "A client with a long time horizon, high risk tolerance, and no current income needs would most likely be best suited by a portfolio emphasizing", "a": "money market instruments.", "b": "investment-grade corporate bonds.", "c": "growth stocks.", "d": "Treasury bills.", "e": "A client with a long time horizon, high risk tolerance, and no current income needs is best suited for growth stocks. Growth stocks offer the potential for capital appreciation over time, which aligns with the client's profile. Money market instruments, bonds, and T-bills focus on income and capital preservation."}, {"n": 39, "q": "Buy and hold is a strategy most consistent with", "a": "tactical asset allocation.", "b": "the weak form of the efficient market hypothesis.", "c": "the belief that markets are efficient.", "d": "active portfolio management.", "e": "Buy and hold is a passive strategy consistent with the belief that markets are efficient and that attempting to time the market will not consistently produce superior results. It is not consistent with tactical allocation or active management, which both attempt to beat the market."}, {"n": 40, "q": "An investor who follows a passive investment strategy would most likely invest in", "a": "individual stocks selected through fundamental analysis.", "b": "an index fund that tracks the S&P 500.", "c": "a hedge fund using a long-short strategy.", "d": "sector-specific mutual funds.", "e": "A passive investment strategy seeks to match market returns rather than beat them. Index funds that track broad market indices like the S&P 500 are the most common vehicle for passive investing. Active strategies involve individual stock selection, hedge funds, and sector rotation."}, {"n": 41, "q": "The primary purpose of asset allocation is to", "a": "eliminate all investment risk.", "b": "maximize short-term returns.", "c": "manage risk by diversifying among different asset classes.", "d": "concentrate investments in the highest returning asset class.", "e": "The primary purpose of asset allocation is to manage risk through diversification among different asset classes (stocks, bonds, cash, real estate, etc.). It does not eliminate all risk, and it is not designed to maximize short-term returns or concentrate investments."}, {"n": 42, "q": "Which of the following investment strategies is considered the most tax efficient?", "a": "Frequent trading of individual stocks", "b": "Buying and holding index funds", "c": "Active portfolio management with frequent rebalancing", "d": "Investing exclusively in high-yield bonds", "e": "Buying and holding index funds is the most tax-efficient strategy because it minimizes taxable events. Frequent trading generates short-term capital gains taxed at higher ordinary income rates. Index funds have low turnover and thus generate fewer taxable distributions."}, {"n": 43, "q": "Call risk is most relevant to holders of", "a": "common stock.", "b": "callable bonds when interest rates are falling.", "c": "Treasury bills.", "d": "variable annuities.", "e": "Call risk is the risk that a bond will be called (redeemed early) by the issuer. This typically happens when interest rates fall, because the issuer can refinance at lower rates. The bondholder then faces reinvestment risk, as they must reinvest the proceeds at lower prevailing rates."}, {"n": 44, "q": "Inflation risk is of greatest concern to an investor holding", "a": "common stocks with strong earnings growth.", "b": "real estate investment trusts (REITs).", "c": "long-term fixed-rate bonds.", "d": "Treasury Inflation-Protected Securities (TIPS).", "e": "Inflation risk (purchasing power risk) is of greatest concern to holders of long-term fixed-rate bonds because their fixed interest payments lose purchasing power as inflation rises. Common stocks, REITs, and TIPS all offer some degree of inflation protection."}, {"n": 45, "q": "The capital market line (CML) plots the relationship between", "a": "a security's beta and its expected return.", "b": "a portfolio's total risk and its expected return.", "c": "a security's alpha and its beta.", "d": "a portfolio's unsystematic risk and its return.", "e": "The capital market line (CML) shows the relationship between a portfolio's total risk (standard deviation) and its expected return. It runs from the risk-free rate through the market portfolio. The security market line (SML), by contrast, plots expected return against beta (systematic risk)."}]}, {"id": 15, "name": "Unit 15: Portfolio Performance Measures and Retirement Plans", "key": "ABBBBCCBBBDABDCABBCCCBBBCBBBCCCBCBBBCCBCBBBBD", "questions": [{"n": 1, "q": "A portfolio manager generated a return of 12% with a standard deviation of 18% when the risk-free rate was 3%. The Sharpe ratio for this portfolio is", "a": "0.50", "b": "0.67", "c": "1.50", "d": "0.33", "e": "The Sharpe ratio is calculated as (Portfolio Return - Risk-Free Rate) / Standard Deviation = (12% - 3%) / 18% = 9% / 18% = 0.50. It measures the excess return earned per unit of total risk."}, {"n": 2, "q": "Which performance measure uses beta rather than standard deviation as its measure of risk?", "a": "Sharpe ratio", "b": "Treynor ratio", "c": "Standard deviation", "d": "Information ratio", "e": "The Treynor ratio uses beta (systematic risk) as its measure of risk, while the Sharpe ratio uses standard deviation (total risk). Treynor ratio = (Portfolio Return - Risk-Free Rate) / Beta."}, {"n": 3, "q": "Holding period return is calculated by", "a": "dividing the annual income by the initial investment.", "b": "adding all income received plus change in value, then dividing by initial investment.", "c": "dividing the ending value by the beginning value.", "d": "subtracting the risk-free rate from the total return.", "e": "Holding period return (HPR) is calculated by adding all income received (dividends, interest) to the change in value (ending value minus beginning value), then dividing by the initial investment. HPR = (Income + Capital Gain or Loss) / Initial Investment."}, {"n": 4, "q": "An investor purchased a stock at $50, received $2 in dividends, and sold it one year later for $55. The holding period return is", "a": "10%", "b": "14%", "c": "4%", "d": "12%", "e": "HPR = (Dividends + Capital Gain) / Purchase Price = ($2 + $5) / $50 = $7 / $50 = 14%. The investor received $2 in dividends and had a $5 capital gain ($55 - $50)."}, {"n": 5, "q": "Time-weighted return is the preferred method for evaluating portfolio manager performance because it", "a": "gives greater weight to periods with larger investments.", "b": "eliminates the impact of cash flows into and out of the portfolio.", "c": "accounts for the time value of money.", "d": "is easier to calculate than dollar-weighted return.", "e": "Time-weighted return eliminates the impact of cash flows (deposits and withdrawals) that are beyond the portfolio manager's control. This makes it the fairest measure of a manager's investment skill, as it measures only the return generated by the manager's investment decisions."}, {"n": 6, "q": "The internal rate of return (IRR) is also known as", "a": "time-weighted return.", "b": "geometric mean return.", "c": "dollar-weighted return.", "d": "arithmetic mean return.", "e": "The internal rate of return (IRR) is also known as the dollar-weighted return because it takes into account the timing and size of cash flows into and out of the portfolio. It reflects the return actually earned by the investor."}, {"n": 7, "q": "Which of the following return measures is most influenced by the timing of cash flows?", "a": "Time-weighted return", "b": "Geometric mean return", "c": "Dollar-weighted return", "d": "Arithmetic mean return", "e": "Dollar-weighted return (IRR) is most influenced by the timing and amount of cash flows. If an investor adds money just before a period of strong performance, the dollar-weighted return will be higher than the time-weighted return."}, {"n": 8, "q": "An investor in the 32% marginal tax bracket earns 6% on a taxable investment. The after-tax return is", "a": "1.92%", "b": "4.08%", "c": "3.00%", "d": "5.04%", "e": "After-tax return = Pre-tax return x (1 - tax rate) = 6% x (1 - 0.32) = 6% x 0.68 = 4.08%. The investor keeps 68% of the return after paying 32% in taxes."}, {"n": 9, "q": "A municipal bond yielding 4% would be equivalent to a taxable yield of what amount for an investor in the 37% federal tax bracket?", "a": "5.36%", "b": "6.35%", "c": "2.52%", "d": "10.81%", "e": "Tax-equivalent yield = Municipal yield / (1 - tax rate) = 4% / (1 - 0.37) = 4% / 0.63 = 6.35%. This is the yield a taxable investment would need to provide to equal the after-tax benefit of the tax-exempt municipal bond."}, {"n": 10, "q": "The tax-equivalent yield formula is", "a": "Municipal yield x (1 - tax rate)", "b": "Municipal yield / (1 - tax rate)", "c": "Taxable yield x (1 - tax rate)", "d": "Taxable yield / (1 - tax rate)", "e": "The tax-equivalent yield formula is: Tax-Equivalent Yield = Municipal Yield / (1 - Marginal Tax Rate). This formula converts a tax-exempt yield to its taxable equivalent for comparison purposes."}, {"n": 11, "q": "Real rate of return differs from nominal rate of return in that real rate of return", "a": "includes the effect of compounding.", "b": "excludes the effect of inflation.", "c": "is always higher than nominal return.", "d": "adjusts for the effect of inflation.", "e": "Real rate of return adjusts the nominal rate of return for the effect of inflation. It represents the actual increase in purchasing power. The approximate formula is: Real Return = Nominal Return - Inflation Rate."}, {"n": 12, "q": "An investment earned a nominal return of 8% during a period when inflation was 3%. The approximate real rate of return was", "a": "5%", "b": "11%", "c": "2.67%", "d": "24%", "e": "Using the approximation method: Real Return = Nominal Return - Inflation Rate = 8% - 3% = 5%. This represents the investor's actual increase in purchasing power after accounting for the erosion caused by inflation."}, {"n": 13, "q": "Current yield on a bond is calculated by dividing", "a": "the coupon rate by the par value.", "b": "the annual coupon payment by the current market price.", "c": "the yield to maturity by 2.", "d": "the par value by the market price.", "e": "Current yield on a bond is calculated by dividing the annual coupon payment (in dollars) by the current market price of the bond. For example, a bond with a $60 annual coupon trading at $950 has a current yield of 6.32% ($60/$950)."}, {"n": 14, "q": "Yield to maturity (YTM) includes all of the following EXCEPT", "a": "coupon payments.", "b": "reinvestment income.", "c": "any capital gain or loss at maturity.", "d": "the current dividend yield.", "e": "Yield to maturity (YTM) accounts for coupon payments, reinvestment income (assumed at the YTM rate), and any capital gain or loss if held to maturity. Current dividend yield is a stock concept, not a bond concept."}, {"n": 15, "q": "An investor subject to the alternative minimum tax (AMT) should be cautious about investing in", "a": "U.S. Treasury bonds.", "b": "general obligation municipal bonds.", "c": "private activity municipal bonds.", "d": "FDIC-insured certificates of deposit.", "e": "Private activity municipal bonds (used to finance projects like airports, stadiums, and housing) may generate income that is subject to the alternative minimum tax (AMT). Investors subject to AMT should be cautious about these bonds, while general obligation bonds are typically exempt from AMT."}, {"n": 16, "q": "For tax purposes, the wash sale rule prohibits an investor from claiming a loss on the sale of a security if a substantially identical security is purchased within", "a": "30 days before or after the sale.", "b": "60 days before or after the sale.", "c": "90 days after the sale.", "d": "30 days after the sale only.", "e": "The wash sale rule prohibits an investor from claiming a tax loss on the sale of a security if a substantially identical security is purchased within 30 days before or 30 days after the sale date (a 61-day window). The purpose is to prevent investors from selling solely to realize a tax loss."}, {"n": 17, "q": "An employee participating in a traditional 401(k) plan", "a": "makes contributions with after-tax dollars.", "b": "pays no tax until funds are withdrawn.", "c": "can contribute unlimited amounts each year.", "d": "must begin distributions at age 65.", "e": "Traditional 401(k) contributions are made with pre-tax dollars, meaning the employee pays no income tax on the contributions until funds are withdrawn. At withdrawal, distributions are taxed as ordinary income."}, {"n": 18, "q": "Which of the following is a characteristic of a Roth IRA?", "a": "Contributions are tax deductible.", "b": "Qualified distributions are tax free.", "c": "There is no income limit for contributions.", "d": "Required minimum distributions begin at age 73.", "e": "Roth IRA contributions are made with after-tax dollars (not deductible), but qualified distributions (after age 59 1/2 and the account has been open at least 5 years) are completely tax free. There are income limits for Roth IRA contributions, and Roth IRAs do not require minimum distributions during the owner's lifetime."}, {"n": 19, "q": "Under ERISA, a fiduciary of a retirement plan must do all of the following EXCEPT", "a": "act solely in the interest of plan participants and beneficiaries.", "b": "diversify plan investments to minimize the risk of large losses.", "c": "guarantee a minimum rate of return for plan participants.", "d": "follow the terms of plan documents.", "e": "ERISA requires fiduciaries to act in the sole interest of plan participants, diversify investments, and follow plan documents. However, ERISA does not require fiduciaries to guarantee a minimum rate of return. Investment performance depends on market conditions."}, {"n": 20, "q": "Required minimum distributions (RMDs) from a traditional IRA must begin by", "a": "age 59 1/2.", "b": "age 65.", "c": "April 1 of the year following the year the owner reaches age 73.", "d": "December 31 of the year the owner turns 70 1/2.", "e": "Under the SECURE 2.0 Act, required minimum distributions from traditional IRAs must begin by April 1 of the year following the year the owner reaches age 73. Failure to take RMDs results in a significant excise tax penalty."}, {"n": 21, "q": "A rollover from a traditional IRA to another traditional IRA must be completed within how many days to avoid tax consequences?", "a": "30 days", "b": "45 days", "c": "60 days", "d": "90 days", "e": "An IRA-to-IRA rollover must be completed within 60 days to avoid being treated as a taxable distribution. If not completed within 60 days, the amount is subject to income tax and possibly the 10% early withdrawal penalty. Note that only one rollover per 12-month period is permitted."}, {"n": 22, "q": "Which of the following retirement plans allows both employer and employee contributions?", "a": "SEP IRA", "b": "SIMPLE IRA", "c": "Traditional IRA", "d": "Individual 401(k)", "e": "A SIMPLE (Savings Incentive Match Plan for Employees) IRA allows both employer and employee contributions. The employer is required to either match employee contributions (up to 3% of compensation) or make a 2% nonelective contribution for all eligible employees."}, {"n": 23, "q": "A Simplified Employee Pension (SEP) IRA is most suitable for", "a": "large corporations with thousands of employees.", "b": "self-employed individuals and small business owners.", "c": "government employees.", "d": "nonprofit organizations.", "e": "SEP IRAs are designed for self-employed individuals and small business owners. They are easy to establish and administer, with only the employer making contributions. Contribution limits are higher than traditional IRAs."}, {"n": 24, "q": "The catch-up contribution provision allows individuals age 50 and older to", "a": "withdraw funds without penalty.", "b": "contribute additional amounts above the standard limit.", "c": "avoid required minimum distributions.", "d": "convert a traditional IRA to a Roth IRA without tax.", "e": "The catch-up contribution provision allows individuals age 50 and older to make additional contributions above the standard annual limits to qualified retirement plans and IRAs. This helps older workers save more for retirement as they approach retirement age."}, {"n": 25, "q": "Which of the following is NOT a qualified retirement plan?", "a": "401(k) plan", "b": "Defined benefit pension plan", "c": "Deferred compensation plan", "d": "Profit-sharing plan", "e": "A deferred compensation plan (such as a Section 457 plan) is a nonqualified plan. Qualified plans include 401(k) plans, defined benefit pension plans, and profit-sharing plans. Qualified plans must meet specific IRS requirements regarding participation, vesting, and funding."}, {"n": 26, "q": "In a defined benefit pension plan, the investment risk is borne by", "a": "the employee.", "b": "the employer.", "c": "the plan trustee.", "d": "the government.", "e": "In a defined benefit pension plan, the employer bears the investment risk because the employer promises a specific benefit at retirement (usually based on a formula considering salary and years of service). If investments underperform, the employer must make up the shortfall."}, {"n": 27, "q": "In a defined contribution plan, the retirement benefit is determined by", "a": "a formula based on years of service and salary.", "b": "the amount contributed and investment performance.", "c": "the employer's profitability.", "d": "federal regulations.", "e": "In a defined contribution plan (such as a 401(k) or 403(b)), the retirement benefit depends on the amount contributed and the investment performance of those contributions. The employee typically bears the investment risk."}, {"n": 28, "q": "An investor takes a distribution from her traditional IRA at age 45. She will owe", "a": "ordinary income tax only.", "b": "ordinary income tax plus a 10% penalty.", "c": "capital gains tax only.", "d": "no tax if reinvested within 60 days.", "e": "Distributions from a traditional IRA before age 59 1/2 are generally subject to ordinary income tax plus a 10% early withdrawal penalty. The penalty is designed to discourage the use of retirement funds before retirement."}, {"n": 29, "q": "Which of the following is an exception to the 10% early withdrawal penalty from an IRA?", "a": "Purchase of a new automobile", "b": "Vacation expenses", "c": "Qualified higher education expenses", "d": "Home renovation", "e": "Qualified higher education expenses are an exception to the 10% early withdrawal penalty from an IRA (though income tax still applies). Other exceptions include death, disability, first-time home purchase (up to $10,000), substantially equal periodic payments (72t), and unreimbursed medical expenses exceeding a certain percentage of AGI."}, {"n": 30, "q": "A 403(b) plan is available to employees of", "a": "private for-profit corporations.", "b": "self-employed individuals.", "c": "public schools and certain tax-exempt organizations.", "d": "state and local government employees only.", "e": "A 403(b) plan (also called a tax-sheltered annuity or TSA) is available to employees of public schools, colleges, universities, and certain tax-exempt organizations under Section 501(c)(3) of the Internal Revenue Code."}, {"n": 31, "q": "A Section 529 plan is used for", "a": "retirement savings.", "b": "health care expenses.", "c": "education savings.", "d": "charitable giving.", "e": "Section 529 plans are state-sponsored education savings plans that offer tax advantages for saving for qualified education expenses, including tuition, room and board, books, and computers at eligible educational institutions."}, {"n": 32, "q": "Contributions to a Section 529 plan are", "a": "tax deductible at the federal level.", "b": "made with after-tax dollars.", "c": "limited to $2,000 per year.", "d": "only available to residents of the state sponsoring the plan.", "e": "Contributions to Section 529 plans are made with after-tax dollars and are not deductible at the federal level (though some states offer state tax deductions). Earnings grow tax deferred, and qualified withdrawals are tax free. There are no annual contribution limits set by the IRS, though gift tax rules apply."}, {"n": 33, "q": "Which of the following accounts allows tax-free withdrawals for qualified medical expenses?", "a": "Traditional IRA", "b": "Roth IRA", "c": "Health Savings Account (HSA)", "d": "Coverdell Education Savings Account", "e": "A Health Savings Account (HSA) allows tax-deductible contributions, tax-free growth, and tax-free withdrawals for qualified medical expenses. HSAs are available to individuals enrolled in a high-deductible health plan (HDHP). They offer a triple tax advantage."}, {"n": 34, "q": "Under ERISA, which of the following is a prohibited transaction?", "a": "Investing plan assets in diversified mutual funds", "b": "A fiduciary lending money to the plan", "c": "Hiring a qualified investment adviser for the plan", "d": "Offering multiple investment options to participants", "e": "Under ERISA, prohibited transactions include a fiduciary lending money to the plan, selling property to the plan, or using plan assets for personal benefit. These rules are designed to prevent conflicts of interest and self-dealing by fiduciaries."}, {"n": 35, "q": "The Employee Retirement Income Security Act of 1974 (ERISA) applies to", "a": "all government retirement plans.", "b": "private sector employer-sponsored retirement plans.", "c": "Social Security.", "d": "individual retirement accounts only.", "e": "ERISA applies to private sector employer-sponsored retirement plans, including defined benefit and defined contribution plans. It does not apply to government plans, church plans, or plans maintained outside the United States for nonresident aliens."}, {"n": 36, "q": "An employer who sponsors a SIMPLE IRA is required to", "a": "match employee contributions dollar for dollar up to 10% of salary.", "b": "make either a matching contribution or a nonelective contribution.", "c": "provide a defined benefit to retiring employees.", "d": "file annual reports with the SEC.", "e": "An employer sponsoring a SIMPLE IRA must either match employee contributions dollar for dollar up to 3% of compensation (which can be reduced to 1% in 2 of 5 years) or make a 2% nonelective contribution for all eligible employees regardless of whether they contribute."}, {"n": 37, "q": "Net asset value (NAV) of a mutual fund is calculated", "a": "once per week.", "b": "continuously throughout the trading day.", "c": "at the close of each business day.", "d": "at the beginning of each business day.", "e": "The net asset value of a mutual fund (open-end investment company) is calculated once per day at the close of business (typically 4:00 PM Eastern Time). This is the price at which shares are bought and redeemed."}, {"n": 38, "q": "The primary difference between an open-end fund and a closed-end fund is that", "a": "open-end funds are traded on exchanges.", "b": "closed-end funds continuously issue and redeem shares.", "c": "open-end funds continuously issue and redeem shares at NAV.", "d": "closed-end funds always trade at a premium to NAV.", "e": "Open-end funds (mutual funds) continuously issue new shares and redeem existing shares at the current NAV. Closed-end funds have a fixed number of shares that trade on an exchange, and their price is determined by supply and demand, which means they can trade at a premium or discount to NAV."}, {"n": 39, "q": "An exchange-traded fund (ETF) differs from a mutual fund in that an ETF", "a": "is not subject to SEC regulation.", "b": "can be bought and sold throughout the trading day.", "c": "does not hold a portfolio of securities.", "d": "guarantees a minimum return.", "e": "ETFs trade on exchanges throughout the trading day, like stocks, while mutual funds can only be bought or redeemed at the end-of-day NAV. Both are regulated by the SEC and hold portfolios of securities."}, {"n": 40, "q": "Which of the following benchmarks would be most appropriate for evaluating the performance of a portfolio of large-cap U.S. stocks?", "a": "Russell 2000 Index", "b": "Barclays Aggregate Bond Index", "c": "S&P 500 Index", "d": "MSCI EAFE Index", "e": "The S&P 500 Index is the most appropriate benchmark for a large-cap U.S. stock portfolio. The Russell 2000 tracks small-cap stocks, the Barclays Aggregate Bond Index tracks bonds, and the MSCI EAFE Index tracks international developed market stocks."}, {"n": 41, "q": "An investor who converts a traditional IRA to a Roth IRA", "a": "pays no tax on the conversion.", "b": "must pay income tax on the converted amount in the year of conversion.", "c": "must be under age 59 1/2.", "d": "can only convert up to $6,500 per year.", "e": "When converting a traditional IRA to a Roth IRA, the converted amount is treated as taxable income in the year of conversion. There is no income limit for conversions and no limit on the amount that can be converted."}, {"n": 42, "q": "A profit-sharing plan differs from a money purchase pension plan in that the profit-sharing plan", "a": "requires a fixed annual contribution by the employer.", "b": "allows the employer discretion in the amount contributed each year.", "c": "provides a defined benefit to employees.", "d": "is only available to companies with fewer than 100 employees.", "e": "A profit-sharing plan allows the employer discretion in the amount contributed each year (including zero in some years). A money purchase pension plan requires the employer to make a fixed annual contribution (a set percentage of each employee's compensation) regardless of profitability."}, {"n": 43, "q": "Vesting refers to", "a": "the employer's right to terminate the plan.", "b": "an employee's nonforfeitable right to employer contributions.", "c": "the process of rolling over retirement funds.", "d": "the calculation of required minimum distributions.", "e": "Vesting refers to an employee's nonforfeitable right to employer contributions in a retirement plan. Employee contributions are always 100% vested immediately. Employer contributions may be subject to a ves

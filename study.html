ting schedule (cliff or graded) determined by the plan."}, {"n": 44, "q": "An annuity in the accumulation phase", "a": "provides regular income payments to the annuitant.", "b": "is growing on a tax-deferred basis.", "c": "is past the annuity start date.", "d": "is being liquidated.", "e": "During the accumulation phase, an annuity is growing on a tax-deferred basis. The owner is making contributions (premiums) that are invested, and any earnings grow without current taxation. The payout (annuitization) phase begins when the annuitant starts receiving income payments."}, {"n": 45, "q": "All of the following are advantages of a Roth 401(k) compared to a traditional 401(k) EXCEPT", "a": "qualified distributions are tax free.", "b": "contributions are made with after-tax dollars.", "c": "there is no income limit for participation.", "d": "contributions reduce current taxable income.", "e": "Unlike a traditional 401(k), Roth 401(k) contributions are made with after-tax dollars and do NOT reduce current taxable income. However, qualified distributions are tax free, there is no income limit for participation (unlike a Roth IRA), and the after-tax contributions grow tax free."}]}, {"id": 16, "name": "Unit 16: Special Types of Accounts, Trading Securities, and Tax Considerations", "key": "BDBBBBBCBBBBBCBBBDBBBAABBBACBBCBBBBCCBBBBBBBB", "questions": [{"n": 1, "q": "Under the Uniform Transfers to Minors Act (UTMA), which of the following statements is TRUE?", "a": "The minor can direct investment decisions in the account.", "b": "The custodian has a fiduciary duty to manage the account in the best interest of the minor.", "c": "The account assets revert to the donor upon the minor reaching the age of majority.", "d": "UTMA accounts can have multiple beneficiaries.", "e": "Under UTMA, the custodian has a fiduciary duty to manage the account assets in the best interest of the minor. The minor cannot direct investments, the assets belong to the minor (not the donor), and each UTMA account can have only one beneficiary."}, {"n": 2, "q": "A trust in which the grantor retains the right to revoke or amend the trust is known as a", "a": "simple trust.", "b": "irrevocable trust.", "c": "testamentary trust.", "d": "revocable trust.", "e": "A revocable trust is one in which the grantor retains the right to revoke, amend, or modify the trust during their lifetime. An irrevocable trust cannot be changed once established. A testamentary trust is created by a will. A simple trust distributes all income annually."}, {"n": 3, "q": "A testamentary trust is established", "a": "during the grantor's lifetime.", "b": "by the terms of a will after the grantor's death.", "c": "by a court order.", "d": "only for charitable purposes.", "e": "A testamentary trust is established by the terms of a will and takes effect only after the grantor's death. It goes through probate. An inter vivos (living) trust is established during the grantor's lifetime."}, {"n": 4, "q": "In a margin account, Regulation T currently requires an initial margin of", "a": "25% of the purchase price.", "b": "50% of the purchase price.", "c": "75% of the purchase price.", "d": "100% of the purchase price.", "e": "Regulation T, set by the Federal Reserve Board, currently requires an initial margin of 50% of the purchase price of securities. This means the investor must deposit at least half of the purchase price; the remaining amount is borrowed from the broker-dealer."}, {"n": 5, "q": "If an investor purchases $20,000 worth of stock on margin with Regulation T at 50%, the investor must deposit", "a": "$5,000.", "b": "$10,000.", "c": "$15,000.", "d": "$20,000.", "e": "With a 50% initial margin requirement, the investor must deposit 50% of the $20,000 purchase, which equals $10,000. The broker-dealer lends the remaining $10,000."}, {"n": 6, "q": "Maintenance margin is set by", "a": "the Federal Reserve Board.", "b": "FINRA and the self-regulatory organizations.", "c": "the SEC.", "d": "the U.S. Treasury.", "e": "While the Federal Reserve sets the initial margin requirement (Reg T), the minimum maintenance margin is set by FINRA (currently 25% for long positions) and the self-regulatory organizations. Individual broker-dealers may set higher requirements, known as house maintenance requirements."}, {"n": 7, "q": "A margin call is issued when", "a": "the account equity exceeds the initial margin requirement.", "b": "the equity in the account falls below the maintenance margin requirement.", "c": "the investor wants to purchase additional securities.", "d": "the broker-dealer wants to increase commissions.", "e": "A margin call (maintenance call) is issued when the equity in a margin account falls below the required maintenance level. The investor must deposit additional funds or securities to bring the account back to the minimum maintenance level, or the broker may liquidate positions."}, {"n": 8, "q": "Which of the following orders instructs the broker to sell a stock when it reaches a specified price below the current market price?", "a": "Limit order", "b": "Market order", "c": "Stop order (sell stop)", "d": "Buy stop order", "e": "A sell stop order (stop-loss order) is placed below the current market price and is triggered when the stock drops to the stop price. Once triggered, it becomes a market order. It is commonly used to protect against further losses on a long position."}, {"n": 9, "q": "A limit order to buy stock at $45 will be executed", "a": "at $45 or higher.", "b": "at $45 or lower.", "c": "only at exactly $45.", "d": "at the best available market price.", "e": "A limit order to buy at $45 instructs the broker to buy the stock at $45 or lower (a better price). The investor is willing to pay up to $45 but not more. A sell limit order would execute at the limit price or higher."}, {"n": 10, "q": "An investor who sells securities short is hoping that", "a": "the price of the securities will rise.", "b": "the price of the securities will fall.", "c": "the securities will pay a dividend.", "d": "interest rates will increase.", "e": "A short seller borrows securities and sells them, hoping the price will decline. If the price falls, the investor can buy the securities back at a lower price and return them to the lender, profiting from the difference."}, {"n": 11, "q": "In a short sale, the investor", "a": "owns the securities and sells them.", "b": "borrows securities from a broker-dealer and sells them.", "c": "buys securities with borrowed money.", "d": "sells call options on securities already owned.", "e": "In a short sale, the investor borrows securities from a broker-dealer (or another party through the broker), sells them in the open market, and later buys them back (covers the short) to return to the lender. The investor profits if the price declines."}, {"n": 12, "q": "Which of the following is TRUE about trading in the over-the-counter (OTC) market?", "a": "All trades are conducted on a centralized exchange floor.", "b": "Broker-dealers act as market makers and trade from their own inventory.", "c": "Only government securities are traded OTC.", "d": "The OTC market has less volume than exchange-listed markets.", "e": "In the OTC market, broker-dealers act as market makers and trade from their own inventory (principal transactions). There is no centralized exchange floor; trading occurs electronically through a network of dealers. Many types of securities trade OTC, including stocks, bonds, and derivatives."}, {"n": 13, "q": "The bid price in a stock quote represents the price at which", "a": "an investor can buy the stock.", "b": "a market maker will buy the stock from an investor.", "c": "the stock last traded.", "d": "the stock is offered for sale.", "e": "The bid price is the price at which a market maker is willing to buy (bid for) the stock from an investor. The ask (offer) price is the price at which the market maker will sell the stock to an investor. Investors sell at the bid and buy at the ask."}, {"n": 14, "q": "The difference between the bid and ask price is called the", "a": "commission.", "b": "markup.", "c": "spread.", "d": "premium.", "e": "The spread is the difference between the bid price and the ask price. It represents the market maker's compensation for providing liquidity. A narrower spread generally indicates a more liquid security."}, {"n": 15, "q": "A discretionary account is one in which", "a": "the client makes all investment decisions.", "b": "the investment adviser or broker-dealer is authorized to make investment decisions without prior approval for each trade.", "c": "the account has no margin borrowing.", "d": "trading is limited to fixed-income securities.", "e": "A discretionary account authorizes the investment adviser or broker-dealer to make investment decisions on behalf of the client without obtaining prior approval for each individual transaction. The client grants this authority through a written power of attorney or trading authorization."}, {"n": 16, "q": "For an investment adviser to exercise discretion over a client account, the adviser must have", "a": "verbal authorization from the client.", "b": "written authorization from the client granting power of attorney.", "c": "approval from the state Administrator.", "d": "a minimum of $1 million in assets under management.", "e": "To exercise discretion, an investment adviser must obtain written authorization from the client, typically in the form of a limited power of attorney or discretionary trading authorization. Verbal authorization alone is insufficient except for the first trade, which must be followed by written confirmation."}, {"n": 17, "q": "Wrap fee programs are characterized by", "a": "separate billing for each service provided.", "b": "a single fee that covers advisory services, brokerage execution, and other services.", "c": "no annual fee.", "d": "fees based solely on the number of transactions.", "e": "Wrap fee programs charge a single, bundled fee that typically covers investment advisory services, brokerage execution, custody, and administrative services. The fee is usually expressed as an annual percentage of assets under management."}, {"n": 18, "q": "Which of the following types of accounts requires documentation to verify the identity and source of funds?", "a": "A joint tenants with rights of survivorship account", "b": "A corporate account", "c": "An account for a politically exposed person (PEP)", "d": "All of the above", "e": "All types of accounts require identity verification under Know Your Customer (KYC) and Anti-Money Laundering (AML) rules. Joint accounts, corporate accounts, and accounts for politically exposed persons all require documentation to verify identity and, in some cases, the source of funds."}, {"n": 19, "q": "Capital gains on securities held for more than 12 months are taxed as", "a": "ordinary income.", "b": "long-term capital gains at preferential rates.", "c": "short-term capital gains.", "d": "not taxable.", "e": "Capital gains on securities held for more than 12 months (long-term capital gains) are taxed at preferential rates (0%, 15%, or 20% depending on income level), which are generally lower than ordinary income tax rates."}, {"n": 20, "q": "An investor purchases stock for $5,000 and sells it 8 months later for $7,000. The $2,000 gain is taxed as", "a": "a long-term capital gain.", "b": "a short-term capital gain at ordinary income tax rates.", "c": "a tax-exempt gain.", "d": "a return of capital.", "e": "Securities held for 12 months or less generate short-term capital gains, which are taxed at ordinary income tax rates. Since this investor held the stock for only 8 months, the $2,000 gain is a short-term capital gain."}, {"n": 21, "q": "Cost basis in a security is generally defined as", "a": "the current market value.", "b": "the original purchase price plus any commissions or fees.", "c": "the selling price minus commissions.", "d": "the par value of the security.", "e": "Cost basis is generally the original purchase price of a security plus any commissions, fees, or other costs of acquisition. It is used to calculate the capital gain or loss when the security is sold."}, {"n": 22, "q": "An investor has realized capital losses of $15,000 and capital gains of $5,000 during the tax year. How much of the net capital loss can be deducted against ordinary income?", "a": "$3,000", "b": "$5,000", "c": "$10,000", "d": "$15,000", "e": "The investor has a net capital loss of $10,000 ($5,000 gains - $15,000 losses). Only $3,000 of net capital losses can be deducted against ordinary income in a single tax year. The remaining $7,000 can be carried forward to future years."}, {"n": 23, "q": "Capital losses in excess of the $3,000 annual deduction limit may be", "a": "carried forward indefinitely.", "b": "carried back 3 years.", "c": "used only in the current tax year.", "d": "carried forward for up to 5 years.", "e": "Capital losses exceeding the $3,000 annual limit can be carried forward indefinitely until they are fully used. There is no time limit on the carryforward of capital losses for individuals."}, {"n": 24, "q": "Progressive taxation means that", "a": "all taxpayers pay the same tax rate.", "b": "higher income is subject to higher marginal tax rates.", "c": "tax rates decrease as income increases.", "d": "only investment income is taxed.", "e": "Progressive taxation means that higher levels of income are subject to higher marginal tax rates. The U.S. federal income tax system uses tax brackets with increasing rates as income rises. This is different from a flat tax, where all income is taxed at the same rate."}, {"n": 25, "q": "Qualified dividends are taxed at", "a": "ordinary income tax rates.", "b": "long-term capital gains rates.", "c": "a flat rate of 10%.", "d": "short-term capital gains rates.", "e": "Qualified dividends (those paid by U.S. corporations and certain foreign corporations on stock held for a specified period) are taxed at the same preferential rates as long-term capital gains (0%, 15%, or 20%), rather than at ordinary income tax rates."}, {"n": 26, "q": "Municipal bond interest is generally", "a": "taxable at the federal and state level.", "b": "exempt from federal income tax.", "c": "taxable at the federal level only.", "d": "subject to the alternative minimum tax in all cases.", "e": "Interest on municipal bonds is generally exempt from federal income tax. If the investor lives in the state where the bond was issued, the interest may also be exempt from state and local taxes. However, some municipal bonds (private activity bonds) may be subject to the AMT."}, {"n": 27, "q": "An investor who donates appreciated securities to a qualified charity can generally", "a": "deduct the fair market value of the securities and avoid paying capital gains tax.", "b": "deduct only the cost basis of the securities.", "c": "only donate if the securities have been held less than one year.", "d": "deduct the gain above the cost basis only.", "e": "When an investor donates appreciated securities held for more than one year to a qualified charity, they can generally deduct the full fair market value as a charitable deduction and avoid paying capital gains tax on the appreciation. This makes donating appreciated securities more tax efficient than selling and donating cash."}, {"n": 28, "q": "Gift tax exclusion for 2024 allows an individual to give up to how much per recipient per year without filing a gift tax return?", "a": "$10,000", "b": "$15,000", "c": "$18,000", "d": "$25,000", "e": "For 2024, the annual gift tax exclusion is $18,000 per recipient. An individual can give up to this amount to any number of recipients without filing a gift tax return or using any of their lifetime exemption."}, {"n": 29, "q": "When a beneficiary inherits securities, the cost basis is generally", "a": "the original cost basis of the deceased.", "b": "stepped up to the fair market value at the date of death.", "c": "zero.", "d": "the average cost over the last 12 months.", "e": "When securities are inherited, the beneficiary generally receives a stepped-up cost basis equal to the fair market value of the securities on the date of the decedent's death (or the alternate valuation date if elected). This eliminates the capital gains tax on any appreciation during the decedent's lifetime."}, {"n": 30, "q": "A fiduciary account is an account managed by", "a": "the account owner for their own benefit.", "b": "a third party who has a legal duty to act in the best interest of the beneficiary.", "c": "a broker-dealer for proprietary trading.", "d": "any registered representative.", "e": "A fiduciary account is managed by a third party (fiduciary) who has a legal obligation to act in the best interest of the beneficiary. Examples include trust accounts, estate accounts, guardianship accounts, and UTMA/UGMA custodial accounts."}, {"n": 31, "q": "Which of the following is NOT a characteristic of a joint tenancy with rights of survivorship (JTWROS) account?", "a": "Each owner has an equal and undivided interest.", "b": "Upon death of one owner, the interest passes to the surviving owner(s).", "c": "The interest of a deceased owner passes to the estate.", "d": "All owners must approve transactions.", "e": "In a JTWROS account, upon the death of one owner, the deceased's interest passes directly to the surviving owner(s), NOT to the estate. This is the key feature of JTWROS. Each owner has an equal and undivided interest, and all owners typically must approve transactions."}, {"n": 32, "q": "A tenancy in common account differs from JTWROS in that", "a": "each owner must have an equal share.", "b": "upon death, the deceased owner's share passes to their estate, not to the surviving owners.", "c": "it does not require a written agreement.", "d": "it can only be held by married couples.", "e": "In a tenancy in common (TIC) account, upon the death of one owner, the deceased owner's share passes to their estate (and ultimately to their heirs), not to the surviving co-owners. Owners may hold unequal shares, unlike JTWROS where shares are always equal."}, {"n": 33, "q": "An investor places a good-til-canceled (GTC) order. This means the order", "a": "expires at the end of the trading day.", "b": "remains open until executed or canceled by the investor.", "c": "is automatically executed at the next market opening.", "d": "can only be placed for listed securities.", "e": "A good-til-canceled (GTC) order remains open until it is either executed or canceled by the investor. In contrast, a day order expires at the end of the trading day if not executed. Most broker-dealers set a maximum time limit on GTC orders (typically 30-90 days)."}, {"n": 34, "q": "A stop-limit order combines the features of a stop order and a limit order by", "a": "executing at any price once the stop price is reached.", "b": "becoming a limit order once the stop price is triggered.", "c": "guaranteeing execution at the stop price.", "d": "canceling the order if the stop price is not reached by market close.", "e": "A stop-limit order becomes a limit order once the stop price is triggered. Unlike a regular stop order (which becomes a market order), a stop-limit order will only execute at the limit price or better. This provides price protection but does not guarantee execution."}, {"n": 35, "q": "The estate tax applies to", "a": "all estates regardless of size.", "b": "estates exceeding the federal estate tax exemption amount.", "c": "only estates with real property.", "d": "only income earned by the estate after death.", "e": "The federal estate tax applies only to estates exceeding the federal estate tax exemption amount (which is indexed for inflation). Estates below this threshold are not subject to federal estate tax. The exemption was approximately $13.61 million per individual in 2024."}, {"n": 36, "q": "Net investment income tax (NIIT) of 3.8% applies to individuals with modified adjusted gross income above certain thresholds on", "a": "earned income only.", "b": "Social Security benefits.", "c": "interest, dividends, capital gains, and rental income.", "d": "municipal bond interest.", "e": "The net investment income tax (NIIT) of 3.8% applies to investment income including interest, dividends, capital gains, rental income, and royalties for individuals with modified AGI exceeding certain thresholds ($200,000 for single filers, $250,000 for married filing jointly). It does not apply to tax-exempt municipal bond interest."}, {"n": 37, "q": "An adviser managing a trust account must consider all of the following EXCEPT", "a": "the terms of the trust document.", "b": "the needs of the beneficiaries.", "c": "the adviser's personal investment preferences.", "d": "prudent investor standards.", "e": "A fiduciary managing a trust must consider the terms of the trust document, the needs of the beneficiaries, and prudent investor standards. The adviser's personal investment preferences are irrelevant and must not influence investment decisions for the trust."}, {"n": 38, "q": "In a community property state, property acquired during a marriage is generally", "a": "owned solely by the spouse who earned the income.", "b": "owned equally by both spouses.", "c": "owned by the state.", "d": "held in trust for any children.", "e": "In community property states, property acquired during the marriage is generally owned equally by both spouses, regardless of which spouse earned the income. Each spouse is entitled to half of all community property upon divorce or death."}, {"n": 39, "q": "A market order guarantees", "a": "the price at which the trade will be executed.", "b": "execution of the trade.", "c": "a profit on the transaction.", "d": "the order will be filled at the bid price.", "e": "A market order guarantees execution but does not guarantee the price. The trade will be filled at the best available price at the time the order reaches the market. This is in contrast to a limit order, which guarantees a price but not execution."}, {"n": 40, "q": "Which of the following describes the tax treatment of a traditional IRA distribution used for a first-time home purchase (up to $10,000)?", "a": "Tax free and penalty free", "b": "Subject to income tax but exempt from the 10% early withdrawal penalty", "c": "Tax free but subject to the 10% penalty", "d": "Subject to both income tax and the 10% penalty", "e": "Distributions from a traditional IRA for a first-time home purchase (up to $10,000 lifetime) are exempt from the 10% early withdrawal penalty, but are still subject to ordinary income tax. This exception applies to the purchase of a home for the account owner, spouse, child, or grandchild."}, {"n": 41, "q": "Kiddie tax rules apply to unearned income of children under a certain age and result in", "a": "all income being tax free.", "b": "unearned income above a threshold being taxed at the parent's marginal tax rate.", "c": "earned income being taxed at the child's rate.", "d": "no tax on the first $50,000 of unearned income.", "e": "The kiddie tax rules require that unearned income (investment income) of children under a certain age that exceeds a threshold amount be taxed at the parent's marginal tax rate rather than the child's rate. This prevents parents from shifting investment income to their children to take advantage of lower tax brackets."}, {"n": 42, "q": "An alternative minimum tax (AMT) is designed to ensure that", "a": "all taxpayers pay the same effective tax rate.", "b": "taxpayers who benefit from certain deductions and exclusions pay at least a minimum amount of tax.", "c": "corporations pay a higher rate than individuals.", "d": "only high-income taxpayers pay federal income tax.", "e": "The alternative minimum tax (AMT) is a parallel tax system designed to ensure that taxpayers who benefit from certain deductions, exclusions, and credits pay at least a minimum amount of federal income tax. It adds back certain preference items and adjustments to calculate AMT income."}, {"n": 43, "q": "An investor who uses the specific identification method for determining cost basis", "a": "must sell shares on a first-in, first-out basis.", "b": "identifies which specific shares are being sold to manage the tax impact.", "c": "uses the average cost of all shares purchased.", "d": "can only apply this method to mutual fund shares.", "e": "The specific identification method allows an investor to identify exactly which shares are being sold when liquidating a partial position. This enables tax management by choosing to sell higher-cost shares (to minimize gains) or lower-cost shares (to maximize gains), depending on the investor's tax situation."}, {"n": 44, "q": "Which of the following best describes a fee-based account?", "a": "An account that charges commissions on each transaction", "b": "An account that charges a flat or percentage-based fee for advisory services", "c": "An account that has no fees of any kind", "d": "An account that charges a fee only when the portfolio outperforms", "e": "A fee-based account charges a flat or percentage-based fee for advisory services rather than commissions on individual transactions. This aligns the adviser's compensation with the account value rather than trading volume, reducing potential conflicts of interest."}, {"n": 45, "q": "The primary advantage of tax-loss harvesting is", "a": "eliminating all capital gains permanently.", "b": "offsetting capital gains with capital losses to reduce current tax liability.", "c": "converting short-term gains to long-term gains.", "d": "avoiding the wash sale rule.", "e": "Tax-loss harvesting involves strategically selling investments at a loss to offset realized capital gains, thereby reducing current tax liability. The investor must be mindful of the wash sale rule, which disallows the loss if substantially identical securities are purchased within 30 days before or after the sale."}]}, {"id": 17, "name": "Unit 17: Client Investment Recommendations and Strategies", "key": "ABACBBABABBACCBCAACACBBBBBABBBCABBBBCCBABCDBBCBC", "questions": [{"n": 1, "q": "Financial planners frequently assist their clients with budgeting. One can't really prepare a budget without knowing the family's cash flow. In preparing a family cash flow statement, all of the following items would appear except", "a": "assets", "b": "salary", "c": "taxes", "d": "interest on saving accounts", "e": "A family cash flow statement basically tracks the money coming in versus the money going out. Assets don't \"flow\"; salary and interest flow in and taxes flow out. Assets would appear on a balance sheet (statement of financial position), not a cash flow statement."}, {"n": 2, "q": "The study of why people often make decisions using rules of thumb rather than rational analysis, basing those decisions on factors economists traditionally don't consider, such as fairness, past events, and aversion to loss, is known as", "a": "systematic risk", "b": "behavioral finance", "c": "irrational finance", "d": "risk tolerance", "e": "Behavioral finance is the study of how psychological factors and biases influence financial decision-making. It examines why people often use mental shortcuts (heuristics) rather than rational analysis, considering factors like fairness, loss aversion, and anchoring."}, {"n": 3, "q": "In making suitable investment recommendations, the least significant element would be the client's", "a": "educational level", "b": "retirement needs", "c": "death and disability needs", "d": "current income", "e": "Educational level is the least significant element when making suitable investment recommendations. While it may provide some context, the client's retirement needs, death and disability needs, and current income are all directly relevant to determining appropriate investments."}, {"n": 4, "q": "A client tells her investment adviser representative that she wants to invest her entire portfolio in one high-growth technology stock. The IAR should", "a": "immediately place the order as directed by the client.", "b": "refuse to execute the trade under any circumstances.", "c": "discuss the risks of a concentrated position and document the discussion.", "d": "report the client to the state Administrator.", "e": "When a client wants to make an unsuitable investment, the IAR should discuss the risks, explain why a concentrated position may not be appropriate, and document the conversation. The IAR should not simply refuse the trade, as the client ultimately makes the decision, but must ensure the client understands the risks."}, {"n": 5, "q": "It would be correct to state that when an investor has a long time horizon,", "a": "the greater the initial deposit needed to reach a projected future goal.", "b": "the smaller the initial deposit needed to reach a projected future goal.", "c": "time horizon has no effect on the initial deposit.", "d": "a shorter time horizon means greater risk tolerance.", "e": "With a longer time horizon, the investor has more time for compound growth to work, meaning a smaller initial deposit is needed to reach the same future goal. This is a fundamental time value of money concept—the longer money has to grow, the less you need to start with."}, {"n": 6, "q": "An investor has just received an inheritance of $100,000 and wants to invest it. Which of the following would be the MOST important first step for an investment adviser?", "a": "Recommend a diversified portfolio of mutual funds.", "b": "Determine the client's investment objectives and risk tolerance.", "c": "Invest in Treasury securities until a plan is developed.", "d": "Place the money in a money market account immediately.", "e": "The most important first step is to determine the client's investment objectives and risk tolerance through a thorough needs analysis. Before recommending any specific investments, the adviser must understand the client's complete financial picture, goals, time horizon, and comfort with risk."}, {"n": 7, "q": "All of the following are characteristics typical of a money market fund EXCEPT", "a": "it has a low beta and is safest in periods of low market volatility.", "b": "the fund attempts to maintain a stable $1.00 net asset value.", "c": "it invests in short-term, high-quality debt instruments.", "d": "it provides a high degree of liquidity.", "e": "Money market funds invest in short-term, high-quality debt instruments, maintain a stable $1.00 NAV, and provide high liquidity. Beta measures a security's volatility relative to the stock market, which is not particularly relevant to money market funds as they don't fluctuate with market volatility in the same way equities do."}, {"n": 8, "q": "A customer who seeks to supplement his retirement income and considers safety of principal as his most important objective would be LEAST interested in", "a": "Treasury receipts.", "b": "high-yield bond funds.", "c": "bank certificates of deposit.", "d": "money market funds.", "e": "A customer seeking income with safety of principal as the most important objective would be least interested in high-yield (junk) bond funds, which carry significant credit risk. Treasury receipts, bank CDs, and money market funds all emphasize safety of principal."}, {"n": 9, "q": "An investment adviser representative's client recently lost her husband. The client is 68 years old and has never managed investments before. The most important factor the IAR should consider when making recommendations is the client's", "a": "emotional state and need for income stability.", "b": "desire to maximize growth for her heirs.", "c": "tax bracket.", "d": "interest in speculative investments.", "e": "For a recently widowed 68-year-old client who has never managed investments, the most important consideration is her emotional state and need for income stability. Making drastic investment changes while grieving would be inappropriate. The focus should be on preserving capital and generating reliable income."}, {"n": 10, "q": "Which of the following would be suitable for an investor seeking current income with moderate risk?", "a": "An aggressive growth stock fund", "b": "A balanced fund of stocks and bonds", "c": "A limited partnership in oil exploration", "d": "A portfolio of call options", "e": "A balanced fund, which holds both stocks and bonds, would be suitable for an investor seeking current income with moderate risk. Aggressive growth funds, limited partnerships, and options portfolios all carry significantly higher risk and are not primarily income-oriented."}, {"n": 11, "q": "The rule of 72 is used to", "a": "determine the tax on investment gains.", "b": "estimate how long it will take for an investment to double in value.", "c": "calculate required minimum distributions.", "d": "measure portfolio standard deviation.", "e": "The rule of 72 is a simplified way to estimate how long it will take for an investment to double in value. You divide 72 by the annual rate of return. For example, at 6%, it would take approximately 72/6 = 12 years to double."}, {"n": 12, "q": "An investment adviser representative has a 78-year-old prospect living on $26,400 per year from Social Security plus investment income. Which of the following would you recommend to her?", "a": "Switch to a more conservative fund in the same family of funds.", "b": "Liquidate the fund shares and put the proceeds in a bank CD.", "c": "Invest in a municipal bond fund.", "d": "Sell her fund shares and reinvest in a vehicle offering her deferred accumulation.", "e": "For a 78-year-old living primarily on Social Security and investment income, switching to a more conservative fund in the same family would be most appropriate. This maintains her investment while reducing risk. Liquidating to a bank CD may reduce income, municipal bonds benefit high tax brackets (which she likely isn't in), and deferred accumulation is inappropriate given her age."}, {"n": 13, "q": "A 25-year-old single individual with a high income, no dependents, and a high risk tolerance would most likely be best suited for a portfolio weighted toward", "a": "money market instruments and short-term bonds.", "b": "long-term government bonds.", "c": "growth stocks and aggressive growth funds.", "d": "balanced funds and income stocks.", "e": "A 25-year-old single individual with high income, no dependents, and high risk tolerance has a long time horizon and the ability to weather market volatility. A portfolio weighted toward growth stocks and aggressive growth funds would be most suitable, as the investor can afford to take on more risk for potentially higher long-term returns."}, {"n": 14, "q": "Which of the following is NOT a component of a client's investment profile?", "a": "Risk tolerance", "b": "Time horizon", "c": "The adviser's personal investment preferences", "d": "Liquidity needs", "e": "The adviser's personal investment preferences should never be a factor in developing a client's investment profile. The profile should be based on the client's own risk tolerance, time horizon, liquidity needs, investment objectives, and financial situation."}, {"n": 15, "q": "Present value is best described as", "a": "the future amount of money that a given investment will grow to at a stated interest rate.", "b": "the current worth of a future sum of money given a specified rate of return.", "c": "the total of all cash flows from an investment.", "d": "the difference between the purchase price and the selling price of an investment.", "e": "Present value is the current worth of a future sum of money given a specified rate of return. It answers the question: how much is a future payment worth in today's dollars? This concept is central to time value of money calculations."}, {"n": 16, "q": "A client has the following financial characteristics: age 45, combined household income of $250,000, mortgage of $300,000, emergency fund of $50,000, and two children ages 10 and 12. Which of the following would be the LEAST appropriate recommendation?", "a": "Contributing the maximum to the employer's 401(k) plan", "b": "Opening 529 plans for the children's education", "c": "Investing the entire emergency fund in an aggressive growth fund", "d": "Purchasing adequate life insurance", "e": "Investing the entire emergency fund in an aggressive growth fund would be the least appropriate recommendation. Emergency funds should be kept in liquid, low-risk investments so they are available when needed. Contributing to a 401(k), opening 529 plans, and purchasing life insurance are all appropriate for this client profile."}, {"n": 17, "q": "Future value calculations are used to determine", "a": "what a sum of money invested today will be worth at a future date.", "b": "the current value of money to be received in the future.", "c": "the internal rate of return of an investment.", "d": "the discount rate needed to achieve a target return.", "e": "Future value calculations determine what a sum of money invested today will be worth at a specified future date, given a particular rate of return. It accounts for the compounding effect of interest or investment returns over time."}, {"n": 18, "q": "An investor who exhibits loss aversion, a concept from behavioral finance, would most likely", "a": "sell winning investments too quickly and hold losing investments too long.", "b": "take excessive risks to try to make up for prior losses.", "c": "invest only in risk-free securities.", "d": "follow the recommendations of investment advisers without question.", "e": "Loss aversion, a key concept in prospect theory and behavioral finance, causes investors to feel the pain of losses more acutely than the pleasure of equivalent gains. This often leads to selling winners too quickly (to lock in gains) while holding losers too long (hoping they will recover)."}, {"n": 19, "q": "When constructing a suitable portfolio for an elderly client who needs income, which of the following allocations would be most appropriate?", "a": "80% equities, 20% bonds", "b": "100% growth stocks", "c": "20% equities, 60% bonds, 20% cash equivalents", "d": "50% options, 50% futures", "e": "For an elderly client needing income, a conservative allocation of 20% equities, 60% bonds, and 20% cash equivalents would be most appropriate. This provides income through bond interest while maintaining some growth potential and liquidity. Heavy equity positions, growth stocks, options, and futures would be too risky."}, {"n": 20, "q": "Net present value (NPV) is calculated by", "a": "subtracting the initial investment from the sum of all discounted future cash flows.", "b": "adding all future cash flows without discounting.", "c": "multiplying the investment by the expected rate of return.", "d": "dividing the future value by the number of years.", "e": "Net present value (NPV) is calculated by subtracting the initial investment cost from the sum of all future cash flows that have been discounted back to present value. A positive NPV indicates the investment is expected to generate returns above the required rate."}, {"n": 21, "q": "An investor who follows the herd, buying when others buy and selling when others sell, is exhibiting which behavioral finance concept?", "a": "Anchoring", "b": "Overconfidence", "c": "Herding", "d": "Mental accounting", "e": "Herding is a behavioral finance concept where investors follow the crowd, buying when others buy and selling when others sell, rather than making independent investment decisions based on their own analysis. This can lead to asset bubbles and market panics."}, {"n": 22, "q": "The internal rate of return (IRR) is the discount rate that", "a": "maximizes the future value of cash flows.", "b": "makes the net present value of all cash flows equal to zero.", "c": "equals the risk-free rate.", "d": "minimizes the standard deviation of returns.", "e": "The internal rate of return (IRR) is the discount rate that makes the net present value of all cash flows from an investment equal to zero. It represents the expected annualized rate of return from the investment and is also known as the dollar-weighted return."}, {"n": 23, "q": "Which of the following clients would have the LONGEST investment time horizon?", "a": "A 65-year-old retired teacher", "b": "A 30-year-old saving for retirement", "c": "A 55-year-old planning to retire at 60", "d": "A 40-year-old saving for a down payment on a house next year", "e": "A 30-year-old saving for retirement has the longest time horizon, potentially 30-35 years. The retired teacher is already in distribution, the 55-year-old has only 5 years, and the 40-year-old saving for a house has about 1 year. Longer time horizons generally allow for more aggressive investment strategies."}, {"n": 24, "q": "Anchoring bias in behavioral finance refers to the tendency of investors to", "a": "diversify their portfolio across many asset classes.", "b": "rely too heavily on the first piece of information they receive when making decisions.", "c": "follow the investment decisions of institutional investors.", "d": "overestimate their ability to pick winning stocks.", "e": "Anchoring bias is the tendency to rely too heavily on the first piece of information encountered (the \"anchor\") when making decisions. For example, an investor might anchor on the price they paid for a stock and be unwilling to sell below that price, even when fundamentals have deteriorated."}, {"n": 25, "q": "A model portfolio is best described as", "a": "a portfolio that guarantees a specific rate of return.", "b": "a pre-designed asset allocation strategy that can be adjusted to fit a client's needs.", "c": "a portfolio consisting only of index funds.", "d": "a portfolio managed by a single portfolio manager for all clients.", "e": "A model portfolio is a pre-designed asset allocation strategy based on different risk profiles (conservative, moderate, aggressive) that can be adjusted to fit individual client needs. It provides a starting framework that advisers can customize based on a client's specific situation."}, {"n": 26, "q": "When using the time value of money to solve for the payment needed to reach a future goal, increasing the assumed rate of return will", "a": "increase the required periodic payment.", "b": "decrease the required periodic payment.", "c": "have no effect on the required periodic payment.", "d": "double the required periodic payment.", "e": "If the assumed rate of return increases, the required periodic payment decreases because each dollar invested is expected to grow faster. A higher return means less money needs to be invested to reach the same future goal."}, {"n": 27, "q": "Confirmation bias causes investors to", "a": "seek out information that confirms their existing beliefs while ignoring contradictory evidence.", "b": "panic sell during market downturns.", "c": "invest only in familiar companies.", "d": "overweight recent events when making investment decisions.", "e": "Confirmation bias is the tendency to search for, interpret, and recall information that confirms one's preexisting beliefs while giving disproportionately less attention to information that contradicts those beliefs. This can lead investors to ignore warning signs about their investments."}, {"n": 28, "q": "A couple, both age 40, with a combined income of $180,000, no children, and a moderate risk tolerance, is saving for retirement at age 65. The most suitable recommendation would be", "a": "100% allocation to money market funds.", "b": "a diversified portfolio of 70% equities and 30% fixed income.", "c": "100% allocation to high-yield bonds.", "d": "a concentrated position in their employer's stock.", "e": "For a couple at age 40 with moderate risk tolerance and 25 years until retirement, a diversified portfolio of approximately 70% equities and 30% fixed income provides growth potential while managing risk. This allocation can be adjusted to become more conservative as they approach retirement."}, {"n": 29, "q": "The discount rate used in present value calculations represents", "a": "the inflation rate only.", "b": "the rate of return required by the investor.", "c": "the federal funds rate.", "d": "the prime lending rate.", "e": "The discount rate in present value calculations represents the rate of return required by the investor, which accounts for the time value of money, inflation expectations, and risk. It is used to determine what future cash flows are worth in today's dollars."}, {"n": 30, "q": "Recency bias in behavioral finance refers to", "a": "the tendency to invest only in domestic securities.", "b": "giving too much weight to recent events and extrapolating them into the future.", "c": "the preference for investments with recent IPOs.", "d": "avoiding investments in companies with recent management changes.", "e": "Recency bias is the tendency to give disproportionate weight to recent events and assume that recent trends will continue. For example, after a market rally, investors with recency bias may expect the rally to continue indefinitely and increase their equity exposure at potentially the wrong time."}, {"n": 31, "q": "An investment adviser who recommends the same portfolio to every client regardless of their individual circumstances is violating the duty of", "a": "loyalty.", "b": "confidentiality.", "c": "suitability.", "d": "best execution.", "e": "Recommending the same portfolio to every client regardless of their individual circumstances violates the duty of suitability. Investment recommendations must be tailored to each client's specific financial situation, investment objectives, risk tolerance, time horizon, and other individual factors."}, {"n": 32, "q": "If an investor needs $50,000 in 10 years and can earn 6% annually, the present value calculation will determine", "a": "how much must be invested today to reach that goal.", "b": "the total interest earned over 10 years.", "c": "the tax liability on the investment.", "d": "the annualized rate of return.", "e": "A present value calculation determines how much must be invested today (the present value) to reach a specific future amount, given a particular rate of return and time period. In this case, it would tell the investor how much to invest today at 6% to have $50,000 in 10 years."}, {"n": 33, "q": "Overconfidence bias leads investors to", "a": "underestimate their knowledge and trade too infrequently.", "b": "overestimate their ability to predict market movements and trade excessively.", "c": "seek professional investment advice.", "d": "maintain well-diversified portfolios.", "e": "Overconfidence bias leads investors to overestimate their own abilities, knowledge, and the precision of their predictions. This often results in excessive trading, under-diversification, and taking on more risk than is appropriate, as investors believe they can consistently outperform the market."}, {"n": 34, "q": "Which of the following is a key element in determining the suitability of an investment recommendation?", "a": "The commission the adviser will earn", "b": "The client's financial situation, including income, net worth, and tax status", "c": "The current popularity of the investment", "d": "The adviser's familiarity with the product", "e": "The client's financial situation—including income, net worth, and tax status—is the key element in determining suitability. The commission earned, popularity of the investment, and adviser's familiarity with the product are not relevant factors and could represent conflicts of interest."}, {"n": 35, "q": "Mental accounting in behavioral finance refers to the tendency to", "a": "keep detailed records of all investment transactions.", "b": "treat money differently depending on its source or intended use.", "c": "calculate risk-adjusted returns for all investments.", "d": "use only mental math when analyzing investments.", "e": "Mental accounting is the tendency to treat money differently depending on its source, where it is kept, or how it is intended to be used, even though money is fungible (interchangeable). For example, someone might be willing to gamble with a bonus but not with their salary."}, {"n": 36, "q": "An annuity due differs from an ordinary annuity in that payments are made", "a": "at the end of each period.", "b": "at the beginning of each period.", "c": "only once per year.", "d": "in a lump sum.", "e": "In an annuity due, payments are made at the beginning of each period, whereas in an ordinary annuity, payments are made at the end of each period. Because payments are received sooner in an annuity due, its present value is higher than that of an otherwise identical ordinary annuity."}, {"n": 37, "q": "An investment adviser gathers all of the following information to develop an investment policy statement for a new client EXCEPT", "a": "the client's income and net worth.", "b": "the client's investment experience.", "c": "the client's political affiliation.", "d": "the client's tax situation.", "e": "A client's political affiliation is not relevant to developing an investment policy statement and should not be gathered as part of the client profiling process. Income, net worth, investment experience, and tax situation are all essential elements."}, {"n": 38, "q": "A client who separates her money into different mental buckets—one for vacations, one for retirement, one for emergencies—even though all money is fungible, is exhibiting", "a": "loss aversion.", "b": "herding.", "c": "mental accounting.", "d": "overconfidence.", "e": "Mental accounting is the behavioral finance concept where individuals categorize and treat money differently based on subjective criteria, such as the source of the money or its intended purpose. Treating vacation money differently from retirement money, even though all dollars are equal, is a classic example."}, {"n": 39, "q": "The time value of money concept is based on the premise that", "a": "money loses value over time due to inflation only.", "b": "a dollar received today is worth more than a dollar received in the future.", "c": "interest rates remain constant over time.", "d": "future cash flows are always certain.", "e": "The time value of money is based on the premise that a dollar received today is worth more than a dollar received in the future because today's dollar can be invested to earn a return. This concept underlies all present value and future value calculations."}, {"n": 40, "q": "Hindsight bias causes investors to", "a": "believe they predicted past events after they occurred, leading to overconfidence in future predictions.", "b": "avoid making investment decisions altogether.", "c": "seek out contrarian investment strategies.", "d": "rely exclusively on technical analysis.", "e": "Hindsight bias is the tendency to believe, after an event has occurred, that one predicted or expected the outcome. This leads to overconfidence in one's ability to predict future events, which can result in excessive risk-taking and poor investment decisions."}, {"n": 41, "q": "A client who is 5 years from retirement, has a moderate risk tolerance, and needs the portfolio to provide income beginning at retirement should have a portfolio that emphasizes", "a": "speculative growth stocks.", "b": "capital preservation with some growth, transitioning toward income.", "c": "100% cash equivalents.", "d": "leveraged investments.", "e": "A client 5 years from retirement with moderate risk tolerance should have a portfolio emphasizing capital preservation with some growth, transitioning toward income as retirement approaches. This means gradually shifting from equities to fixed-income securities and cash equivalents."}, {"n": 42, "q": "Using the rule of 72, approximately how long will it take for an investment to double at an annual growth rate of 8%?", "a": "6 years", "b": "8 years", "c": "9 years", "d": "12 years", "e": "Using the rule of 72: 72 divided by the annual growth rate of 8% equals 9 years. This means an investment growing at 8% annually will approximately double in value in 9 years."}, {"n": 43, "q": "Which of the following would NOT be considered when determining a client's risk tolerance?", "a": "The client's age", "b": "The client's investment experience", "c": "The client's emotional capacity for loss", "d": "The current Federal Reserve interest rate policy", "e": "Federal Reserve interest rate policy is a macroeconomic factor, not a factor in determining an individual client's risk tolerance. Risk tolerance is determined by personal factors such as age, investment experience, emotional capacity for loss, financial situation, and time horizon."}, {"n": 44, "q": "Prospect theory, a key concept in behavioral finance, suggests that", "a": "investors always act rationally to maximize wealth.", "b": "the pain of a loss is felt more strongly than the pleasure of an equivalent gain.", "c": "markets are perfectly efficient at all times.", "d": "past performance is the best predictor of future results.", "e": "Prospect theory, developed by Kahneman and Tversky, suggests that investors are not always rational and that losses have a greater psychological impact than equivalent gains. The pain of losing $1,000 is felt more strongly than the pleasure of gaining $1,000, which explains loss aversion behavior."}, {"n": 45, "q": "A lump-sum investment of $10,000 at 6% compounded annually will grow to approximately $17,908 in 10 years. This demonstrates the concept of", "a": "present value.", "b": "future value.", "c": "net present value.", "d": "internal rate of return.", "e": "This demonstrates the concept of future value—the amount that a current sum of money will grow to at a given interest rate over a specified period. The $10,000 grows to $17,908 through the power of compound interest over 10 years at 6%."}, {"n": 46, "q": "When gathering client information during the profiling process, all of the following would be relevant EXCEPT the client's", "a": "current and expected future income.", "b": "existing investments and net worth.", "c": "favorite sports team.", "d": "marital status and number of dependents.", "e": "A client's favorite sports team has no relevance to the investment profiling process. Current and expected income, existing investments and net worth, and marital status with dependents are all important factors that directly affect investment recommendations."}, {"n": 47, "q": "Framing in behavioral finance refers to the way", "a": "a portfolio is structured across asset classes.", "b": "information is presented can influence an investor's decision.", "c": "financial statements frame a company's performance.", "d": "regulatory frameworks are structured.", "e": "Framing refers to how the presentation or context of information influences decision-making. For example, an investment described as having a \"90% chance of success\" may be perceived differently than one described as having a \"10% chance of failure,\" even though they are mathematically identical."}, {"n": 48, "q": "A client with $500,000 to invest, no need for current income, a 20-year time horizon, and high risk tolerance is best suited for", "a": "a portfolio of Treasury bills.", "b": "a conservative bond ladder.", "c": "an aggressive growth portfolio with equities and alternative investments.", "d": "a money market fund.", "e": "With $500,000, no income needs, a 20-year time horizon, and high risk tolerance, this client is well-suited for an aggressive growth portfolio with equities and alternative investments. The long time horizon allows the investor to ride out market volatility and benefit from higher long-term growth potential."}]}, {"id": 18, "name": "Unit 18: Retirement Plans, Including ERISA Issues and Educational Funding Programs", "key": "DBCBCBCBBCBBBCCCBCBBBBBCABBBBBBABCDBDCCBCBBDBCBCBC", "questions": [{"n": 1, "q": "All of the following are characteristics of a traditional individual retirement account (IRA) EXCEPT", "a": "contributions may be tax deductible.", "b": "earnings grow tax deferred.", "c": "distributions are taxed as ordinary income.", "d": "qualified distributions are tax free.", "e": "Qualified distributions being tax free is a characteristic of a Roth IRA, not a traditional IRA. Traditional IRA contributions may be tax deductible, earnings grow tax deferred, and distributions are taxed as ordinary income upon withdrawal."}, {"n": 2, "q": "A Roth IRA differs from a traditional IRA in that", "a": "contributions to a Roth IRA are tax deductible.", "b": "qualified distributions from a Roth IRA are tax free.", "c": "Roth IRAs have lower contribution limits.", "d": "Roth IRAs require minimum distributions during the owner's lifetime.", "e": "The key difference between a Roth IRA and a traditional IRA is that qualified distributions from a Roth IRA are completely tax free. Roth IRA contributions are made with after-tax dollars (not deductible), contribution limits are the same as traditional IRAs, and Roth IRAs do not require minimum distributions during the owner's lifetime."}, {"n": 3, "q": "Under current IRS rules, the maximum annual contribution to a traditional or Roth IRA for an individual under age 50 is", "a": "$5,500.", "b": "$6,500.", "c": "$7,000.", "d": "$10,000.", "e": "The maximum annual IRA contribution for individuals under age 50 is $7,000 (as of 2024, indexed for inflation). This limit applies to the combined total of contributions to all traditional and Roth IRAs."}, {"n": 4, "q": "The catch-up contribution provision for IRAs allows individuals age 50 and older to contribute an additional", "a": "$500.", "b": "$1,000.", "c": "$2,500.", "d": "$5,000.", "e": "Individuals age 50 and older can make an additional catch-up contribution of $1,000 per year to their IRA, on top of the standard contribution limit. This provision is designed to help older workers increase their retirement savings."}, {"n": 5, "q": "Distributions from a traditional IRA taken before age 59½ are generally subject to", "a": "ordinary income tax only.", "b": "a 10% early withdrawal penalty only.", "c": "ordinary income tax plus a 10% early withdrawal penalty.", "d": "no tax or penalty if used for any purpose.", "e": "Distributions from a traditional IRA before age 59½ are generally subject to both ordinary income tax and a 10% early withdrawal penalty. The penalty is designed to discourage the use of retirement funds before retirement."}, {"n": 6, "q": "Which of the following is an exception to the 10% early withdrawal penalty from an IRA?", "a": "Purchase of a new automobile", "b": "Qualified higher education expenses", "c": "Vacation expenses", "d": "Home renovation costs", "e": "Qualified higher education expenses are an exception to the 10% early withdrawal penalty from an IRA. Other exceptions include death, disability, substantially equal periodic payments (72t), first-time home purchase (up to $10,000), and unreimbursed medical expenses exceeding a certain percentage of AGI. Note that income tax still applies."}, {"n": 7, "q": "Required minimum distributions (RMDs) from a traditional IRA must begin by", "a": "age 59½.", "b": "age 65.", "c": "April 1 of the year following the year the owner reaches age 73.", "d": "December 31 of the year the owner reaches age 70½.", "e": "Under the SECURE 2.0 Act, required minimum distributions from traditional IRAs must begin by April 1 of the year following the year the owner reaches age 73. Failure to take the RMD results in a significant excise tax penalty on the amount that should have been distributed."}, {"n": 8, "q": "An investor wishes to roll over funds from one traditional IRA to another traditional IRA. To avoid tax consequences, the rollover must be completed within", "a": "30 days.", "b": "60 days.", "c": "90 days.", "d": "120 days.", "e": "An IRA-to-IRA rollover must be completed within 60 days to avoid being treated as a taxable distribution. If not completed within 60 days, the amount is subject to income tax and possibly the 10% early withdrawal penalty. Only one such rollover per 12-month period is permitted."}, {"n": 9, "q": "Which of the following statements regarding Roth IRA conversions is CORRECT?", "a": "Only individuals under age 59½ may convert.", "b": "Income tax must be paid on the converted amount in the year of conversion.", "c": "There is a $10,000 annual limit on conversions.", "d": "Conversions are only permitted from traditional IRAs, not from 401(k) plans.", "e": "When converting a traditional IRA to a Roth IRA, income tax must be paid on the converted amount in the year of conversion. There is no income limit or age restriction for conversions, no limit on the amount that can be converted, and conversions can be made from 401(k) plans as well as traditional IRAs."}, {"n": 10, "q": "For a distribution from a Roth IRA to be considered qualified and therefore tax free, the account must have been open for at least", "a": "1 year.", "b": "3 years.", "c": "5 years.", "d": "10 years.", "e": "For a Roth IRA distribution to be qualified (and therefore tax and penalty free), the account must have been open for at least 5 years and the distribution must meet one of the qualifying conditions (age 59½, death, disability, or first-time home purchase up to $10,000)."}, {"n": 11, "q": "A 401(k) plan is a type of", "a": "defined benefit plan.", "b": "defined contribution plan.", "c": "nonqualified deferred compensation plan.", "d": "individual retirement account.", "e": "A 401(k) plan is a defined contribution plan in which the employer establishes the plan and both employer and employee may make contributions. The retirement benefit depends on the amount contributed and investment performance, unlike a defined benefit plan which promises a specific retirement benefit."}, {"n": 12, "q": "In a traditional 401(k) plan, employee contributions are made with", "a": "after-tax dollars.", "b": "pre-tax dollars.", "c": "a combination of pre-tax and after-tax dollars.", "d": "employer-matched dollars only.", "e": "In a traditional 401(k) plan, employee contributions are made with pre-tax dollars, meaning they reduce the employee's current taxable income. Taxes are deferred until the funds are withdrawn, at which point distributions are taxed as ordinary income."}, {"n": 13, "q": "Which of the following is a characteristic of a Roth 401(k)?", "a": "Contributions are tax deductible.", "b": "Qualified distributions are tax free.", "c": "There is an income limit for participation.", "d": "Required minimum distributions apply during the owner's lifetime.", "e": "In a Roth 401(k), contributions are made with after-tax dollars (not deductible), but qualified distributions are completely tax free. Unlike a Roth IRA, there is no income limit for participation in a Roth 401(k). However, Roth 401(k) accounts are subject to RMDs during the owner's lifetime unless rolled to a Roth IRA."}, {"n": 14, "q": "An employer who sponsors a 401(k) plan may offer a matching contribution. Employer matching contributions", "a": "are always required by law.", "b": "vest immediately in all cases.", "c": "may be subject to a vesting schedule.", "d": "are limited to 3% of the employee's salary.", "e": "Employer matching contributions to a 401(k) may be subject to a vesting schedule, meaning the employee earns the right to the employer's contributions over time. Matching is not required by law, vesting schedules vary by plan, and there is no universal limit of 3%."}, {"n": 15, "q": "The maximum annual employee elective deferral to a 401(k) plan for an individual under age 50 is", "a": "$7,000.", "b": "$20,500.", "c": "$23,500.", "d": "$66,000.", "e": "The maximum annual employee elective deferral to a 401(k) plan for individuals under age 50 is $23,500 (2025, indexed for inflation). Individuals age 50 and older can make additional catch-up contributions. The $66,000 figure represents the total contribution limit including employer contributions."}, {"n": 16, "q": "A 403(b) plan is available to employees of", "a": "private, for-profit corporations.", "b": "self-employed individuals only.", "c": "public schools and certain tax-exempt organizations.", "d": "state and local government employees only.", "e": "A 403(b) plan, also called a tax-sheltered annuity (TSA), is available to employees of public schools, colleges, universities, and certain tax-exempt organizations under Section 501(c)(3) of the Internal Revenue Code. It operates similarly to a 401(k) plan."}, {"n": 17, "q": "A Section 457 deferred compensation plan is primarily designed for employees of", "a": "private corporations.", "b": "state and local governments and certain tax-exempt organizations.", "c": "the federal government only.", "d": "self-employed individuals.", "e": "Section 457 deferred compensation plans are primarily designed for employees of state and local governments and certain tax-exempt organizations. They allow participants to defer a portion of their salary on a pre-tax basis, similar to a 401(k), but with some unique distribution rules."}, {"n": 18, "q": "A Simplified Employee Pension (SEP) IRA is characterized by all of the following EXCEPT", "a": "only the employer makes contributions.", "b": "it is easy to establish and administer.", "c": "employee contributions are permitted.", "d": "contribution limits are higher than traditional IRAs.", "e": "In a SEP IRA, only the employer makes contributions; employee contributions are not permitted. SEP IRAs are easy to establish and administer, have higher contribution limits than traditional IRAs, and are popular among self-employed individuals and small business owners."}, {"n": 19, "q": "A SIMPLE IRA requires the employer to", "a": "match employee contributions dollar for dollar up to 10% of salary.", "b": "either match employee contributions up to 3% of compensation or make a 2% nonelective contribution.", "c": "provide a defined benefit at retirement.", "d": "file quarterly reports with the SEC.", "e": "An employer sponsoring a SIMPLE IRA must either match employee contributions dollar for dollar up to 3% of compensation (which can be reduced to 1% in 2 of every 5 years) or make a 2% nonelective contribution for all eligible employees regardless of whether they contribute."}, {"n": 20, "q": "Which of the following is TRUE about a SIMPLE IRA?", "a": "It is available only to employers with 500 or more employees.", "b": "Both employer and employee contributions are permitted.", "c": "Employee contributions are not tax deductible.", "d": "The plan requires annual actuarial calculations.", "e": "A SIMPLE IRA allows both employer and employee contributions. It is available to employers with 100 or fewer employees, employee contributions are made with pre-tax dollars (tax deductible), and the plan does not require actuarial calculations."}, {"n": 21, "q": "In a defined benefit pension plan, the retirement benefit is determined by", "a": "the amount contributed and investment performance.", "b": "a formula typically based on years of service and salary.", "c": "the employee's voluntary contributions.", "d": "the employer's annual profits.", "e": "In a defined benefit pension plan, the retirement benefit is determined by a formula, typically based on years of service and salary (often the average of the highest 3 or 5 years). The employer promises a specific benefit amount at retirement."}, {"n": 22, "q": "In a defined benefit pension plan, the investment risk is borne by", "a": "the employee.", "b": "the employer.", "c": "the plan trustee personally.", "d": "the federal government.", "e": "In a defined benefit pension plan, the employer bears the investment risk because the employer is obligated to pay the promised benefit regardless of investment performance. If plan investments underperform, the employer must make up the shortfall with additional contributions."}, {"n": 23, "q": "In a defined contribution plan, the retirement benefit depends on", "a": "a formula based on years of service and final salary.", "b": "the amount contributed and the investment performance of those contributions.", "c": "the employer's guarantee of a specific payout.", "d": "Social Security benefits.", "e": "In a defined contribution plan (such as a 401(k) or 403(b)), the retirement benefit depends on the total amount contributed by the employee and employer and the investment performance of those contributions. The employee bears the investment risk."}, {"n": 24, "q": "Which of the following is a nonqualified retirement plan?", "a": "401(k) plan", "b": "Defined benefit pension plan", "c": "Deferred compensation plan", "d": "Profit-sharing plan", "e": "A deferred compensation plan is a nonqualified plan. It does not need to meet the same IRS requirements as qualified plans regarding participation, vesting, and funding. Qualified plans include 401(k) plans, defined benefit pension plans, and profit-sharing plans."}, {"n": 25, "q": "A key difference between qualified and nonqualified retirement plans is that qualified plans", "a": "offer tax-deductible contributions and tax-deferred growth.", "b": "are available only to highly compensated employees.", "c": "do not need to comply with ERISA.", "d": "allow unlimited contributions.", "e": "Qualified retirement plans offer tax-deductible contributions (for employers) and tax-deferred growth, which are the primary tax advantages. They must comply with ERISA and IRS requirements, are available to a broad group of employees (not just highly compensated), and have annual contribution limits."}, {"n": 26, "q": "Under ERISA, a fiduciary of a retirement plan must", "a": "guarantee a minimum rate of return for plan participants.", "b": "act solely in the interest of plan participants and beneficiaries.", "c": "invest all plan assets in government securities.", "d": "distribute all plan earnings annually.", "e": "Under ERISA, fiduciaries must act solely in the interest of plan participants and beneficiaries, following the prudent expert rule. ERISA does not require guaranteeing returns, investing only in government securities, or distributing all earnings annually."}, {"n": 27, "q": "Which of the following is a prohibited transaction under ERISA?", "a": "Diversifying plan investments across multiple asset classes", "b": "A fiduciary lending money to the plan", "c": "Hiring a qualified investment adviser for the plan", "d": "Offering participants a choice of investment options", "e": "Under ERISA, a fiduciary lending money to the plan is a prohibited transaction. Prohibited transactions are designed to prevent self-dealing and conflicts of interest. Diversifying investments, hiring qualified advisers, and offering investment choices are all permissible and even encouraged."}, {"n": 28, "q": "ERISA applies to", "a": "all government retirement plans.", "b": "private sector employer-sponsored retirement plans.", "c": "Social Security.", "d": "individual retirement accounts only.", "e": "ERISA applies to private sector employer-sponsored retirement plans, including both defined benefit and defined contribution plans. It does not apply to government plans, church plans, or plans maintained outside the United States for nonresident aliens. It also does not apply to individual retirement accounts directly."}, {"n": 29, "q": "Vesting refers to", "a": "the employer's right to terminate the retirement plan.", "b": "an employee's nonforfeitable right to employer contributions.", "c": "the process of converting a traditional IRA to a Roth IRA.", "d": "the calculation of required minimum distributions.", "e": "Vesting refers to an employee's nonforfeitable right to the employer's contributions in a retirement plan. Employee contributions are always 100% immediately vested. Employer contributions may be subject to a vesting schedule that determines when the employee earns the right to those funds."}, {"n": 30, "q": "Under a cliff vesting schedule, an employee", "a": "gradually becomes vested over several years.", "b": "becomes 100% vested after a specified number of years of service.", "c": "is always immediately vested.", "d": "loses all unvested benefits if they change employers.", "e": "Under cliff vesting, an employee has 0% vesting until a specified number of years of service is completed, at which point they become 100% vested. This is in contrast to graded (graduated) vesting, where vesting increases incrementally over time."}, {"n": 31, "q": "A profit-sharing plan differs from a money purchase pension plan in that", "a": "the profit-sharing plan requires a fixed annual contribution.", "b": "the profit-sharing plan allows the employer discretion in the amount contributed each year.", "c": "the money purchase plan has no minimum funding requirement.", "d": "the profit-sharing plan provides a defined benefit.", "e": "A profit-sharing plan allows the employer discretion in the amount contributed each year, including the ability to make no contribution in some years. A money purchase pension plan requires the employer to make a fixed annual contribution (a set percentage of each employee's compensation) every year."}, {"n": 32, "q": "An employee stock ownership plan (ESOP) is a retirement plan that", "a": "invests primarily in the employer's stock.", "b": "is available only to executives.", "c": "prohibits employer contributions.", "d": "requires employees to purchase shares at market price.", "e": "An employee stock ownership plan (ESOP) is a qualified retirement plan that invests primarily in the stock of the sponsoring employer. It allows employees to become owners of the company. ESOPs receive special tax benefits and are available to all eligible employees, not just executives."}, {"n": 33, "q": "Social Security retirement benefits are based on", "a": "the worker's highest 5 years of earnings.", "b": "the worker's average indexed monthly earnings over 35 years.", "c": "the total amount of FICA taxes paid.", "d": "the worker's final year of employment income.", "e": "Social Security retirement benefits are based on the worker's average indexed monthly earnings (AIME) calculated over the highest 35 years of earnings. If a worker has fewer than 35 years of earnings, zeros are averaged in for the missing years."}, {"n": 34, "q": "To be fully insured for Social Security retirement benefits, a worker generally needs", "a": "20 quarters of coverage.", "b": "30 quarters of coverage.", "c": "40 quarters of coverage.", "d": "52 quarters of coverage.", "e": "To be fully insured for Social Security retirement benefits, a worker generally needs 40 quarters of coverage (equivalent to 10 years of work). A quarter of coverage is earned by earning a minimum amount of income in a calendar quarter."}, {"n": 35, "q": "The full retirement age for Social Security for individuals born in 1960 or later is", "a": "62.", "b": "65.", "c": "66.", "d": "67.", "e": "The full retirement age (FRA) for Social Security for individuals born in 1960 or later is 67. For those born between 1943 and 1954, the FRA is 66, with a gradual increase for those born between 1955 and 1959."}, {"n": 36, "q": "A worker who begins collecting Social Security retirement benefits at age 62 will receive", "a": "the full benefit amount.", "b": "a permanently reduced benefit.", "c": "a temporarily reduced benefit that increases at full retirement age.", "d": "no benefit until reaching full retirement age.", "e": "A worker who begins collecting Social Security retirement benefits at age 62 (the earliest eligibility age) will receive a permanently reduced benefit. The reduction is approximately 6.67% per year for the first 3 years before FRA and 5% per year for additional years. This reduction is permanent."}, {"n": 37, "q": "Social Security benefits may be subject to federal income tax if the recipient's combined income exceeds certain thresholds. The maximum percentage of benefits that may be taxable is", "a": "25%.", "b": "50%.", "c": "75%.", "d": "85%.", "e": "Up to 85% of Social Security benefits may be subject to federal income tax if the recipient's combined income (adjusted gross income + nontaxable interest + half of Social Security benefits) exceeds certain thresholds. The thresholds vary based on filing status."}, {"n": 38, "q": "For a divorced spouse to receive Social Security benefits based on the ex-spouse's earnings record, the marriage must have lasted at least", "a": "5 years.", "b": "7 years.", "c": "10 years.", "d": "15 years.", "e": "For a divorced spouse to receive Social Security benefits based on the ex-spouse's earnings record, the marriage must have lasted at least 10 years. Additionally, the divorced spouse must be unmarried, at least 62 years old, and not entitled to a higher benefit based on their own earnings record."}, {"n": 39, "q": "A Section 529 plan is used for", "a": "retirement savings.", "b": "health care expenses.", "c": "education savings.", "d": "charitable giving.", "e": "Section 529 plans are state-sponsored education savings plans that offer tax advantages for saving for qualified education expenses. They can be used for tuition, room and board, books, and computers at eligible educational institutions, and up to $10,000 per year for K-12 tuition."}, {"n": 40, "q": "Contributions to a Section 529 plan are", "a": "tax deductible at the federal level.", "b": "made with after-tax dollars.", "c": "limited to $2,000 per year.", "d": "restricted to residents of the sponsoring state.", "e": "Contributions to Section 529 plans are made with after-tax dollars and are not deductible at the federal level (though some states offer state tax deductions). There is no annual contribution limit set by the IRS, though contributions above the annual gift tax exclusion amount may have gift tax implications."}, {"n": 41, "q": "Qualified withdrawals from a Section 529 plan used for eligible education expenses are", "a": "taxed as ordinary income.", "b": "subject to a 10% penalty.", "c": "tax free at the federal level.", "d": "taxed at capital gains rates.", "e": "Qualified withdrawals from a Section 529 plan used for eligible education expenses are completely tax free at the federal level. Earnings grow tax deferred, and if used for non-qualified purposes, the earnings portion is subject to income tax plus a 10% penalty."}, {"n": 42, "q": "A Coverdell Education Savings Account (ESA) differs from a Section 529 plan in that the Coverdell ESA", "a": "has no annual contribution limit.", "b": "can be used for elementary and secondary school expenses in addition to college.", "c": "offers tax-deductible contributions.", "d": "has no income limit for contributors.", "e": "A Coverdell ESA can be used for elementary and secondary school expenses (K-12) in addition to college expenses, whereas Section 529 plans were originally limited to higher education (though the Tax Cuts and Jobs Act expanded 529s to include up to $10,000 for K-12 tuition). Coverdell ESAs have a $2,000 annual contribution limit and income limits for contributors."}, {"n": 43, "q": "The maximum annual contribution to a Coverdell Education Savings Account is", "a": "$500.", "b": "$2,000.", "c": "$5,500.", "d": "$18,000.", "e": "The maximum annual contribution to a Coverdell Education Savings Account is $2,000 per beneficiary. This limit is subject to income phase-outs for contributors. Contributions are made with after-tax dollars, but qualified distributions for education expenses are tax free."}, {"n": 44, "q": "Under ERISA, the prudent investor rule requires fiduciaries to", "a": "invest plan assets only in government-guaranteed securities.", "b": "manage plan assets with the care, skill, and diligence that a prudent person would use.", "c": "maximize returns regardless of risk.", "d": "invest at least 50% of plan assets in equities.", "e": "The prudent investor rule under ERISA requires fiduciaries to manage plan assets with

bject to exchange rate, or currency, risk.", "d": "ADRs are denominated in and pay dividends in U.S. dollars.", "e": "Even though ADRs are denominated in U.S. dollars, they are subject to exchange rate, or currency, risk."}]}, {"id": 83, "name": "Series 65 Domain 2 (Quiz 3): Investment Vehicle Characteristics", "key": "CABABCDDBBCBAACCDBCDDCCDB", "questions": [{"n": 1, "q": "A company that has issued cumulative preferred stock", "a": "pays the preferred dividend before paying the coupons due on its outstanding bonds", "b": "forces conversion of the preferred that is trading at a discount to par, thereby eliminating the need to pay past-due dividends", "c": "pays past and current preferred dividends before paying dividends on common stock", "d": "pays the current dividends on the preferred, but not the past dividends on the preferred, before paying a dividend on the common", "e": "Current and unpaid past dividends on cumulative preferred stock must be paid before common stockholders can receive a dividend."}, {"n": 2, "q": "ADRs are used to facilitate", "a": "the domestic trading of foreign securities", "b": "the domestic trading of U.S. government securities", "c": "the foreign trading of domestic securities", "d": "the foreign trading of U.S. government securities", "e": "An ADR is a negotiable security that represents an ownership interest in a non-U.S. company."}, {"n": 3, "q": "Which of the following is a risk faced by investors in foreign stocks that is not found when investing in domestic issues?", "a": "Credit risk", "b": "Exchange rate risk", "c": "Market risk", "d": "Business risk", "e": "An investor who invests in foreign stocks is subject to many of the same risks associated with domestic stock investment, but a unique risk faced by investors in foreign stocks is exchange rate risk."}, {"n": 4, "q": "An American depositary receipt (ADR) is", "a": "a certificate representing ownership of a foreign security that is on deposit at a U.S. bank", "b": "a certificate representing ownership of a U.S. security that is deposited in a foreign bank", "c": "a type of derivative used to speculate in foreign currencies", "d": "a document used with interest rate swaps", "e": "An American depositary receipt (ADR) is a certificate representing ownership of foreign securities that are on deposit at a U.S. bank."}, {"n": 5, "q": "A fundamental analyst would be most interested in which of the following?", "a": "Resistance and support levels", "b": "A P/E analysis of the stocks included in the Dow Jones Industrial Average", "c": "A 200-day moving average", "d": "The outstanding short interest in the market", "e": "Fundamentalists look at P/E ratios; the other tools mentioned are technical."}, {"n": 6, "q": "An analytical tool used to project the current value of a common stock using projected future dividends is", "a": "the price-to-earnings ratio", "b": "the dividend payout ratio", "c": "the dividend discount model", "d": "the future value computation", "e": "There are two widely accepted forms of common stock price projection using dividends - the dividend discount model and the dividend growth model."}, {"n": 7, "q": "Which of the following is used in technical analysis in an attempt to modify fluctuations of stock prices over the long term into a smoothed trend?", "a": "Consolidation", "b": "Trend lines", "c": "Support and resistance", "d": "Moving averages", "e": "To avoid the volatility frequently present in stock price trends, analysts will frequently use moving averages. These averages reduce short-term distortions to a minimum."}, {"n": 8, "q": "When reviewing potential securities to select for an investor's portfolio, a technical analyst would be most likely to evaluate", "a": "the price-to-book ratio", "b": "the price-to-earnings ratio", "c": "the management tenure", "d": "the daily trading volume", "e": "A technical analyst charts price and volume over time. The other choices are of interest to a fundamental analyst."}, {"n": 9, "q": "All the following factors support fundamental analysis while assessing a wide range of qualitative factors except", "a": "the company’s competitive position.", "b": "the company’s stock price trend.", "c": "the company’s management team’s quality and experience.", "d": "the company’s business model.", "e": "The company's stock price trend is important to technical analysis. Remember that a technician charts prices and volume over time."}, {"n": 10, "q": "Which of the following might be used by an analyst to approximate a reasonable price for a common stock?", "a": "Yield to maturity", "b": "The dividend discount model", "c": "Par value", "d": "Book value per share", "e": "The simplest model for valuing equity is the dividend discount model - the value of a stock is the present value of expected dividends on it."}, {"n": 11, "q": "Which of the following statements is TRUE?", "a": "A stock split increases the owner’s proportionate share of the company.", "b": "A growth company would be more likely to pay a cash dividend than a stock dividend.", "c": "Dividends have a significant influence on the value of the corporation's stock.", "d": "A corporation is required to pay a cash dividend to stockholders if the earnings are sufficient, especially if it is of preferred stock.", "e": "Dividends play a large role in what someone is willing to pay for the stock. For example, the dividend discount model (DDM) values a stock as the discounted present value of future dividends."}, {"n": 12, "q": "During the analysis of XYZ stock, a technical analyst concludes that XYZ's support level has been broken. Being a technician, the most appropriate decision should be to", "a": "rate the stock as a hold.", "b": "rate the stock as a sell.", "c": "rate the stock as a buy.", "d": "purchase additional shares of the stock.", "e": "If a support level is broken, this provides a sell signal. Once the stock has lost its support, expectations are that it will continue to fall."}, {"n": 13, "q": "To a technical analyst, the resistance level signifies the price at which a stock's supply would be expected to", "a": "increase substantially.", "b": "decrease substantially.", "c": "cause the stock price to \"\"break out\"\".", "d": "remain constant.", "e": "This is about comparing support and resistance levels. The lower limit to these fluctuations is called a support level. The upper limit is called a resistance level."}, {"n": 14, "q": "If a technician believed in the importance of volume, which of the following would indicate bullish sentiment?", "a": "Prices increase on heavy volume.", "b": "Prices decrease on heavy volume.", "c": "Prices decrease on light volume.", "d": "Prices increase on light volume.", "e": "Technicians watch volume changes along with price movements as an indicator of changes in supply and demand."}, {"n": 15, "q": "A technical analyst (chartist) with a long position in a particular stock would most likely enter a sell stop order below that stock's", "a": "resistance level", "b": "previous high", "c": "support level", "d": "200-day moving average", "e": "Sell stops are entered below the market. A technical analyst would enter a sell stop below a support level in order to sell out if the support level is breached."}, {"n": 16, "q": "Which of the following would NOT be of interest to a technical analyst?", "a": "Moving averages", "b": "Volume", "c": "P/E ratio", "d": "Advance/decline line", "e": "A technical analyst charts movement in market price and volume over a period of time. The price-to-earnings ratio is a tool used by fundamental analysts."}, {"n": 17, "q": "A fundamental analyst researching a stock is concerned with all of the following EXCEPT", "a": "management efficiency", "b": "capitalization ratio", "c": "the stock's market price as a multiple of the company's earnings", "d": "volume of shares traded", "e": "A fundamental analyst is concerned with the economic climate, the inflation rate, how an industry is performing, a company's historical earnings trends, and its financial statement ratios."}, {"n": 18, "q": "In the technical analysis of the value of securities, which of the following items is NOT important?", "a": "A prevailing market trend in response to shifts in supply and demand", "b": "The amount of a company's past earnings", "c": "Resistance and support levels", "d": "The breadth of market volume", "e": "The amount of a company's past earnings is a factor used in the fundamental analysis of securities, but not technical analysis."}, {"n": 19, "q": "The type of analysis that attempts to value securities by examining general economic trends and the growth potential and productivity of individual companies is", "a": "holding period analysis", "b": "credit analysis", "c": "fundamental analysis", "d": "technical analysis", "e": "There are two main approaches to valuing securities. Fundamental analysis takes the approach described in this question. The other approach - technical analysis - relies on charts of past performance."}, {"n": 20, "q": "A fundamental analyst would be interested in all of the following EXCEPT", "a": "statistics of the U.S. Department of Commerce on disposable income", "b": "innovations within the automotive industry", "c": "corporate annual reports", "d": "daily trading volumes on the NYSE", "e": "Trading volume interests the technical analyst, who looks at fluctuations in the market, not at fundamental economic values."}, {"n": 21, "q": "A technical analyst is least likely to consider which of the following when selecting securities?", "a": "Short interest ratio", "b": "Trend lines", "c": "Advance/decline line", "d": "Corporate earnings", "e": "Corporate earnings would be of least interest to a technical analyst, who is interested in market statistics indicative of future buying."}, {"n": 22, "q": "A stock has been in a downtrend for several days. When its price decreases to near 30,manyinvestorsenterorderstobuythestockandthepriceincreasesto31. This is most likely an example of", "a": "a change in polarity.", "b": "a resistance level.", "c": "a support level.", "d": "a reversal.", "e": "The downtrend reached a support level where buying demand sustained the price. A resistance level is a price at which selling pressure emerges that stops an uptrend."}, {"n": 23, "q": "Which of the following is not included in fundamental analysis of a company?", "a": "The study of the direction of the economy.", "b": "The study of a firm's financial statements.", "c": "The study of a company’s historical stock prices and trading volume.", "d": "The study of a firm's position within its industry.", "e": "Studying historical stock prices and volume is related to technical analysis. Fundamental analysis is concerned with the earnings potential and risk associated with a particular firm."}, {"n": 24, "q": "Which of the following would be of least interest to a chartist?", "a": "The volume of shares traded during the past month", "b": "The advance/decline line", "c": "The short interest", "d": "The relationship between the current market price of an issuer's common stock and most recently reported earnings per share", "e": "A chartist is interested in the volume of shares traded, and the short interest for that particular stock."}, {"n": 25, "q": "A support level is the price range at which a technical analyst would expect", "a": "the supply of a stock to decrease substantially.", "b": "the demand for a stock to increase substantially.", "c": "the demand for a stock to decrease substantially.", "d": "the supply of a stock to increase substantially.", "e": "Most stock prices remain relatively stable and fluctuate up and down from their true value. The lower limit is called a support level, the upper limit is called a resistance level."}]}, {"id": 84, "name": "Series 65 Domain 2 (Quiz 4): Investment Vehicle Characteristics", "key": "AAADADDDDCDBCAAABDBBBDACC", "questions": [{"n": 1, "q": "As defined in the Securities Exchange Act of 1934, the term municipal security would include all of the following EXCEPT", "a": "a City of Chicago school district bond", "b": "50-year bonds issued by the Tennessee Valley Authority", "c": "a U.S. Treasury bill", "d": "a Province of Ontario library construction bond", "e": "Under federal law, municipal bonds are those issued by any domestic political body or subdivision from the state level on down."}, {"n": 2, "q": "Municipal bonds are often called tax-exempts. This refers to the exemption of their income from", "a": "federal income taxes", "b": "federal estate taxes", "c": "state income taxes", "d": "state, federal, and inheritance taxes", "e": "Although municipal bonds are sometimes exempt from state income tax, all references to tax exemption refer to their exemption from federal income taxes."}, {"n": 3, "q": "Kate, age 59, has an investment portfolio exceeding $250,000. She considers herself a moderate to conservative investor. To generate additional income, she is anticipating adding bonds to her portfolio. She lives in a state that does not have an income tax and she is in the 28% federal income tax bracket. Which of the following bonds would be the best recommendation for her portfolio?", "a": "Bond A, A-rated corporate debenture with a 6.5% coupon rate", "b": "Bond C, CCC-rated corporate debenture with an 8% coupon rate", "c": "Bond D, AAA-rated Treasury note with a 2.55% coupon rate", "d": "Bond B, BBB-rated municipal bond with a 3.75% coupon rate", "e": "Even though Bond C has the highest after-tax rate of return, this bond would not be appropriate for Kate based on her risk tolerance. Therefore, Bond A would be the best choice."}, {"n": 4, "q": "A client in the 28% marginal federal income tax bracket invests in a corporate bond with an 8% coupon. To calculate the client's after-tax rate of return,", "a": "divide 0.08 by 0.28", "b": "divide 0.08 by 0.72", "c": "multiply 0.08 by 0.28", "d": "multiply 0.08 by 0.72", "e": "To determine a taxable bond's after-tax rate of return, multiply the coupon rate by the complement of the client's marginal federal income tax bracket."}, {"n": 5, "q": "Your client in the 25% federal income tax bracket lives in a state where his earnings place him in the 6% bracket for state income tax purposes. If he were to purchase a 4% bond issued by a political subdivision of his state, his total tax-equivalent yield would be", "a": "slightly more than 5.33%", "b": "approximately 12.90%", "c": "slightly less than 5.33%", "d": "4%", "e": "When an individual owns a municipal bond issued in his state of residence, not only is the interest tax free on a federal basis, but it is nontaxed in that state."}, {"n": 6, "q": "Your client in the 35% federal income tax bracket currently owns some corporate bonds with a coupon yield of 7%. In order to receive the same income after taxes, he would need to buy municipal bonds with a coupon of", "a": "7.00%", "b": "2.45%", "c": "9.45%", "d": "4.55%", "e": "Because the 7% on the corporate bond is fully taxable, the client receives a net of 4.55%. Interest on municipal bonds is tax free, so a 4.55% coupon will result in the same amount of after-tax income."}, {"n": 7, "q": "Which of the following choices offers the highest tax-equivalent yield?", "a": "5.8% municipal bond to an individual in the 25% tax bracket", "b": "5.5% municipal bond to an individual in the 28% tax bracket", "c": "5% municipal bond to an individual in the 35% tax bracket", "d": "6.2% municipal bond to a corporation in the 21% tax bracket", "e": "Corporations receive the same tax break on municipal bonds as do individuals. Therefore, receiving a 6.2% return in the 21% tax bracket is equivalent to 7.85% before tax."}, {"n": 8, "q": "Which of the following investments would provide the highest after-tax income to your client in the 35% federal income tax bracket?", "a": "6% U.S. Treasury bond", "b": "5% general obligation municipal bond issued by State H", "c": "7% bond issued by Canadian Province M", "d": "8% debenture issued by the LMN Corporation", "e": "Only the State H bond is exempt from federal income tax. Using the tax equivalent yield formula we get 5% divided by 65% or 7.7%."}, {"n": 9, "q": "When a corporation domiciled in the U.K. issues U.S. dollar-denominated bonds in the United States, it is issuing", "a": "Eurobonds.", "b": "ADRs.", "c": "Ameribonds.", "d": "Yankee bonds.", "e": "Yankee bonds are foreign bonds, denominated in U.S. dollars and issued in the United States by foreign banks and corporations."}, {"n": 10, "q": "An investor interested in investing in sovereign debt would most likely purchase", "a": "bonds backed by gold sovereigns.", "b": "European Central Bank debt issues.", "c": "Sweden 2.5s of 2032.", "d": "bonds issued by the Bank of the United States.", "e": "Sovereign debt refers to bonds and other debt instruments issued by a specific country."}, {"n": 11, "q": "Which of the following statements represents an advantage of a municipal general obligation bond over a revenue bond?", "a": "A GO bond is not charged against the municipality's borrowing limits.", "b": "A GO bond issuer is required to conduct a feasibility study.", "c": "Only a facility's users pay for a GO bond.", "d": "A GO bond generally involves less risk to the investor.", "e": "GO bonds are generally less risky than revenue bonds because they are backed by taxes rather than revenues."}, {"n": 12, "q": "Which of the following would best describes a Yankee bond?", "a": "U.S. dollar-denominated bond issued by a U.S. entity inside the United States", "b": "U.S. dollar-denominated bond issued by a non-U.S. entity inside the United States", "c": "U.S. dollar-denominated bond issued by a non-U.S. entity outside the United States", "d": "U.S. dollar-denominated bond issued by a U.S. entity outside the United States", "e": "Yankee bonds are issued by non-U.S. entities in marketplaces inside the United States. The bonds are issued in U.S. dollars."}, {"n": 13, "q": "Which of the following would best describe a Yankee bond?", "a": "A U.S. dollar–denominated bond issued by a U.S. entity outside the United States.", "b": "A U.S. dollar–denominated bond issued by a non-U.S. entity outside the United States.", "c": "A U.S. dollar–denominated bond issued by a non-U.S. entity inside the United States", "d": "A U.S. dollar–denominated bond issued by a U.S. entity inside the United States.", "e": "Yankee bonds are issued by non-U.S. entities in marketplaces inside of the United States. The bonds are issued in U.S. dollars."}, {"n": 14, "q": "Of the following securities, which is most commonly recommended to fund a child's college education?", "a": "Zero-coupon Treasury bonds", "b": "Investment-grade corporate bonds", "c": "Treasury bills", "d": "Municipal bonds", "e": "Zero-coupon bonds, particularly those carrying the guarantee of the U.S. Treasury, are a favored investment vehicle for saving for a child's higher education."}, {"n": 15, "q": "The call feature available on some bonds", "a": "allows the issuer the option to escape high interest rates if market rates decline.", "b": "may be used to convert the bond into preferred shares.", "c": "allows bond issuers to extend the life of the bond.", "d": "allows the issuer to refinance the debt if interest rates rise above the call rate.", "e": "Many bonds have a call feature that allows the issuer to call in the bonds and escape high interest rates if market interest rate declines."}, {"n": 16, "q": "If a corporate bond is a convertible bond, this means that", "a": "the owner of the bond may exchange it for a set number of shares of stock", "b": "the owner of the bond may exchange it for a bond paying a higher coupon rate", "c": "the owner of the bond may exchange it for a debenture", "d": "the corporation may redeem the bond before its maturity date", "e": "A convertible bond is usually a debenture that allows the owner to exchange it for a set number of shares of stock."}, {"n": 17, "q": "Which of the following statements regarding callable bonds is correct?", "a": "They offer lower yields than comparable noncallable bonds.", "b": "They usually provide a call risk premium.", "c": "They are only issued by government entities.", "d": "They are unaffected by changes in market yields.", "e": "Callable bonds are normally called only when interest rates fall. The call premium helps to compensate bondholders for the lower interest rate at which they will be able to reinvest the proceeds."}, {"n": 18, "q": "Which of the following statements regarding convertible debentures is TRUE?", "a": "The issuer pays a higher rate of interest, compared with a comparable nonconvertible debenture.", "b": "The debenture holders receive a variable rate of interest.", "c": "The issuer has the right to convert the debentures during the time period specified in the indenture.", "d": "When compared with similar nonconvertible debentures, convertible debentures are issued with a lower coupon rate.", "e": "A conversion feature is a benefit to the debtholder. It allows the debtholder a choice to either continue holding the debt or to convert it into shares of common stock."}, {"n": 19, "q": "A U.S. dollar-denominated bond issued by a non-American company (or government), sold outside the United States and the issuer's country, but for which the principal and interest are stated and paid in U.S. dollars is best described as", "a": "a Brady bond.", "b": "a Eurodollar bond.", "c": "a Eurobond.", "d": "a Yankee bond.", "e": "This is the definition of a Eurodollar bond. A Yankee bond is U.S. dollar-denominated, but is issued in the United States; Eurodollar bonds are not."}, {"n": 20, "q": "When a U.S. resident investor purchases foreign bonds,", "a": "depreciation of the bonds and appreciation of the foreign currency benefit the domestic investor.", "b": "appreciation of both the bonds and the foreign currency benefits the domestic investor.", "c": "depreciation of both the bonds and the foreign currency benefits the domestic investor.", "d": "appreciation of the bonds and depreciation of the foreign currency benefit the domestic investor.", "e": "In the same manner that purchasing foreign equities adds diversification to a portfolio, purchasing foreign bonds does as well."}, {"n": 21, "q": "If your customer wants to set aside $40,000 for when his child starts college, but does not want to endanger the principal, you should recommend", "a": "common stock", "b": "zero-coupon bonds backed by the U.S. Treasury", "c": "municipal bonds for their tax benefits", "d": "corporate bonds with high rates of interest", "e": "Treasury STRIPS are guaranteed by the U.S. government, so there is no chance of default. They are zero-coupon bonds and offer no current income."}, {"n": 22, "q": "The term \"eurodollars\" refers to", "a": "European currency held in U.S. banks", "b": "a worldwide currency system that is expected to someday replace existing currency systems", "c": "obsolete currency that was formerly backed by the gold standard", "d": "American dollars held by banks in other countries, especially in Europe", "e": "American dollars held in international banks, especially, but not exclusively, in Europe, are known as eurodollars."}, {"n": 23, "q": "Which of the following investments gives the investor the least exposure to reinvestment risk?", "a": "Treasury STRIPS/zero-coupon bonds", "b": "Preferred stock in a growth company", "c": "Treasury notes", "d": "Common stock in an electric utility", "e": "Treasury STRIPS (Separate Trading of Registered Interest and Principal of Securities) are zero-coupon bonds paying no interest. Thus, there is no reinvestment risk."}, {"n": 24, "q": "Your customer owns ½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½½100par5½25. What should she be advised to do if the board of directors were to call all the preferred at 106 when the common stock is trading at $25.50?", "a": "Convert her preferred stock into common stock because it is selling above parity.", "b": "Hold the preferred stock to continue the 5½% yield.", "c": "Present the preferred stock for the call because the call price is $4 above the parity price.", "d": "Place irrevocable instructions to convert the preferred stock into common stock and sell short the common stock immediately.", "e": "If the preferred stock is called, the client will receive $106. Tendering the preferred stock will provide the highest value."}, {"n": 25, "q": "An investor interested in acquiring a convertible bond as part of his investment portfolio would", "a": "be interested in tax advantages available to convertible debt securities", "b": "seek to minimize changes in the bond price during periods of steady interest rates", "c": "want the safety of a fixed-income investment along with potential capital appreciation", "d": "want the assurance of a guaranteed dividend on the underlying common stock", "e": "An investor who wants the safety of a fixed-income investment with the potential for capital gains would be most interested in purchasing a convertible bond."}]}, {"id": 85, "name": "Series 65 Domain 3 (Quiz 1): Client Investment Recommendations and Strategies", "key": "BCAAACDCDAADCDDAABBADBBDB", "questions": [{"n": 1, "q": "When does a customer have to receive the OCC Options Disclosure Document?", "a": "Within 15 days of account approval by the firm's designated options supervisor", "b": "Before accepting the customer’s first order to trade options covered by the ODD", "c": "With the confirmation of the first options transaction", "d": "Within 5 business days of the first options trade", "e": "When opening an account to trade options, the owner must be told about the risks involved with trading options. By providing the owner with an options disclosure document, the broker-dealer satisfies the risk disclosure requirements."}, {"n": 2, "q": "An investment adviser registered in 4 states would be permitted to enter into an advisory contract with all of the following prospective clients except", "a": "a university endowment fund.", "b": "a single parent.", "c": "a registered investment company.", "d": "a charitable foundation.", "e": "This is a bit sneaky. In order for an investment adviser to enter into an advisory contract with an investment company, the adviser must be SEC registered (federal covered)."}, {"n": 3, "q": "An investment adviser would be able to enter into an advisory contract with all of the following except", "a": "a minor.", "b": "a philanthropic foundation.", "c": "three brothers in a joint account.", "d": "a closed-end investment company.", "e": "Investment advisers can only enter into advisory contracts for those who are persons, as defined in the Uniform Securities Act. There are three nonpersons: minors, deceased persons, and those declared mentally incompetent."}, {"n": 4, "q": "A registered broker-dealer would not be able to open an account for", "a": "a person deemed mentally incompetent.", "b": "the CEO of a company whose stock is NYSE-traded.", "c": "two unrelated individuals.", "d": "the estate of a deceased individual.", "e": "A broker-dealer can only open an account with a legal person. Those deemed mentally incompetent are not persons under the law."}, {"n": 5, "q": "A registered broker-dealer would not be able to open an account for", "a": "a deceased individual.", "b": "a convicted felon.", "c": "the American Cancer Society.", "d": "the sovereign government of Poland.", "e": "An account may only be opened in the name of a legal person. Deceased individuals are not considered legal persons."}, {"n": 6, "q": "An investment adviser registered in 4 states would be permitted to enter into an advisory contract with all of the following prospective clients except", "a": "a bank.", "b": "an insurance company.", "c": "a minor.", "d": "a trust.", "e": "Because minors are not considered legal persons, advisory (or brokerage) accounts cannot be opened for them."}, {"n": 7, "q": "A broker-dealer would not be able to open an account for", "a": "a trust.", "b": "the estate of a deceased person.", "c": "a city.", "d": "a deceased person", "e": "Broker-dealers can only open accounts for those who are persons, as defined in the Uniform Securities Act. There are three nonpersons: minors, deceased persons, and those declared mentally incompetent."}, {"n": 8, "q": "Among the clients of a broker-dealer could be", "a": "a minor.", "b": "a deceased individual.", "c": "a foundation.", "d": "an individual declared mentally incompetent.", "e": "Clients could include any person, as defined in the Uniform Securities Act. Minors, deceased individuals, and mentally incompetent individuals are not persons."}, {"n": 9, "q": "Ms. Abbot has a joint account with her sister. She enters a sell order in the account and instructs that the proceeds check be made out to her only. If your firm sends the check but makes it payable to both Ms. Abbot and her sister, this is an example of", "a": "not following instructions, a prohibited practice under the Uniform Securities Act", "b": "an unlawful practice because the transaction was unauthorized", "c": "an unfortunate error that can be reconciled with the broker-dealer through a process called reclamation", "d": "the proper joint account procedure", "e": "In joint accounts, either party may act. However, by law, all checks must be made payable to all owners."}, {"n": 10, "q": "One respect in which an LLC differs from an S corporation is that", "a": "there is no statutory limit on the number of investors in an LLC", "b": "an LLC can be formed with as little as a single investor", "c": "there is more favorable tax treatment afforded to members of an LLC", "d": "not only income, but losses, if generated, pass through to investors in an LLC", "e": "There is no limit to the number of investors (members) in an LLC, while current regulations limit the number of investors (shareholders) in an S corporation to 100."}, {"n": 11, "q": "An S corporation is characterized by", "a": "flow-through tax treatment", "b": "limited lifetime", "c": "more than 100 shareholders", "d": "unlimited personal liability", "e": "Shareholders of an S corporation have limited liability, are limited to no more than 100 shareholders, and receive flow-through tax treatment."}, {"n": 12, "q": "In an account opened by 2 individuals as joint tenants with rights of survivorship, all of the following are true EXCEPT", "a": "in the event of death, the other party assumes full ownership of the account", "b": "orders may be entered by either party", "c": "mail may be directed to the joint owner agreed upon by both parties to the account", "d": "stock certificates may be delivered in the name of either party", "e": "In a JTWROS account, each party has an equal, undivided interest in the account. Upon the death of 1 party, the other party assumes full ownership."}, {"n": 13, "q": "Suzie McQueen has a very successful interior design shop she has run as a sole proprietorship. She has just celebrated her 60th birthday and has been giving thought to an eventual sale of the business. She wants your opinion on whether she should incorporate or change to a partnership. You might respond that", "a": "the partnership form of business structure would be the easiest for ultimate transfer of ownership", "b": "the partnership form of business structure would enable Suzie to maximize her sale price", "c": "the corporate form of business structure would be the easiest for ultimate transfer of ownership", "d": "the corporate form of business structure would be the least expensive to form", "e": "In general, the corporate form of business leads to the easiest transfer of ownership."}, {"n": 14, "q": "Under the provisions of the Internal Revenue Code, which of the following business forms is not required to file a separate tax return?", "a": "S corporation", "b": "Limited partnership", "c": "LLC", "d": "Sole proprietorship", "e": "In the case of a sole proprietorship, any tax consequences (income or loss) are reported on the owner's personal Form 1040, Schedule C."}, {"n": 15, "q": "A form of business structure that exposes all personal assets of the owner to creditors is", "a": "the LLC", "b": "the limited partnerships", "c": "the C corporation", "d": "the sole proprietorship", "e": "One of the reasons why few large businesses are organized as sole proprietorships is the fact that all personal assets are placed at risk if the business fails."}, {"n": 16, "q": "A man is planning to start his own glass-sculpturing business. He wants to be able to deduct his anticipated losses for the first 2 years. He anticipates that the enterprise will borrow money from lenders and is willing to personally guarantee the debt. He also wants to attract other investors but does not want to give up control of the day-to-day business decisions. What business form do you recommend?", "a": "Limited partnership", "b": "S corporation", "c": "General partnership", "d": "C corporations", "e": "A limited partnership with him as general partner would allow for additional investment capital without giving up management control."}, {"n": 17, "q": "If 150 investors want to form a corporation to limit their financial liability to the amount of money they invest and do not want to be responsible for any debt that the corporation incurs, they would most likely form", "a": "a C corporation", "b": "an S corporation", "c": "a general partnership", "d": "a proprietorship", "e": "The investors would form a C corporation. The advantages include that stockholders are not liable for corporate debt and it is easier to raise money."}, {"n": 18, "q": "Among the advantages of forming an S corporation rather than a C corporation for a new business enterprise is", "a": "shareholders’ losses are limited to the amount of their investment", "b": "any losses flow through to the investors", "c": "unlike the C corporation, which is limited to 100 investors, there is no such limit for an S corporation", "d": "the ease in raising substantial amounts of capital.", "e": "An S corporation offers the benefit of flow-through of both income and losses. It is limited to 100 investors."}, {"n": 19, "q": "The type of business organization in which one person owns the entire business and there is no legal distinction between that individual and the business is", "a": "a corporation", "b": "a sole proprietorship", "c": "a limited partnership", "d": "a general partnership", "e": "A sole proprietorship is the simplest form of business organization, because one person owns the entire business."}, {"n": 20, "q": "Because a trust account is managed for the beneficial interest of the beneficiary, the investment adviser representative can", "a": "have a check drawn on the account payable to the trustee for expenses", "b": "place the securities in the trust fund in a noncustodial brokerage account", "c": "have funds withdrawn from the account at the direction of the beneficiary", "d": "arrange to have the trust's funds pledged to support a loan for the trustee", "e": "The trustee can be reimbursed for expenses that are reasonable. A trust account must be managed by the trustee and not by the beneficiary."}, {"n": 21, "q": "Alvin's spouse is a trustee of a trust established by Henrietta Flood, which directs income from the trust be paid to Alvin, for as long as he lives. Alvin's son, Floyd, will receive the principal upon Alvin's death. Floyd would like to receive some of the principal before Alvin's death, and Alvin does not object. How should his spouse, the trustee, act in this situation?", "a": "Distribute part of the income to Floyd.", "b": "Distribute part of the principal to Floyd.", "c": "Distribute all of the principal to Floyd.", "d": "Follow the trust terms, continuing to distribute the income to Alvin and the principal to Floyd upon Alvin's death.", "e": "A trustee must follow the terms of the trust. Nothing in the question implies that the trustee has any discretionary powers."}, {"n": 22, "q": "Your advisory client is an 86-year-old woman who is presently in the hospital, unable to communicate due to a severe stroke. For the past 6 years, she has followed the practice of making annual gifts of stock to her children and grandchildren on her birthday. Because her 87th is coming up later this month, her oldest son approaches you and asks you to continue the policy.", "a": "With 6 years of prior history, you know this is what she would want you to do so you go ahead as in previous years.", "b": "Without a proper durable power of attorney being produced, you cannot do anything.", "c": "You should go to the hospital and see if she can blink her eyes to indicate yes or no.", "d": "You may only follow the provisions of her will.", "e": "Unless proper written authorization has been provided, such as with a durable power of attorney, you cannot do anything without the client's consent."}, {"n": 23, "q": "A feature of which of the following business entities is limited liability but no flow-through of earnings or losses?", "a": "Sole proprietorship", "b": "Corporation", "c": "Limited partnership", "d": "LLC", "e": "The corporation (always assume C corporation unless it says different on the test) offers limited liability to its shareholders, but there is no flow-through of income or loss."}, {"n": 24, "q": "When a trustee is managing the trust assets, which of the following is the most important consideration?", "a": "Preservation of capital", "b": "Reasonable income", "c": "Minimizing expenses", "d": "The purposes, terms, distribution requirements, and other circumstances of the trust", "e": "Although there certainly is a case for preservation of capital, the most important consideration is to follow the design and objectives of the trust."}, {"n": 25, "q": "In a trust account, the person who makes the account management decisions is", "a": "the investment adviser representative", "b": "the trustee", "c": "the nontrustee custodian", "d": "the beneficiary", "e": "A trust is a legal entity that designates a person (the trustee) to manage the trust's assets for the benefit of another person (the beneficiary)."}]}, {"id": 86, "name": "Series 65 Domain 3 (Quiz 2): Client Investment Recommendations and Strategies", "key": "DAADADADCCADABDCCDACDCDBC", "questions": [{"n": 1, "q": "One major difference between the customer identification program (CIP) and the new account opening rules of the regulatory bodies is that", "a": "the CIP requires a residence address for individuals while the regulatory bodies will accept a PO Box", "b": "the CIP only applies to individuals while the rules of the regulators apply to retail and institutional accounts", "c": "the CIP requires a statement of the customer’s goals while the regulators only require current financial information", "d": "the CIP requires date of birth while the regulators only require proof of legal age", "e": "The CIP requires the actual date of birth, not just proof of legal age. The CIP has no interest in the goals of the investor, just the identity."}, {"n": 2, "q": "One of the portions of the USA PATRIOT Act of 2001that affects the opening of an account for a new customer is", "a": "the customer identification program", "b": "the “know-your-customer rule", "c": "the Transportation Security Administration (TSA)", "d": "the requirement to obtain suitability information", "e": "The customer identification program (CIP) is mandated by the PATRIOT Act and requires that broker-dealers obtain certain specified information about new customers."}, {"n": 3, "q": "All the following information must be obtained from new individual customers EXCEPT", "a": "educational background", "b": "Social Security number", "c": "date of birth", "d": "physical address", "e": "A customer's educational background is not required to open a new account."}, {"n": 4, "q": "A woman wants to buy from an agent who is not registered in her state. She decides to use a friend's address in the state in which the agent is licensed. This action is", "a": "acceptable as long as she has her friend's permission to use the address", "b": "acceptable because the agent can do business only with those who have a residence address in those states in which he is registered", "c": "not acceptable because the other party does not know you are using the address", "d": "not acceptable because there are no circumstances under which you are permitted to use someone else's address as yours", "e": "Use of a fictitious home address is not only a red flag, it is illegal under the federal customer identification program (CIP)."}, {"n": 5, "q": "When does a customer have to receive the OCC Options Disclosure Document?", "a": "At or prior to the time the account is approved for options trading", "b": "With the confirmation of his first options transaction", "c": "Within 5 business days of the first options trade", "d": "Within 15 days of account approval", "e": "When opening an account to trade options, the owner must be told about the risks involved with trading options."}, {"n": 6, "q": "Which of the following is NOT a characteristic of a corporation?", "a": "It is considered an entity apart from its owners.", "b": "Ownership interests are evidenced by shares of stock.", "c": "Owners have no personal liability for corporate debts.", "d": "Existence terminates when an owner dies.", "e": "A corporation is an entity that has an existence separate from its owners. Therefore, the existence of a corporation does not terminate when an owner dies."}, {"n": 7, "q": "Two sisters might wish to open an account as tenants in common (TIC) rather than JTWROS in order to", "a": "ensure that their respective shares go to their heirs instead of the surviving sister.", "b": "limit the right of each party to withdraw assets from the account.", "c": "provide for an undivided interest in the assets of the account.", "d": "allow the spouse of each sister to have access to the account.", "e": "In a TIC account, when one of the cotenants dies, that individual's share of the account passes to her estate, not directly to the survivor."}, {"n": 8, "q": "If a new joint tenants with rights of survivorship account is opened by two related individuals, all of the following statements are true EXCEPT", "a": "orders may be given by either party", "b": "mail may be sent to either party (with the permission of each party)", "c": "in the event of death, the decedent's interest in the account goes to the other party", "d": "checks may be drawn in the name of either party", "e": "While either party may enter an order, any money or securities delivered out of the account must be in the names of both owners."}, {"n": 9, "q": "All of the following statements relating to an account registered as tenants in common are true EXCEPT", "a": "cotenants can own unequal percentages of the assets in the account", "b": "each cotenant has an undivided interest in the entire account", "c": "upon the death of one of the cotenants, that individual’s share of the account passes to the survivor(s)", "d": "this form of registration is less common for married couples than JTWROS", "e": "Unlike an account registered JTWROS, when a cotenant in a TIC account dies, that individual's share passes to the individual's estate, not the other cotenant(s)."}, {"n": 10, "q": "If a businessowner's goal is to establish an entity that features ease in raising capital, which of these entities is the most appropriate?", "a": "An S form of corporation", "b": "A general partnership", "c": "A limited liability company (LLC)", "d": "A sole proprietorship", "e": "If a businessowner's goal is ease in raising capital, the limited liability company (LLC) is preferable because it has no restrictions on the number or nationality of investors."}, {"n": 11, "q": "The customer identification program (CIP) requires that certain information relating to new customers be obtained. Included in that requirement for individual clients who are citizens of the United States are all of the following EXCEPT", "a": "current employment status", "b": "a physical address", "c": "Social Security number", "d": "date of birth", "e": "The 4 primary requirements of the CIP are the individual client's name, physical address, DOB, and SSN."}, {"n": 12, "q": "Which of the following documents would aid an investment adviser in its responsibility to fully understand the needs of a client when making investment recommendations?", "a": "A proxy voting policy.", "b": "A restricted list.", "c": "A communications agreement.", "d": "An investment policy statement.", "e": "The IPS is the key document that defines an investor's risk and return objectives and any constraints for their investment."}, {"n": 13, "q": "If an investment adviser's client wishes to save current income taxes by placing certain investments in a charitable trust, ethically, the investment adviser should", "a": "recommend the client consult with a qualified attorney", "b": "refuse to discuss the trust with the client because the adviser is not an attorney", "c": "help the client draft the appropriate documents following a discussion of the advantages of the arrangement", "d": "urge the client to consult with an attorney who pays a referral fee to the investment adviser", "e": "Presuming the adviser is not a licensed attorney, he should recommend the client see a qualified attorney."}, {"n": 14, "q": "With respect to taxation, an investment adviser representative should NOT", "a": "explain the taxable status of particular investments", "b": "draft tax and estate documents to ensure compliance with current law to provide substantial after-tax returns", "c": "discuss the tax implications of investments", "d": "consider tax implications as a way of improving a client's after-tax returns", "e": "An investment adviser representative must not draft legal documents; they should only be drafted by an attorney."}, {"n": 15, "q": "One of your clients dies. You could legally take instructions regarding the individual's estate from", "a": "a CPA who prepared the deceased’s tax return", "b": "the spouse of the deceased", "c": "a person with durable power of attorney", "d": "the administrator in intestacy", "e": "If an individual dies without a will (intestate), the state will appoint an administrator in intestacy who has control over the deceased's assets."}, {"n": 16, "q": "A professional tennis player comes to you seeking advice on setting up a trust. She is interested in giving to charity and also wants discretion as to when income is distributed to the beneficiaries, her parents. Which trust do you advise she use?", "a": "Charitable lead trust", "b": "Simple trust", "c": "Complex trust", "d": "Charitable remainder trust", "e": "Only a complex trust allows the two features that she requires. Simple trusts may not make charitable contributions."}, {"n": 17, "q": "An estate account is opened with Family Asset Protectors (FAP) a registered investment adviser. Management decisions regarding the account must be made at the direction of the", "a": "attorney with guardianship over the surviving children", "b": "investment adviser", "c": "estate’s executor or administrator", "d": "estate creditors", "e": "Only the estate executor (or administrator when the individual dies intestate) can make investment management and distribution decisions."}, {"n": 18, "q": "The distributable net income (DNI) of a simple trust would not include", "a": "dividends received.", "b": "interest received on municipal bonds.", "c": "interest received on corporate bonds.", "d": "realized capital gains.", "e": "It is capital gains that are reinvested in the corpus (body) of a simple trust which are not part of DNI."}, {"n": 19, "q": "If a customer who has granted a durable power of attorney to her son dies, which of the following statements regarding the power of attorney is TRUE?", "a": "It is canceled on the death of either principal.", "b": "It remains in effect until the son cancels it.", "c": "It remains in effect until the executor of the estate cancels it.", "d": "It remains in effect only if the son is the sole heir to the estate.", "e": "When the customer or her son dies, the power of attorney also expires. However, a durable power of attorney will survive a declaration of mental incompetence."}, {"n": 20, "q": "As a registered investment adviser, you have managed 10millionofacustomer′sfundsforseveralyears.Thecustomerasksyoutoprepareatrustforhischildren,totransfer3 million of his funds into the trust, and to trade the trust with the same objectives as the existing account. You should", "a": "prepare the trust, transfer funds, and begin investing", "b": "explain to the customer that trusts cannot be traded", "c": "refer the customer to an attorney that can set up the trust", "d": "tell the customer to contact a tax specialist", "e": "The best choice is to have the customer contact a qualified attorney to set up a trust."}, {"n": 21, "q": "Increasingly, many institutional investors, especially those in the philanthropic arena, are using ESG factors when considering where to invest their funds. Those factors are most accurately described as", "a": "exchange, sales, and general.", "b": "exchange, sensitivity, and growth.", "c": "earnings, systematic, and governmental.", "d": "environmental, social, and governance.", "e": "The ESG business factors that should be considered when analyzing a firm are a company's environmental, social, and governance risk exposures."}, {"n": 22, "q": "One of your longtime advisory clients has been critically injured in an automobile accident. The client is in the ICU at the local hospital, unable to communicate. You would be able to accept orders for the account", "a": "from the client’s lawyer", "b": "from the client by getting a squeeze of the hand for a “yes”", "c": "from a person who has a written durable power of attorney over the account", "d": "from the client’s spouse", "e": "When a client is incapacitated, agents may transact business in the account only when they receive instructions from someone with proper authorization."}, {"n": 23, "q": "If a client wishes the assets in her account to pass directly to specific beneficiaries after her death, her account should be titled", "a": "TIC", "b": "testamentary account", "c": "JTWROS", "d": "TOD", "e": "TOD (transfer on death) provides that, upon the death of the account holder, the assets pass to the named beneficiary without going through probate."}, {"n": 24, "q": "One of your customers has a substantial savings account at the local S&L. The customer has several grandchildren and wants the flexibility of being able to change the beneficiary allocations as their financial conditions change. You should recommend that the customer investigate the use of", "a": "a durable power of attorney (POA).", "b": "a Totten trust.", "c": "an irrevocable trust.", "d": "a Uniform Transfers to Minors Act (UTMA) account.", "e": "A Totten trust allows for the transfer of ownership of a bank account to a beneficiary after the owner's death."}, {"n": 25, "q": "One of your existing clients wishes to open a new account in the name of his spouse and enter orders on her behalf.", "a": "This action is prohibited unless the customer signs a trading authorization on behalf of his spouse.", "b": "This practice is ordinary and acceptable.", "c": "This action is prohibited unless the spouse signs a trading authorization.", "d": "The agent could be liable if the stock declines in value.", "e": "Effecting transactions without specific written authority from the beneficial owner of the account is prohibited."}]}, {"id": 87, "name": "Series 65 Domain 3 (Quiz 3): Client Investment Recommendations and Strategies", "key": "CDABDAADDBBDCBDBCCDBDCAAB", "questions": [{"n": 1, "q": "Which of the following actions should be taken by an agent when a client decides to open an options account?", "a": "Assure that an options agreement has been signed prior to the first trade taking place", "b": "Provide an options disclosure document no later than 15 days after the first trade", "c": "Review with the client the risks involved when trading options before the first options trade", "d": "Obtain approval from the designated options supervisor to open the account no later than 1 business day after the first options trade", "e": "It is imperative that suitability and risk be addressed with the client before allowing option trading to take place."}, {"n": 2, "q": "Under industry rules, customers who wish to trade options must receive a copy of the options disclosure document (ODD)", "a": "at or before the mailing of the confirmation representing the first options trade", "b": "at or before the mailing of the next monthly statement", "c": "within 15 days of account approval", "d": "at or before account approval", "e": "All prospective options customers must receive a copy of the ODD at or before the time the account is approved to trade options."}, {"n": 3, "q": "Small corporations that satisfy certain criteria can elect not to pay income tax at the corporate level but instead pass their earnings through to their shareholders. These corporations are known as", "a": "S corporations", "b": "Q corporations", "c": "R corporations", "d": "C corporations", "e": "The type of small corporation that can elect not to be taxed at the corporate level but to pass its earnings through to its shareholders is an S corporation."}, {"n": 4, "q": "Which of the following individuals may NOT open a joint account?", "a": "Business colleagues", "b": "Parent and a minor", "c": "Two spouses", "d": "Three sisters", "e": "Any 2 or more persons can have a joint account, but a minor is specifically excluded from the definition of a person."}, {"n": 5, "q": "The type of trust created by a will that becomes operative at death is", "a": "a Q-tip trust", "b": "a revocable trust", "c": "a living trust", "d": "a testamentary trust", "e": "As in last will and testament."}, {"n": 6, "q": "Mr. Hawkins sets up a revocable trust for the benefit of his adult daughter, Madeleine. His wife may draw from it only if she needs to. Income on the trust will be taxed to", "a": "Mr. Hawkins as the donor", "b": "the trust because it is a separate legal entity", "c": "Mrs. Hawkins as the contingent beneficiary", "d": "Madeleine as the primary beneficiary", "e": "Because Mrs. Hawkins has an economic interest, this is a grantor trust. Thus, all income will be taxed to the donor, Mr. Hawkins."}, {"n": 7, "q": "All of the following actions must be completed prior to customers entering their first option trade EXCEPT", "a": "receipt of a completed options agreement", "b": "delivery of the options disclosure document (ODD)", "c": "approval by a designated options supervisor", "d": "completion of the new account form", "e": "Customers do not have to complete (sign) the options agreement prior to entering an order; the agreement must be signed and returned within 15 days of account approval."}, {"n": 8, "q": "Which of the following would likely be stressed in a socially responsible fund?", "a": "Avoidance of foreign securities", "b": "Lower than average expenses", "c": "Higher-than-average returns", "d": "Ethical and moral investing", "e": "Socially responsible investing (SRI) is an impact investment strategy which seeks to consider both financial return and social good."}, {"n": 9, "q": "An advantage of structuring a business operation as an S corporation rather than a C corporation would be", "a": "the C corporation is limited to a maximum of 100 shareholders while no such limit exists for the S corporation", "b": "limited liability", "c": "simplicity when raising capital through a public offering", "d": "avoiding double taxation", "e": "Because an S corporation is taxed like a partnership, all earnings (or losses) flow directly through to the shareholders."}, {"n": 10, "q": "Obtaining all of the following complies with the regulations regarding customer identification programs (CIPs) EXCEPT", "a": "date of birth", "b": "a PO Box, instead of a physical address, if it is the primary mailing address", "c": "name", "d": "taxpayer identification number", "e": "A PO Box is never acceptable without a physical address."}, {"n": 11, "q": "A feature of which of the following business entities is limited liability for owners, as well as flow-through of income?", "a": "Sole proprietorship", "b": "Limited partnership", "c": "C corporation", "d": "General partnership", "e": "Limited partnership interests offer both flow-through of income (or loss) along with limited liability."}, {"n": 12, "q": "Although all new accounts must be approved by a designated supervisor before any trading activity may take place, there is one type of account that must be approved by a specially qualified supervisor. That would be", "a": "a discretionary account", "b": "an IRA", "c": "a margin account", "d": "an options account", "e": "Because trading options generally involves a higher degree of risk, a designated supervisory person with knowledge about options must approve the account opening."}, {"n": 13, "q": "One of the ways in which a simple trust differs from a complex trust is that simple trusts", "a": "may retain income.", "b": "may make distributions from the corpus of the trust.", "c": "must distribute their distributable net income each year.", "d": "are easier to prepare.", "e": "Unlike complex trusts, simple trusts must distribute their DNI on an annual basis."}, {"n": 14, "q": "One of your clients approaches you about setting up a trust. If your client assumes the role of grantor, what additional roles may be taken?", "a": "Beneficiary", "b": "Trustee and beneficiary", "c": "As the grantor, no other roles may be taken", "d": "Trustee", "e": "Under trust law, the grantor of a trust, sometimes referred to as the settlor, may also be the beneficiary and the trustee."}, {"n": 15, "q": "As with all investors, it is important that trusts have an investment policy statement (IPS). If the beneficiary of a trust requests that the trustee use trust assets to enter an order that is considered a prohibited transaction under the IPS, the trustee should", "a": "contact the grantor of the trust.", "b": "amend the IPS and process the order.", "c": "follow the beneficiary’s instructions.", "d": "follow the trust’s IPS and refuse the order.", "e": "A trustee is the classic example of a fiduciary - one responsible for handling the assets of another person."}, {"n": 16, "q": "Which of the following is most commonly used when the author wants to express end of life wishes?", "a": "A testamentary trust", "b": "A living will", "c": "A living trust", "d": "A revocable trust", "e": "Sometimes referred to as a medical directive or advanced care directive, a living will is used to express the author's end-of-life wishes."}, {"n": 17, "q": "A customer has just died. If his wife asks you what amount of federal estate tax will be imposed on the transfer of their personal property to her name, which of the following responses would be best?", "a": "The amount of tax will depend on your late husband's tax bracket.", "b": "The amount of tax will depend on the size of the estate to be transferred.", "c": "Consult a qualified tax specialist.", "d": "The amount may be prorated over the next 4 years.", "e": "Specific tax advice should be referred to a qualified tax adviser such as an accountant or tax attorney."}, {"n": 18, "q": "A living will is used to", "a": "eliminate, or at least reduce, estate taxes.", "b": "ensure that the author’s assets are properly distributed after death.", "c": "express the author’s end-of-life wishes.", "d": "avoid the cost and time of probate.", "e": "Sometimes referred to as a medical directive or advanced care directive, a living will has nothing to do with a last will and testament."}, {"n": 19, "q": "When advisory clients wish to structure their portfolios to support companies that engage in social or environmental policies that they agree with, it is known as", "a": "asset allocation", "b": "program-related investing", "c": "engineered investing", "d": "impact investing", "e": "Impact investing can be defined as the intentional allocation of capital to generate a positive social or environmental impact."}, {"n": 20, "q": "In the banking industry, the term POD refers to an account similar to the TOD designation used by broker-dealers. An old, but sometimes still used term to describe this kind of account, is", "a": "demand deposit account (DDA)", "b": "Totten trust", "c": "revocable trust", "d": "passbook savings account", "e": "The name comes from a 1904 decision in a New York case called In re Totten."}, {"n": 21, "q": "Which of the following documents would aid an investment adviser in its responsibility to fully understand the needs of a client when making investment recommendations?", "a": "A proxy voting policy.", "b": "A restricted list.", "c": "A communications agreement.", "d": "An investment policy statement.", "e": "The IPS is the key document that defines an investor's risk and return objectives and any constraints for their investment."}, {"n": 22, "q": "A wealthy individual has set up a GRAT. Should she die during the time the trust is active, how are the remaining assets in the trust taxed?", "a": "No tax is due if the grantor should die during the term of the trust.", "b": "The original value plus any appreciation passes to the beneficiaries but is subject to gift tax.", "c": "The original value plus any appreciation is taxed as part of the grantor’s estate.", "d": "The original value plus any appreciation passes to the beneficiaries and is taxed as ordinary income.", "e": "One of the risks in setting up a GRAT is that if the grantor dies during the term of the trust, the assets are included in her estate."}, {"n": 23, "q": "One of the situations that investment adviser representatives may encounter is the death of a client. When that happens, orders may be accepted from", "a": "the trustee in intestacy.", "b": "an individual with a durable power of attorney.", "c": "the deceased client’s spouse.", "d": "the deceased client’s children.", "e": "In most cases, your clients will have a will. When the deceased has not written a will, he is considered to have died intestate."}, {"n": 24, "q": "When a will calls for property to be distributed per stirpes, it means that", "a": "the property is divided into as many equal shares as there are surviving children of the designated ancestor and deceased children who left surviving descendants", "b": "the property is divided into as many equal shares as there are surviving children and grandchildren of the designated ancestor", "c": "all living descendants of the ancestor receive equal shares in the property remaining after all estate expenses are paid", "d": "the property is divided into as many equal shares as there are surviving children of the designated ancestor, with nothing going to surviving descendants of deceased children", "e": "When a will calls for a per stirpes distribution of assets, surviving children of a predeceased beneficiary share in the share that individual would have received."}, {"n": 25, "q": "A major benefit of a revocable trust is that", "a": "the settlor cannot also be the beneficiary.", "b": "the grantor retains control of the assets.", "c": "the grantor saves on income taxes.", "d": "the assets are not included in the grantor’s estate.", "e": "Among the benefits of a revocable trust is that the grantor (settlor) retains all control over the assets. There are no tax benefits."}]}, {"id": 88, "name": "Series 65 Domain 3 (Quiz 4): Client Investment Recommendations and Strategies", "key": "DACCADAADBCBBCBCCCACADAAD", "questions": [{"n": 1, "q": "An investment adviser using an insurance approach to capital needs analysis would", "a": "only invest in securities guaranteed by the FDIC", "b": "select securities based upon the customer's investment experience", "c": "invest exclusively in insured securities such as insured municipal bonds or Ginnie Maes", "d": "determine the insurance coverage needed to complete the customer's financial objective should the customer die before the objective is met", "e": "An insurance approach to a customer's capital needs analysis involves purchasing life insurance sufficient to complete the customer's financial objective should he die before it is met."}, {"n": 2, "q": "If a customer's chief concern is to shelter as much of his portfolio earnings from tax as possible, which of the following securities would be most suitable?", "a": "Municipal GOs", "b": "Treasury receipts", "c": "Money market instruments", "d": "High-yield bonds", "e": "The interest on municipal GOs is exempt from federal income tax and perhaps state income tax, depending on the investor's residency."}, {"n": 3, "q": "Many investment advisers prepare an investment policy statement (IPS) when counseling their clients. Which of the following should least likely be included as a constraint in an investment policy statement?", "a": "Asset classes the client specifically forbids or limits based on past experience", "b": "Constraints put on investment activities by regulatory agencies", "c": "How the funds are spent after being withdrawn from the portfolio", "d": "Any unique needs or preferences an investor may have", "e": "How funds are spent after withdrawal would not be a constraint of an IPS."}, {"n": 4, "q": "Parker and Mary have recently divorced. For Mary to receive Social Security benefits based on Parker's earnings, which of the following conditions must exist?", "a": "Parker must already be at full retirement age.", "b": "Mary must have worked at least 40 quarters to be eligible for benefits.", "c": "The marriage must have lasted at least 10 years.", "d": "Parker must not be remarried.", "e": "The marriage of these two must have lasted at least 10 years. In addition, Mary cannot be remarried."}, {"n": 5, "q": "Liquidity risk is the risk that when an investor wishes to dispose of an investment, no one will be willing to buy it, or that a very large purchase or sale would not be possible at the current price. With that in mind, which of the following would likely have the lowest degree of exposure to liquidity risk?", "a": "Money market mutual funds", "b": "Investment-grade municipal bonds​", "c": "REITs", "d": "RELPs", "e": "RELPs (real estate limited partnerships) would have high liquidity risk because there is generally no secondary market for them. Money market funds are about as liquid as you can get."}, {"n": 6, "q": "A client with 25 years until retirement should invest primarily in", "a": "private placements", "b": "preferred stocks", "c": "bonds", "d": "common stocks", "e": "This client's time horizon is quite long. With 25 years until retirement, the customer should invest primarily in stocks."}, {"n": 7, "q": "A married couple in their early 50s saving for retirement would most likely have which of the following objectives?", "a": "Moderate risk, moderate safety, low liquidity", "b": "High risk, moderate safety, low liquidity", "c": "Low risk, high safety, high liquidity", "d": "Moderate risk, low safety, high liquidity", "e": "A middle-aged couple planning for their retirement is most likely interested in moderate risk, moderate safety, and low liquidity."}, {"n": 8, "q": "An investor has just received an inheritance of $100,000 and has decided to use the money to buy a new home. Because it will take time to decide where to buy, it is expected that the purchase will not be made for another 6–9 months. If this investor placed the money into a broad market index ETF, the primary risk taken would be", "a": "market risk", "b": "unsystematic risk", "c": "business risk", "d": "interest rate risk", "e": "A major risk involved with investing in equities is the systematic risk known as market risk. The shorter the time horizon, the greater the market risk."}, {"n": 9, "q": "An elderly widow with no independent income wishes to invest the proceeds from her recently deceased husband's life insurance. Which of the following would be the most suitable recommendation?", "a": "Municipal bonds", "b": "Call options", "c": "Oil and gas exploration program that you know is going to strike", "d": "High-grade corporate bond mutual fund", "e": "This customer needs income. The bond fund would be the most suitable because it would provide income while maintaining relative safety."}, {"n": 10, "q": "Which of the following situations would most likely cause an individual's application for a disability income insurance policy to be denied?", "a": "Being over 50 years of age", "b": "Working in a hazardous occupation", "c": "BMI over 26", "d": "Type 2 diabetes", "e": "In most cases, those who work in hazardous occupations will be denied disability income coverage."}, {"n": 11, "q": "Tamika is an investment adviser representative with Financial Engineers, LLC, a covered investment adviser. The firm uses an investment policy statement to help design financial plans for their clients. One of Tamika's current clients plans to purchase a new boat 7 months from now. When using the IPS, this would be considered", "a": "a capital need", "b": "an investment goal", "c": "an investment constraint", "d": "a financial objective", "e": "Investment constraints are obstacles or restrictions that must be met in order to meet objectives. In this case, we are dealing with a liquidity constraint."}, {"n": 12, "q": "An investor who purchases stock in two technology companies with high projected earnings and growth potential but little performance history is considered", "a": "a conservative investor", "b": "an aggressive investor", "c": "a defensive investor", "d": "a passive investor", "e": "An investor is taking an aggressive investment posture in investing in a growth company with little history."}, {"n": 13, "q": "A benefit of waiting until the age of 70 to claim Social Security benefits is that", "a": "the income tax rate is reduced once the claimant reaches 70.", "b": "benefits are increased by 8% for each year from the full retirement age.", "c": "a higher percentage of the monthly benefit is exempt from income taxes.", "d": "Medicare benefits are increased.", "e": "If an individual delays taking Social Security until age 70, the benefit is increased by 8% for each year from the full retirement age."}, {"n": 14, "q": "Which of the following is least likely to be considered an investment constraint when preparing an investment policy statement?", "a": "Tax concerns", "b": "Legal and regulatory factors", "c": "Risk tolerance", "d": "Liquidity needs", "e": "The commonly tested investment constraints are: liquidity needs, time horizon, taxes, legal and regulatory factors, and unique needs and preferences."}, {"n": 15, "q": "In projecting future cash requirements, one of the tools is a capital needs analysis. When doing one, all of the following would be considered capital needs EXCEPT", "a": "a $100,000 loan for law school with a due date in 10 years", "b": "rolling over a 401(k) into an IRA", "c": "a home equity loan with a $15,000 balance", "d": "a $20,000 loan for undergraduate school with a due date in 6 years", "e": "A capital needs analysis attempts to determine money that would be needed in the event of an individual's sudden passing."}, {"n": 16, "q": "Years ago, following your advice, a client opened a 529 Plan to save for their son's college education. The child is now about 3 years from beginning his freshman year. The client, believing that the stock market is currently undervalued, wishes to reallocate the plan assets so that most of the funds are in a broad stock market index portfolio. At this time, your advice would probably be against this allocation because of", "a": "interest rate risk", "b": "liquidity risk", "c": "market risk", "d": "business risk", "e": "This short time horizon is a serious constraint and a portfolio that is largely equities subjects the account to too much market risk."}, {"n": 17, "q": "For a trust account not seeking appreciation, which of the following would be recommended?", "a": "Large-cap common and preferred stocks", "b": "Common stock, preferred stock, and debentures", "c": "Highly rated, fixed-income securities", "d": "Common stock in small, highly profitable companies", "e": "The only choice that is prudent and does not have a goal of appreciation is the purchase of highly rated, fixed-income securities."}, {"n": 18, "q": "Your married customers are both 42 years old, have 2 children ages 14 and 12, and have spent the past 10 years accumulating money to provide for their children's education. Their oldest child will enter college in 4 years, and the customers are very cautious investors. If they need a safe investment that provides regular income to help them meet tuition payments, which of the following mutual funds is the most suitable for these customers?", "a": "ATF Overseas Opportunities Fund", "b": "RST Balanced Fund", "c": "LMN Investment-Grade Bond Fund", "d": "ABC Stock Index Fund", "e": "These clients cannot afford a downturn in the stock market. An investment-grade bond fund will provide the income and safety required."}, {"n": 19, "q": "If your clients, spouses both age 50, are interested in long-term growth and are willing to accept a moderate amount of risk, you should recommend", "a": "a large-cap stock fund", "b": "a municipal bond fund", "c": "an equity/income fund", "d": "a money market fund", "e": "A mutual fund investing in large-cap stocks has relatively moderate risk with likely growth potential."}, {"n": 20, "q": "Your elderly client has $10,000 to invest and seeks preservation of capital and a moderate income stream. If she has never invested in mutual funds before and all of her savings are in bank CDs and saving accounts, you should recommend", "a": "a government bond fund", "b": "a T-bill", "c": "a money market fund", "d": "a tax-exempt bond fund", "e": "A money market fund is the most appropriate for an elderly person seeking preservation of capital and some income on a regular basis."}, {"n": 21, "q": "You are doing an investment plan for a new client, age 55, who plans to retire at age 70. The client is somewhat risk averse and wants to preserve capital while at the same time not falling prey to possible inflation. Which of the following portfolios would probably be most suitable?", "a": "60% high-quality bonds; 30% large-cap stocks; 10% cash equivalents", "b": "90% large-cap stocks; 10% high-quality bonds", "c": "90% high-quality bonds; 10% large-cap stocks", "d": "40% high-yield bonds; 60% large-cap stocks", "e": "Although it is possible to debate this choice, NASAA would suggest that the bonds and cash offer sufficient capital preservation while this proportion of equities will combat the risk of inflation."}, {"n": 22, "q": "An investment adviser representative has a 78-year-old prospect living on 26,400peryearfromSocialSecurityplusinvestmentincome.Theindividual′snetworthis141, 000 including the equity in her primary residence. Her net worth was higher until recently, but the aggressive fund she owns in the KAPCO family of funds is down over $20,000 in value. Which of the following would you recommend to her?", "a": "Sell her fund shares and reinvest in a vehicle offering her deferred accumulation", "b": "Liquidate the fund shares and put the proceeds in a bank CD", "c": "Invest in a municipal bond fund", "d": "Switch to a more conservative fund in the same family of funds", "e": "Clearly the municipal bond fund is inappropriate because this client's income does not put her into one of the higher tax brackets. The exchange privilege allows moving to a more conservative fund without paying a sales charge."}, {"n": 23, "q": "An investor concerned about preservation of capital would be most apt to purchase", "a": "investment-grade corporate bonds", "b": "common stock", "c": "warrants", "d": "call options", "e": "Capital risk is the danger of losing principal. Corporate bonds have the least capital risk because of the issuer's legal obligation to pay principal."}, {"n": 24, "q": "Your customer, age 60, is retired and living at home with a fully paid-off mortgage. Her portfolio contains growth stocks and high-quality bonds, and she is a longtime investor and comfortable with moderate risk. Her objective is a moderate level of current income to supplement her corporate pension plan distributions and the earnings from her IRA. Which of the following mutual funds is the most suitable for this customer?", "a": "ABC Equity Income Fund", "b": "QRS Capital Appreciation Fund", "c": "XYZ Biotechnology Fund", "d": "LMN Stock Index Fund", "e": "An equity fund that aims to achieve both current income and growth of income best suits the objectives."}, {"n": 25, "q": "If a customer is in the 15% federal income tax bracket and his main investment objective is current income, which of the following securities should the agent recommend?", "a": "Zero-coupon bond.", "b": "City of Milwaukee GO bond.", "c": "U.S. government bond.", "d": "Investment-grade corporate bond.", "e": "The investor is in a low tax bracket, so the tax-exempt municipal bond is not a suitable investment. To maximize income, the best recommendation is the corporate bond."}]}, {"id": 89, "name": "Series 65 Domain 4 (Quiz 1): Laws, Regulations, and Guidelines, including Prohibition on Unethical Business Practices", "key": "BDDCDCDDCAAACBDCDCDDCCBDB", "questions": [{"n": 1, "q": "Under the Uniform Securities Act, a person whose business model is selling reports on a subscription basis concerning specific securities to investors based on their individual objectives will be defined as", "a": "a broker-dealer", "b": "an investment adviser", "c": "a journalist", "d": "an agent", "e": "The definition of investment adviser includes any person who for compensation engages in the business of advising others as to the value of securities."}, {"n": 2, "q": "There are waivers from the Series 65 exam requirement for certain professional designations. Among those qualifying for the waiver are individuals who are", "a": "MBAs.", "b": "CLUs.", "c": "CPAs.", "d": "CFP®s.", "e": "This is tricky. CFPs do qualify for the waiver. ChFCs also qualify and those with the PFS, but not solely a CPA. MBA is not a professional designation."}, {"n": 3, "q": "The responsibility for administering the Investment Advisers Act of 1940 lies with", "a": "FINRA", "b": "the Administrator", "c": "the Investment Advisers Association (IAA)", "d": "the SEC", "e": "The Investment Advisers Act of 1940 is federal law, and that comes under the jurisdiction of the SEC."}, {"n": 4, "q": "Under the Investment Advisers Act of 1940, which of the following is TRUE about the use of the term \"investment counsel\" by investment advisers?", "a": "Advisers may use the term without restriction as long as they are registered.", "b": "The use of the term is prohibited under any circumstances.", "c": "Advisers may use the term only if their principal business is acting as an investment adviser and a substantial part of their business consists of providing continuous advice based on a client's individual needs.", "d": "Advisers may use the term only if they are attorneys.", "e": "Advisers may use the term investment counsel only if two conditions are met: rendering investment advice must be their principal business and a substantial part must be providing investment supervisory services."}, {"n": 5, "q": "Which of the following investment advisers would be permitted to use the term \"investment counsel\"?", "a": "A professional providing a market timing service with an annual subscription fee of $995, with this service attempting to maximize profits by suggesting entry and exit points for over 100 listed stocks", "b":

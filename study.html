 the care, skill, prudence, and diligence that a prudent person acting in a like capacity would use. It does not mandate specific investment types or allocation percentages, but rather a standard of care."}, {"n": 45, "q": "Which of the following individuals would be considered a fiduciary under ERISA?", "a": "An employee who participates in the plan but has no management role", "b": "A person who exercises discretionary control over plan management or assets", "c": "A custodian who merely holds plan assets", "d": "A broker who executes trades directed by the plan administrator", "e": "Under ERISA, a fiduciary is any person who exercises discretionary authority or control over plan management or its assets, provides investment advice for a fee, or has discretionary responsibility for plan administration. Simply participating in or holding plan assets does not make someone a fiduciary."}, {"n": 46, "q": "A Keogh plan (HR-10 plan) is designed for", "a": "employees of large corporations.", "b": "government employees.", "c": "self-employed individuals and their employees.", "d": "nonprofit organizations.", "e": "A Keogh plan (also called an HR-10 plan) is a tax-deferred retirement plan designed for self-employed individuals and unincorporated businesses. It can be structured as either a defined benefit or defined contribution plan and allows for higher contribution limits than an IRA."}, {"n": 47, "q": "An individual 401(k), also known as a Solo 401(k), is designed for", "a": "large corporations with over 1,000 employees.", "b": "self-employed individuals with no employees other than a spouse.", "c": "government workers.", "d": "nonprofit organizations.", "e": "An individual 401(k), or Solo 401(k), is designed for self-employed individuals with no employees other than a spouse. It combines the features of a traditional 401(k) with a profit-sharing plan, allowing both employee elective deferrals and employer profit-sharing contributions."}, {"n": 48, "q": "The penalty for failing to take a required minimum distribution from a traditional IRA is an excise tax of", "a": "10% of the amount not distributed.", "b": "25% of the amount not distributed.", "c": "50% of the amount not distributed.", "d": "100% of the amount not distributed.", "e": "The penalty for failing to take a required minimum distribution is an excise tax of 25% of the amount that should have been distributed but was not (reduced from 50% by the SECURE 2.0 Act). This can be further reduced to 10% if corrected within a specified time period."}, {"n": 49, "q": "Which of the following statements about rollovers between retirement plans is CORRECT?", "a": "Funds can only be rolled from an IRA to another IRA.", "b": "A direct rollover from a 401(k) to an IRA avoids mandatory withholding.", "c": "Rollovers are limited to once per calendar year with no exceptions.", "d": "Funds rolled from a Roth IRA to a traditional IRA are tax free.", "e": "A direct rollover (trustee-to-trustee transfer) from a 401(k) to an IRA avoids the mandatory 20% federal income tax withholding that applies to indirect rollovers. Funds can be rolled between various types of retirement plans, and the once-per-year rule applies specifically to IRA-to-IRA rollovers."}, {"n": 50, "q": "Under the SECURE 2.0 Act, the age at which required minimum distributions must begin for individuals reaching that age after December 31, 2032, is", "a": "72.", "b": "73.", "c": "75.", "d": "There is no RMD requirement.", "e": "Under the SECURE 2.0 Act, the RMD age increases to 75 for individuals who reach that age after December 31, 2032. Prior to that, the age is 73 for those reaching 73 between 2023 and 2032. This provides additional years for tax-deferred growth."}]}, {"id": 19, "name": "Unit 19: Types of Investment Vehicles", "key": "BCACBCBBBABBDBBBBBCBCCBCCCBABBBACBBBBBBBBBBBABBBBB", "questions": [{"n": 1, "q": "An open-end investment company is commonly known as a", "a": "closed-end fund.", "b": "mutual fund.", "c": "unit investment trust.", "d": "hedge fund.", "e": "An open-end investment company is commonly known as a mutual fund. It continuously issues new shares to investors and redeems (buys back) shares from investors who wish to sell, all at the fund's current net asset value (plus any applicable sales charge)."}, {"n": 2, "q": "Shares of an open-end investment company are purchased and redeemed at the fund's", "a": "market price determined by supply and demand.", "b": "par value.", "c": "net asset value (NAV), plus any applicable sales charge.", "d": "book value.", "e": "Shares of an open-end investment company (mutual fund) are purchased at the fund's NAV plus any applicable sales charge (the public offering price) and redeemed at NAV. Unlike closed-end funds, mutual fund shares do not trade on an exchange at market prices determined by supply and demand."}, {"n": 3, "q": "Net asset value (NAV) of a mutual fund is calculated by", "a": "dividing total assets minus total liabilities by the number of shares outstanding.", "b": "multiplying the share price by the number of shares outstanding.", "c": "dividing total revenue by total expenses.", "d": "subtracting the sales charge from the offering price.", "e": "NAV is calculated by taking the total market value of the fund's assets, subtracting total liabilities, and dividing by the number of shares outstanding. The formula is: NAV = (Total Assets - Total Liabilities) / Shares Outstanding."}, {"n": 4, "q": "NAV of an open-end fund is computed", "a": "continuously throughout the trading day.", "b": "once per week.", "c": "at the close of each business day.", "d": "at the beginning of each business day.", "e": "The NAV of an open-end fund is computed once per day at the close of each business day (typically 4:00 PM Eastern Time). This is known as forward pricing—all orders received before the close are executed at that day's NAV."}, {"n": 5, "q": "A closed-end investment company differs from an open-end investment company in that the closed-end fund", "a": "continuously issues and redeems shares.", "b": "has a fixed number of shares that trade on an exchange.", "c": "always trades at NAV.", "d": "cannot use leverage.", "e": "A closed-end fund issues a fixed number of shares through an IPO and those shares then trade on an exchange, like stocks. Unlike open-end funds, closed-end funds do not continuously issue or redeem shares. Their market price is determined by supply and demand and may differ from NAV."}, {"n": 6, "q": "Shares of a closed-end fund trading at a price below their NAV are said to be trading at a", "a": "premium.", "b": "markup.", "c": "discount.", "d": "par.", "e": "When a closed-end fund's market price is below its NAV, it is trading at a discount. When the market price is above NAV, it is trading at a premium. This premium/discount dynamic is unique to closed-end funds."}, {"n": 7, "q": "An exchange-traded fund (ETF) is similar to a mutual fund in that both", "a": "trade continuously throughout the day on an exchange.", "b": "hold a portfolio of securities.", "c": "are priced only at the end of the trading day.", "d": "must be purchased directly from the fund company.", "e": "Both ETFs and mutual funds hold diversified portfolios of securities. However, ETFs trade on exchanges throughout the day at market prices, while mutual funds are priced only at the end of the day. Both are registered investment companies subject to SEC regulation."}, {"n": 8, "q": "A key advantage of an ETF over a traditional mutual fund is that an ETF", "a": "guarantees a minimum return.", "b": "can be bought and sold throughout the trading day at market prices.", "c": "is not subject to SEC regulation.", "d": "always outperforms the underlying index.", "e": "A key advantage of ETFs is intraday tradability—they can be bought and sold throughout the trading day at current market prices. Additionally, ETFs generally have lower expense ratios and are more tax efficient than traditional mutual funds."}, {"n": 9, "q": "A unit investment trust (UIT) is characterized by", "a": "active management of the portfolio.", "b": "a fixed portfolio of securities that is not actively managed.", "c": "the ability to issue new shares at any time.", "d": "unlimited duration.", "e": "A unit investment trust (UIT) holds a fixed portfolio of securities that is not actively managed. The portfolio is assembled at creation and generally held until the trust's termination date. UITs do not have a board of directors or investment adviser making ongoing portfolio changes."}, {"n": 10, "q": "Which of the following mutual fund share classes typically has a front-end sales charge?", "a": "Class A shares", "b": "Class B shares", "c": "Class C shares", "d": "No-load shares", "e": "Class A shares typically charge a front-end sales charge (load) that is deducted from the initial investment. In exchange, they usually have lower ongoing annual expenses (12b-1 fees) compared to Class B and Class C shares."}, {"n": 11, "q": "Class B mutual fund shares typically feature", "a": "a front-end sales charge.", "b": "a contingent deferred sales charge (CDSC) that declines over time.", "c": "no sales charges of any kind.", "d": "the lowest annual expense ratio.", "e": "Class B shares typically have no front-end sales charge but impose a contingent deferred sales charge (CDSC) if shares are redeemed within a specified period. The CDSC usually declines over time (e.g., 5% in year 1, 4% in year 2, etc.) and eventually reaches zero."}, {"n": 12, "q": "A no-load mutual fund is one that", "a": "has no management fees.", "b": "does not charge a front-end or back-end sales charge.", "c": "has no operating expenses.", "d": "is not registered with the SEC.", "e": "A no-load fund does not charge a front-end or back-end sales charge. However, no-load funds still have management fees and operating expenses. The term \"no-load\" refers specifically to the absence of sales charges, not the absence of all fees."}, {"n": 13, "q": "The expense ratio of a mutual fund includes all of the following EXCEPT", "a": "management fees.", "b": "12b-1 fees.", "c": "administrative costs.", "d": "sales loads.", "e": "The expense ratio includes management fees, 12b-1 fees, administrative costs, and other operating expenses. Sales loads (front-end and back-end charges) are not included in the expense ratio. They are separate charges paid at the time of purchase or redemption."}, {"n": 14, "q": "12b-1 fees are charges assessed by a mutual fund to cover", "a": "management and advisory costs.", "b": "distribution and marketing expenses.", "c": "custodial fees.", "d": "legal and audit expenses.", "e": "12b-1 fees (named after the SEC rule that permits them) are annual charges deducted from fund assets to cover distribution and marketing expenses, including compensation to brokers and financial advisers for selling the fund."}, {"n": 15, "q": "Breakpoints in mutual fund sales charges", "a": "increase the sales charge for larger purchases.", "b": "provide reduced sales charges for larger investments.", "c": "apply only to Class B shares.", "d": "are available only to institutional investors.", "e": "Breakpoints provide reduced sales charges for larger investments in a mutual fund. As the size of the investment increases and crosses certain dollar thresholds, the sales charge percentage decreases, rewarding larger investors with lower costs."}, {"n": 16, "q": "A letter of intent (LOI) in mutual fund investing allows an investor to", "a": "lock in the current NAV for future purchases.", "b": "receive a reduced sales charge by committing to invest a specified amount over a period, typically 13 months.", "c": "guarantee a minimum rate of return.", "d": "convert shares from one fund family to another without charge.", "e": "A letter of intent (LOI) allows an investor to receive a reduced sales charge (breakpoint discount) by committing to invest a specified total amount in the fund family over a period, typically 13 months. The investor does not need to invest the full amount upfront."}, {"n": 17, "q": "Rights of accumulation in mutual fund investing allow an investor to", "a": "accumulate shares without paying any fees.", "b": "qualify for breakpoint discounts based on the current total value of holdings in the fund family.", "c": "defer taxes on mutual fund distributions.", "d": "exchange shares between different fund families.", "e": "Rights of accumulation allow an investor to qualify for breakpoint discounts based on the total current value of their holdings in the fund family, not just the amount of a single new purchase. As the account value grows, the investor may qualify for lower sales charges on subsequent purchases."}, {"n": 18, "q": "An index fund is designed to", "a": "actively select stocks expected to outperform the market.", "b": "replicate the performance of a specific market index.", "c": "invest only in government securities.", "d": "guarantee returns equal to the index.", "e": "An index fund is designed to replicate the performance of a specific market index (such as the S&P 500) by holding the same securities in the same proportions as the index. Index funds are passively managed and typically have lower expense ratios than actively managed funds."}, {"n": 19, "q": "A money market mutual fund typically invests in", "a": "long-term corporate bonds.", "b": "common stocks of large companies.", "c": "short-term, high-quality debt instruments.", "d": "real estate properties.", "e": "Money market mutual funds invest in short-term, high-quality debt instruments such as Treasury bills, commercial paper, certificates of deposit, and repurchase agreements. They aim to maintain a stable NAV of $1.00 per share and provide high liquidity."}, {"n": 20, "q": "A sector fund concentrates its investments in", "a": "a broad mix of all market sectors.", "b": "a single industry or sector of the economy.", "c": "only government securities.", "d": "international markets only.", "e": "A sector fund concentrates its investments in a single industry or sector of the economy, such as technology, healthcare, or energy. While this focus can provide higher returns when the sector performs well, it also increases risk due to lack of diversification."}, {"n": 21, "q": "A balanced fund typically holds", "a": "only equity securities.", "b": "only fixed-income securities.", "c": "a combination of stocks, bonds, and sometimes money market instruments.", "d": "only alternative investments.", "e": "A balanced fund holds a combination of stocks, bonds, and sometimes money market instruments. The typical allocation might be approximately 60% stocks and 40% bonds, providing both growth potential and income while moderating risk through diversification across asset classes."}, {"n": 22, "q": "A target-date fund automatically adjusts its asset allocation based on", "a": "current market conditions.", "b": "the fund manager's personal preferences.", "c": "the investor's target retirement date, becoming more conservative over time.", "d": "the Federal Reserve's interest rate policy.", "e": "A target-date fund (also called a lifecycle fund) automatically adjusts its asset allocation based on the investor's target retirement date. The fund starts with a more aggressive allocation (higher equity percentage) and gradually shifts to more conservative investments as the target date approaches. This shift is called the glide path."}, {"n": 23, "q": "A real estate investment trust (REIT) allows investors to", "a": "directly own real property.", "b": "invest in a portfolio of real estate assets or mortgages through a publicly traded entity.", "c": "avoid all taxes on real estate income.", "d": "make leveraged bets on real estate futures.", "e": "A REIT allows investors to invest in a professionally managed portfolio of real estate assets or mortgages through a publicly traded entity. Investors do not directly own real property but instead own shares in the REIT, which provides diversification, liquidity, and income."}, {"n": 24, "q": "To qualify as a REIT, the entity must distribute at least what percentage of its taxable income to shareholders?", "a": "50%.", "b": "75%.", "c": "90%.", "d": "100%.", "e": "To qualify as a REIT under IRS rules, the entity must distribute at least 90% of its taxable income to shareholders as dividends. This distribution requirement is what allows REITs to avoid paying corporate income tax on the distributed earnings."}, {"n": 25, "q": "Dividends received from a REIT are generally taxed as", "a": "qualified dividends at preferential rates.", "b": "long-term capital gains.", "c": "ordinary income.", "d": "tax-exempt income.", "e": "Most REIT dividends are taxed as ordinary income because they do not qualify for the preferential qualified dividend tax rate. However, under current tax law, investors may be able to deduct up to 20% of REIT dividends through the qualified business income (QBI) deduction."}, {"n": 26, "q": "A variable annuity's separate account is most similar to", "a": "a savings account.", "b": "a certificate of deposit.", "c": "a mutual fund.", "d": "a Treasury bond.", "e": "A variable annuity's separate account functions similarly to a mutual fund. The investor's money is invested in subaccounts that resemble mutual funds, and the value fluctuates based on the performance of the underlying investments."}, {"n": 27, "q": "During the accumulation phase of a variable annuity, earnings grow on a", "a": "tax-free basis.", "b": "tax-deferred basis.", "c": "fully taxable basis.", "d": "tax-exempt basis.", "e": "During the accumulation phase of a variable annuity, earnings grow on a tax-deferred basis. No taxes are paid on investment gains until withdrawals are made. At that point, the earnings portion of withdrawals is taxed as ordinary income."}, {"n": 28, "q": "A fixed annuity provides", "a": "a guaranteed minimum rate of return during the accumulation phase.", "b": "returns that vary based on the performance of the separate account.", "c": "no guaranteed payments.", "d": "returns tied to a stock market index.", "e": "A fixed annuity provides a guaranteed minimum rate of return during the accumulation phase. The insurance company bears the investment risk and guarantees both the rate of return and the principal. This makes it more conservative than a variable annuity."}, {"n": 29, "q": "An equity-indexed annuity provides returns linked to", "a": "the performance of a bond index.", "b": "a stock market index, with a guaranteed minimum return.", "c": "the federal funds rate.", "d": "the performance of a specific mutual fund.", "e": "An equity-indexed annuity (also called a fixed-indexed annuity) provides returns linked to the performance of a stock market index, such as the S&P 500, while also providing a guaranteed minimum return. The upside is typically capped through participation rates or caps."}, {"n": 30, "q": "The death benefit of a variable annuity guarantees that the beneficiary will receive at least", "a": "the current account value.", "b": "the total amount invested minus withdrawals, or the current account value, whichever is greater.", "c": "twice the original investment.", "d": "the original investment plus 10% interest.", "e": "The standard death benefit of a variable annuity guarantees that the beneficiary will receive the greater of the total amount invested (minus any withdrawals) or the current account value at the time of the annuitant's death. Some contracts offer enhanced death benefits for an additional cost."}, {"n": 31, "q": "Surrender charges on an annuity", "a": "apply when an annuitant begins receiving income payments.", "b": "are fees charged for early withdrawal, typically declining over a period of years.", "c": "increase over the life of the contract.", "d": "never apply to variable annuities.", "e": "Surrender charges are fees imposed by the insurance company for early withdrawal from an annuity, typically during the first 5 to 10 years of the contract. The charges usually start high and decline each year until they reach zero at the end of the surrender period."}, {"n": 32, "q": "A direct participation program (DPP) allows investors to", "a": "participate directly in the cash flow and tax benefits of the underlying business.", "b": "trade shares on a public exchange.", "c": "avoid all investment risk.", "d": "guarantee a fixed rate of return.", "e": "A direct participation program (DPP) is a business venture structured to pass income, gains, losses, and tax deductions directly through to investors. The most common form is a limited partnership. DPPs do not trade on public exchanges and are illiquid investments."}, {"n": 33, "q": "Which of the following is a characteristic of a limited partnership?", "a": "Limited partners have unlimited liability for partnership debts.", "b": "Limited partners participate in the day-to-day management of the business.", "c": "Limited partners' liability is generally limited to their investment.", "d": "The general partner has no management responsibilities.", "e": "In a limited partnership, limited partners' liability is generally restricted to the amount of their investment. They do not participate in management. The general partner manages the business and has unlimited personal liability for partnership debts and obligations."}, {"n": 34, "q": "A hedge fund is typically available only to", "a": "all retail investors.", "b": "accredited investors and qualified purchasers.", "c": "government pension funds.", "d": "mutual fund shareholders.", "e": "Hedge funds are typically available only to accredited investors (individuals with net worth exceeding $1 million excluding primary residence, or annual income exceeding $200,000) and qualified purchasers. They are exempt from many SEC registration requirements."}, {"n": 35, "q": "Which of the following is NOT a characteristic of hedge funds?", "a": "They may use leverage and short selling.", "b": "They are heavily regulated by the SEC with daily reporting requirements.", "c": "They often charge a management fee plus a performance fee.", "d": "They may have lock-up periods restricting withdrawals.", "e": "Hedge funds are not heavily regulated by the SEC with daily reporting requirements. They are relatively lightly regulated compared to mutual funds. Hedge funds may use leverage, short selling, and derivatives, often charge \"2 and 20\" fee structures, and may have lock-up periods."}, {"n": 36, "q": "A private equity fund typically invests in", "a": "publicly traded stocks and bonds.", "b": "companies that are not publicly traded, with the goal of improving operations and eventually selling at a profit.", "c": "government securities.", "d": "commodities and futures.", "e": "Private equity funds invest in companies that are not publicly traded, with the goal of improving operations, growing the business, and eventually selling the company at a profit (through an IPO or sale to another company). These are long-term, illiquid investments."}, {"n": 37, "q": "An American Depositary Receipt (ADR) represents", "a": "shares of a U.S. company held in a domestic bank.", "b": "shares of a foreign company held by a U.S. depositary bank, traded on U.S. exchanges.", "c": "a bond issued by an American company.", "d": "a derivative contract on a foreign currency.", "e": "An American Depositary Receipt (ADR) represents shares of a foreign company that are held by a U.S. depositary bank. ADRs trade on U.S. exchanges in U.S. dollars, making it easier for American investors to invest in foreign companies without dealing with foreign exchanges or currencies directly."}, {"n": 38, "q": "The primary risk unique to investing in ADRs beyond normal equity risk is", "a": "inflation risk.", "b": "currency risk.", "c": "reinvestment risk.", "d": "call risk.", "e": "The primary risk unique to ADRs, beyond normal equity risk, is currency risk (also called exchange rate risk). Since the underlying shares are denominated in a foreign currency, fluctuations in the exchange rate between the foreign currency and the U.S. dollar can affect the ADR's value."}, {"n": 39, "q": "A structured product is a financial instrument that typically combines", "a": "only equity securities.", "b": "a debt instrument with a derivative component.", "c": "only government bonds.", "d": "cash and money market instruments.", "e": "A structured product is a pre-packaged financial instrument that typically combines a debt instrument (such as a bond or note) with a derivative component (such as an option). The derivative component ties the return to the performance of an underlying asset, index, or benchmark."}, {"n": 40, "q": "Leveraged ETFs are designed to", "a": "provide returns equal to the underlying index.", "b": "provide a multiple of the daily return of an underlying index.", "c": "reduce volatility compared to the index.", "d": "guarantee positive returns.", "e": "Leveraged ETFs use derivatives and borrowing to provide a multiple (e.g., 2x or 3x) of the daily return of an underlying index. They are designed for short-term trading, not long-term holding, because the compounding of daily returns can cause significant tracking deviation over time."}, {"n": 41, "q": "Inverse ETFs are designed to", "a": "provide the same return as the underlying index.", "b": "provide returns that move in the opposite direction of the underlying index.", "c": "invest in international markets.", "d": "eliminate all market risk.", "e": "Inverse ETFs are designed to provide returns that move in the opposite direction of the underlying index. If the index declines 1%, an inverse ETF is designed to gain approximately 1%. Like leveraged ETFs, they are intended for short-term trading due to daily compounding effects."}, {"n": 42, "q": "A fund of funds invests in", "a": "individual stocks and bonds directly.", "b": "shares of other investment funds rather than individual securities.", "c": "only government-backed securities.", "d": "real estate properties.", "e": "A fund of funds invests in shares of other investment funds rather than investing directly in individual securities. This provides additional diversification but also adds a layer of fees, as investors pay both the fund of funds' expenses and the expenses of the underlying funds."}, {"n": 43, "q": "Municipal bond funds are attractive to investors in", "a": "the lowest tax brackets.", "b": "the highest tax brackets because interest is generally exempt from federal income tax.", "c": "tax-deferred retirement accounts.", "d": "all tax brackets equally.", "e": "Municipal bond funds are most attractive to investors in the highest tax brackets because the interest income from municipal bonds is generally exempt from federal income tax. The higher an investor's tax bracket, the greater the tax benefit of tax-exempt income."}, {"n": 44, "q": "The primary risk of investing in a high-yield (junk) bond fund is", "a": "interest rate risk.", "b": "credit risk (default risk).", "c": "currency risk.", "d": "political risk.", "e": "The primary risk of investing in a high-yield (junk) bond fund is credit risk, also known as default risk. High-yield bonds are issued by companies with lower credit ratings, meaning there is a greater chance the issuer will be unable to make interest payments or repay principal."}, {"n": 45, "q": "An investor in a mutual fund receives a capital gains distribution. This event is", "a": "taxable to the investor even if the distribution is reinvested.", "b": "tax free if reinvested in additional shares.", "c": "taxed only when the shares are eventually sold.", "d": "not reported to the IRS.", "e": "Capital gains distributions from a mutual fund are taxable to the investor in the year received, even if the distribution is automatically reinvested in additional fund shares. The taxable event is the distribution itself, not the subsequent disposition of shares."}, {"n": 46, "q": "When comparing actively managed funds to passively managed (index) funds, which of the following statements is generally TRUE?", "a": "Actively managed funds always outperform index funds.", "b": "Index funds typically have lower expense ratios than actively managed funds.", "c": "Actively managed funds have no management fees.", "d": "Index funds require a portfolio manager to select individual securities.", "e": "Index funds typically have significantly lower expense ratios than actively managed funds because they do not require a team of analysts and portfolio managers to research and select individual securities. Studies have shown that most actively managed funds underperform their benchmark index over long periods."}, {"n": 47, "q": "Exchange-traded notes (ETNs) differ from ETFs in that ETNs", "a": "are equity instruments backed by a portfolio of stocks.", "b": "are unsecured debt obligations of the issuing bank.", "c": "are guaranteed by the FDIC.", "d": "cannot be traded on an exchange.", "e": "Exchange-traded notes (ETNs) are unsecured debt obligations of the issuing bank, meaning they carry credit risk of the issuer. Unlike ETFs, which hold a portfolio of securities, ETNs are debt instruments that promise to pay a return linked to a benchmark. If the issuing bank defaults, investors may lose their investment."}, {"n": 48, "q": "A commodity pool is", "a": "a mutual fund that invests in agricultural stocks.", "b": "a pooled investment vehicle that trades commodity futures and options.", "c": "a government program for agricultural subsidies.", "d": "a type of money market fund.", "e": "A commodity pool is a pooled investment vehicle that combines investor funds to trade commodity futures contracts and options. They are typically structured as limited partnerships and managed by a commodity pool operator (CPO) registered with the CFTC."}, {"n": 49, "q": "Business development companies (BDCs) primarily invest in", "a": "large-cap publicly traded companies.", "b": "small and mid-sized private companies and distressed businesses.", "c": "government bonds.", "d": "foreign currencies.", "e": "Business development companies (BDCs) primarily invest in small and mid-sized private companies and distressed businesses. They provide capital to these companies in the form of debt or equity and are required to distribute at least 90% of their taxable income to shareholders, similar to REITs."}, {"n": 50, "q": "Which of the following best describes an interval fund?", "a": "A fund that trades continuously like an ETF", "b": "A closed-end fund that periodically offers to repurchase a portion of its shares at NAV", "c": "An open-end fund with daily liquidity", "d": "A fund that only accepts investments at regular intervals", "e": "An interval fund is a type of closed-end fund that periodically (at set intervals, such as quarterly) offers to repurchase a portion of its outstanding shares at NAV. This structure provides some liquidity while allowing the fund to invest in less liquid assets that might not be suitable for daily-redemption open-end funds."}]}, {"id": 20, "name": "Unit 20: Trading Securities, Markets, and Pricing", "key": "BBBBBACBBBBBBBBBBBBBCBCCCBBBBBBBBBBBBABBCBBBBCBA", "questions": [{"n": 1, "q": "The New York Stock Exchange (NYSE) is an example of", "a": "an over-the-counter market.", "b": "an auction market.", "c": "a dealer market.", "d": "a dark pool.", "e": "The NYSE is an auction market (also called an exchange market) where buyers and sellers compete with each other through a centralized trading system. Prices are determined through competitive bidding, with specialists (now called designated market makers) facilitating orderly trading."}, {"n": 2, "q": "The Nasdaq market is best described as", "a": "an auction market with a physical trading floor.", "b": "a dealer market using an electronic quotation system.", "c": "a government-regulated commodities exchange.", "d": "a market exclusively for bond trading.", "e": "The Nasdaq is a dealer market that operates through an electronic quotation system. Unlike the NYSE, there is no physical trading floor. Multiple market makers compete to provide quotes and execute trades in Nasdaq-listed securities."}, {"n": 3, "q": "In an auction market, the price of a security is determined by", "a": "a single market maker.", "b": "competitive bidding between buyers and sellers.", "c": "the issuing corporation.", "d": "the SEC.", "e": "In an auction market, prices are determined through competitive bidding between buyers and sellers. The highest bid and lowest offer determine the market price. This process ensures price discovery through open competition."}, {"n": 4, "q": "A market maker in the over-the-counter (OTC) market profits primarily from", "a": "commissions charged to customers.", "b": "the spread between the bid and ask prices.", "c": "interest earned on margin loans.", "d": "advisory fees.", "e": "Market makers in the OTC market profit primarily from the spread between the bid price (the price they pay to buy) and the ask price (the price at which they sell). The wider the spread, the greater the market maker's profit per transaction."}, {"n": 5, "q": "The bid price represents the price at which", "a": "an investor can purchase a security.", "b": "a dealer is willing to buy a security from an investor.", "c": "the last trade was executed.", "d": "the security was issued.", "e": "The bid price is the price at which a dealer (market maker) is willing to buy a security from an investor. When an investor wants to sell, they receive the bid price. The bid is always lower than the ask price."}, {"n": 6, "q": "The ask (offer) price represents the price at which", "a": "a dealer is willing to sell a security to an investor.", "b": "an investor wishes to sell a security.", "c": "the security last traded.", "d": "the security was originally issued.", "e": "The ask (offer) price is the price at which a dealer is willing to sell a security to an investor. When an investor wants to buy, they pay the ask price. The ask is always higher than the bid price."}, {"n": 7, "q": "The difference between the bid price and the ask price of a security is known as the", "a": "commission.", "b": "markup.", "c": "spread.", "d": "premium.", "e": "The spread is the difference between the bid price and the ask price. It represents the market maker's compensation for providing liquidity and taking on risk. Narrower spreads typically indicate more liquid securities with active trading."}, {"n": 8, "q": "When a broker-dealer acts as an agent in a transaction, the firm", "a": "buys or sells securities from its own inventory.", "b": "executes the trade on behalf of the customer and charges a commission.", "c": "guarantees the customer a profit.", "d": "sets the bid and ask prices.", "e": "When acting as an agent (broker), the firm executes the trade on behalf of the customer, matching the customer's order with another buyer or seller, and charges a commission for this service. The firm does not take ownership of the securities."}, {"n": 9, "q": "When a broker-dealer acts as a principal in a transaction, the firm", "a": "charges a commission.", "b": "buys from or sells to the customer from its own inventory.", "c": "acts as an intermediary without taking a position.", "d": "only handles government securities.", "e": "When acting as a principal (dealer), the broker-dealer buys securities from or sells securities to the customer from its own inventory. Instead of charging a commission, the firm may charge a markup (when selling) or markdown (when buying). A firm cannot act as both agent and principal in the same transaction."}, {"n": 10, "q": "A market order instructs the broker to", "a": "buy or sell at a specific price or better.", "b": "buy or sell immediately at the best available price.", "c": "hold the order until a specific price is reached.", "d": "cancel the order at the end of the trading day if not filled.", "e": "A market order instructs the broker to buy or sell immediately at the best available price. Market orders guarantee execution but do not guarantee a specific price. They are the most common type of order and are typically filled quickly."}, {"n": 11, "q": "A limit order to buy a stock at $50 will be executed", "a": "at $50 or higher.", "b": "at $50 or lower.", "c": "only at exactly $50.", "d": "at the market price regardless of the limit.", "e": "A limit order to buy at $50 will only be executed at $50 or lower (a better price for the buyer). The investor is willing to pay up to $50 but not more. If the stock is trading above $50, the order will not be filled until the price drops to $50 or below."}, {"n": 12, "q": "A limit order to sell a stock at $75 will be executed", "a": "at $75 or lower.", "b": "at $75 or higher.", "c": "only at exactly $75.", "d": "at the next available price.", "e": "A limit order to sell at $75 will only be executed at $75 or higher (a better price for the seller). The investor wants at least $75 per share. If the stock is trading below $75, the order will not be filled until the price rises to $75 or above."}, {"n": 13, "q": "A stop order (stop-loss order) to sell is placed", "a": "above the current market price.", "b": "below the current market price.", "c": "at the current market price.", "d": "only on listed securities.", "e": "A sell stop order is placed below the current market price. It is used to protect against further losses on a long position (stop-loss) or to protect a profit. The order is triggered when the stock price falls to or below the stop price."}, {"n": 14, "q": "When a sell stop order is triggered, it becomes a", "a": "limit order.", "b": "market order.", "c": "canceled order.", "d": "good-til-canceled order.", "e": "When a sell stop order is triggered (the stock reaches the stop price), it becomes a market order and is executed at the next available price. This means the execution price may be different from the stop price, especially in fast-moving markets."}, {"n": 15, "q": "A buy stop order is typically used by an investor who", "a": "wants to buy shares at a price below the current market.", "b": "has a short position and wants to limit losses if the price rises.", "c": "wants to lock in a profit on a long position.", "d": "wants to sell shares at a premium.", "e": "A buy stop order is placed above the current market price and is commonly used by short sellers to limit their losses. If the stock price rises to the stop price, the order is triggered and becomes a market order to buy, closing the short position."}, {"n": 16, "q": "A stop-limit order combines the features of a stop order and a limit order by", "a": "executing immediately at any price.", "b": "becoming a limit order once the stop price is triggered.", "c": "guaranteeing execution at the stop price.", "d": "automatically canceling if not filled within one day.", "e": "A stop-limit order becomes a limit order once the stop price is triggered, rather than becoming a market order. This gives the investor price protection—the order will only execute at the limit price or better—but does not guarantee execution."}, {"n": 17, "q": "A disadvantage of a stop-limit order compared to a regular stop order is that a stop-limit order", "a": "may result in a worse execution price.", "b": "may not be executed at all if the price moves past the limit.", "c": "costs more in commissions.", "d": "can only be used for listed securities.", "e": "Because a stop-limit order becomes a limit order (not a market order) when triggered, it may not be executed if the price moves quickly past the limit price. With a regular stop order, execution is virtually guaranteed (as a market order), but the price is not."}, {"n": 18, "q": "A day order expires", "a": "after 30 days if not executed.", "b": "at the end of the trading day if not executed.", "c": "after 90 days.", "d": "only when the investor cancels it.", "e": "A day order is valid only for the trading day on which it is placed. If it is not executed by the close of trading that day, it is automatically canceled. If no time designation is specified, orders are assumed to be day orders."}, {"n": 19, "q": "A good-til-canceled (GTC) order remains open until", "a": "the end of the trading day.", "b": "it is executed or canceled by the investor.", "c": "30 calendar days.", "d": "the end of the calendar year.", "e": "A good-til-canceled (GTC) order remains open until it is either executed or canceled by the investor. Most broker-dealers impose a maximum time limit on GTC orders, typically 30 to 90 days, after which the order is automatically canceled if not filled."}, {"n": 20, "q": "An investor who sells a security short is", "a": "buying shares with borrowed money.", "b": "borrowing shares and selling them, hoping the price will decline.", "c": "selling shares held in a margin account.", "d": "placing a limit order to sell above the current price.", "e": "In a short sale, an investor borrows shares from a broker-dealer and sells them in the open market, hoping the price will decline. If the price drops, the investor buys the shares back at the lower price, returns them to the lender, and profits from the difference."}, {"n": 21, "q": "In a short sale, the investor's maximum potential loss is", "a": "limited to the amount of the initial investment.", "b": "limited to 50% of the short sale proceeds.", "c": "theoretically unlimited.", "d": "limited to the margin requirement.", "e": "In a short sale, the maximum potential loss is theoretically unlimited because there is no upper limit to how high a stock's price can rise. The investor must eventually buy back the shares to return them, and the price could rise indefinitely."}, {"n": 22, "q": "Short selling requires the use of a", "a": "cash account.", "b": "margin account.", "c": "retirement account.", "d": "custodial account.", "e": "Short selling requires a margin account because the investor is borrowing securities from the broker-dealer. Regulation T requires the short seller to deposit margin (currently 50% of the short sale proceeds) to collateralize the borrowed shares."}, {"n": 23, "q": "The Securities Investor Protection Corporation (SIPC) provides protection for customers of", "a": "banks and savings institutions.", "b": "insurance companies.", "c": "broker-dealers that are SIPC members.", "d": "investment advisory firms.", "e": "SIPC protects customers of broker-dealers that are SIPC members in the event the broker-dealer fails financially. It does not protect customers of banks, insurance companies, or investment advisory firms (unless the adviser is also a broker-dealer)."}, {"n": 24, "q": "SIPC protection covers customer accounts up to", "a": "$100,000 per account.", "b": "$250,000 per account.", "c": "$500,000 per account, including up to $250,000 in cash.", "d": "$1,000,000 per account.", "e": "SIPC provides protection up to $500,000 per customer account, including a maximum of $250,000 for cash claims. This covers securities and cash held in a customer's account at a failed SIPC-member broker-dealer."}, {"n": 25, "q": "SIPC protection does NOT cover losses due to", "a": "a broker-dealer's insolvency.", "b": "missing securities from a customer's account.", "c": "a decline in the market value of securities.", "d": "theft of securities by a broker-dealer employee.", "e": "SIPC does not protect against losses due to market fluctuations or declines in the value of securities. It only protects against the loss of securities and cash resulting from a broker-dealer's financial failure, insolvency, or unauthorized trading."}, {"n": 26, "q": "The third market refers to", "a": "trading of unlisted securities OTC.", "b": "trading of exchange-listed securities in the OTC market.", "c": "trading on foreign exchanges.", "d": "after-hours trading on the NYSE.", "e": "The third market refers to the trading of exchange-listed securities in the OTC (over-the-counter) market, rather than on the exchange where they are listed. This allows institutional investors to negotiate trades directly with OTC market makers."}, {"n": 27, "q": "The fourth market refers to", "a": "trading of penny stocks.", "b": "institutional investors trading directly with each other without a broker-dealer.", "c": "trading on electronic communication networks only.", "d": "the municipal bond market.", "e": "The fourth market refers to direct institution-to-institution trading without the use of a broker-dealer as an intermediary. These trades are typically executed through electronic communication networks (ECNs) and involve large blocks of securities."}, {"n": 28, "q": "An electronic communication network (ECN) is", "a": "a government-operated trading system.", "b": "an electronic system that automatically matches buy and sell orders.", "c": "a physical trading floor using electronic displays.", "d": "a system exclusively for mutual fund trades.", "e": "An electronic communication network (ECN) is an automated system that matches buy and sell orders electronically. ECNs provide an alternative to traditional exchanges and OTC markets, often offering faster execution, lower costs, and the ability to trade outside regular market hours."}, {"n": 29, "q": "A dark pool is a type of trading venue that", "a": "operates only at night.", "b": "allows large institutional trades to be executed without displaying orders publicly before execution.", "c": "is illegal under SEC regulations.", "d": "is used exclusively for trading government securities.", "e": "A dark pool is a private trading venue where large institutional orders can be executed without displaying order information publicly before execution. This helps prevent large trades from moving the market price against the institution before the trade is completed."}, {"n": 30, "q": "Best execution requires a broker-dealer to", "a": "always obtain the lowest possible commission for the client.", "b": "use reasonable diligence to execute customer orders at the most favorable terms available.", "c": "always execute orders on the NYSE.", "d": "guarantee a specific execution price.", "e": "Best execution requires broker-dealers to use reasonable diligence to execute customer orders at the most favorable terms reasonably available under the circumstances. Factors considered include price, speed of execution, likelihood of execution, and the size and type of the transaction."}, {"n": 31, "q": "Payment for order flow occurs when", "a": "customers pay a fee to have their orders executed more quickly.", "b": "a market maker pays a broker-dealer for routing customer orders to it.", "c": "the SEC charges a fee for processing trades.", "d": "investors pay a premium for after-hours trading.", "e": "Payment for order flow occurs when a market maker pays a broker-dealer a fee for routing customer orders to that market maker for execution. While legal and disclosed, this practice raises potential conflicts of interest regarding best execution."}, {"n": 32, "q": "A trade settlement of T+1 means that", "a": "the trade must settle within one hour.", "b": "the trade settles one business day after the trade date.", "c": "the trade must be confirmed within one minute.", "d": "the trade settles on the same day.", "e": "T+1 settlement means the trade settles one business day after the trade date. The \"T\" represents the trade date, and \"+1\" means one business day after. This is the current standard settlement cycle for most U.S. securities transactions."}, {"n": 33, "q": "Regular way settlement for most securities transactions is", "a": "T+0 (same day).", "b": "T+1 (one business day after the trade date).", "c": "T+2 (two business days after the trade date).", "d": "T+3 (three business days after the trade date).", "e": "Regular way settlement for most securities transactions (stocks, bonds, mutual funds, ETFs) is T+1, meaning settlement occurs one business day after the trade date. This was changed from T+2 effective May 28, 2024. Government securities and options settle T+1 as well."}, {"n": 34, "q": "The ex-dividend date for a stock is important because", "a": "it is the date the dividend is paid.", "b": "investors who purchase the stock on or after this date are NOT entitled to the upcoming dividend.", "c": "it is the date the company declares the dividend.", "d": "it is the last day to sell the stock and still receive the dividend.", "e": "The ex-dividend date is the first day a stock trades without the upcoming dividend. Investors who purchase the stock on or after the ex-dividend date will NOT receive the upcoming dividend. To receive the dividend, shares must be purchased before the ex-dividend date."}, {"n": 35, "q": "The record date is the date on which", "a": "the company declares a dividend.", "b": "the company determines which shareholders are entitled to receive the dividend.", "c": "the dividend is actually paid.", "d": "the stock begins trading ex-dividend.", "e": "The record date is the date on which the company examines its records to determine which shareholders are registered owners and therefore entitled to receive the declared dividend. Shareholders of record on this date will receive the dividend on the payment date."}, {"n": 36, "q": "Under Regulation T, the initial margin requirement for purchasing securities on margin is currently", "a": "25%.", "b": "50%.", "c": "75%.", "d": "100%.", "e": "Regulation T, set by the Federal Reserve Board, currently requires an initial margin of 50% of the purchase price when buying securities on margin. This means the investor must deposit at least half of the purchase price, with the broker-dealer lending the remaining amount."}, {"n": 37, "q": "If an investor purchases $40,000 worth of stock on margin with a 50% initial margin requirement, the investor must deposit", "a": "$10,000.", "b": "$20,000.", "c": "$30,000.", "d": "$40,000.", "e": "With a 50% initial margin requirement, the investor must deposit 50% of the $40,000 purchase, which equals $20,000. The broker-dealer lends the remaining $20,000 as a margin loan, on which the investor pays interest."}, {"n": 38, "q": "The minimum maintenance margin for long positions, as set by FINRA, is", "a": "25%.", "b": "35%.", "c": "50%.", "d": "75%.", "e": "FINRA requires a minimum maintenance margin of 25% of the current market value of securities held in a long margin account. Individual broker-dealers may set higher \"house\" maintenance requirements. If equity falls below this level, a margin call is issued."}, {"n": 39, "q": "A margin call is issued when", "a": "the equity in the account exceeds the initial margin requirement.", "b": "the equity in the account falls below the maintenance margin requirement.", "c": "the investor makes a profit on the securities.", "d": "the investor first opens a margin account.", "e": "A margin call (maintenance call) is issued when the equity in a margin account falls below the minimum maintenance requirement. The investor must deposit additional cash or securities to bring the account back to compliance, or the broker-dealer may liquidate positions."}, {"n": 40, "q": "Regulation SHO addresses rules related to", "a": "insider trading.", "b": "short selling.", "c": "margin requirements.", "d": "municipal bond trading.", "e": "Regulation SHO, adopted by the SEC, addresses short selling rules, including requirements for locating shares to borrow before short selling (locate requirement), close-out provisions for fails-to-deliver, and restrictions on naked short selling."}, {"n": 41, "q": "A block trade is generally defined as a trade involving", "a": "100 shares or fewer.", "b": "at least 1,000 shares.", "c": "at least 10,000 shares or $200,000 in value.", "d": "any trade executed on the NYSE.", "e": "A block trade is generally defined as a trade involving at least 10,000 shares or having a market value of at least $200,000. Block trades are often executed by institutional investors and may be facilitated through special arrangements to minimize market impact."}, {"n": 42, "q": "The primary market is where", "a": "previously issued securities are traded between investors.", "b": "new securities are sold to investors for the first time.", "c": "only government bonds are traded.", "d": "only institutional investors participate.", "e": "The primary market is where new securities are sold to the public for the first time, such as through an initial public offering (IPO) or a follow-on offering. Proceeds from primary market sales go to the issuing company or government entity."}, {"n": 43, "q": "The secondary market is where", "a": "new securities are issued through IPOs.", "b": "previously issued securities are traded between investors.", "c": "the Federal Reserve conducts open market operations.", "d": "companies repurchase their own stock.", "e": "The secondary market is where previously issued securities are traded between investors. Exchanges like the NYSE and Nasdaq, as well as the OTC market, are all part of the secondary market. Proceeds from secondary market sales go to the selling investor, not the issuing company."}, {"n": 44, "q": "An initial public offering (IPO) takes place in the", "a": "secondary market.", "b": "primary market.", "c": "third market.", "d": "fourth market.", "e": "An IPO takes place in the primary market because it involves the first-time sale of newly issued securities to the public. After the IPO, the shares trade in the secondary market on exchanges or in the OTC market."}, {"n": 45, "q": "Soft dollar arrangements involve", "a": "broker-dealers paying advisers in cash for client referrals.", "b": "investment advisers directing brokerage to firms that provide research and other services in return.", "c": "customers paying reduced commissions during market downturns.", "d": "the SEC reducing registration fees for small advisers.", "e": "Soft dollar arrangements involve investment advisers directing client brokerage transactions to broker-dealers that provide research, data services, or other benefits in return. These arrangements must be disclosed and must comply with the safe harbor provisions of Section 28(e) of the Securities Exchange Act of 1934."}, {"n": 46, "q": "Under the Uniform Securities Act, a broker-dealer's markup on an OTC transaction must be", "a": "exactly 5%.", "b": "no more than 10%.", "c": "reasonable and disclosed.", "d": "set by the state Administrator.", "e": "Under the Uniform Securities Act, markups on OTC transactions must be reasonable and disclosed to the customer. There is no specific percentage limit set by law, but excessive markups may be considered fraudulent. FINRA's 5% markup policy serves as a guideline, not a rule."}, {"n": 47, "q": "Churning is the unethical practice of", "a": "holding securities for too long without trading.", "b": "excessively trading a customer's account to generate commissions.", "c": "recommending only no-load mutual funds.", "d": "failing to execute orders in a timely manner.", "e": "Churning is the excessive buying and selling of securities in a customer's account by a broker or adviser primarily to generate commissions rather than to benefit the customer. It is a violation of fiduciary duty and securities laws, and is considered a form of fraud."}, {"n": 48, "q": "An investor places a fill-or-kill (FOK) order. This means the order must be", "a": "executed in its entirety immediately or canceled entirely.", "b": "filled before the end of the trading day.", "c": "partially filled and the remainder canceled.", "d": "executed at the next market opening.", "e": "A fill-or-kill (FOK) order must be executed immediately in its entirety or canceled completely. No partial fills are allowed. This order type is commonly used for large trades where the investor needs the full order executed at once or not at all."}]}, {"id": 21, "name": "Unit 21: Insurance-Based Products and Considerations", "key": "BACBCCBBCCBBABBBBCCBBCBBBBBBBBBBBABBCBBCBBBBC", "questions": [{"n": 1, "q": "The primary purpose of life insurance is to", "a": "generate investment returns for the policyholder.", "b": "provide a death benefit to protect the insured's dependents from financial hardship.", "c": "avoid estate taxes.", "d": "accumulate tax-deferred savings for retirement.", "e": "The primary purpose of life insurance is to provide a death benefit to protect the insured's dependents and beneficiaries from financial hardship in the event of the insured's death. While some policies include investment or savings components, the core purpose is financial protection."}, {"n": 2, "q": "Term life insurance provides", "a": "coverage for a specified period with no cash value accumulation.", "b": "lifetime coverage with a cash value component.", "c": "coverage that increases in value over time.", "d": "an investment component tied to the stock market.", "e": "Term life insurance provides coverage for a specified period (the term), such as 10, 20, or 30 years. If the insured dies during the term, the beneficiary receives the death benefit. Term insurance has no cash value component and is generally the least expensive form of life insurance."}, {"n": 3, "q": "Whole life insurance differs from term life insurance in that whole life", "a": "provides coverage for a limited period only.", "b": "has no death benefit.", "c": "provides permanent coverage and accumulates a cash value.", "d": "is only available to individuals under age 40.", "e": "Whole life insurance provides permanent coverage for the insured's entire lifetime (as long as premiums are paid) and accumulates a cash value that grows on a tax-deferred basis. Term life only covers a specified period and has no cash value."}, {"n": 4, "q": "The cash value component of a whole life insurance policy", "a": "is available immediately upon purchase.", "b": "grows on a tax-deferred basis.", "c": "is always greater than the death benefit.", "d": "cannot be accessed by the policyholder during their lifetime.", "e": "The cash value of a whole life insurance policy grows on a tax-deferred basis, meaning no income tax is owed on the growth until funds are withdrawn. The cash value builds gradually over time and can be accessed through policy loans or partial surrenders."}, {"n": 5, "q": "Universal life insurance provides flexibility in all of the following EXCEPT", "a": "the amount and timing of premium payments.", "b": "the death benefit amount.", "c": "the guaranteed fixed rate of return on the cash value.", "d": "accessing the cash value through loans or withdrawals.", "e": "Universal life insurance provides flexibility in premium payments, death benefit amounts, and access to cash value. However, the rate of return on the cash value is not guaranteed at a fixed rate—it is typically tied to current interest rates with a minimum guaranteed floor. The flexibility in premiums and death benefits is the hallmark of universal life."}, {"n": 6, "q": "Variable life insurance differs from whole life insurance primarily because the variable policy's cash value", "a": "is guaranteed by the insurance company.", "b": "is invested in the insurer's general account.", "c": "is invested in separate accounts (subaccounts) chosen by the policyholder.", "d": "cannot lose value.", "e": "Variable life insurance allows the policyholder to invest the cash value in separate accounts (subaccounts), which function similarly to mutual funds. The cash value and potentially the death benefit fluctuate based on the performance of these investments, unlike whole life where the insurer manages the investments in its general account."}, {"n": 7, "q": "Variable life insurance is considered a security and must be registered with the SEC because", "a": "it is sold by broker-dealers.", "b": "the policyholder bears the investment risk of the separate account.", "c": "the premiums are tax deductible.", "d": "it has a fixed death benefit.", "e": "Variable life insurance is considered a security because the policyholder bears the investment risk—the cash value depends on the performance of the selected separate account investments. Because of this investment risk, variable products must be registered with the SEC and sold with a prospectus."}, {"n": 8, "q": "A variable universal life (VUL) insurance policy combines the features of", "a": "term insurance and whole life insurance.", "b": "variable life insurance and universal life insurance.", "c": "term insurance and an annuity.", "d": "whole life insurance and disability insurance.", "e": "Variable universal life (VUL) combines the investment flexibility of variable life insurance (separate account investing) with the premium and death benefit flexibility of universal life insurance. It offers the most flexibility of any permanent life insurance product but also carries the most investment risk."}, {"n": 9, "q": "An individual who sells variable life insurance or variable annuities must hold", "a": "only a state insurance license.", "b": "only a FINRA securities registration.", "c": "both a state insurance license and a FINRA securities registration.", "d": "a CPA license.", "e": "Because variable life insurance and variable annuities are both insurance products and securities, an individual who sells them must hold both a state insurance license and a FINRA securities registration (typically Series 6 or Series 7). Neither license alone is sufficient."}, {"n": 10, "q": "The death benefit of a life insurance policy is generally", "a": "taxable as ordinary income to the beneficiary.", "b": "taxable as a capital gain to the beneficiary.", "c": "received income tax free by the beneficiary.", "d": "subject to a 10% penalty if the insured is under age 59½.", "e": "Life insurance death benefits are generally received income tax free by the beneficiary under IRC Section 101(a). However, the death benefit may be included in the deceased's estate for estate tax purposes if the insured had incidents of ownership in the policy at the time of death."}, {"n": 11, "q": "A policy loan from a whole life insurance policy", "a": "is a taxable event at the time the loan is taken.", "b": "reduces the death benefit by the outstanding loan amount if not repaid.", "c": "must be repaid within 60 days.", "d": "is available only after the policy has been in force for 10 years.", "e": "A policy loan from a whole life insurance policy is not a taxable event when taken. However, if the loan is outstanding when the insured dies, the death benefit paid to the beneficiary is reduced by the amount of the outstanding loan plus any accrued interest."}, {"n": 12, "q": "The surrender value of a life insurance policy is", "a": "the same as the death benefit.", "b": "the cash value minus any surrender charges and outstanding loans.", "c": "always greater than the premiums paid.", "d": "the amount the beneficiary receives upon the insured's death.", "e": "The surrender value (or cash surrender value) is the amount the policyholder receives if they cancel the policy. It equals the cash value minus any applicable surrender charges and any outstanding policy loans. It is not the same as the death benefit."}, {"n": 13, "q": "A 1035 exchange allows a policyholder to", "a": "exchange a life insurance policy or annuity for another without triggering a taxable event.", "b": "exchange securities for insurance products tax free.", "c": "convert term insurance to whole life insurance at any age without a medical exam.", "d": "exchange a variable annuity for a mutual fund tax free.", "e": "A Section 1035 exchange allows a policyholder to exchange one life insurance policy for another life insurance policy, one annuity for another annuity, or a life insurance policy for an annuity, without triggering a taxable event. This preserves the tax-deferred status of the accumulated value."}, {"n": 14, "q": "Under a 1035 exchange, which of the following transfers is permitted?", "a": "An annuity exchanged for a life insurance policy", "b": "A life insurance policy exchanged for an annuity", "c": "A mutual fund exchanged for an annuity", "d": "A 401(k) plan exchanged for a life insurance policy", "e": "Under Section 1035, permitted exchanges include: life insurance to life insurance, life insurance to annuity, and annuity to annuity. An annuity CANNOT be exchanged for a life insurance policy tax free. Mutual funds and 401(k) plans are not eligible for 1035 exchanges."}, {"n": 15, "q": "An annuity is primarily designed to", "a": "provide a death benefit to beneficiaries.", "b": "provide a stream of income, often for retirement.", "c": "insure against property loss.", "d": "provide short-term disability coverage.", "e": "An annuity is primarily designed to provide a stream of income, often for retirement. During the accumulation phase, the owner contributes money that grows tax deferred. During the annuitization phase, the accumulated value is converted into periodic income payments."}, {"n": 16, "q": "During the accumulation phase of an annuity, the owner", "a": "receives regular income payments.", "b": "makes contributions and the account grows tax deferred.", "c": "must begin taking required minimum distributions.", "d": "cannot access the funds under any circumstances.", "e": "During the accumulation phase, the annuity owner makes contributions (premium payments) and the account value grows on a tax-deferred basis. No income tax is owed on the earnings until withdrawals or annuity payments are made."}, {"n": 17, "q": "During the annuitization (payout) phase of an annuity, the owner", "a": "continues making contributions.", "b": "receives periodic income payments from the contract.", "c": "can make additional lump-sum deposits.", "d": "pays no taxes on the payments received.", "e": "During the annuitization (payout) phase, the annuity contract is converted into a stream of periodic income payments to the annuitant. The owner no longer makes contributions and instead receives payments based on the selected payout option."}, {"n": 18, "q": "The tax treatment of nonqualified annuity distributions is based on the", "a": "entire distribution being tax free.", "b": "entire distribution being taxed as ordinary income.", "c": "exclusion ratio, which determines the taxable and nontaxable portions.", "d": "capital gains tax rate.", "e": "Nonqualified annuity distributions are taxed based on the exclusion ratio, which determines the portion of each payment that represents a tax-free return of the owner's cost basis (after-tax contributions) and the portion that represents taxable earnings. Only the earnings portion is taxed as ordinary income."}, {"n": 19, "q": "If an annuity owner takes a withdrawal before age 59½, the earnings portion is subject to", "a": "ordinary income tax only.", "b": "a 10% early withdrawal penalty only.", "c": "ordinary income tax plus a 10% early withdrawal penalty.", "d": "no tax or penalty.", "e": "If an annuity owner takes a withdrawal before age 59½, the earnings portion of the withdrawal is subject to both ordinary income tax and a 10% early withdrawal penalty. The return of cost basis (after-tax contributions) is not taxed or penalized."}, {"n": 20, "q": "A life settlement involves", "a": "a policyholder purchasing additional life insurance.", "b": "the sale of an existing life insurance policy to a third party for more than the cash surrender value but less than the death benefit.", "c": "converting term insurance to whole life.", "d": "surrendering a policy to the insurance company.", "e": "A life settlement is a transaction in which the owner of a life insurance policy sells the policy to a third-party investor for an amount greater than the cash surrender value but less than the death benefit. The purchaser becomes the new owner and beneficiary and is responsible for future premium payments."}, {"n": 21, "q": "A viatical settlement is similar to a life settlement but specifically involves", "a": "policies with very large death benefits.", "b": "the sale of a policy by a terminally or chronically ill individual.", "c": "corporate-owned life insurance policies.", "d": "policies held in irrevocable trusts.", "e": "A viatical settlement is specifically the sale of a life insurance policy by a terminally or chronically ill individual. The proceeds from a viatical settlement for a terminally ill person are generally received income tax free, unlike life settlement proceeds which may be taxable."}, {"n": 22, "q": "Which of the following annuity payout options provides income for the life of the annuitant, with no payments to beneficiaries after death?", "a": "Life with period certain", "b": "Joint and survivor", "c": "Life only (straight life)", "d": "Installment refund", "e": "A life only (straight life) annuity provides income for the life of the annuitant with no payments to beneficiaries after the annuitant's death. This option provides the highest periodic payment because the insurer has no obligation beyond the annuitant's lifetime."}, {"n": 23, "q": "A life annuity with period certain guarantees payments", "a": "for the life of the annuitant only.", "b": "for the life of the annuitant or a specified minimum period, whichever is longer.", "c": "to two annuitants until both have died.", "d": "of the full purchase price to the beneficiary.", "e": "A life annuity with period certain guarantees payments for the life of the annuitant or a specified minimum period (e.g., 10 or 20 years), whichever is longer. If the annuitant dies before the period certain expires, payments continue to the beneficiary for the remainder of the period."}, {"n": 24, "q": "A joint and last survivor annuity provides income", "a": "for the life of one annuitant only.", "b": "for the lives of two annuitants, continuing until the last survivor dies.", "c": "for a fixed period of years.", "d": "only until the first annuitant dies.", "e": "A joint and last survivor annuity provides income for the lives of two annuitants and continues making payments until the last surviving annuitant dies. This is commonly used by married couples to ensure the surviving spouse continues to receive income."}, {"n": 25, "q": "Equity-indexed annuities provide returns linked to", "a": "the performance of a specific mutual fund.", "b": "a stock market index, typically with a minimum guaranteed return.", "c": "the federal funds rate.", "d": "the consumer price index.", "e": "Equity-indexed annuities (also called fixed-indexed annuities) provide returns linked to a stock market index, such as the S&P 500, while typically guaranteeing a minimum return (e.g., 1-3%). The upside participation may be limited through caps, participation rates, or spread margins."}, {"n": 26, "q": "A fixed annuity guarantees", "a": "returns based on stock market performance.", "b": "a minimum rate of return during the accumulation phase.", "c": "that the account value will never decrease.", "d": "returns equal to the S&P 500.", "e": "A fixed annuity guarantees a minimum rate of return during the accumulation phase. The insurance company invests the premiums in its general account and bears the investment risk, providing the annuity owner with a predictable, stable return."}, {"n": 27, "q": "The separate account of a variable annuity is", "a": "part of the insurance company's general account.", "b": "protected from the claims of the insurer's creditors.", "c": "guaranteed by the FDIC.", "d": "invested only in government securities.", "e": "The separate account of a variable annuity is legally separate from the insurance company's general account and is protected from the claims of the insurer's creditors. This is an important protection for variable annuity owners—if the insurer becomes insolvent, the separate account assets belong to the policyholders."}, {"n": 28, "q": "An immediate annuity begins making payments", "a": "after a 5-year waiting period.", "b": "within one payment period after purchase (usually within one month).", "c": "after the annuitant reaches age 65.", "d": "only after the accumulation phase is complete.", "e": "An immediate annuity begins making income payments within one payment period after purchase, usually within one month. The owner makes a single lump-sum payment and immediately begins receiving periodic income. There is no accumulation phase."}, {"n": 29, "q": "A deferred annuity", "a": "begins payments immediately after purchase.", "b": "has an accumulation phase before annuitization begins.", "c": "cannot be annuitized.", "d": "must begin payments by age 59½.", "e": "A deferred annuity has an accumulation phase during which the owner makes contributions and the account grows tax deferred before annuitization begins. The owner chooses when to begin receiving income payments, typically at retirement."}, {"n": 30, "q": "Surrender charges on an annuity contract", "a": "apply to all withdrawals regardless of when they are made.", "b": "are fees for early withdrawal that typically decline over a period of years.", "c": "increase the longer the contract is held.", "d": "are charged only by variable annuities.", "e": "Surrender charges are fees imposed by the insurance company for early withdrawal from an annuity, typically during the first 5 to 10 years of the contract. The charges usually start high (e.g., 7%) and decline by approximately 1% per year until they reach zero. Both fixed and variable annuities may have surrender charges."}, {"n": 31, "q": "A key risk of a fixed annuity is", "a": "market risk.", "b": "purchasing power (inflation) risk, because the fixed payments may not keep pace with inflation.", "c": "liquidity risk from exchange trading.", "d": "currency risk.", "e": "The key risk of a fixed annuity is purchasing power (inflation) risk. Because the payments are fixed, they do not increase with inflation. Over time, the real value of the fixed payments declines as the cost of living increases, reducing the annuitant's purchasing power."}, {"n": 32, "q": "A key risk of a variable annuity is", "a": "inflation risk, because payments are fixed.", "b": "market risk, because the account value fluctuates with the performance of the separate account investments.", "c": "that the insurance company will default.", "d": "regulatory risk from changing tax laws.", "e": "The key risk of a variable annuity is market risk. Because the account value is invested in separate accounts that fluctuate with market performance, the owner's account value and potentially the income payments can decrease if investments perform poorly."}, {"n": 33, "q": "The free-look period for an annuity contract allows the owner to", "a": "make unlimited withdrawals without surrender charges.", "b": "cancel the contract within a specified period (typically 10 to 30 days) and receive a full refund.", "c": "exchange the annuity for another product at no cost.", "d": "add riders to the contract at no additional charge.", "e": "The free-look period (typically 10 to 30 days, depending on state law) allows the annuity owner to examine the contract and cancel it for a full refund if not satisfied. This consumer protection provision gives the owner time to review the terms without penalty."}, {"n": 34, "q": "A guaranteed minimum death benefit (GMDB) rider on a variable annuity ensures that", "a": "the beneficiary receives at least the amount invested minus withdrawals, regardless of market performance.", "b": "the annuitant receives lifetime income.", "c": "the account value will never decline.", "d": "the beneficiary receives double the account value.", "e": "A guaranteed minimum death benefit (GMDB) rider ensures that the beneficiary receives at least the total amount invested (premiums paid minus any withdrawals), even if the account value has declined due to poor investment performance. This provides downside protection for the death benefit."}, {"n": 35, "q": "A guaranteed minimum income benefit (GMIB) rider on a variable annuity", "a": "guarantees a fixed rate of return on the separate account.", "b": "guarantees a minimum level of income when the contract is annuitized, regardless of account performance.", "c": "eliminates all surrender charges.", "d": "provides tax-free withdrawals.", "e": "A guaranteed minimum income benefit (GMIB) rider guarantees a minimum level of annuity income when the contract is annuitized, regardless of the actual account value at that time. This protects the annuitant from receiving reduced income due to poor investment performance in the separate accounts."}, {"n": 36, "q": "Long-term care insurance is designed to cover", "a": "short-term hospital stays.", "b": "the cost of extended care services, including nursing home, assisted living, and home health care.", "c": "prescription drug costs.", "d": "dental and vision care.", "e": "Long-term care (LTC) insurance is designed to cover the cost of extended care services that are not typically covered by health insurance or Medicare, including nursing home care, assisted living facilities, adult day care, and home health care services."}, {"n": 37, "q": "Disability income insurance provides", "a": "a death benefit to the insured's family.", "b": "a lump-sum payment upon diagnosis of a disability.", "c": "a percentage of the insured's income if they become unable to work due to illness or injury.", "d": "coverage for medical expenses related to the disability.", "e": "Disability income insurance replaces a percentage of the insured's income (typically 60-70%) if they become unable to work due to illness or injury. It provides periodic income payments, not a lump sum, and does not cover medical expenses directly."}, {"n": 38, "q": "The elimination period in a disability insurance policy refers to", "a": "the maximum period during which benefits will be paid.", "b": "the waiting period after the onset of disability before benefits begin.", "c": "the period during which the insured cannot cancel the policy.", "d": "the time required to process the insurance application.", "e": "The elimination period (also called the waiting period) is the time between the onset of disability and when benefit payments begin. Common elimination periods are 30, 60, 90, or 180 days. Longer elimination periods result in lower premiums."}, {"n": 39, "q": "An own-occupation disability policy defines disability as the inability to perform", "a": "any job whatsoever.", "b": "the specific duties of the insured's own occupation.", "c": "at least two activities of daily living.", "d": "any job for which the insured is qualified by education and experience.", "e": "An own-occupation disability policy defines disability as the inability to perform the specific duties of the insured's own occupation. This is the most favorable definition for the insured because they can receive benefits even if they are able to work in a different occupation."}, {"n": 40, "q": "Which of the following types of insurance would be most appropriate for a high-income professional concerned about losing income due to injury?", "a": "Term life insurance", "b": "Long-term care insurance", "c": "Disability income insurance", "d": "Variable life insurance", "e": "Disability income insurance would be most appropriate for a high-income professional concerned about losing income due to injury. It replaces a portion of lost income during disability, protecting the professional's standard of living and ability to meet financial obligations."}, {"n": 41, "q": "A key person life insurance policy is purchased by", "a": "an individual to protect their family.", "b": "a business to protect against the financial loss of a key employee or owner.", "c": "a bank to insure its deposits.", "d": "a charity to fund its operations.", "e": "Key person (key employee) life insurance is purchased by a business to protect against the financial loss that would result from the death of a key employee or owner. The business is both the owner and beneficiary of the policy, and the death benefit h

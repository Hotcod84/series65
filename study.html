 "An investment adviser who has been admitted to the bar in the state in which the firm's principal office is located", "c": "A financial planner offering a wide range of services to his clients, including tax planning, estate planning, insurance planning, and investment advice", "d": "A firm whose exclusive business is placing clients' assets into model portfolios", "e": "In order for the term investment counsel to be used, two criteria must be met. First, the principal business must be the rendering of investment advice. Second, the nature of the advice must meet the definition of investment supervisory service."}, {"n": 6, "q": "Which of the following is NOT a person as defined by the Uniform Securities Act?", "a": "XYZ Dry Cleaners, Inc., whose shareholders all work on the premises and also offer financial advice to customers who request it.", "b": "A small unincorporated investment club.", "c": "A child prodigy for whom his mother, as custodian, opened an account at a major securities firm.", "d": "Guelph, a small city outside of Toronto, Ontario, that maintains an investment account at a brokerage house to invest surplus funds.", "e": "Under the Uniform Securities Act, the term person has a specific meaning. A minor child is not a person legally capable of entering into contracts."}, {"n": 7, "q": "The term \"investment counsel\" can be used by investment advisers", "a": "who are registered with the SEC under the Investment Advisers Act of 1940", "b": "who are also attorneys", "c": "who are also registered as broker-dealers", "d": "with a primary business of rendering investment advice", "e": "While this choice is only half correct, under the Investment Advisers Act of 1940, the term investment counsel may be used by any adviser that meets two standards."}, {"n": 8, "q": "Which of the following is NOT included in Form ADV Part 2A?", "a": "Types of investments made by the adviser", "b": "A description of how the adviser is compensated", "c": "Investment policy of the adviser", "d": "States in which the investment adviser is registered or intends to register", "e": "ADV Part 2A is the brochure that investment advisers must deliver to clients; it describes the investment adviser's fees, investment policies, and types of investments made."}, {"n": 9, "q": "The chief compliance officer (CCO) of a registered investment adviser would generally not have responsibility for the actions of", "a": "ministerial personnel of the firm.", "b": "an investment adviser representative of the firm.", "c": "an agent registered with an affiliated broker-dealer.", "d": "supervisory personnel of the firm.", "e": "The CCO of an investment adviser is responsible for compliance with all relevant rules and procedures applying to all personnel."}, {"n": 10, "q": "A federal covered registered investment adviser who receives compensation for advice and whose business is primarily as an investment adviser may describe its business as investment counsel if", "a": "a substantial part of his business is providing investment supervisory services", "b": "it maintains custody of customer funds and/or securities", "c": "it maintains its registration by filing an updating amendment to its Form ADV annually", "d": "it receives SEC approval to use the definition", "e": "The Investment Advisers Act of 1940 prohibits the use of the term investment counsel, unless the principal business is as an investment adviser and a substantial part is providing investment supervisory services."}, {"n": 11, "q": "According to the Investment Advisers Act of 1940, the SEC must either grant investment adviser registration or begin proceedings to determine whether registration should be denied within how many days of filing?", "a": "45", "b": "90", "c": "60", "d": "30", "e": "The SEC is required by the Investment Advisers Act of 1940 to either grant registration or begin proceedings within 45 days of application."}, {"n": 12, "q": "Included in the Investment Advisers Act of 1940 are a number of different recordkeeping requirements. Wealth Preservation Specialists is a covered adviser that is organized as a partnership. If the firm were to dissolve, partnership agreements must be kept for", "a": "3 years after the dissolution", "b": "5 years after the dissolution", "c": "5 years from the date of organization", "d": "the lifetime of the firm", "e": "Both the Investment Company Act of 1940 and the NASAA Model Rule on Recordkeeping require that investment advisers maintain certain records for a period of no less than 3 years after dissolution."}, {"n": 13, "q": "Registration as an investment adviser is required for any firm in the business of giving advice on the purchase of", "a": "gold coins", "b": "apartments undergoing a conversion to condominiums", "c": "convertible bonds", "d": "rare convertible automobiles", "e": "Only those individuals in the business of giving advice on securities are required to register as investment advisers; only the convertible bonds are securities."}, {"n": 14, "q": "John Law is the owner of Mississippi Advisory Services (MAS), an independent financial planning organization. Law is registered as an investment adviser representative of SSC Securities and Investments, registered as a broker-dealer, and an investment adviser with the SEC. Supervision over Law's advisory activities is the responsibility of", "a": "MAS’s CCO.", "b": "SSC’s CCO.", "c": "John Law.", "d": "the SEC.", "e": "It is common for independent financial planners to establish their own business entity and hang their registration as an IAR with another firm."}, {"n": 15, "q": "In which of the following cases could revocation of the registration of an IAR lead to disciplinary action against the investment adviser employing that individual?", "a": "The IAR was found guilty of first degree murder.", "b": "The IAR failed to make full disclosure of a previous felony conviction on the Form U4.", "c": "The firm supplied the IAR with a copy of its Code of Ethics and administered regular training on its contents.", "d": "The firm was found guilty of failure to supervise.", "e": "In most cases, disciplinary action against an investment adviser representative will not have a direct impact on the investment advisory firm."}, {"n": 16, "q": "Leslie is an IAR with Financial Visions (FV), a federal covered investment adviser. Leslie operates Innovative Financial Solutions (IFS), a separate financial planning company with its own office in State W. Should Leslie be found guilty of fraudulent business activities, FV would", "a": "be immune from State W’s Administrator’s jurisdiction because it is a federal covered adviser.", "b": "claim that IFS is a separate entity over which FV has no responsibility.", "c": "be subject to possible disciplinary action brought by the State W Administrator if it could be shown that FV failed to supervise Leslie’s activities.", "d": "possibly have its State W registration suspended.", "e": "Under the doctrine of respondeat superior, an investment adviser is responsible for the actions of any of its registered IARs, even independent contractors."}, {"n": 17, "q": "Which of the following statements regarding the SEC's power to revoke the registration of an investment adviser is TRUE?", "a": "If it is determined that an investment adviser is insolvent, the SEC may revoke the registration.", "b": "An investment adviser receiving substantial prepayment of fees from 50% of its clients that fails to include a copy of its balance sheet in its brochure delivered to all clients would give the SEC cause for beginning revocation proceedings.", "c": "Revocation would occur, with appropriate notice, when a firm’s annual updating amendment was received by the SEC 120 days after the end of the registrant’s fiscal year.", "d": "Failure to adequately supervise a person associated with the adviser could be cause for the SEC to revoke the firm’s registration.", "e": "Failure to supervise, if proven, is one of the most common causes for disciplinary action against a broker-dealer or investment adviser."}, {"n": 18, "q": "The Investment Advisers Act of 1940 requires every registered investment adviser to have a chief compliance officer (CCO). This individual would be responsible for ensuring compliance with the firm's Code of Ethics by all of these EXCEPT", "a": "clerical and ministerial employees of the firm", "b": "investment adviser representatives employed by the firm", "c": "a nonaffiliated broker-dealer through whom the majority of the firms trades are executed", "d": "investment adviser representatives who are independent contractors", "e": "The CCO is responsible for compliance with the firm's Code of Ethics by every employee, registered or not."}, {"n": 19, "q": "Under the Uniform Securities Act, which of the following is an investment adviser?", "a": "Tom writes a newspaper column that analyzes and recommends securities.", "b": "Jane advises customers regarding the value of gold and silver coins.", "c": "The Trust Department of ABC Bank provides investment advice to its clients.", "d": "Jill is an attorney specializing in estate planning who, as a side job, structures portfolios for the beneficiaries of her deceased clients at a reduced fee.", "e": "A firm with no office in the state that provides investment advice is an investment adviser in the state if its clients exceed the de minimis level of five noninstitutional clients."}, {"n": 20, "q": "To register a sole proprietorship as an investment adviser in a state, the application for initial registration (Form ADV) must be filed with the appropriate party. This application must include all of the following except", "a": "the appropriate fees.", "b": "a consent to service of process.", "c": "any information to be furnished or disseminated to any client or prospective client.", "d": "a copy of the articles of incorporation for the business.", "e": "Articles of incorporation only apply to corporations. To register as an investment adviser in a state, Form ADV is filed with the Administrator."}, {"n": 21, "q": "Under the Uniform Securities Act, which of the following qualifies as an investment adviser representative?", "a": "An agent who offers incidental advice on securities as part of his sales commissions", "b": "An individual who renders fee-based advice on precious metals", "c": "A solicitor for an investment advisory firm who is paid a fee for his services", "d": "An employee, although highly skilled in evaluating securities, solely performs administrative or clerical functions for an investment adviser", "e": "If the goal is obtaining clients for the investment adviser, a solicitor is considered an investment adviser representative under the Uniform Securities Act."}, {"n": 22, "q": "The final responsibility for ensuring that investment adviser representatives are adequately supervised is that of", "a": "the managing principal.", "b": "the Administrator.", "c": "the chief compliance officer.", "d": "each investment adviser representative’s immediate supervisor.", "e": "It is the CCO who has the ultimate responsibility for ensuring that the firm has adequate supervisory procedures."}, {"n": 23, "q": "Under the Uniform Securities Act, if no denial or proceedings are pending, when does an investment adviser registration become effective?", "a": "When the Administrator so orders, but not to exceed 90 days", "b": "When the Administrator so orders, but not to exceed 30 days", "c": "No sooner than 15 days", "d": "60 days after application or an amendment is filed", "e": "Registrations become effective at noon on the 30th calendar day after the date of filing if there are no denial orders or pending proceedings."}, {"n": 24, "q": "Kapco Advisers, a federal covered investment adviser operating on a calendar-year basis, published a list of recommended securities in January 2015. A copy of this must be maintained until at least", "a": "January 31, 2020", "b": "January 31, 2017", "c": "December 31, 2017", "d": "December 31, 2020", "e": "Investment adviser records, including copies of advertisements, must be kept for at least 5 years from the end of the fiscal year."}, {"n": 25, "q": "The primary responsibility for supervising the activities of an investment adviser representative who is affiliated with a federal covered investment adviser lies with", "a": "the investment adviser representative", "b": "the investment adviser the IAR represents", "c": "the SEC", "d": "the Administrator", "e": "It is the obligation of every registered investment adviser to supervise its representatives."}]}, {"id": 90, "name": "Series 65 Domain 4 (Quiz 2): Laws, Regulations, and Guidelines, including Prohibition on Unethical Business Practices", "key": "BBCACAABDDCADDBDDBDAADBBA", "questions": [{"n": 1, "q": "Which of the following does NOT meet the compensation test for defining investment advisers under SEC Release 1A-1092?", "a": "An insurance agent sells a life insurance policy and receives a commission on that policy. During the sale of the insurance policy, the agent provides some securities investment advice", "b": "Your next-door neighbor recommends the purchase of a certain security from his broker, which you eventually do", "c": "Subscription payments received by a publisher of a newsletter providing impersonal securities-related advice", "d": "A real estate agent advertises that she will give free advice regarding investing the proceeds from the sale of any home she lists", "e": "Compensation may take the form of fees, payments for subscriptions, salaries, or commissions. Compensation does not have to be direct."}, {"n": 2, "q": "A person is excluded from the definition of investment adviser under the Investment Advisers Act of 1940 if the investment advice and reports are restricted to", "a": "securities listed on a national stock exchange", "b": "U.S. government securities", "c": "bank and insurance company securities", "d": "foreign securities", "e": "Among the exclusions found in the act is one for persons whose advice relates exclusively to securities issued or guaranteed by the U.S. government."}, {"n": 3, "q": "Which of the following is required to register in a state under the Uniform Securities Act?", "a": "ABC State Bank, which provides investment advice in its branches throughout the state", "b": "A broker-dealer who has no place of business in the state and whose only clients in the state are limited to insurance companies, banks, and broker-dealers", "c": "An investment adviser who has a place of business in the state and whose only clients in the state are insurance companies, banks, and broker-dealers", "d": "An investment adviser who has no place of business in the state and communicates with only 5 advisory clients in the state for the year", "e": "Because the investment adviser has a place of business within the state and is acting as investment adviser in the state, it must register, regardless of the fact that the only clients are financial institutions."}, {"n": 4, "q": "Written policies and procedures reasonably designed to safeguard customer information from cyber security threats would include all of the following EXCEPT", "a": "maintaining the minimum required cybersecurity insurance coverage.", "b": "encrypting personally identifiable information.", "c": "conducting periodic risk assessments.", "d": "implementing a firewall.", "e": "All of these choices are important components of a cybersecurity program. However, there is no minimum insurance coverage specified by any of the regulatory bodies."}, {"n": 5, "q": "The USA provides either an exclusion from the definition or an exemption from registration as an investment adviser for certain persons. Which of the following would be required to register?", "a": "A bank trust officer with less than $250 million in assets under management", "b": "A teacher who teaches a course in the local high school on consumer economics", "c": "A CFP® who provides a full range of financial planning to clients on a fee-only basis", "d": "An engineer employed by an oil company selling limited partnership interests to public investors who provides estimates of recoverable reserves", "e": "Unless excluded or exempted, anyone charging a fee for investment advice must register. Banks and their employees are excluded."}, {"n": 6, "q": "Under the SEC Release IA-1092, who of the following would be considered to be in the business of rendering investment advice?", "a": "A financial planner who charges no fee for developing a financial plan, but takes commissions on recommended trades", "b": "An accountant who provides investment advice to clients as an incidental part of the business", "c": "An agent who receives no separate compensation for investment advice but who takes commissions on recommended trades", "d": "An individual who provides investment advice to family members, but receives no compensation", "e": "A financial planner who takes commissions from a broker-dealer on recommended trades is considered to be compensated for giving advice."}, {"n": 7, "q": "Under the Uniform Securities Act, which of the following statements relating to the registration requirements of investment advisers is TRUE?", "a": "A registration becomes effective at noon, 30 days after the application has been filed, providing the registration is not in the process of denial.", "b": "If an amendment to the registration is subsequently filed, the registration becomes effective 15 days after the amendment is filed.", "c": "Registrations of securities professionals expire 1 year after their effective date, unless renewed.", "d": "A registration is automatically effective at noon, 30 days after the application has been filed.", "e": "A registration is effective at noon, 30 days after the application has been filed if there is no denial or stop order in process."}, {"n": 8, "q": "After diligently studying the Kaplan course, Greg Gossett completed the series of exams for the Certified Financial Planner (CFP®) designation. Now, Greg would like to expand his horizons by becoming a registered investment adviser. In order to do so, Greg would have to do all of the following EXCEPT", "a": "pay a filing fee", "b": "pass the Series 65 examination", "c": "provide a consent to service of process", "d": "submit a Form ADV", "e": "There are several professional qualifications that qualify for a waiver of the examination. CFP is one of them."}, {"n": 9, "q": "A consent to service of process required by an Administrator is", "a": "a formal statement declaring that an investment adviser will comply with all advertising requirements of the USA", "b": "an agreement to perform all services and duties that the Uniform Securities Act (USA) requires of those individuals covered by the USA", "c": "an agreement whereby a registrant will be bound by any legal action or subpoena served on the Administrator as if it had been served on the registrant", "d": "a legal procedure that authorizes the Administrator to issue injunctions", "e": "A consent to service is a formal legal agreement whereby a registrant will be bound by a legal action or subpoena served on the Administrator."}, {"n": 10, "q": "When filing the consent to service of process, which of the following is TRUE?", "a": "It must be filed annually on the dates specified by the Administrator.", "b": "It is not required of investment adviser representatives, only investment advisers.", "c": "It expires simultaneously with the registration on December 31.", "d": "It is supplied with the initial registration and remains on file permanently.", "e": "The consent to service of process is supplied with the initial registration and remains on file permanently."}, {"n": 11, "q": "Peterson Financial Planning is a small personal financial planning partnership in Missouri that has $10 million in assets under management. As a result of the Dodd-Frank Act, which of the following statements best describes the registration requirement for Peterson Financial Planning?", "a": "Peterson Financial Planning is required to register as an investment adviser with the SEC but has no requirement to register with the Administrator of the Missouri Department of Securities.", "b": "Peterson Financial Planning is required to register as an investment adviser with the SEC and to notify the Administrator of the Missouri Department of Securities of its operation.", "c": "Peterson Financial Planning is required to register as an adviser with the Administrator of the Missouri Department of Securities.", "d": "Peterson is required to register as an adviser with both the SEC and the Administrator of the Missouri Department of Securities.", "e": "With less than $25 million under management, the adviser is considered small and must register with the state."}, {"n": 12, "q": "Which of the following investment advisers, with no place of business in the state, does not qualify for the de minimis exemption?", "a": "An investment adviser who, during the preceding twelve-month period, has had no more than 6 retail clients.", "b": "An investment adviser who, during the preceding twelve-month period, has had 5 or fewer retail clients.", "c": "An investment adviser who, during the preceding twelve-month period, has had fewer than 6 retail clients.", "d": "An investment adviser who, during the preceding twelve-month period, has had no more than 5 retail clients.", "e": "The de minimis exemption limits the number of retail clients to a maximum of 5 during the preceding 12 months."}, {"n": 13, "q": "A pension consultant who advises corporate retirement plans with assets of $135 million must register with which of the following?", "a": "SEC", "b": "Either the state or the SEC", "c": "Both the state and the SEC", "d": "The state", "e": "Under the Dodd-Frank Bill, until a pension fund manager has at least $200 million in AUM, registration with the states is required."}, {"n": 14, "q": "Foster Advisers, based in New Jersey, manages $135 million in funds for New Jersey-based clients. As a result of the Dodd-Frank Wall Street Reform and Consumer Protection Act, which of the following statements best describes the registration requirement for Foster Advisers?", "a": "Foster Advisers is required to register as an adviser with the SEC and has no requirement to notify the Administrator of the New Jersey Department of Securities.", "b": "Foster Advisers is required to register with both the SEC and the Administrator of the New Jersey Department of Securities.", "c": "Foster Advisers is required to register with the Administrator of the New Jersey Department of Securities.", "d": "Foster Advisers is required to register as an adviser with the SEC and notify the Administrator of the New Jersey Department of Securities of its operation.", "e": "Since the enactment of the Dodd-Frank Act, investment advisers with $110 million or more in assets under management must register with the SEC."}, {"n": 15, "q": "Defalcator Investment Planning (DIP) has $175 million in AUM and has offices in States A, K, and R. DIP would be required to provide a balance sheet as part of its brochure if it charged fees of", "a": "$1,200 for the next 6 months of advisory service.", "b": "$1,500 for the next year’s advisory service.", "c": "$1,500 for the next 3 months of advisory service.", "d": "$600 for the next 6 months of advisory service.", "e": "Federal covered investment advisers who charge substantial prepayment of advisory fees must include a balance sheet with their brochure. The definition is more than $1,200, 6 or more months in advance."}, {"n": 16, "q": "A broker-dealer is NOT considered an investment adviser if", "a": "the firm has less than 15 advisory accounts totaling less than $1 million", "b": "the firm's investment advice is limited to 10 or fewer people", "c": "the firm is registered under the Investment Advisers Act of 1940", "d": "the investment advisory services are incidental to the broker-dealer's business and no special compensation is received", "e": "Excluded from the definition of investment adviser are financial institutions, publishers, investment adviser representatives, and certain professionals."}, {"n": 17, "q": "A state-registered investment adviser maintains custody of client funds and securities. On Thursday, the chief financial officer of the firm informs the chief compliance officer that their net worth is $31,578. Under the provisions of the Uniform Securities Act, the firm would", "a": "need to increase the amount of their surety bond", "b": "do nothing, as their net worth is far in excess of the minimum requirement of $10,000", "c": "send a detailed financial report to the Administrator by the close of business Friday", "d": "send a detailed financial report to the Administrator by the close of business Monday", "e": "A state-registered investment adviser who maintains custody of client assets must maintain net worth of at least $35,000 or a bond of the same amount."}, {"n": 18, "q": "With regard to the keeping of records, the Uniform Securities Act states that investment advisers must keep records for", "a": "5 years", "b": "5 years, the first 2 in the principal office of the adviser", "c": "3 years", "d": "3 years, the first 2 in the principal office of the adviser", "e": "For state-registered investment advisers, records must be kept for a total of 5 years. For the first 2 of those years, they must be located in the principal office."}, {"n": 19, "q": "An investment adviser to a private fund wishes to qualify for the exemption offered under the Uniform Securities Act when the fund has no more than 100 investors. In order to qualify,", "a": "the private fund adviser must have less than $110 million in private fund assets under management", "b": "the fund’s outstanding securities are owned exclusively by persons who, at the time of acquisition of such securities, are individuals with at least $5 million in investments", "c": "neither the private fund adviser nor any of its advisory affiliates have been convicted of a felony within the past 12 years", "d": "every investor must have either at least 1millioninassetsmanagedbytheinvestmentadviser,oranetworth,excludingthevalueoftheprimaryresidence,inexcessof2.1 million", "e": "The 100 or less investors is technically known as advising a 3(c)(1) issuer. The $5 million is the requirement under federal law for a 3(c)(7) fund."}, {"n": 20, "q": "MidWest Advisory Services has $175 million in assets under management and has offices in 10 Midwest states. Regarding recordkeeping requirements, MidWest must meet those of", "a": "the SEC.", "b": "each state in which it has a place of business", "c": "the state in which its principal office is located", "d": "the state with the most stringent financial requirements", "e": "With $175 million in AUM, MidWest is a federal covered adviser. All financial requirements are those of the SEC, not any of the states."}, {"n": 21, "q": "Under the Uniform Securities Act, if not denied, an application for registration as investment adviser will generally become effective how soon after filing?", "a": "30 days", "b": "15 days", "c": "Immediately", "d": "10 days", "e": "If not denied and no disciplinary proceedings are instituted, an application for registration becomes effective at noon on the 30th day."}, {"n": 22, "q": "Under the Investment Advisers Act of 1940, who is not excluded from the definition of investment adviser when their investment advice is solely incidental to the individual's profession?", "a": "Engineers", "b": "Teachers", "c": "Attorneys", "d": "Insurance agents", "e": "The persons excluded from the definition of investment adviser when advice is provided solely incidental to their profession include lawyers, accountants, engineers, and teachers."}, {"n": 23, "q": "Under the Investment Advisers Act of 1940, the exclusion for providing investment advice that is solely incidental to the practice of a profession is NOT available to", "a": "teachers", "b": "real estate agents", "c": "attorneys", "d": "engineers", "e": "In the Investment Advisers Act of 1940, there is no specific exemption for real estate agents who give investment advice."}, {"n": 24, "q": "An investment adviser sends a notice offering a research report she has recently prepared to a group of 25 new members of the local Lions Club. Under the NASAA Model Rule on recordkeeping for investment advisers, the firm must keep a copy of the notice along with", "a": "the date the Administrator approved the research report", "b": "a memorandum describing the list and its source", "c": "a copy of the full roster of the local chapter", "d": "the names of those members to whom the report was sent", "e": "If an investment adviser sends any notice or advertisement to more than 10 persons, the investment adviser shall not be required to keep a record of the names and addresses of the persons to whom it was sent, with certain exceptions."}, {"n": 25, "q": "If a federal covered adviser's fiscal year ends on November 30, 2017, it must file its annual updating amendment to its Form ADV no later than", "a": "February 28, 2018", "b": "March 30, 2018", "c": "December 31, 2017", "d": "January 18, 2018", "e": "The annual updating amendment to Form ADV must be filed within 90 days of the adviser's fiscal-year end."}]}, {"id": 91, "name": "Series 65 Domain 4 (Quiz 3): Laws, Regulations, and Guidelines, including Prohibition on Unethical Business Practices", "key": "BBDACCBAACAABACAAADCCACAA", "questions": [{"n": 1, "q": "Under all of the following circumstances, the USA requires investment advisers with no place of business in the state to register EXCEPT", "a": "when an adviser only provides investment advice to 401(k) plans with assets of $250,000 or more", "b": "when an adviser only provides advice to registered investment companies", "c": "when an adviser has maintained assets of $100 million or more for 7 out of the last 10 years", "d": "when an adviser with numerous clients in the state has not been subject to disciplinary action within any state within the last 10 years", "e": "An adviser that only provides investment advice to investment companies registered under the Investment Company Act of 1940 is federal covered."}, {"n": 2, "q": "Under the Uniform Securities Act, investment advisers are exempt from registration in a state where they have no office if they direct business communications with no more than 5 retail clients within", "a": "6 months", "b": "12 months", "c": "30 days", "d": "2 years", "e": "If investment advisers have no office in a state, they are not defined as investment advisers and are exempt from registration if certain conditions apply."}, {"n": 3, "q": "What is the official designation of the person or agency that enforces the USA in each state?", "a": "Issuer", "b": "Registrar", "c": "Transfer agent", "d": "Administrator", "e": "The USA specifies that a state's securities Administrator has the authority to enforce the act in that state."}, {"n": 4, "q": "Which of the following persons are included in the definition of investment adviser?", "a": "A publisher of a bona fide newspaper, news magazine, or business or financial publication of general and regular circulation", "b": "A financial planner or other person that provides investment advisory services to others for compensation", "c": "A bank whose deposits are insured by the FDIC", "d": "Any person that the Administrator excludes by rule or order", "e": ""}, {"n": 5, "q": "There are a number of exclusions from the definition of investment adviser. Which of the following would NOT qualify for an exclusion under the Uniform Securities Act?", "a": "An accountant who conducts seminars on the tax benefits of contributing to IRAs, both traditional and Roth", "b": "A lawyer who charges an hourly fee for preparing trust documents for individuals referred to her by an investment adviser", "c": "A teacher at the local high school who receives nominal compensation for giving investment advice to engineers", "d": "A financial planner who conducts seminars for the local PTA, where he presents the benefits of term life insurance", "e": "The LATE exclusion applies when advice is given by one of the listed professionals on an incidental basis."}, {"n": 6, "q": "The Uniform Securities Act's definition of investment adviser would include", "a": "An investment adviser representative of an advisory firm who makes securities recommendations on a regular basis for compensation", "b": "Any person who is a federal covered investment adviser", "c": "A person who, on a regular basis for compensation, offers specific investment advice to clients as to the value of securities", "d": "A temporary employee hired to assist in administrative responsibilities of an advisory firm", "e": "A person who, on a regular basis for compensation, offers specific investment advice to clients meets the 3-prong test as an investment adviser."}, {"n": 7, "q": "Under the Uniform Securities Act, which of the following persons has to register as an investment adviser?", "a": "An agent of a broker-dealer who gives investment advice within the course of his duties with the firm for which a fee is charged", "b": "A broker-dealer who gives advice for which he charges a specific fee", "c": "A broker-dealer who gives investment advice that is incidental to the course of its business and for which no special compensation is received", "d": "An attorney who writes a legal opinion for a municipal bond indenture", "e": "Broker-dealers need not register as investment advisers unless they charge a separate fee for providing investment advice."}, {"n": 8, "q": "Which of the following would have to register as an investment adviser under the Uniform Securities Act?", "a": "A retired aeronautical engineer who charges a nominal fee for holding seminars on opportunities in aerospace stocks", "b": "An accountant who advises clients about investments as an incidental part of services", "c": "An economics professor who occasionally gives a lecture to business groups about the stock market", "d": "A trust company", "e": "Excluded from the definition are banks, publishers of general paid circulation publications, investment adviser representatives, and certain professionals."}, {"n": 9, "q": "An investment adviser has its home office in Wisconsin. Its only business is with trust companies, large employee benefit plans, and insurance companies. It has no place of business in Colorado but provides investment advice to two Denver banks, both chartered under Colorado banking laws. There is a new Administrator in Colorado, and it is his opinion that this IA should be required to register in his state. A careful reading of Section 201 of the Uniform Securities Act would indicate that", "a": "the firm does not have to register because it has no place of business in the state and its only clients are registered financial institutions", "b": "the Administrator is correct and the firm must register", "c": "as long as the IA does not have an office in Colorado, there are no conditions that would mandate registration there", "d": "this firm would be exempt from registration with the Colorado Administrator because it is doing business in more than one state", "e": "Section 201 of the Uniform Securities Act specifies the conditions under which one is an investment adviser in the state."}, {"n": 10, "q": "The Uniform Securities Act would NOT provide an exemption from registration as an investment adviser to an investment adviser who", "a": "has no place of business in the state and limits clientele to banks and insurance companies", "b": "has no place of business in the state and limits clientele to broker-dealers", "c": "is an out-of-state investment adviser and directed business communications to fewer than 12 clients in the state in the past 12-month period", "d": "has no place of business in the state and limits clientele to other investment advisers", "e": "An adviser is exempt from state registration if it has no place of business in the state and limits clientele to certain institutional customers."}, {"n": 11, "q": "Under the USA, a person who is in the business of providing advice on trading futures contracts in addition to advising clients on securities issued or guaranteed by the U.S. government is", "a": "not required to be a registered investment adviser in the state", "b": "required to be a registered investment adviser representative in the state", "c": "required to be a registered agent in the state", "d": "required to be a registered investment adviser in the state", "e": "This question is referring to a federal covered adviser. The Investment Advisers Act of 1940 specifically excludes from the definition anyone whose securities advice is confined to securities issued or guaranteed by the Treasury."}, {"n": 12, "q": "Under the Uniform Securities Act, which of the following statements is TRUE about an investment adviser who does not have an office in a state and solicits no more than 5 clients in that state?", "a": "He is not required to register as an investment adviser in that state.", "b": "He is not liable for violations of the antifraud provisions.", "c": "He is exempt from the advertising requirements in the state.", "d": "He must file a consent to service of process.", "e": "Investment advisers who have no place of business within the state are not defined as investment advisers if they have no more than 5 clients within the state in a 12-month period."}, {"n": 13, "q": "Under the Uniform Securities Act, an investment adviser would be exempt from registration in a state in which he has no place of business if he", "a": "is registered as a broker-dealer", "b": "had no more than 5 clients in that state within the past 12 months", "c": "had no more than 10 clients in that state within the past 12 months", "d": "had no more than 15 clients in that state within the past 12 months", "e": "An adviser who had no more than 5 clients in a state within the prior 12-month period or deals exclusively with institutions is not required to register."}, {"n": 14, "q": "Which of the following persons must register as an investment adviser under the Uniform Securities Act?", "a": "An investment adviser who only serves institutional clients and whose only office is in this state", "b": "An accountant who makes no pretense of providing investment advisory services but gives incidental advice to clients as a small part of accounting services provided", "c": "An investment adviser representative with no place of business in the state who has dealt with 7 retail clients during the most recent 12 month period", "d": "An investment adviser whose advice is limited to securities issued or guaranteed by the U.S. government and who has 3 places of business in the state", "e": "The Uniform Securities Act requires those defined as investment advisers to register with the state. Accountants are excluded when their advice is incidental."}, {"n": 15, "q": "Alpha-Beta Advisers (ABA) has its principal office in State X. ABA limits its clientele to insurance companies that are authorized to do business in State X. Which of the following best describes the registration requirements for ABA?", "a": "Both the SEC and State X", "b": "SEC only", "c": "State X only", "d": "Neither the SEC nor State X", "e": "Dealing exclusively with insurance companies makes this advisory firm exempt from registering with the SEC. However, it is not a federal covered adviser."}, {"n": 16, "q": "Registration with the state as an investment adviser would be required for a person with an office in this state who", "a": "manages $13 million in assets for 4 clients", "b": "only gives advice on securities issued by or guaranteed by the government of the United States", "c": "manages the portfolio of the KPF Balanced Fund, a registered open-end investment company with $22 million in net assets", "d": "serves as a pension consultant to the XYZ Employees Retirement Plan, covering 1,200 employees with total assets of $278 million", "e": "Under the Dodd-Frank Bill, investment advisers with less than $100 million in AUM must register with the states."}, {"n": 17, "q": "Who of the following is not exempt from registration as an investment adviser under the Investment Advisers Act of 1940?", "a": "An adviser, with total AUM of $125 million, specializing in stocks listed on the New York Stock Exchange, whose only place of business is in State F and whose only clients are 110 State F resident individuals", "b": "An adviser to seven private funds with total assets under management in the U.S. of $125 million", "c": "An adviser whose clientele consists solely of insurance companies", "d": "An adviser whose only office is in State G who deals only with State G residents, none of whom is a private fund, and does not deal in securities listed on any national securities exchange", "e": "The intrastate exemption has no numerical limitation, only that all clients be residents of the state and none be private funds."}, {"n": 18, "q": "Which of the following parties is most likely to be considered an investment adviser under the Investment Advisers Act of 1940?", "a": "A CPA who manages investment accounts for 50 clients and charges hourly fees for the service", "b": "Dow Jones, Inc., publisher of The Wall Street Journal", "c": "An expert in fixed-income securities whose only clients are individuals and whose only recommendations deal with securities issued or guaranteed by the U.S. Treasury", "d": "The trust department of Citibank, which handles billions of dollars in trust assets", "e": "The Investment Advisers Act of 1940 excludes accountants providing investment advice when the advice is given on an incidental basis and with no specific compensation."}, {"n": 19, "q": "Under the Uniform Securities Act, all of the following persons with no place of business in the state are exempt from registration as an investment advisers EXCEPT", "a": "advisers who deal exclusively with federal covered investment advisers located in the state", "b": "advisers who deal exclusively with savings banks located in the state", "c": "advisers who deal exclusively with investment companies registered under the Investment Company Act of 1940", "d": "advisers who have conducted business with no more than 6 individual clients in the state within the last 12 months", "e": "The de minimis rule for a registered investment adviser with no place of business in the state is fewer than 6 clients."}, {"n": 20, "q": "Under the Uniform Securities Act, all of the following persons may provide investment advice incidental to their normal business without requiring registration as an investment adviser EXCEPT", "a": "an engineer", "b": "a lawyer", "c": "an economist", "d": "a teacher", "e": "The Uniform Securities Act does not grant an economist exemption from registration, but it does offer an exemption to teachers, lawyers, and engineers."}, {"n": 21, "q": "Long-Term Financial Solutions, Inc. (LTFSI), an investment adviser registered in five states, files a Form ADV-W indicating the business is closing. It is being acquired by another federal covered adviser, Gold and Sylver Advisers, LLC. Which of the following statements is correct?", "a": "Gold and Sylver will not have to amend their Form ADV Part 1 until the filing of their annual updating amendment.", "b": "Gold and Sylver must notify all clients of LTFSI that their advisory contracts have been assigned.", "c": "LTFSI is responsible for ensuring that a copy of the LTFSI corporate charter is preserved for at least three years after the acquisition.", "d": "As the successor firm, Gold and Sylver Advisers must keep copies of the LTFSI corporate charter for at least three years after LTFSI’s acquisition.", "e": "When an investment adviser ceases to exist, articles of incorporation, charters, minute books, and stock certificate books must be preserved until at least three years after termination."}, {"n": 22, "q": "Reticent Asset Management (RAM) is claiming an exemption from registration with the state because it is an adviser to private funds. One of the requirements to qualify for this exemption is", "a": "all investors must be qualified clients.", "b": "private fund assets under management cannot exceed $110 million.", "c": "all investors must be accredited.", "d": "there can be no more than 10 investors during any 12-month period.", "e": "On the state level, the exemption requires that all investors meet the USA's definition of qualified client."}, {"n": 23, "q": "A state-registered investment adviser suddenly incurs a liability that materially affects its net worth, causing it to drop below the required minimum. Which of the following statements is TRUE?", "a": "The investment adviser must notify the Administrator promptly.", "b": "The ​investment adviser ​must increase its surety bond to make up the deficiency.", "c": "The​ ​investment adviser must notify the Administrator​ by the close of business on the following business day​.", "d": "The ​investment adviser is not required to file​ ​an amendment to its registration with the Administrator.", "e": "Unless otherwise exempted, every investment adviser shall by the close of business on the next business day notify the Administrator if net worth is less than the minimum required."}, {"n": 24, "q": "Under the Uniform Securities Act, which of the following investment advisers with no place of business in the state must register with the state as an investment adviser?", "a": "An adviser rendering advice to no more than 10 individual clients within a 12-month period", "b": "An adviser rendering advice solely to broker-dealers", "c": "An adviser rendering advice to employee benefit plans with at least $1 million in assets", "d": "An adviser managing more than $110 million in assets", "e": "An investment adviser with no office in the state would be exempt from registration if the adviser renders advice to no more than 5 noninstitutional clients in a 12-month period."}, {"n": 25, "q": "Form PF must be filed by", "a": "SEC-registered advisers with at least $150 million in private fund assets under management", "b": "SEC-exempt reporting advisers", "c": "SEC-registered advisers with no more than $150 million in private fund assets under management", "d": "state-registered private fund managers, regardless of the amount of assets under management", "e": "Form PF is the form used by those private fund managers who are registered with the SEC and whose private fund AUM reaches or exceeds the $150 million threshold."}]}, {"id": 92, "name": "Series 65 Domain 4 (Quiz 4): Laws, Regulations, and Guidelines, including Prohibition on Unethical Business Practices", "key": "BDBCDDBABDBAAAAADACACBCDD", "questions": [{"n": 1, "q": "A discussion referring to blue-sky laws would include all of the following EXCEPT", "a": "forms requiring issuers selling securities in the state to comply with state securities laws", "b": "the Securities Act of 1933 and Securities Exchange Act of 1934", "c": "a state securities law that grants state securities Administrators the power to deny or revoke a broker-dealer's or an agent's registration within its state", "d": "state laws that are designed to protect the public against fraud in securities sales within a state", "e": "Blue-sky laws are state securities laws. The Securities Act of 1933 and the Securities Exchange Act of 1934 are federal securities laws."}, {"n": 2, "q": "Which of the following must register as an investment adviser under the Investment Advisers Act of 1940?", "a": "A person who provides advice to people who are investing in coin collections", "b": "A person who provides advice to insurance companies on their portfolios", "c": "A person who provides advice to people who are investing in antique furniture", "d": "A person who provides advice to people who are investing in mutual funds registered under the Investment Company Act of 1940", "e": "Investment advisers are defined as any person who, for compensation, engages in the business of advising others concerning the purchase or sale of securities."}, {"n": 3, "q": "The SEC requires investment advisers registered under the Investment Advisers Act of 1940 to maintain certain books and records for a minimum of", "a": "3 years", "b": "5 years", "c": "1 year", "d": "6 years", "e": "Investment advisers must keep most records for 5 years from the end of the fiscal year in which the record was created."}, {"n": 4, "q": "Which of the following is specifically excluded from the definition of an investment adviser providing the investment advice is solely incidental to the business in which the person is engaged?", "a": "Pension manager", "b": "Movie star's business manager who handles the star's investment portfolio", "c": "Industrial engineer", "d": "Sports representative who advises on securities for a fee", "e": "Lawyers, accountants, engineers, teachers, and broker-dealers whose advice is incidental to their profession are excluded from the definition."}, {"n": 5, "q": "Under the provisions of the Uniform Securities Act, it is NOT necessary for an investment adviser to register when it", "a": "has a place of business in the state but deals exclusively with federal covered advisers", "b": "has a place of business in the state but has conducted business with 3 individual investors during the preceding 12 consecutive months", "c": "is headquartered in a state where it conducts most of its business with broker-dealers only", "d": "has no place of business in the state and deals with savings and loan associations only", "e": "An adviser who has no place of business in the state and deals only with savings and loan associations is not required to register."}, {"n": 6, "q": "A federal covered IA files a petition for bankruptcy. The firm must", "a": "notify all of its clients immediately", "b": "notify the Administrator immediately", "c": "do nothing until the court decides the disposition of the firm's assets", "d": "notify the SEC immediately", "e": "As a federal covered investment adviser, the responsible regulatory body is the SEC."}, {"n": 7, "q": "Under the Uniform Securities Act, who must register as an investment adviser?", "a": "A financial planner with no place of business in a state and who advises only trust companies", "b": "A registered broker-dealer who receives compensation for providing investment advice", "c": "A bank that provides investment advice", "d": "An accountant who provides advice solely incidental to the business", "e": "Registered broker-dealers that provide advice only incidentally to their business are exempt from the definition if they do not receive compensation."}, {"n": 8, "q": "The sole proprietor of an insurance business that exclusively provides advice on fixed-income annuity contracts", "a": "need not register under any securities laws", "b": "must register as an investment adviser under the Investment Advisers Act of 1940", "c": "must register as an investment adviser representative under the USA", "d": "must register as a broker-dealer with the SEC", "e": "The sole proprietor of an insurance business need not register under the Uniform Securities Act. He provides advice on fixed-income annuities only, which are not securities."}, {"n": 9, "q": "An investment adviser with no place of business in the state is exempt from registration with the state when making recommendations to all of the following EXCEPT", "a": "AAA Manufacturing Co., with respect to the quality of investment bankers available for an underwriting of AAA securities", "b": "when the recommendations are made exclusively to individual residents of the state who are accredited investors regarding new issues of exempt securities not registered in that state", "c": "St. Amelia's college endowment fund", "d": "Amalgamated Bank", "e": "An investment adviser with no place of business in the state is not exempt from registration when making recommendations to individual accredited investors who are residents of that state."}, {"n": 10, "q": "Under the Investment Advisers Act of 1940, which of the following is considered an investment adviser?", "a": "A person who publishes a regular newsletter of advice on U.S. Treasury bonds and other U.S. government securities", "b": "The trust officer of a commercial bank who manages investment accounts for clients", "c": "A syndicated columnist who gives weekly reports and recommendations on investments", "d": "A lawyer who specializes in consulting on investing in securities", "e": "Publishers and writers of general, regular, paid circulation publications are excluded from the definition of investment adviser."}, {"n": 11, "q": "Federally registered investment advisers are obligated to maintain certain books and records as specified by the SEC. Which of the following statements regarding adviser recordkeeping is NOT true?", "a": "Records originally created on computer may be stored in electronic media.", "b": "Records must be kept for 6 years.", "c": "Written records may be reduced to microfilm.", "d": "Records are subject to surprise audits by the SEC.", "e": "Records of an adviser must be maintained for 5 years."}, {"n": 12, "q": "Under the Uniform Securities Act, a state-registered investment adviser whose only office was in State N would NOT have to register in State O if its only clients were", "a": "trust companies", "b": "individual accredited investors", "c": "complex trusts", "d": "6 or fewer retail clients", "e": "A state-registered investment adviser can make use of the de minimis exemption if it has no place of business in a state and its only clients are institutions."}, {"n": 13, "q": "Martin holds both the CPA and the CFP designations. Within the previous year, if he has provided portfolio advice to approximately 40 clients, is Martin required to register as an investment adviser?", "a": "Yes, because he provides investment advice on a more than incidental basis.", "b": "Yes, because he could receive commission income from investment clients.", "c": "No, because he falls under the de minimis exemption having relatively few clients.", "d": "No, because he is a CPA.", "e": "Although Martin is an accountant, he provides investment advice on a more than incidental basis."}, {"n": 14, "q": "Under the Investment Advisers Act of 1940, an adviser is required to be registered with the SEC if", "a": "the adviser's clients are investment companies registered under the Investment Company Act of 1940", "b": "the adviser's advice relates solely to securities issued or guaranteed by the U.S. government.", "c": "the adviser is the publisher of a news magazine of general and regular circulation", "d": "the adviser's clientele is exclusively federal credit unions and the adviser has less than $100 million in assets under management", "e": "Advisers to registered investment companies are required to be SEC-registered."}, {"n": 15, "q": "A state-registered investment adviser with discretionary authority over client accounts discovered on Monday, that the firm's net worth is below the required amount. He must notify the administrator and then file a report no later than the", "a": "close of business Tuesday, close of business Wednesday", "b": "close of business Tuesday, close of business Friday", "c": "close of business Monday, close of business Friday", "d": "close of business Monday, close of business Wednesday", "e": "Unless otherwise exempted, every investment adviser shall by the close of business on the next business day notify the Administrator if net worth is less than the minimum required."}, {"n": 16, "q": "Platinum Investment in Growth Group, Inc. (PIGGI) is registered in and has its principal office in State W. PIGGI has near-term plans to open offices in State A and B. In an effort to test the waters, PIGGI mails several hundred flyers to prospects in those 2 states. Under the Uniform Securities Act,", "a": "these flyers could not be mailed until PIGGI was registered in States A and B", "b": "as long as PIGGI did not maintain an office in either of these states, the flyers could be mailed", "c": "as a federal covered investment adviser, the flyers would need filing with the SEC", "d": "these flyers could be mailed, but no accounts can be opened until PIGGI is registered in States A and B", "e": "Any attempt to hold oneself out as offering investment advice as part of a business would require the person to be registered in the state."}, {"n": 17, "q": "Bulaan Advisory Services, Inc. (BAS), an investment adviser registered in 5 states, was found to have been untruthful in its performance reporting. Once this news was released, most of its clients terminated their advisory contracts. As a result, BAS shuttered its doors on July 18, 2018. Minutes of shareholder meetings must be preserved until at least", "a": "July 18, 2023.", "b": "December 31, 2018.", "c": "December 31, 2023.", "d": "July 18, 2021.", "e": "NASAA's Model Rule on record keeping requires that partnership articles and any amendments shall be maintained and preserved until at least 3 years after termination."}, {"n": 18, "q": "If an investment adviser files an initial registration with a state on June 30, which of the following statements regarding the filing fee to be paid is TRUE?", "a": "The full year's fee must be paid.", "b": "The fee will be prorated from the filing date.", "c": "The fee will be prorated from the effective date.", "d": "No filing fee is required until December 31.", "e": "While some states make exceptions for filings late in the year, under the USA there is no pro rating of filing fees."}, {"n": 19, "q": "Under the Uniform Securities Act, which of the following statements is TRUE regarding registration of an investment adviser if the application has not been amended?", "a": "Unless specified earlier, registration becomes effective no later than 90 days after the application is filed.", "b": "Unless specified earlier by the Administrator, the registration becomes effective at noon on the 60th day after application.", "c": "Unless specified earlier by the Administrator, the registration becomes effective no later than noon on the 30th day after application.", "d": "Unless specified earlier, registration becomes effective no sooner than 15 days after the application is filed.", "e": "While the Administrator may specify an earlier date, registrations become effective at noon on the 30th calendar day after filing."}, {"n": 20, "q": "The term \"federal covered investment adviser\" would apply to a person who", "a": "is registered as such under the Investment Advisers Act of 1940", "b": "limits the advice offered strictly to securities listed on the New York Stock Exchange (NYSE)", "c": "is registered as such under the Investment Company Act of 1940", "d": "limits the advice offered strictly to securities issued or guaranteed by the U.S. government or 1 of its political subdivisions", "e": "Only federal covered investment advisers register under the Investment Advisers Act of 1940."}, {"n": 21, "q": "On April 15, ABC Advisers, Inc., made application for registration as an investment adviser with State X. Absent a denial or stop order, registration will become effective", "a": "April 15", "b": "May 1", "c": "May 15", "d": "April 30", "e": "If no denials or stop orders are in effect, registration automatically takes effect at noon on the 30th day after filing."}, {"n": 22, "q": "USAAdvisers is registered in 10 Midwest states. Regarding financial requirements, USAAdvisers must meet those of", "a": "each state in which it has a place of business", "b": "the state in which its principal office is located", "c": "the state with the most stringent financial requirements", "d": "the SEC", "e": "Unlike broker-dealers, investment advisers register with either the SEC or the state(s), but never both."}, {"n": 23, "q": "ABC Advisers changes its name to XYZ Advisers and also changes its location. Under the Investment Advisers Act of 1940, it must", "a": "notify the Administrator", "b": "notify FINRA within seven days", "c": "amend Form ADV promptly", "d": "amend Form ADV in advance", "e": "If information on certain parts of Form ADV becomes out of date, a federal covered adviser must file a prompt amendment with the SEC."}, {"n": 24, "q": "Under the NASAA Model Rule on financial requirements for investment advisers, investment advisers who have custody of customer funds are usually required to have a net worth in the amount of", "a": "$5,000", "b": "$10,000", "c": "$50,000", "d": "$35,000", "e": "The NASAA Model Rule on financial requirements requires an investment adviser with custody to have a minimum net worth of $35,000."}, {"n": 25, "q": "The USA places a number of recordkeeping requirements on investment advisers. Records required to be kept by all state-registered investment advisers include all of the following EXCEPT", "a": "a list of discretionary accounts", "b": "emails", "c": "bank records", "d": "a record by security showing each client's interest and location thereof", "e": "The key to this question is the requirement for all advisers. A security record is only required for those advisers who have custody of client assets."}]}, {"id": 17, "name": "Series 65 Practice Test", "key": "CDAACBCCAADBBACBBBAACADCDCCDAADBBDCBCCCADBDDAADAACDADBDDDBACBAACBBADCDBCDDDCACADDACCACCBACBCDBCCDBDD", "questions": [{"n": 1, "q": "A significant increase in the importing of goods into the United States would likely have what effect on the strength of the U.S. dollar?", "a": "No effect", "b": "Fluctuation both ways", "c": "Weaken", "d": "Strengthen", "e": "Currency rates tend to ebb and flow as the balance of payments shift from positive to negative. A significant increase in imports represents a large outflow of U.S. dollars which results in a negative trade balance."}, {"n": 2, "q": "If a country's current account shows a trade deficit, it is most likely that", "a": "short-term flows are greater than long-term flows.", "b": "tax payments are greater than tax receipts.", "c": "net exports are greater than zero.", "d": "imports are greater than exports.", "e": "A trade deficit occurs when imports are greater than exports."}, {"n": 3, "q": "The primary function of the Federal Reserve System (the Fed) is to", "a": "carry out monetary policy.", "b": "implement fiscal policy.", "c": "manage the revenues and expenditures of the federal government.", "d": "issue bonds to the general public.", "e": "The Federal Reserve controls the money supply, enabling it to significantly affect interest rates. The Fed will follow a loose, or easy, monetary policy when it wants to increase the money supply."}, {"n": 4, "q": "When a bank that is a member of the Federal Reserve System borrows from another member bank, the rate that is charged is known as", "a": "the federal funds rate", "b": "the call loan rate", "c": "the discount rate", "d": "the prime rate", "e": "Loans between banks, usually on an overnight basis, are made at the federal funds rate. It is the most volatile of the money market rates."}, {"n": 5, "q": "If the dollar weakens, which of the following statements is TRUE?", "a": "The dollar buys more foreign currency.", "b": "Foreign securities denominated in their domestic currency decrease in value to the U.S. investor.", "c": "An increase in U.S. interest rates might strengthen the dollar.", "d": "U.S. exports become less competitive.", "e": "When U.S. interest rates rise, foreign investors invest in U.S. dollar-denominated securities, thereby increasing the demand for dollars and causing the dollar to strengthen."}, {"n": 6, "q": "Which of the following statements describes the federal funds rate?", "a": "Charge on loans to depositary institutions by the New York FRB", "b": "Rate charged on reserves traded among commercial banks for overnight use in amounts of $1 million or more", "c": "Charge on loans to brokers on stock exchange collateral", "d": "Base rate on corporate loans at large U.S. money center commercial banks", "e": "The federal funds rate represents the interest charge on reserves, traded among commercial banks for overnight use, in amounts of $1 million or more."}, {"n": 7, "q": "Final approval of the annual operating budget for the United States is given by", "a": "the president", "b": "the Conference of Governors", "c": "the Congress", "d": "the Cabinet", "e": "The United States Congress is responsible for voting approval of the budget submitted by the president."}, {"n": 8, "q": "XYZ Aircraft Manufacturing Corporation, based in the United States, announces a multibillion dollar order for its new jumbo jet from Fly Airlines, a Japanese-based carrier. When the sale is completed, there will be", "a": "a debit to the current account of the United States", "b": "no effect on the balance of trade", "c": "a credit to the current account of the United States", "d": "a credit to the current account of Japan", "e": "Whenever money from a foreign source enters the United States, it becomes a credit item in the U.S. balance of payments."}, {"n": 9, "q": "Country A develops a new product that is in high demand around the world. The likely effect of this would be", "a": "a trade surplus for Country A", "b": "a trade deficit for Country A", "c": "an increase in the income tax rates of Country A", "d": "a decrease in the value of the currency of Country A", "e": "When exports exceed imports (the likely case here), it leads to a trade surplus. Invariably, that causes a positive balance of payments."}, {"n": 10, "q": "If the dollar weakens, which of the following statements is TRUE?", "a": "A rise in U.S. interest rates might strengthen the dollar.", "b": "U.S. exports will fall.", "c": "Foreign securities denominated in their domestic currency decrease in value to the U.S. investor.", "d": "The dollar buys more foreign currency.", "e": "If U.S. interest rates rise, foreign investors would invest in U.S. dollar-denominated securities, thereby increasing the demand for dollars."}, {"n": 11, "q": "A securities analyst's stock selection method is to begin by looking for superior companies, regardless of their industry sector or the condition of the overall economy. In so doing, this analyst is using", "a": "the business cycle approach.", "b": "the top-down approach.", "c": "the optimal portfolio approach.", "d": "the bottom-up approach.", "e": "This is the basic approach of bottom-up analysis. Rather than focusing on the overall market, this approach seeks to identify the most attractive individual stocks."}, {"n": 12, "q": "A research analyst studying the performance of ABC Industries compares that with reports from other analysts reviewing other companies in other industries. This is known as", "a": "fundamental analysis", "b": "bottom-up analysis", "c": "top-down analysis", "d": "sector analysis", "e": "Bottom-up analysis starts by attempting to find superior performing companies, regardless of the industry."}, {"n": 13, "q": "Among the responsibilities of the Federal Reserve (the Fed) is influencing the supply of money and credit in the economy. When performing this function, adjusting which of the following is not a tool at its disposal?", "a": "The discount rate", "b": "The prime rate", "c": "The activities of the Federal Open Market Committee", "d": "The reserve requirements", "e": "The prime rate is set by the banks. All of the others are under the control of the Fed."}, {"n": 14, "q": "Which of the following statements reflects the monetarist economic position?", "a": "The amount of money in the economy determines the overall price level over time, therefore the Federal Reserve should control the growth in the amount of money in the economy in a gradual and predictable way.", "b": "The amount of money in the economy is not significant because economic activity reflects the value of real goods and services, therefore the Federal Reserve should not attempt to manage the money supply.", "c": "The total amount of money in the economy is the result of the level of interest rates.", "d": "The best way to control the money supply is to raise taxes which will reduce the amount of money in the economy and lower prices.", "e": "Monetarists believe that the economy and inflation are best controlled through the management of the money supply rather than through fiscal policy stimulation."}, {"n": 15, "q": "An expansionary fiscal policy would usually result in", "a": "a government decreasing government spending to slow down economic activity.", "b": "a government operating a balanced budget.", "c": "a government increasing government spending to stimulate economic activity.", "d": "a government increasing taxes in the economy.", "e": "An expansionary fiscal policy is one that is deliberately implemented to boost demand. Increased spending would be an expansionary policy."}, {"n": 16, "q": "An investor in an equity security", "a": "has a say in the day-to-day operations of the business.", "b": "acquires an ownership interest in the companyq", "c": "is assured of a minimum rate of return.", "d": "becomes a creditor of the company.", "e": "Equity means ownership, and this is a characteristic shared by both common and preferred stock."}, {"n": 17, "q": "Which of the following statements about equity securities is NOT true?", "a": "Preferred stock pays a fixed dividend.", "b": "Preferred stock is an equity security while common stock is a hybrid.", "c": "Common stock is less sensitive to interest rate risk than preferred stock.", "d": "Preferred stock is usually nonvoting.", "e": "Both common and preferred stock are equity securities. The dividend on preferred stock is fixed, and shares do not have voting rights."}, {"n": 18, "q": "Which of the following statements concerning equity securities is not correct?", "a": "Preferred stock is an equity security with an intermediate claim (between the bondholders and the common stockholders) on a firm's assets and earnings.", "b": "Equity securities represent a lending interest in a corporation.", "c": "Common stock is an equity security representing an ownership interest in a corporation.", "d": "Equity securities provide a residual claim, after payment of all obligations to fixed-income claims, on the income and assets of a corporation.", "e": "Equity securities represent an ownership interest in a corporation. Preferred stock has a claim ahead of common, but behind debt securities."}, {"n": 19, "q": "The primary defining characteristic of an equity security is", "a": "it represents ownership in a corporation.", "b": "the ability to keep pace with inflation.", "c": "it pays dividends, usually quarterly.", "d": "voting rights.", "e": "What does the term equity mean? It means ownership and that is the single most significant fact about an equity security."}, {"n": 20, "q": "All of the following represent ownership in corporation except", "a": "mortgage bonds.", "b": "common stock.", "c": "convertible preferred stock.", "d": "preferred stock.", "e": "Ownership in a corporation resides in its equity securities. All stock is equity while all bonds are debt."}, {"n": 21, "q": "A customer owns cumulative preferred stock (par value of $100) that pays an 8% dividend. The dividend has not been paid this year or for the 2 previous years. How much must the company pay the customer per share before it may pay dividends to the common stockholders?", "a": "$16.00", "b": "$8.00", "c": "$24.00", "d": "$0.00", "e": "If the company is going to pay a common stock dividend, it must pay the preferred dividends first. A cumulative preferred stockholder must also receive all dividends in arrears."}, {"n": 22, "q": "A company's dividend on its common stock is", "a": "determined by its board of directors", "b": "voted on by shareholders", "c": "specified in the company charter", "d": "mandatory if the company is profitable", "e": "A common stock's dividend payment and amount are determined by the company's board of directors."}, {"n": 23, "q": "Investments in which of the following offer the best long-term protection against inflation?", "a": "Government bonds", "b": "Fixed annuities", "c": "Corporate bonds", "d": "Common stock", "e": "Common stocks have historically offered returns that outpace inflation over the long term."}, {"n": 24, "q": "A common stockholder's rights include all of the following EXCEPT", "a": "the receipt of dividends, if declared by the board of directors", "b": "electing the board of directors", "c": "the right to determine the par value of the stock", "d": "preemptive rights", "e": "Par value is an accounting decision made by the company when the stock is first issued and is not something voted on by shareholders."}, {"n": 25, "q": "One of the features of convertible preferred stock is that", "a": "the owner has the opportunity to convert the stock into the issuer’s bonds", "b": "the holder is able to select the conversion price", "c": "the dividend is paid ahead of all other securities", "d": "the owner has the opportunity to participate in the growth of the company", "e": "Any convertible security, preferred stock or debenture, is convertible into the issuer's common stock."}, {"n": 26, "q": "An employee wishing to obtain long-term capital gain treatment would prefer the employer to offer", "a": "listed stock options", "b": "non-qualified stock options", "c": "incentive stock options", "d": "portable stock options", "e": "Assuming the time limit conditions are met, exercise of an ISO can result in long-term capital gains while non-qualified options are always treated as ordinary income."}, {"n": 27, "q": "Which of the following statements regarding preemptive rights is TRUE?", "a": "Both common and preferred stockholders have the right to subscribe to a rights offering.", "b": "Common stockholders do not have the right to subscribe to a rights offering.", "c": "Preferred stockholders do not have the right to subscribe to a rights offering.", "d": "Neither common nor preferred stockholders have the right to subscribe to a rights offering.", "e": "Preferred stockholders have a preference as to liquidation and distribution of dividends, but the right to maintain a proportionate interest only applies to common stock."}, {"n": 28, "q": "If a customer owns 7% of a publicly-traded company's stock and his spouse owns 6% and wants to sell her shares, which of the following statements is true?", "a": "The spouse is not an affiliate and Rule 144 does not apply.", "b": "The spouse is an affiliate and Rule 144 does not apply.", "c": "The spouse is not an affiliate and Rule 144 applies.", "d": "The spouse is an affiliate and Rule 144 applies.", "e": "Together, the client and wife own 13% of the company's stock, so the spouse is considered an affiliate and is bound by Rule 144."}, {"n": 29, "q": "One way in which incentive stock options (ISOs) differ from nonqualified stock options (NQSOs) is that", "a": "the bargain element of the ISO is an AMT preference item.", "b": "the bargain element of the ISO is reported as wages on the tax returns of the employer and the employee.", "c": "there is a maximum 5-year limit for exercise on the ISO while the time limit on the NQSO is 10 years.", "d": "gains on an ISO are always short-term while those on an NQSO are long-term.", "e": "The only true statement here is that the bargain element of the ISO (but not the NQSO) is one of the preference items for the alternative minimum tax."}, {"n": 30, "q": "An investor holding which of the following equity securities would NOT expect to have preemptive rights?", "a": "Preferred stock", "b": "Common stock acquired in a private placement", "c": "Control stock", "d": "Common stock", "e": "Preferred stockholders do not have preemptive rights. Preemptive rights allow common stockholders to subscribe to additional issues of shares."}, {"n": 31, "q": "Corporations have found that one way to increase employee motivation is to grant options to purchase stock in the company. Incentive (qualified) options differ from nonqualified options in all of the following respects except", "a": "there is a maximum 10-year limit for exercising an ISO; no such time limit exists for an NSO.", "b": "the holder of an ISO can recognize capital gain (loss) as a result of exercise, whereas ordinary income (loss) is the result with an NSO.", "c": "ISOs may only be granted to employees while NSOs may be given to virtually anyone.", "d": "the recipient of the grant of the ISO has no income tax consequences at the time of the grant.", "e": "Whether the grant is of an ISO or an NSO, there are no tax consequences to the recipient at the time of the grant."}, {"n": 32, "q": "A client is considering the purchase of American depositary receipts (ADRs). She is looking to further diversify her portfolio. Which of the following is not a feature of this type of investment vehicle?", "a": "ADRs are traded on exchanges and the OTC markets.", "b": "They are not subject to exchange rate, or currency, risk.", "c": "ADRs are denominated in and pay dividends in U.S. dollars.", "d": "Information regarding the foreign company is easily attainable.", "e": "Even though ADRs are denominated in U.S. dollars, they are subject to exchange rate, or currency, risk."}, {"n": 33, "q": "Which of the following statements regarding international investing is not correct?", "a": "An international investor faces the additional risks of foreign currency risk and country risk.", "b": "An emerging market is a market in a highly-developed foreign economy with stable political and social institutions.", "c": "One method to engage in international investing is through American depositary receipts.", "d": "International investing offers diversification and potentially higher returns.", "e": "Emerging markets are markets in lesser developed countries. As a result, the political risk tends to be higher than with developed economies."}, {"n": 34, "q": "An employee is offered a nonqualified stock option with an exercise price of 20pershare.Iftheoptionisexercisedwhenthecurrentmarketvalueofthestockis30, the employee", "a": "has a capital gain of $10 per share", "b": "is taxed on $30 per share as if it were salary", "c": "is taxed on $20 per share as if it were salary", "d": "is taxed on $10 per share as if it were salary", "e": "In the case of NSOs, the difference between the exercise (or strike) price and the current market value is considered salary to the employee."}, {"n": 35, "q": "A client is considering the purchase of American depositary receipts (ADRs). She is looking to further diversify her portfolio. Which of the following is NOT a feature of this type of investment vehicle?", "a": "ADRs are traded on exchanges and the OTC markets.", "b": "Information regarding the foreign company is easily attainable.", "c": "They are not subject to exchange rate, or currency, risk.", "d": "ADRs are denominated in and pay dividends in U.S. dollars.", "e": "Even though ADRs are denominated in U.S. dollars, they are subject to exchange rate, or currency, risk."}, {"n": 36, "q": "A corporation would like to offer their employees an opportunity to participate in the future growth of the company. Among the methods you might suggest are", "a": "voting-trust certificates", "b": "employee stock options", "c": "subordinated debentures", "d": "preemptive rights", "e": "One of the most popular ways to give employees the chance to benefit from an increase in the value of the employer's stock is through employee stock options."}, {"n": 37, "q": "Which of the following is not a characteristic of American depositary receipts (ADRs)?", "a": "Because ADRs are traded on the exchanges, they are relatively liquid and marketable investments.", "b": "ADR holders may sur
